name: CI

# First CI for this repo (2026-08-08). Three cheap jobs; the iOS-simulator Maestro
# tier stays local per docs/runbook.md § Pre-ship simulator gate (no free macOS runner).
# Make these required checks on main via a branch ruleset (repo settings — operator).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest backend/tests -q

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      # Structural suites (mobile/tests/check-*.js): they parse the shipped
      # source with the project's own TypeScript, so they run here, after the
      # same `npm ci`. Since D-056 retired Maestro these are the primary
      # regression evidence for client invariants — including the guided-tour
      # copy budget and eligibility contract (check-guide-script.js).
      - run: for f in tests/check-*.js; do echo "── $f"; node "$f" || exit 1; done
        working-directory: mobile

  maestro-testid-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash mobile/scripts/testid-lint.sh
