name: CI

# First CI for this repo (2026-08-08). The backend pytest suite runs sharded by
# test file across 8 parallel runners (backend-suite, via .github/scripts/ci_shard.py
# and .github/backend-test-durations.json); backend-tests is the single gate over
# all shards. The other jobs are cheap.
# D-056 (2026-08-15) retired Maestro and the simulator entirely, so there is no
# local simulator tier behind these jobs any more — CI plus the operator's manual
# TestFlight pass is the whole verification story. The maestro-testid-lint job keeps
# its name but only runs testid-lint.sh, which D-056 explicitly preserved.
# Note mobile-typecheck globs mobile/tests/check-*.js, so a guard is live in CI the
# moment the file exists — no npm script needed.
# Make these required checks on main via a branch ruleset (repo settings — operator).

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels that PR's superseded run. Runs on main are
# grouped by commit sha and never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-suite:
    name: backend-suite (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest backend/tests -q -p ci_shard
        env:
          # Exercise the optional path across the complete suite. Fresh-process
          # decoder tests separately prove default-off and startup-only behavior.
          FTF_OWNER_PROOF_FAST_JSON: '1'
          FTF_TEST_SHARD: ${{ matrix.shard }}/8
          PYTHONPATH: .github/scripts

  # The single required status check over all backend shards (the branch ruleset
  # requires this exact name). `if: always()` makes a failed or cancelled shard
  # report failure here; without it this job would be skipped, and GitHub treats a
  # skipped required check as passing.
  backend-tests:
    needs: [backend-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "backend-suite: ${{ needs.backend-suite.result }}"
          test "${{ needs.backend-suite.result }}" = success

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      # Structural suites (mobile/tests/check-*.js): they parse the shipped
      # source with the project's own TypeScript, so they run here, after the
      # same `npm ci`. Since D-056 retired Maestro these are the primary
      # regression evidence for client invariants — including the guided-tour
      # copy budget and eligibility contract (check-guide-script.js).
      - run: for f in tests/check-*.js; do echo "── $f"; node "$f" || exit 1; done
        working-directory: mobile

  web-structure:
    # First CI gate that touches web/ (2026-08-19). Until this existed, nothing in
    # CI checked the web frontend at all — no typecheck, no lint, no tests. Parses
    # the shipped HTML/CSS/JS and asserts the design-system, SEO and a11y
    # invariants the 2026-08-19 audit found violated. No browser, no server, no
    # network — runs in well under a second.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 qa/web/check_web_structure.py
      - run: node qa/web/check_trade_search.cjs
      - run: python3 -m unittest discover -s scripts/qa -p test_instant_trade_report.py

  maestro-testid-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash mobile/scripts/testid-lint.sh
