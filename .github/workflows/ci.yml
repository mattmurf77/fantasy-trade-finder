name: CI

# First CI for this repo (2026-08-08). Started as three cheap jobs; now the
# backend suite (changes, backend-suite, backend-tests gate) plus three cheap
# jobs (mobile-typecheck, web-structure, maestro-testid-lint).
# Skip by area: on pull requests the backend suite runs only when a changed path
# can affect it (.github/scripts/backend-area.sh); every push to main runs it in
# full. The rule and its evidence are in .github/CLAUDE.md.
# D-056 (2026-08-15) retired Maestro and the simulator entirely, so there is no
# local simulator tier behind these jobs any more — CI plus the operator's manual
# TestFlight pass is the whole verification story. The maestro-testid-lint job keeps
# its name but only runs testid-lint.sh, which D-056 explicitly preserved.
# Note mobile-typecheck globs mobile/tests/check-*.js, so a guard is live in CI the
# moment the file exists — no npm script needed.
# Make these required checks on main via a branch ruleset (repo settings — operator).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    # Decides whether the backend suite must run. Pull requests only; a push to
    # main always runs the full suite.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.area.outputs.backend }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          # The pull_request checkout is the PR merge commit, so HEAD^1 is the
          # base branch tip and HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2
      - id: area
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push to main: the full backend suite always runs."
            echo "Backend suite: runs (push to main)" >> "$GITHUB_STEP_SUMMARY"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists both the old and the new path of a rename.
          git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          decision="$(bash .github/scripts/backend-area.sh < "$RUNNER_TEMP/changed.txt")"
          if [ "$decision" != "true" ] && [ "$decision" != "false" ]; then
            echo "::error::backend-area.sh printed '$decision', expected true or false"
            exit 1
          fi
          echo "Changed files:"
          cat "$RUNNER_TEMP/changed.txt"
          echo "Backend suite needed: $decision"
          {
            echo "### Skip by area"
            echo "Backend suite needed: \`$decision\`"
            echo ""
            echo "Changed files:"
            echo '```'
            cat "$RUNNER_TEMP/changed.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "backend=$decision" >> "$GITHUB_OUTPUT"

  backend-suite:
    # Another change will turn this job into a matrix. Keep the needs and if
    # lines below: the backend-tests gate depends on them.
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          # Exercise the optional path across the complete suite. Fresh-process
          # decoder tests separately prove default-off and startup-only behavior.
          FTF_OWNER_PROOF_FAST_JSON: '1'

  backend-tests:
    # The required status check. Always reports: success when the suite passed or
    # was correctly skipped, failure when detection or the suite failed.
    needs: [changes, backend-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_NEEDED: ${{ needs.changes.outputs.backend }}
          SUITE_RESULT: ${{ needs.backend-suite.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::change detection did not succeed (result: $CHANGES_RESULT)"
            exit 1
          fi
          if [ "$BACKEND_NEEDED" = "true" ]; then
            if [ "$SUITE_RESULT" = "success" ]; then
              echo "backend suite ran and passed"
              exit 0
            fi
            echo "::error::backend suite was needed and did not pass (result: $SUITE_RESULT)"
            exit 1
          fi
          if [ "$BACKEND_NEEDED" = "false" ]; then
            if [ "$SUITE_RESULT" = "skipped" ]; then
              echo "backend suite not needed for this change, skipped by the area rule"
              exit 0
            fi
            echo "::error::backend suite was not needed but its result is $SUITE_RESULT, expected skipped"
            exit 1
          fi
          echo "::error::change detection gave no usable decision (backend: '$BACKEND_NEEDED')"
          exit 1

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
      # Structural suites (mobile/tests/check-*.js): they parse the shipped
      # source with the project's own TypeScript, so they run here, after the
      # same `npm ci`. Since D-056 retired Maestro these are the primary
      # regression evidence for client invariants — including the guided-tour
      # copy budget and eligibility contract (check-guide-script.js).
      - run: for f in tests/check-*.js; do echo "── $f"; node "$f" || exit 1; done
        working-directory: mobile

  web-structure:
    # First CI gate that touches web/ (2026-08-19). Until this existed, nothing in
    # CI checked the web frontend at all — no typecheck, no lint, no tests. Parses
    # the shipped HTML/CSS/JS and asserts the design-system, SEO and a11y
    # invariants the 2026-08-19 audit found violated. No browser, no server, no
    # network — runs in well under a second.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 qa/web/check_web_structure.py
      - run: node qa/web/check_trade_search.cjs
      - run: python3 -m unittest discover -s scripts/qa -p test_instant_trade_report.py

  maestro-testid-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash mobile/scripts/testid-lint.sh
