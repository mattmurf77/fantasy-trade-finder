databases:
  - name: fantasy-trade-finder-db
    # The live DB was upgraded to Basic-256mb in the Render dashboard;
    # the blueprint must match or sync fails with "cannot downgrade
    # database from Basic-256mb to Free" (2026-07-26).
    plan: basic-256mb
    databaseName: trade_finder
    user: trade_finder_user

services:
  - type: web
    name: fantasy-trade-finder
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        fromDatabase:
          name: fantasy-trade-finder-db
          property: connectionString
      - key: CRON_SECRET
        sync: false   # set manually in the Render dashboard
      # Experiment tester allowlist (is_tester_allowlist targeting attr,
      # backend/experiments.py; docs/config-reference.md). Unit ids —
      # 'device:<id>' pseudo-ids and/or account ids. Currently: the
      # operator's device + account for the onboarding_v2_rollout smoke
      # (docs/business/analytics/2026-07-18-onboarding-v2-rollout-experiment.md).
      # Pseudo-ids, not secrets; declarative here so the allowlist is
      # reviewable in git. Engine picks up changes on its 60s cache refresh.
      - key: FTF_TESTER_ALLOWLIST
        value: "device:dev_loc-mrpy6qog-2t72t6,313560442465169408"

  # Push notification / player-cache / value-snapshot scheduling used to
  # live here as `type: cron` blueprint services (or, for players-refresh,
  # was documented as "provision by hand in the dashboard"). Render
  # blueprint cron is a billable resource requiring account approval,
  # which broke blueprint sync on this account (see commit 1e50d3e,
  # living-memory/GOTCHAS.md, and docs/runbook.md → "Cron schedule"). All
  # five cron-gated endpoints (/api/cron/realtime-tick, /hourly-tick,
  # /players-refresh, /value-snapshot, /daily-tick) are now scheduled
  # externally via .github/workflows/render-cron.yml — same
  # X-Cron-Secret auth, same schedules, GitHub Actions cron instead of
  # Render's.

