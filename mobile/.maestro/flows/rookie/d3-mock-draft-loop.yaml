appId: com.fantasytradefinder.app
# tc: T-291-01 / T-291-03 / T-295-M1 — the mock loop, end to end, twice,
#     with the user provably ON THE CLOCK before any tap.
# profile: draft-pre
# flags: release
#
# WHAT THIS FLOW IS FOR. Three acceptances the pytest suite structurally
# cannot reach, because all three are about what a person can SEE and DO:
#
#   #295  ".*You’re on the clock.*" BEFORE any row is tapped (curly
#         apostrophe — Maestro matches source bytes). The shipped mock NEVER
#         put a live-league user in their own draft: `owners` was built from
#         the caller-excluded `league.members`, so every mock was born
#         complete with zero user picks. #291's flow asserted the tap
#         affordance and never asserted WHOSE turn it was — it would have
#         passed on the defect. This assertion is the repair's UI
#         acceptance: the user is in the draft, on the clock, at a real
#         slot, before ever touching the board.
#
#   #291  `assertVisible: "Tap to draft"` BEFORE any row is tapped. The pick
#         path always worked; the defect was that a tappable mock row looked
#         exactly like a read-only Draft Room row until after it had been
#         tapped.
#
#   #292  The loop runs TWICE, and the second recap is dismissed. With two
#         completed mocks on file, ONE dismissal must return the room to
#         "No mock running" — not to the previous recap.
#
# RETARGET (#295 build): the old header pointed at the ffv3 league
# (1312140920132497408), which appeared in no profile — the PRECONDITION
# block it carried is repaired by this retarget, not worked around.
# `draft-pre` is the purpose-built world: 12-team Sleeper league
# 990000000000000001, status pre_draft, order assigned (qa_draft seeded at
# slot 8 — mid-order, mirroring the live ffv3 operator position), and
# traded_picks pinned to 0 so qa_draft's round-1 slot is not traded away
# (with the seeder's traded formula, ANY nonzero count trades roster 1's
# round-1 pick out and a 1-round mock would complete at create).
#
# Rounds are stepped 4 -> 1 so the user makes exactly ONE pick per lap and
# the CPU tail resolves straight into the recap.
tags: [rookie, draft-room, mock]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
# Retry-hardened sign-in preamble (law 10): prove the typed username landed
# BEFORE submitting — a raced inputText submits a partial name and books a
# real VCR miss. `eraseText` first keeps retries idempotent.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "signin.username-input"
      - eraseText
      - inputText: "qa_draft"
      - assertVisible:
          text: ".*qa_draft.*"
      - tapOn:
          id: "signin.continue-btn"
      - extendedWaitUntil:
          visible:
            id: "leagues.row.990000000000000001"
          timeout: 30000
- tapOn:
    id: "leagues.row.990000000000000001"
- extendedWaitUntil:
    visible:
      id: "tab.trades"
    timeout: 60000
# Settle before switching tabs (law 8): the tab bar paints seconds before
# routing settles and the Rank stack steals the tap back.
- extendedWaitUntil:
    visible:
      id: "rank.more-ways"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "tab.draft"
- extendedWaitUntil:
    visible:
      id: "draft-room.scroll"
    timeout: 60000
# "Not started" is STATE_LABEL.upcoming — a fixture drifting back to a live
# board fails HERE, naming the cause, not later on a blocked entry card.
- extendedWaitUntil:
    visible:
      text: ".*Not started.*"
    timeout: 40000

# ── the Mock side of the room ────────────────────────────────────────────
- tapOn:
    id: "draft-room.mode.mock"
- extendedWaitUntil:
    visible:
      id: "mock-entry.card"
    timeout: 20000
- assertNotVisible:
    id: "mock-entry.blocked.*"
# Normalise (RUN-9): the seeder does not clear `mock_drafts` between runs,
# so a re-run may find an active mock (Resume / Start over) or a leftover
# recap (run-it-back) instead of the virgin card. The three card variants
# are mutually exclusive and every start action routes to the same onStart,
# so at most one of these conditionals fires and all three end with the
# setup sheet opening.
- runFlow:
    when:
      visible:
        id: "mock-entry.start-over"
    commands:
      - tapOn:
          id: "mock-entry.start-over"
- runFlow:
    when:
      visible:
        id: "mock-entry.run-it-back"
    commands:
      - tapOn:
          id: "mock-entry.run-it-back"
- runFlow:
    when:
      visible:
        id: "mock-entry.start"
    commands:
      - takeScreenshot: rookie-d3-mock-entry
      - tapOn:
          id: "mock-entry.start"

# ── lap 1 ────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "mock-setup-sheet"
    timeout: 20000
- tapOn:
    id: "mock-setup.rounds.minus"
- tapOn:
    id: "mock-setup.rounds.minus"
- tapOn:
    id: "mock-setup.rounds.minus"
- assertVisible:
    id: "mock-setup.rounds.value"
- tapOn:
    id: "mock-setup.type.linear"
- tapOn:
    id: "mock-setup.start"

- extendedWaitUntil:
    visible:
      id: "mock-draft.on-the-clock"
    timeout: 40000
- assertVisible:
    id: "mock-draft.rail"
# ═══ #295's UI acceptance. The clock claims the USER'S turn — #291's flow
#     never did. Curly apostrophe: the source byte in MockDraftScreen. ═══
- assertVisible: ".*You’re on the clock.*"
# ═══ #291's acceptance. These assertions run BEFORE any row has been
#     tapped — that is the whole point of them. ═══
- assertVisible: "Tap to draft"
- assertVisible: "Tap a rookie below, then confirm."
- takeScreenshot: rookie-d3-affordance-before-tap

- scrollUntilVisible:
    element:
      id: "mock-draft.undrafted-row..*"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 100
    speed: 30
    centerElement: true
- tapOn:
    id: "mock-draft.undrafted-row..*"
- extendedWaitUntil:
    visible:
      id: "mock-draft.confirm"
    timeout: 20000
- tapOn:
    id: "mock-draft.confirm.draft"
- extendedWaitUntil:
    visible:
      id: "mock-draft.recap"
    timeout: 60000
- takeScreenshot: rookie-d3-recap-1

# Back to the room. The complete card's PRIMARY is now the way onward.
- tapOn:
    id: "mock-draft.back-btn"
- extendedWaitUntil:
    visible:
      id: "mock-entry.run-it-back"
    timeout: 20000
- takeScreenshot: rookie-d3-complete-card

# ── lap 2 — ***#292's acceptance*** ──────────────────────────────────────
- tapOn:
    id: "mock-entry.run-it-back"
- extendedWaitUntil:
    visible:
      id: "mock-setup-sheet"
    timeout: 20000
- tapOn:
    id: "mock-setup.rounds.minus"
- tapOn:
    id: "mock-setup.rounds.minus"
- tapOn:
    id: "mock-setup.rounds.minus"
- tapOn:
    id: "mock-setup.type.linear"
- tapOn:
    id: "mock-setup.start"
- extendedWaitUntil:
    visible:
      id: "mock-draft.on-the-clock"
    timeout: 40000
- assertVisible: ".*You’re on the clock.*"

- scrollUntilVisible:
    element:
      id: "mock-draft.undrafted-row..*"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 100
    speed: 30
    centerElement: true
- tapOn:
    id: "mock-draft.undrafted-row..*"
- extendedWaitUntil:
    visible:
      id: "mock-draft.confirm"
    timeout: 20000
- tapOn:
    id: "mock-draft.confirm.draft"
- extendedWaitUntil:
    visible:
      id: "mock-draft.recap"
    timeout: 60000

# ── ***R-14's acceptance*** ──────────────────────────────────────────────
# Two completed mocks are now on file. ONE dismissal must clear the surface.
# If the abandon only retired the newest row, the room would come back
# showing the FIRST mock's recap and `mock-entry.start` would never appear.
- assertVisible:
    id: "mock-draft.end"
- tapOn:
    id: "mock-draft.end"
# The confirmation is a native Alert — its buttons are drawn by iOS and
# cannot carry a testID, so this is the one place an id selector does not
# exist. Multi-line `text:` form, which the linter permits; a one-line
# `tapOn: "Clear"` would (correctly) be rejected.
- tapOn:
    text: "Clear"
- extendedWaitUntil:
    visible:
      id: "mock-entry.start"
    timeout: 30000
- assertNotVisible:
    id: "mock-entry.recap"
- takeScreenshot: rookie-d3-surface-cleared
