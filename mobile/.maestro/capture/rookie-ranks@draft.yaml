appId: com.fantasytradefinder.app
# tc: TC-CAP-ROOKIERANKS-DRAFT
# profile: draft
# flags: release
# captures: loading, populated--from-draft-room, filter--rb, error
# source: mobile/src/screens/RookieRanksScreen.tsx, mobile/src/components/RookieScopeControl.tsx, mobile/src/screens/DraftRoomScreen.tsx
# interactive-stop: populated--from-draft-room
#
# FLAGS HEADER: `release`, and it must stay a bare fixture NAME. screen-capture
# .sh resolves it to backend/tests/fixtures/flags/<name>.json AND groups flows
# into sim cells by (profile, flags) — an earlier revision of this file carried
# a prose description there, which resolved to no fixture (silent fallback to
# seeder defaults) and split this profile into one extra cell per distinct
# string. The profile's own `flag_overrides` ride on top of `release` via the
# seeder, so they need no mention here.
#
# Screen-library capture flow for the consolidated rookie board (matrix row 74,
# "⚠ rookie-ranks / populated: needs `pin:ranks.rookie_subset=true`; the
# fixture player pool has no `years_experience: 0` cohort guarantee → may
# render `scope-empty` instead"). BOTH caveats are now resolved by evidence,
# and neither the way the matrix guessed:
#
#   1. NO PIN IS NEEDED. `ranks.rookie_subset` was not in `config/features.json`
#      when the matrix was written; it is TRUE in the refreshed
#      backend/tests/fixtures/flags/release.json that sign-off ruling A made a
#      prerequisite. So the honest release capture is the flag-ON one, and the
#      `flag-off` row (matrix row 73, "Rookie rankings aren't available yet.")
#      is now the one that needs a fixture, not this one.
#   2. THE COHORT IS GUARANTEED, and it is counted, not hoped for.
#      backend/tests/fixtures/player_pool_2026.json carries 56 players with
#      `metadata.rookie_year == "2026"` — WR 20, RB 16, TE 12, QB 8 — which is
#      the exact predicate `World.rookie_ids` and `database.load_rookie_
#      player_ids` share (seed_ui_test_db.py:648). 56 minus the profile's 18
#      made picks is the 38 the Draft Room shows
#      (test_draft_league_rosters_hold_made_picks_and_no_undrafted_rookies).
#      `scope-empty` is therefore UNREACHABLE on this profile, and the RB
#      filter below has 16 rows, not zero.
#
# ── WHY THE `draft` PROFILE AND NOT `standard` ───────────────────────────
# The screen renders populated on either — /api/rankings?scope=rookie is a view
# filter over the caller's BOARD, not over rosters, and both profiles draw from
# the same pool fixture. `draft` is chosen for two reasons that `standard`
# cannot give:
#   · It is the only profile where `rookie-ranks.back-to-draft` exists at all.
#     That row renders only for `route.params.returnTo === 'DraftRoom'`
#     (RookieRanksScreen.tsx:433), and the ONLY caller that sets it is the
#     Draft Room's `goToRookieRanks` (DraftRoomScreen.tsx:426-436). Without a
#     draft-capable profile there is no Draft Room to come from, so the state
#     is unphotographable.
#   · It lets the flow enter by the shipped two-way bridge rather than a launch
#     argument, which additionally proves `draft-room.rank-rookies` renders
#     (it is gated on the same `ranks.rookie_subset` flag).
# FILENAME: `@draft`, not the bare `rookie-ranks.yaml` the brief named. The
# library's convention is that an unsuffixed file runs on `standard`
# (capture/league.yaml vs capture/league@two-leagues.yaml); a flow that
# REQUIRES another profile carries the suffix. Flagged to the orchestrator.
#
# ── ONE LAUNCH, AND WHY THE ERROR USES PULL-TO-REFRESH ───────────────────
# `['rankings', …]` IS in App.tsx:60's PERSIST_KEYS, so unlike every other flow
# in this block a `stopApp: true` relaunch does NOT give a cold cache — the
# AsyncStorage persister rehydrates it. Two consequences:
#   · `loading` must be caught on the FIRST-EVER fetch of the rookie-scoped key
#     `['rankings', fmt, 'all', 'rookie']`, which is why the latency is armed
#     mid-flow, after the rank landing has settled and before the bridge tap.
#     The rank landing uses different keys, so the rookie key is still cold.
#   · `error` cannot use the cold-relaunch trick the sibling flows use. It does
#     not need to: RookieRanksScreen checks `ranksQuery.isError` BEFORE it
#     renders the list (line 509-513), so an errored REFETCH over warm data
#     still shows the error card — unlike DraftRoom/RecordPicks, whose
#     `isError || !data` OR renders stale data instead. The RefreshControl on
#     the DraggableFlatList is the compliant trigger.
#
# NOT CAPTURED, with evidence:
#   · `scope-empty` — impossible on this profile, see (2) above.
#   · `empty--filter` ("No rookie QBs on your board yet.") — every one of the
#     four positions has rows in this pool, so no filter is empty.
#   · `row--dragging` and the save pill's pending/saving/saved/error states —
#     all four require a drag, which is a mid-gesture state (sign-off ruling E)
#     AND a real POST /api/rankings/reorder against the seeded board.
#   · `toast--format-switch-failed` — needs a failed POST /api/scoring/switch;
#     reachable in principle, but the FormatToggle carries no testID, so there
#     is no compliant way to trigger it.
tags: [capture, rookie-ranks, draft]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
# Retry-hardened sign-in preamble, copied verbatim from capture/rank-home.yaml.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "signin.username-input"
      - eraseText
      # RAILS FIX (run 20260810T152819, cell exit 4): the raced first attempt
      # this retry exists to absorb used to tap Continue with a PARTIAL username,
      # which fired GET /v1/user/q and booked a vcr_miss — the flow self-healed on
      # retry but the rails audit counts misses and failed the cell. Proving the
      # text landed BEFORE the submit turns a raced attempt into a silent retry
      # with zero network. Assertion, never a tap.
      - inputText: "qa_draft"
      - assertVisible:
          text: ".*qa_draft.*"
      - tapOn:
          id: "signin.continue-btn"
      - extendedWaitUntil:
          visible:
            id: "leagues.row.*"
          timeout: 30000
- tapOn:
    id: "leagues.row.*"
- extendedWaitUntil:
    visible:
      id: "tab.trades"
    timeout: 60000
# SETTLE BEFORE SWITCHING TABS — see capture/league.yaml for the full finding.
# This wait is doing double duty here: it is also what guarantees the rank
# landing's own /api/rankings reads are done BEFORE the latency below is armed,
# so the delay lands on the rookie-scoped key's first fetch and nothing else.
- extendedWaitUntil:
    visible:
      id: "rank.more-ways"
    timeout: 60000
- waitForAnimationToEnd

# ── loading ──────────────────────────────────────────────────────────────
# fnmatch runs against request.path with the query string stripped
# (backend/test_support.py `_before_request_hook`), so the bare path matches the
# `?scope=rookie` call this screen makes. 5000 ms — comfortably wider than the
# ~4 s window the pilot found to be missable by hierarchy polling. The
# injection persists until reset, which is what also widens the error window
# below; nothing else in this flow reads /api/rankings.
- runScript:
    file: helpers/inject.js
    env:
      INJECT_KIND: latency
      INJECT_PATH: "/api/rankings"
      INJECT_MS: "5000"
- assertTrue: ${output.inject.ok}
- tapOn:
    id: "tab.draft"
- extendedWaitUntil:
    visible:
      id: "draft-room.scroll"
    timeout: 60000
# The bridge row renders in EVERY board state, including `unavailable` — by
# design: pre-draft prep is when it matters most, and that is exactly when the
# board has least to show (DraftRoomScreen.tsx, RankRookiesRow note). It sits
# directly under the status bar, so no forced scroll is needed.
- extendedWaitUntil:
    visible:
      id: "draft-room.rank-rookies"
    timeout: 40000
- tapOn:
    id: "draft-room.rank-rookies"
# `rookie-ranks.back-to-draft` mounts ABOVE the query branch (it is the first
# child of the SafeAreaView, RookieRanksScreen.tsx:432), so it proves we are on
# the screen AND that the two-way bridge passed `returnTo: 'DraftRoom'`. The
# ABSENCE of the list is what makes this frame the spinner and not the board.
- extendedWaitUntil:
    visible:
      id: "rookie-ranks.back-to-draft"
    timeout: 30000
- assertNotVisible:
    id: "rookie-ranks.list"
- takeScreenshot: rookie-ranks__loading

# ── populated--from-draft-room ───────────────────────────────────────────
# `rookie-ranks.list` is the DraggableFlatList and is rendered by no other
# branch — loading, scope-empty, error and empty--filter each render their own
# centred View instead (RookieRanksScreen.tsx:507-530).
- extendedWaitUntil:
    visible:
      id: "rookie-ranks.list"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "rookie-ranks.row.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: rookie-ranks__populated--from-draft-room

# ── filter--rb ───────────────────────────────────────────────────────────
# A pure client-side filter over the ONE consolidated list — no second fetch,
# no save — so this costs nothing and cannot fail on the network. RB is chosen
# because it is the second-largest cohort (16 of 56) and its underline colour
# is the most distinct against the ALL default.
# `rookie-ranks.filter.*` is already in scripts/testid-lint-allow.txt (the
# source templates it as `rookie-ranks.filter.${f.toLowerCase()}`).
- tapOn:
    id: "rookie-ranks.filter.rb"
- extendedWaitUntil:
    visible:
      id: "rookie-ranks.row.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: rookie-ranks__filter--rb

# ── error ────────────────────────────────────────────────────────────────
# Element-anchored swipe, never a bare `- scroll` and never coordinates: the
# pull has to START INSIDE the list or it lands on the stack header and does
# nothing (the finding capture/portfolio@two-leagues.yaml records for its
# RefreshControl). A row is the list's own cell, which is exactly where a
# user's thumb would begin a pull-to-refresh.
#
# `onRefresh` is a no-op while a save is in flight (`saveStatus === 'pending' ||
# 'saving'`), which is why this flow never drags: the board stays `idle` and
# the refetch is guaranteed to fire.
#
# COUNT=2: 500 is NOT in api/client.ts's RETRY_STATUSES {502,503,504} — that
# layer is gateway-only — so the HTTP client attempts once per call and
# react-query's `retry: 1` doubles it. This is the same arithmetic
# capture/matches.yaml and capture/calc.yaml use for their 500 injections, as
# distinct from capture/free-agents.yaml's count=6 for a 503.
#
# BODY: /api/rankings has no typed error of its own — it is a bare
# `@_gate_unverified_read` read (backend/server.py:6013) whose only declared
# refusals are the gate's 403 `verification_required` and the session helpers'
# 401/409. A 500 therefore carries Flask's generic shape, and the screen falls
# to `readErrorCopy(ranksQuery.error, 'Could not load rookie rankings.')` — the
# fallback, since the body is not `verification_required`. The injected body is
# the honest "server blew up" payload rather than a typed code this route never
# emits.
- runScript:
    file: helpers/inject.js
    env:
      INJECT_KIND: fail_next
      INJECT_PATH: "/api/rankings"
      INJECT_STATUS: "500"
      INJECT_COUNT: "2"
      INJECT_BODY: '{"error": "internal_error"}'
- assertTrue: ${output.inject.ok}
- swipe:
    from:
      id: "rookie-ranks.row.*"
    direction: DOWN
    duration: 500
# `ranksQuery.isError` is checked BEFORE the list renders, so the error card
# replaces the board even though the cached rows are still in memory. ~5 s of
# latency per attempt, twice — hence the generous budget.
- extendedWaitUntil:
    visible:
      text: ".*Could not load rookie rankings.*"
    timeout: 60000
- assertNotVisible:
    id: "rookie-ranks.list"
- waitForAnimationToEnd
- takeScreenshot: rookie-ranks__error
