appId: com.fantasytradefinder.app
# tc: TC-CAP-LEAGUESUMMARY-SINGLEFORMAT
# profile: single-format
# flags: release
# captures: populated--single-format
# source: mobile/src/screens/LeagueSummaryScreen.tsx
# interactive-stop: populated--single-format
#
# SELECTOR: the league row is matched as `leagues.row.*` (Maestro ids are
# regexes) rather than a literal id. The seeder writes `spec["league_id"]`
# verbatim (seed_ui_test_db.py:499), so every profile currently shares
# 990000000000000001 — but a profile-agnostic row selector cannot drift when
# a fixture renumbers, and every profile this flow runs under has exactly one
# league to pick (or wants the first one).
#
# Matrix row 174 — the power-rankings root with the single-format caption
# ("Dynasty · SF TEP": the league resolves to SF TEP even though the user's
# board lives in 1QB PPR). The League TAB root IS LeagueSummaryScreen
# (LeagueRankings), so no navigation beyond the tab is needed.
#
# ANCHOR CHOICE (pre-audit, not sim-driven): `league-summary.league-home` and
# the basis toggle exist in the static chrome, so either alone would let a
# still-loading frame through. `league-summary.updated-at` was the first
# candidate but it is doubly conditional — `query.data?.updated_at` (:731),
# a field the fixtures are not guaranteed to emit. The per-team row
# (`league-summary.team.<uid>`, :1379) only exists once the ranking payload
# has rows, so it is the honest populated proof; the wildcard is required
# because the id is a template literal.
tags: [capture, league-summary, single-format]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
- tapOn:
    id: "signin.username-input"
- inputText: "qa_standard"
- tapOn:
    id: "signin.continue-btn"
- extendedWaitUntil:
    visible:
      id: "leagues.row.*"
    timeout: 30000
- tapOn:
    id: "leagues.row.*"
- extendedWaitUntil:
    visible:
      id: "tab.league"
    timeout: 30000
- tapOn:
    id: "tab.league"

# ── populated--single-format ─────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "league-summary.basis.consensus"
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: "league-summary.team.*"
    timeout: 40000
- waitForAnimationToEnd
- takeScreenshot: league-summary__populated--single-format
