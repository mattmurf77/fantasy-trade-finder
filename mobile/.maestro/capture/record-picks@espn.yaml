appId: com.fantasytradefinder.app
# tc: TC-CAP-RECORDPICKS-ESPN
# profile: espn
# flags: release
# captures: populated, team-picker-expanded, loading, error--generic
# source: mobile/src/screens/RecordPicksScreen.tsx, mobile/src/screens/DraftRoomScreen.tsx, backend/draft_board_service.py assigned_board
# interactive-stop: populated
#
# FLAGS HEADER: `release`, and it must stay a bare fixture NAME. screen-capture
# .sh resolves it to backend/tests/fixtures/flags/<name>.json AND groups flows
# into sim cells by (profile, flags) — an earlier revision of this file carried
# a prose description there, which resolved to no fixture (silent fallback to
# seeder defaults) and split this profile into one extra cell per distinct
# string. The profile's own `flag_overrides` ride on top of `release` via the
# seeder, so they need no mention here.
#
# Screen-library capture flow for live offline pick recording
# (capture-matrix-2026-08-09.md deferred block, row "⚠ record-picks: ESPN-only
# + requires assigned picks"). Both halves are satisfied by the `espn` profile:
# `platform='espn'` with a STORED pick-assignment order, plus 5 recorded picks
# seeded ahead of time (backend/tests/test_seed_ui_test_db.py::
# test_espn_recorded_picks_are_seeded_for_the_record_picks_screen pins
# `overall` 1..5, all in round 1).
#
# WHAT THE FIXTURE MAKES THIS SCREEN SAY. The ESPN board is built entirely from
# the assignment grid (`assigned_board`, backend/draft_board_service.py:1249) —
# zero platform egress, by construction, because ESPN has no draft object.
# `order_confidence` is hard-coded `assigned` there, which is what clears
# RecordPicksScreen's `not-assigned` gate (RecordPicksScreen.tsx:337). The 5
# recorded rows are projected into `picks[]` behind `draft.manual_picks`, so
# `record-picks.progress` reads "5 of 40 recorded" (4 rounds x 10 teams for the
# current season) and the cursor auto-advances to the first unrecorded slot —
# pick 6, i.e. 1.06 — which is what `record-picks.on-the-clock` shows.
#
# ENTRY — the Draft Room's own row, then the launch argument:
#   · Populated leg: Draft tab → DraftRoom → `draft-room.record-picks`. That
#     row renders only for `manualPicksOn && board.platform === 'espn' &&
#     board.order_confidence === 'assigned'` (DraftRoomScreen.tsx:696-712), so
#     tapping it also PROVES the fixture satisfies all three conditions —
#     worth more than a launch argument that would skip the proof. Its sibling
#     `draft-room.assign-progress` renders on the same page (the espn profile
#     IS `seeded`), which is the second entry into
#     capture/pick-assignment@espn.yaml.
#   · Loading/error leg: launch argument, and it has to be — see that section.
#
# NOTHING IN THIS FLOW RECORDS OR VOIDS. Tapping an undrafted row calls
# `recordPick` (an offline queue that flushes to POST
# /api/league/recorded-picks) and `record-picks.undo.<n>` calls
# `voidRecordedPick`. Both are real server writes against the seeded league;
# neither is touched. `record-picks.change-team` is local state only
# (`setPickingTeam`) and is safe, as is a `record-picks.order-row.<n>` tap
# (`setCursor`) — but the flow does not need the latter.
#
# NOT CAPTURED, with evidence:
#   · `not-assigned` — needs `order_confidence !== 'assigned'`, which
#     `assigned_board` never emits, and the `unavailable` variant on this
#     screen ALSO cannot occur here (`draft.manual_picks` is pinned on). Both
#     need a fixture whose ESPN grid is unseeded, which is the `picks_not_
#     assigned` notice profile the matrix does not have.
#   · `done-card` — needs all 40 slots recorded, i.e. 35 server writes.
#     Excluded on the same no-writes rule.
#   · `order-row--sending` — the " · sending…" transient of an in-flight
#     record. Write-only, and it is a mid-mutation frame, so it also falls
#     under sign-off ruling E.
#   · toasts — every one is raised BY a write.
tags: [capture, record-picks, espn]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
# Retry-hardened sign-in preamble, copied verbatim from capture/rank-home.yaml.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "signin.username-input"
      - eraseText
      # RAILS FIX (run 20260810T152819, cell exit 4): the raced first attempt
      # this retry exists to absorb used to tap Continue with a PARTIAL username,
      # which fired GET /v1/user/q and booked a vcr_miss — the flow self-healed on
      # retry but the rails audit counts misses and failed the cell. Proving the
      # text landed BEFORE the submit turns a raced attempt into a silent retry
      # with zero network. Assertion, never a tap.
      - inputText: "qa_espn"
      - assertVisible:
          text: ".*qa_espn.*"
      - tapOn:
          id: "signin.continue-btn"
      - extendedWaitUntil:
          visible:
            id: "leagues.row.*"
          timeout: 30000
# The single row here is the ESPN league, merged in from GET /api/espn/leagues
# (qa_espn's Sleeper list is honestly `[]`) — see capture/pick-assignment@espn
# .yaml for the full note on why that merge is what stamps `platform: 'espn'`.
- tapOn:
    id: "leagues.row.*"
- extendedWaitUntil:
    visible:
      id: "tab.trades"
    timeout: 60000
# SETTLE BEFORE SWITCHING TABS — see capture/league.yaml for the full finding.
# `draft.tab` is TRUE in the release flags and is NOT overridden by the espn
# profile, so the Draft tab is present here too.
- extendedWaitUntil:
    visible:
      id: "rank.more-ways"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "tab.draft"
# The ESPN room builds from a DB grid, not a platform read, so it paints fast —
# but the budget stays generous because this is the run's first board fetch.
- extendedWaitUntil:
    visible:
      id: "draft-room.scroll"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "draft-room.state"
    timeout: 40000

# ── populated ────────────────────────────────────────────────────────────
# The record-picks row sits below the status bar, the rank-rookies bridge and
# the assign-progress row, so the forced-scroll construction from
# capture/rank-home.yaml applies: iOS keeps off-screen ScrollView children in
# the hierarchy, so a bare scrollUntilVisible would let the tap fire at
# off-screen coordinates.
- scrollUntilVisible:
    element:
      id: "draft-room.record-picks"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: "draft-room.record-picks"
# `record-picks.progress` renders only past every honest-state gate
# (no-league / unavailable / loading / error / not-assigned), so its presence
# is the proof that all five were cleared.
- extendedWaitUntil:
    visible:
      id: "record-picks.progress"
    timeout: 40000
# Full-match regex. "5 of 40 recorded" is `${recordedCount} of ${order.length}
# recorded` (RecordPicksScreen.tsx:358) and is the fixture's arithmetic: 5
# seeded recorded picks against a 4-round x 10-team current-season grid. If the
# seeder's counts ever drift, this assertion is what says so.
- extendedWaitUntil:
    visible:
      text: ".*5 of 40 recorded.*"
    timeout: 20000
# The cursor card. Its presence also proves the done-card branch is NOT taken
# (the two are the halves of one ternary, RecordPicksScreen.tsx:361-370).
- extendedWaitUntil:
    visible:
      id: "record-picks.on-the-clock"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "record-picks.order-row.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: record-picks__populated

# ── team-picker-expanded ─────────────────────────────────────────────────
# Local state only — `setPickingTeam(v => !v)`. The horizontal chip strip below
# the cursor's team name is what "Change team" reveals; choosing a chip only
# writes a LOCAL `teamOverride` map (no request), but the flow stops at the
# open strip because the override would change what a later capture shows.
#
# The id is `record-picks.team.${t.user_id}` and the espn profile's
# counterparties carry synthetic `espn:1189600.t<n>` ids (pinned by
# test_espn_membership_uses_synthetic_ids_for_counterparties), so the wildcard
# is both necessary and the only lint-resolvable form.
- tapOn:
    id: "record-picks.change-team"
- extendedWaitUntil:
    visible:
      id: "record-picks.team.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: record-picks__team-picker-expanded

# ── loading + error--generic (second launch, cold cache) ─────────────────
# WHY A SECOND LAUNCH, AND WHY THE LAUNCH ARGUMENT. This screen shares the
# Draft Room's exact query key — `['draft-board', leagueId, 'consensus']`
# (RecordPicksScreen.tsx:105) — so entering it from `draft-room.record-picks`
# ALWAYS finds a warm cache and never renders `query.isLoading`. And
# `query.isError || !board` is an OR against the DATA, so a failing refetch
# over a warm cache renders the populated recorder, never the error card. Both
# states need a cold key, i.e. a process restart that never opens the room.
#
# `draft-board` is not in App.tsx:60's PERSIST_KEYS, so `stopApp: true` alone
# empties it; `clearState: false` keeps the session RootNav restores onto Main.
# `RecordPicks` is absent from testRouteEntry.ts's TAB_OF map, so it dispatches
# as a ROOT-stack route (registered unconditionally in RootNav), and the screen
# reads `leagueId` from the session when no param is supplied.
#
# Both injections cover the same first fetch: the 5 s delay IS the loading
# window and the 404 lands at the end of it.
#
# COUNT=2: 404 is not in api/client.ts's RETRY_STATUSES {502,503,504}, so the
# HTTP client attempts once per call and react-query's `retry: 1` doubles it.
# BEWARE the one thing that could spend more: this screen polls
# `refetchInterval: 15_000` UNCONDITIONALLY (no focus/app-active/state gate,
# unlike the Draft Room's four-condition contract). The two error attempts and
# their ~5 s delays finish well inside one interval, so the budget is not eaten
# by a poll — but a later poll IS what makes the error self-heal, which is why
# the error frame is shot as soon as it appears rather than after a settle.
#
# BODY is the route's own 404 (backend/server.py:11295, `league_not_found`).
# RecordPicksScreen renders `readErrorCopy(query.error, "Couldn't load the
# draft board.")`, which returns the FALLBACK for anything that is not
# `verification_required`, so the copy asserted below is the client's; the body
# is there for fidelity.
- runScript:
    file: helpers/inject.js
    env:
      INJECT_KIND: latency
      INJECT_PATH: "/api/draft/board"
      INJECT_MS: "5000"
- assertTrue: ${output.inject.ok}
- runScript:
    file: helpers/inject.js
    env:
      INJECT_KIND: fail_next
      INJECT_PATH: "/api/draft/board"
      INJECT_STATUS: "404"
      INJECT_COUNT: "2"
      INJECT_BODY: '{"error": "league_not_found"}'
- assertTrue: ${output.inject.ok}
- launchApp:
    clearState: false
    stopApp: true
    arguments:
      FTFTestRoute: RecordPicks
# `record-picks.scroll` is the Shell's ScrollView (RecordPicksScreen.tsx:508)
# and mounts in EVERY branch including the spinner, so it proves we are on the
# screen; the ABSENCE of both the progress line and the error text is what
# makes this frame the loading state.
- extendedWaitUntil:
    visible:
      id: "record-picks.scroll"
    timeout: 60000
- assertNotVisible:
    id: "record-picks.progress"
- assertNotVisible:
    id: "record-picks.error"
- takeScreenshot: record-picks__loading
- extendedWaitUntil:
    visible:
      id: "record-picks.error"
    timeout: 60000
- takeScreenshot: record-picks__error--generic
