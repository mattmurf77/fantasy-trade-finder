appId: com.fantasytradefinder.app
# tc: TC-CAP-TRADES
# profile: standard
# flags: release
# captures: empty, error, loading, populated
# source: mobile/src/screens/TradesScreen.tsx, mobile/src/components/SkeletonTradeCard.tsx, mobile/src/components/Toast.tsx, mobile/src/components/TradeCard.tsx
# interactive-stop: empty
#
# Screen-library capture flow for Trades. Preamble copied from
# flows/smoke/05-trades-render.yaml, including the conditional dismissal of the
# first-run team-outlook sheet (outlook.save-btn, Contender pre-selected).
#
# State ordering avoids /__test__/reset entirely (reset clears backend
# sessions = signs us out):
#   empty      → resting state after the preamble (trades.empty-text)
#   error      → fail_next 500 (real production body) on POST
#                /api/trades/generate; count=1 so it self-clears before the
#                real run below. P0-2: the leg now ENDS on the persistent
#                trades.deck-error card (it no longer decays back to the
#                never-searched card), and it deliberately does NOT tap
#                "Try again" — a retry would populate the deck, and a
#                populated deck outranks every placeholder in the ladder, so
#                the `loading` state below could never render. The retry
#                itself is asserted three times in
#                flows/trades-generation-failure.yaml.
#   loading    → latency on the status poll holds the running-job UI open;
#                anchored on trades.deck-error UNMOUNTING (see below)
#   populated  → the same (slowed) job completes into the deck
tags: [capture, trades]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
- tapOn:
    id: "signin.username-input"
- inputText: "qa_standard"
- tapOn:
    id: "signin.continue-btn"
- extendedWaitUntil:
    visible:
      id: "leagues.row.990000000000000001"
    timeout: 30000
- tapOn:
    id: "leagues.row.990000000000000001"
- extendedWaitUntil:
    visible:
      id: "tab.trades"
    timeout: 30000
- tapOn:
    id: "tab.trades"
- runFlow:
    when:
      visible:
        id: "outlook.save-btn"
    commands:
      - tapOn:
          id: "outlook.save-btn"
      - extendedWaitUntil:
          notVisible:
            id: "outlook.save-btn"
          timeout: 5000
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "trades.find-btn"
    timeout: 20000

# ── empty ────────────────────────────────────────────────────────────────
- assertVisible:
    id: "trades.empty-text"
- takeScreenshot: trades__empty

# ── error ────────────────────────────────────────────────────────────────
# P0-2: a failed generate now renders a NAMED persistent state in the deck
# slot (trades.deck-error, red "SEARCH FAILED" + Try again), not just a Toast
# that fades back to the never-searched card. We anchor the shutter on that id
# — no blind waitForAnimationToEnd needed. Body is the REAL production shape
# from server.py's handle_unexpected_error (errorhandler at
# backend/server.py:2070), so the toast renders shipping copy ("Unexpected
# server error.") instead of the injector's "ftf_injected" placeholder:
# client.ts builds the message as parsed.message || parsed.error. (The CARD's
# own copy is DECK_FAIL_GENERIC — readErrorCopy's fallback — so the card never
# echoes a raw server string; the toast keeps the curated one.)
- runScript:
    file: helpers/inject.js
    env:
      INJECT_KIND: fail_next
      INJECT_PATH: "/api/trades/generate"
      INJECT_STATUS: "500"
      INJECT_COUNT: "1"
      INJECT_BODY: '{"error": "internal_error", "message": "Unexpected server error."}'
- assertTrue: ${output.inject.ok}
- tapOn:
    id: "trades.find-btn"
- extendedWaitUntil:
    visible:
      id: "trades.deck-error"
    timeout: 20000
- assertVisible:
    id: "trades.deck-error.retry"
- assertNotVisible:
    id: "trades.empty-text"
- takeScreenshot: trades__error

# ── loading ──────────────────────────────────────────────────────────────
# PILOT FINDING (run 20260809T222219): do NOT anchor this state on
# trades.progress-strip. The strip mounts only while job.status === 'running'
# (TradesScreen.tsx:4072/4248), and with only 2.5 s of poll latency that
# window was ~8 s — short enough that Maestro's hierarchy polling missed it
# and the flow died on "Assertion is false: trades.progress-strip is visible".
# (The strip itself is fine and does appear in the capture below; it was a
# race, not a layout problem.)
#
# The robust anchor is the resting headline DISAPPEARING: it unmounts the
# instant the running placeholder replaces it, it is always in view, and it
# cannot be missed the way a transient mount can. 6 s of latency per status
# poll widens the running window as well, without changing what the job
# ultimately returns.
#
# P0-2: the resting state entering this leg is now trades.deck-error, not
# trades.empty-text (the error leg above leaves the failure card mounted, and
# handleFindTrades clears deckFailure as its FIRST statement, so the card
# unmounts on this very tap). Anchoring on the id that is actually on screen
# is what keeps this a real wait instead of a vacuously-true one.
- runScript:
    file: helpers/inject.js
    env:
      INJECT_KIND: latency
      INJECT_PATH: "/api/trades/status*"
      INJECT_MS: "6000"
- assertTrue: ${output.inject.ok}
- tapOn:
    id: "trades.find-btn"
- extendedWaitUntil:
    notVisible:
      id: "trades.deck-error"
    timeout: 30000
- takeScreenshot: trades__loading

# ── populated ────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "trades.card-top"
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: trades__populated
