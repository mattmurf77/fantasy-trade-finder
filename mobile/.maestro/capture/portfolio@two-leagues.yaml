appId: com.fantasytradefinder.app
# tc: TC-CAP-PORTFOLIO-TWO
# profile: two-leagues
# flags: release
# captures: populated
# source: mobile/src/screens/PortfolioScreen.tsx
# interactive-stop: populated
#
# Screen-library capture flow for the cross-league Portfolio (matrix rows 158
# and 160). Portfolio was zero-coverage because of ENTRY: the Acquire subnav's
# Portfolio pill only renders with ≥2 leagues AND no finder mode, and `trades
# .finder_hub` (on in release) lands TradesHome directly in the guided deck —
# i.e. always in a finder mode. This flow uses the launch-argument entry (see
# capture/rank-home.yaml's header for the mechanism and its production gate):
# `-FTFTestRoute Portfolio` resolves through the Trades tab's nested stack.
#
# `two-leagues` is required, not cosmetic: the screen's first branch is a hard
# gate on `useSession().leagues.length >= 2`, and the league list is restored
# from AsyncStorage (`sleeper_leagues`) on the second launch — written by the
# normal sign-in + league pick below.
#
# SELECTOR NOTE: `leagues.row.*` rather than a literal id, matching
# capture/matches@two-leagues.yaml — the seeder currently gives every profile
# 990000000000000001, but a regex cannot drift when a fixture renumbers.
#
# The screen carries no list testID (its only testID, portfolio.open-settings,
# belongs to the <2-league gate), so the populated branch is anchored on the
# ListHeaderComponent's exposure summary, which no other branch renders.
tags: [capture, portfolio, two-leagues]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
# RUN-2 FIX: the shared sign-in preamble flakes — `inputText` occasionally
# races the field's focus and lands nowhere, and the empty username box only
# surfaces 30 s later as a missing `leagues.row.*` (observed once on this
# flow, passing on the identical preamble in its sibling). The retry wraps the
# whole sign-in leg and is idempotent: `eraseText` clears whatever a
# half-landed attempt left in the field before retyping. No fixed sleeps.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "signin.username-input"
      - eraseText
      - inputText: "qa_standard"
      - tapOn:
          id: "signin.continue-btn"
      - extendedWaitUntil:
          visible:
            id: "leagues.row.*"
          timeout: 30000
# RUN-3 FIX (2026-08-10): this flow died twice in a row on `tab.trades is
# visible` with the failure screenshot still showing the league picker — the
# league row tap simply did not navigate. Cause: AnalystGuide's onboarding
# coach-mark ("Pick the league that matters most…") mounts over the picker
# behind an ABSOLUTE-FILL tap catcher (`guide.tap-catcher`,
# AnalystGuide.tsx:117), which swallows the first tap anywhere on screen.
# `clearState: true` is what makes it appear: the tour's seen-marker lives in
# AsyncStorage, so every cold cell gets the tour, and whether the swallowed tap
# costs the flow is a race with the bubble's entrance.
#
# Dismissed explicitly rather than absorbed by a retry: `guide.step-x` is the
# bubble's own ✕ (AnalystGuide.tsx:151), the runFlow guard makes it a no-op on
# any run where the tour does not appear, and closing the tour means the FRAME
# below cannot pick up a stray coach-mark either.
- runFlow:
    when:
      visible:
        id: "guide.step-x"
    commands:
      - tapOn:
          id: "guide.step-x"
      - extendedWaitUntil:
          notVisible:
            id: "guide.bubble"
          timeout: 10000
      - waitForAnimationToEnd
- tapOn:
    id: "leagues.row.*"
- extendedWaitUntil:
    visible:
      id: "tab.trades"
    timeout: 60000

# ── populated ────────────────────────────────────────────────────────────
- launchApp:
    clearState: false
    stopApp: true
    arguments:
      FTFTestRoute: Portfolio
# Full-match regex. "<n> distinct players across <m> leagues" is the summary
# header, mounted only on the populated branch — the <2-league gate, the
# loading spinner, the error card and the "No exposure yet" empty list all
# render different bodies.
- extendedWaitUntil:
    visible:
      text: ".*distinct players across.*"
    timeout: 60000
- assertNotVisible:
    id: "portfolio.open-settings"
- waitForAnimationToEnd
- takeScreenshot: portfolio__populated

# ── refreshing — REMOVED 2026-08-10, ruling E ────────────────────────────
# The mobile UX audit (2026-08-09 §3) reported `portfolio/refreshing.png` as
# PIXEL-IDENTICAL to populated.png: "same timestamp, same scroll position, no
# refresh affordance in either". It was right, and re-shooting it was the
# wrong answer. The state has been deleted (the PNG pruned, this leg removed)
# rather than relabelled.
#
# WHY IT IS UNREACHABLE, not merely missed. Portfolio has NO refresh CONTROL.
# Its only refetch affordance is a <RefreshControl> on the list
# (PortfolioScreen.tsx:108-110 and :149-151) — `refreshing={query.isFetching}`,
# `onRefresh={() => query.refetch()}` — and RefreshControl fires only on a
# real overscroll pull. The previous attempt armed 4 s of latency on
# /api/portfolio and issued an element-anchored `swipe: from: <the summary
# header> direction: DOWN`, which travels only within the anchor element's own
# bounds: nowhere near the overscroll threshold, so `onRefresh` never fired,
# `isFetching` never went true, and the frame was byte-for-byte the populated
# one. A pull long enough to trip the threshold means start/end COORDINATES,
# which testid-lint bans outright, and the state it would show is a
# mid-gesture spinner — precisely the class ruling E excludes ("mid-gesture
# and timer-only states", 6 matrix rows).
#
# So: gesture-only affordance ⇒ ruling E ⇒ excluded by policy, not by
# capability. Recorded here rather than in a report so the next author does
# not re-derive it. If Portfolio ever grows a tappable refresh (the way
# LeagueSummary has `league-summary.refresh`), this state becomes capturable
# in one step and should come back.
