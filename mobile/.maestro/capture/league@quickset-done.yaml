appId: com.fantasytradefinder.app
# tc: TC-CAP-LEAGUE-QUICKSETDONE
# profile: quickset-done
# flags: release
# captures: progress-ring--4-4-unlocked
# source: mobile/src/screens/LeagueScreen.tsx, mobile/src/components/LeagueProgressModule.tsx
# interactive-stop: progress-ring--4-4-unlocked
#
# CAPTURE REQUEST #8 (mobile UX audit 2026-08-09, §2) — "the finding is that a
# Quick Set user reaches 4/4 and is still locked — I can describe it from code
# but have never seen it." Every other league capture shows the ring at 0/4.
#
# POST-FIX (audit P0-1, docs/plans/audit-p0-remediation/). The contradiction
# this file was authored to photograph is GONE, and the frame is re-captured
# rather than preserved — git history is the archive for the old one. What it
# shows now is the FIXED shape:
#
#   • /api/tiers/status  → saved: [QB, RB, WR, TE]      (Quick Set committed
#     tiers for all four positions in both formats)
#   • /api/rankings/progress → unlocked: TRUE            (ranking_method is
#     'quickset' — written at the point of use by /api/tiers/save, and
#     backfilled at Flask boot for rows that predate the fix)
#
# HISTORY, two sentences: until P0-1, `ranking_method` stayed NULL because the
# default Rank route never visits the chooser that wrote it, so the endpoint
# fell to the trio branch, found 0 of the 40 required interactions, and
# answered unlocked:false while LeagueScreen.tsx:328 counted the position
# ranked on `tiersSaved.includes(p)` and painted 4/4. The seeder's guard is now
# INVERTED (seed_ui_test_db.py `_validate_quickset`): it refuses an
# all-four-position Quick Set profile that claims unlocked:false, because the
# server can no longer produce that state — so the fixture cannot silently
# drift back out from under this capture.
#
# WHY THE MODULE IS ON SCREEN AT ALL AT 4/4. `moduleVisible`
# (LeagueScreen.tsx:358) is an OR: ring incomplete, OR no matches, OR
# contrarian insufficient. The ring is COMPLETE here, so it is the second
# clause carrying it — `quickset-done` seeds matches_seed {mutual: 0,
# awaiting: 0}.
#
# ENTRY is the ordinary pushed path (League tab → league-summary.league-home →
# LeagueHome), matching capture/league.yaml and capture/league@near-unlock
# .yaml. No launch argument is needed or wanted — the finding is about what a
# real Quick Set user sees.
#
# NO INJECTIONS. Every state this file photographs is the fixture's own
# resting answer; arming latency or a failure would photograph a different
# claim than the one the audit is checking.
tags: [capture, league, quickset-done]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
# Retry-hardened sign-in preamble (see capture/rank-home.yaml for the finding).
# The username ASSERTION before Continue is the rails fix from
# capture/pick-assignment@espn.yaml: a raced inputText that lands half a name
# submits a partial username and books a vcr miss, which fails the cell's
# rails audit even though the retry self-heals the flow.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "signin.username-input"
      - eraseText
      - inputText: "qa_quickset"
      - assertVisible:
          text: ".*qa_quickset.*"
      - tapOn:
          id: "signin.continue-btn"
      - extendedWaitUntil:
          visible:
            id: "leagues.row.*"
          timeout: 30000
- tapOn:
    id: "leagues.row.*"
- extendedWaitUntil:
    visible:
      id: "tab.trades"
    timeout: 60000
# SETTLE BEFORE SWITCHING TABS — the tab BAR paints long before #244's launch
# routing finishes resetting the Rank stack, and a tab tap fired into that
# window gets stolen back. `rank.more-ways` is the Rank surface's own header
# control (TabNav.tsx:148), so its presence proves the routing already ran.
# Full finding in capture/league.yaml.
- extendedWaitUntil:
    visible:
      id: "rank.more-ways"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "tab.league"
- extendedWaitUntil:
    visible:
      id: "league-summary.league-home"
    timeout: 30000
- tapOn:
    id: "league-summary.league-home"
- extendedWaitUntil:
    visible:
      id: "league.hero"
    timeout: 30000

# ── progress-ring--4-4-unlocked ────────────────────────────────────────────
# The module needs BOTH the summary and the coverage query resolved
# (`moduleVisible` is `!!summary && !!coverage && …`), so it can never be on
# the first frame; waiting on the module id rather than the hero is what keeps
# this out of the half-painted window.
#
# FORCED SCROLL, not a bare scrollUntilVisible: iOS keeps off-screen
# ScrollView children in the hierarchy, so Maestro would call the module
# "visible" while it sits below the fold and the shutter would photograph the
# hero. visibilityPercentage: 100 + centerElement: true forces a real scroll
# and parks the ring mid-screen. (rank-home.yaml RUN-1 finding.)
# RUN-2 FIX: `centerElement: true` OVERSHOT. The module is a tall card, and
# centring it drove the scroll past the point where it fit, cropping the ring
# and the "League progress" tick label off the top of the frame. Centring is
# the right tool before a TAP (rank-home.yaml) — for a SHUTTER the requirement
# is 100% visibility, and stopping the moment that is satisfied is what frames
# the whole card. visibilityPercentage: 100 is still mandatory: iOS keeps
# off-screen ScrollView children in the hierarchy, so without it Maestro would
# call the module visible from the hero and never scroll at all.
- scrollUntilVisible:
    element:
      id: "league.progress-module"
    direction: DOWN
    visibilityPercentage: 100
    timeout: 30000
# THE ASSERTION THAT MAKES THIS CAPTURE MEAN SOMETHING: the ring reading FULL
# on an account that is now genuinely unlocked — the fixed frame.
#
# RUN-1 FIX: this asserted ".*4/4.*", the literal the ring paints
# (LeagueProgressModule.tsx:84), and went red on a screen whose ring plainly
# read 4/4. PositionsRing's wrapper is `accessible` with an
# accessibilityLabel (:57-64), which COLLAPSES the subtree on iOS — the "4/4"
# Text is not exposed to the hierarchy at all, only the label is. So the
# assertion has to match the label's phrasing, which is also the more stable
# string (it survives any restyle of the in-ring numeral). Full-match regex;
# ASSERTION, never a tap.
- assertVisible:
    text: ".*4 of 4 positions ranked.*"
# `league.works-now` renders only while mutual matches are zero. Post-P0-1 it
# no longer pins a "locked" reading — it pins the frame to a ZERO-MATCH league,
# which is the second clause of `moduleVisible` and therefore the reason the
# progress module is still on screen at a complete ring at all.
- assertVisible:
    id: "league.works-now"
- waitForAnimationToEnd
- takeScreenshot: league__progress-ring--4-4-unlocked
