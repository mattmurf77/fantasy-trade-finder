appId: com.fantasytradefinder.app
# tc: TC-CAP-TOPBAR-TWO
# profile: two-leagues
# flags: release
# captures: league-switcher
# source: mobile/src/components/TopBar.tsx, mobile/src/components/LeagueSwitcherSheet.tsx
# interactive-stop: league-switcher
#
# SELECTOR: the league row is matched as `leagues.row.*` (Maestro ids are
# regexes) rather than a literal id. The seeder writes `spec["league_id"]`
# verbatim (seed_ui_test_db.py:499), so every profile currently shares
# 990000000000000001 — but a profile-agnostic row selector cannot drift when
# a fixture renumbers, and every profile this flow runs under has exactly one
# league to pick (or wants the first one).
#
# Matrix row 161 — the populated league switcher. Two rows plus the pinned
# "Add a league" entry; the ACTIVE league carries the check affordance
# (LeagueSwitcherSheet.tsx:127-133), which is the shape this row exists to
# record.
#
# The sheet's league rows have NO testIDs — `league.switcher.add-league` (:149)
# is the only one — so it is the arrival anchor and the fixture league names
# are the content proof. This is a capture-only row: nothing is tapped, so the
# missing row ids do not block it. (They DO block matrix rows 162/163 — see
# the report.)
tags: [capture, topbar, two-leagues]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
- tapOn:
    id: "signin.username-input"
- inputText: "qa_standard"
- tapOn:
    id: "signin.continue-btn"
- extendedWaitUntil:
    visible:
      id: "leagues.row.*"
    timeout: 30000
- tapOn:
    id: "leagues.row.*"
- extendedWaitUntil:
    visible:
      id: "topbar.league"
    timeout: 30000

# ── league-switcher ──────────────────────────────────────────────────────
- tapOn:
    id: "topbar.league"
- extendedWaitUntil:
    visible:
      id: "league.switcher.add-league"
    timeout: 20000
- assertVisible:
    text: ".*QA Standard League.*"
- assertVisible:
    text: ".*QA Second League.*"
- waitForAnimationToEnd
- takeScreenshot: topbar__league-switcher
