appId: com.fantasytradefinder.app
# tc: TC-CAP-PROFILE
# profile: standard
# flags: release
# captures: flag-off
# source: mobile/src/screens/ProfileScreen.tsx
# interactive-stop: flag-off
#
# Screen-library capture flow for the public profile screen (matrix row 139).
# The profile rows were zero-coverage purely because of ENTRY: the screen's
# only in-app path is the `/u/<username>` deep link, and `openLink dtf://…`
# raises an undismissable SpringBoard "Open in DTF?" confirm on iOS 18 (proven
# warm and cold). This flow uses the launch-argument entry instead — see
# capture/rank-home.yaml's header for the mechanism and its production gate.
#
# `FTFTestRouteParams` is a QUERY STRING merged in as the route's params — how
# the username the deep link would have supplied gets in. RUN-1 FIX: it was a
# JSON blob and silently arrived empty (the route opened, the header rendered
# "@profile"). NSUserDefaults' argument-domain parser treats a value starting
# with `{` as an old-style property list, which JSON is not, so the whole
# argument was dropped before the app ever saw it. `username=qa_standard` has
# no characters that parser claims.
#
# WHAT RELEASE TRUTH SHOWS: `profiles.public_pages` is false in the `standard`
# profile's overrides AND in config/features.json (#221 also hid the Settings
# row that pointed here). ProfileScreen's very first branch returns the
# "Profile not available / Public profiles are coming soon" gate, BEFORE the
# username check and before the query is enabled. So on release flags this is
# the ONLY renderable state of this screen — matrix rows 140 (`populated`) and
# 141 (`error--404`) are unreachable without `pin:profiles.public_pages=true`,
# which would need a second flags fixture and is out of this flow's scope.
#
# The screen has ZERO testIDs, so every assertion here is a full-match regex
# text matcher (Maestro anchors text selectors).
tags: [capture, profile]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
# RUN-2 FIX: the shared sign-in preamble flakes — `inputText` occasionally
# races the field's focus and lands nowhere, and the empty username box only
# surfaces 30 s later as a missing `leagues.row.*` (observed once on this
# flow, passing on the identical preamble in its sibling). The retry wraps the
# whole sign-in leg and is idempotent: `eraseText` clears whatever a
# half-landed attempt left in the field before retyping. No fixed sleeps.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: "signin.username-input"
      - eraseText
      - inputText: "qa_standard"
      - tapOn:
          id: "signin.continue-btn"
      - extendedWaitUntil:
          visible:
            id: "leagues.row.*"
          timeout: 30000
- tapOn:
    id: "leagues.row.*"
- extendedWaitUntil:
    visible:
      id: "tab.rank"
    timeout: 60000

# ── flag-off ─────────────────────────────────────────────────────────────
- launchApp:
    clearState: false
    stopApp: true
    arguments:
      FTFTestRoute: Profile
      FTFTestRouteParams: "username=qa_standard"
# The stack header renders "@<username>" from route.params, so this proves the
# params blob arrived — not just that some screen mounted.
- extendedWaitUntil:
    visible:
      text: ".*@qa_standard.*"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: ".*Profile not available.*"
    timeout: 30000
- assertVisible:
    text: ".*Public profiles are coming soon.*"
- waitForAnimationToEnd
- takeScreenshot: profile__flag-off
