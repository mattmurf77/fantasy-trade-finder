appId: com.fantasytradefinder.app
# tc: TC-CAP-TRADES-NEARUNLOCK
# profile: near-unlock
# flags: release
# captures: locked-gate
# source: mobile/src/screens/TradesScreen.tsx, mobile/src/components/FormatGate.tsx
# interactive-stop: locked-gate
#
# SELECTOR: the league row is matched as `leagues.row.*` (Maestro ids are
# regexes) rather than a literal id. The seeder writes `spec["league_id"]`
# verbatim (seed_ui_test_db.py:499), so every profile currently shares
# 990000000000000001 — but a profile-agnostic row selector cannot drift when
# a fixture renumbers, and every profile this flow runs under has exactly one
# league to pick (or wants the first one).
#
# Matrix row 155 — "verify what the deck renders while locked". SOURCE READ
# (2026-08-09), recorded here because the row asked the question:
#
#   TradesScreen has NO lock branch. The only gate it renders is FormatGate
#   (:3606), and its condition (:929-937) requires the league's format to be
#   ABSENT from `unlocked_formats` while the OTHER format is PRESENT. On
#   `near-unlock` the user is unlocked in neither format, so `gateState` is
#   null by the explicit "neither set — cold start, not this gate" clause and
#   the normal controls + empty deck render. The lock lives entirely on
#   progress (the Rank surfaces' payoff line), not on Acquire.
#
# So `locked-gate` captures the honest answer: the ordinary cold Acquire
# landing, reached by a locked user. The assertions below are the evidence —
# the Find control is live and the format gate is absent.
tags: [capture, trades, near-unlock]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
- tapOn:
    id: "signin.username-input"
- inputText: "qa_standard"
- tapOn:
    id: "signin.continue-btn"
- extendedWaitUntil:
    visible:
      id: "leagues.row.*"
    timeout: 30000
- tapOn:
    id: "leagues.row.*"
- extendedWaitUntil:
    visible:
      id: "tab.trades"
    timeout: 30000
- tapOn:
    id: "tab.trades"
- runFlow:
    when:
      visible:
        id: "outlook.save-btn"
    commands:
      - tapOn:
          id: "outlook.save-btn"
      - extendedWaitUntil:
          notVisible:
            id: "outlook.save-btn"
          timeout: 5000
      - waitForAnimationToEnd

# ── locked-gate ──────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "trades.find-btn"
    timeout: 30000
- assertVisible:
    id: "trades.empty-text"
- assertNotVisible:
    text: "Set up SF TEP to trade here"
- waitForAnimationToEnd
- takeScreenshot: trades__locked-gate
