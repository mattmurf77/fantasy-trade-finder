<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fantasy Trade Finder — Code City</title>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --panel:rgba(13,17,23,.88);
    --line:#262d38; --ink:#e6edf3; --dim:#8b949e; --ice:#5ac8fa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;position:absolute;inset:0;cursor:grab}
  canvas.drag{cursor:grabbing}

  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;backdrop-filter:blur(6px);font-size:11px;line-height:1.5}

  #hud{top:12px;left:12px;width:288px;max-height:calc(100vh - 24px);overflow:auto;padding:0}
  #hud::-webkit-scrollbar{width:8px}
  #hud::-webkit-scrollbar-thumb{background:#2c3441;border-radius:4px}
  .hd{padding:12px 14px;border-bottom:1px solid var(--line)}
  .hd h1{margin:0;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
  .hd .sub{color:var(--dim);font-size:10px;margin-top:4px}
  .sec{padding:11px 14px;border-bottom:1px solid var(--line)}
  .sec h2{margin:0 0 8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
  .stat b{display:block;font-size:16px;font-weight:600}
  .stat span{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.08em}

  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{flex:1;min-width:52px;background:#1b222c;color:var(--dim);border:1px solid var(--line);
    border-radius:4px;padding:5px 4px;font:inherit;font-size:10px;cursor:pointer}
  .seg button:hover{color:var(--ink);border-color:#39414f}
  .seg button.on{background:var(--ice);border-color:var(--ice);color:#06202b;font-weight:600}

  .row{display:flex;align-items:center;gap:8px;margin-top:7px;color:var(--dim);font-size:10px}
  .row input[type=range]{flex:1;accent-color:var(--ice)}
  #search{width:100%;background:#1b222c;border:1px solid var(--line);border-radius:4px;
    color:var(--ink);font:inherit;font-size:11px;padding:6px 8px}
  #search:focus{outline:none;border-color:var(--ice)}

  .legend{display:flex;flex-direction:column;gap:3px}
  .lg{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 3px;border-radius:3px}
  .lg:hover{background:#1b222c}
  .lg.off{opacity:.32}
  .sw{width:11px;height:11px;border-radius:2px;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
  .lg .n{flex:1}
  .lg .v{color:var(--dim);font-size:10px}

  .dist{display:flex;gap:8px;padding:4px 3px;border-radius:3px;cursor:pointer;align-items:baseline}
  .dist:hover{background:#1b222c}
  .dist .k{color:var(--ice);min-width:88px}
  .dist .d{color:var(--dim);font-size:10px;flex:1}

  #crumbs{top:12px;left:316px;padding:7px 11px;display:flex;gap:6px;align-items:center;max-width:52vw}
  #crumbs a{color:var(--ice);text-decoration:none;cursor:pointer;white-space:nowrap}
  #crumbs a:hover{text-decoration:underline}
  #crumbs .sep{color:#39414f}

  #tip{position:fixed;pointer-events:none;display:none;z-index:9;padding:8px 10px;max-width:400px}
  #tip .t{font-weight:600;margin-bottom:3px;word-break:break-all}
  #tip .p{color:var(--dim);font-size:10px;word-break:break-all;margin-bottom:5px}
  #tip .m{display:flex;gap:12px;color:var(--dim);font-size:10px}
  #tip .m b{color:var(--ink);font-weight:600}

  #help{right:12px;bottom:12px;padding:9px 12px;color:var(--dim);font-size:10px;text-align:right}
  #help b{color:var(--ink)}
  #compass{right:12px;top:12px;padding:9px 12px;color:var(--dim);font-size:10px}
  #compass b{color:var(--ink);font-weight:600}
  .kbd{background:#1b222c;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--ink)}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<div id="hud" class="panel">
  <div class="hd">
    <h1>Code City</h1>
    <div class="sub" id="meta">loading…</div>
  </div>

  <div class="sec">
    <h2>Metropolis</h2>
    <div class="stats">
      <div class="stat"><b id="s-files">–</b><span>files</span></div>
      <div class="stat"><b id="s-loc">–</b><span>lines</span></div>
      <div class="stat"><b id="s-commits">–</b><span>commits</span></div>
      <div class="stat"><b id="s-size">–</b><span>on disk</span></div>
    </div>
  </div>

  <div class="sec">
    <h2>Building height</h2>
    <div class="seg" id="metric">
      <button data-v="loc" class="on">lines</button>
      <button data-v="commits">commits</button>
      <button data-v="bytes">bytes</button>
    </div>
    <h2 style="margin-top:12px">Paint by</h2>
    <div class="seg" id="colorby">
      <button data-v="lang" class="on">language</button>
      <button data-v="age">age</button>
      <button data-v="churn">churn</button>
    </div>
    <div class="row"><span>height</span><input id="hscale" type="range" min="20" max="260" value="100"></div>
    <div class="row"><span>labels</span><input id="ldens" type="range" min="0" max="100" value="45"></div>
  </div>

  <div class="sec">
    <h2>Find a building</h2>
    <input id="search" placeholder="server.py, trade, .tsx …" autocomplete="off">
    <div class="row" id="hits">&nbsp;</div>
  </div>

  <div class="sec">
    <h2 id="legend-title">Legend</h2>
    <div id="scale"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="sec" style="border-bottom:none">
    <h2>Districts</h2>
    <div id="districts"></div>
  </div>
</div>

<div id="crumbs" class="panel"></div>
<div id="compass" class="panel"></div>
<div id="tip" class="panel"></div>
<div id="help" class="panel">
  <div><b>drag</b> rotate · <b>shift-drag</b> pan · <b>wheel</b> zoom</div>
  <div><b>click</b> district to enter · <b>right-click</b> back · <span class="kbd">R</span> reset</div>
</div>

<script src="city-data.js"></script>
<script>
(function(){
'use strict';

/* ─────────────────────────── data + constants ─────────────────────────── */

const DATA = window.CITY_DATA;
if(!DATA){ document.body.innerHTML = '<p style="padding:2rem;font:14px monospace;color:#e6edf3">'+
  'city-data.js missing — run <code>python3 scripts/codecity/generate.py</code></p>'; return; }

const LANG_COLOR = {
  python:'#4a90d9', typescript:'#7c5cd6', javascript:'#d6a93c', docs:'#5fa88a',
  web:'#d96a4a', config:'#7e8794', data:'#c05c8e', asset:'#43a3a8',
  shell:'#9aa84f', native:'#b05c4a', other:'#5a6472'
};
const LANG_LABEL = {
  python:'Python — backend', typescript:'TypeScript — mobile', javascript:'JavaScript',
  docs:'Markdown docs', web:'HTML / CSS', config:'Config / JSON / YAML', data:'Data + fixtures',
  asset:'Images / binaries', shell:'Shell', native:'iOS / Android native', other:'Other'
};
// Plain-language notes for the top-level districts, shown in the sidebar + on hover.
const DISTRICT_NOTES = {
  backend:'Flask + SQLAlchemy API, ranking + trade engines, test fixtures',
  mobile:'React Native / Expo iOS app — screens, components, Maestro flows',
  web:'Vanilla HTML/CSS/JS single-page site',
  extension:'Chrome / Edge MV3 browser extension',
  docs:'Reference layer — what the system IS (API, schema, ADRs, plans)',
  'living-memory':'Cross-session state — handoff, changelog, gotchas, decisions',
  '.claude':'Claude Code skills, hooks and settings',
  qa:'QA harness, sim-run records, results',
  scripts:'One-off + operational scripts',
  mockups:'Standalone Expo/HTML mockups and design labs',
  screens:'Screenshot library of every app screen',
  archive:'Retired code and cleanup snapshots',
  config:'Feature flags + tester allowlist',
  reference:'Vendored competitor reference material',
  githooks:'Pre-push sim gate',
  '.github':'CI workflows'
};

const GROUND = 1000;              // world is a GROUND × GROUND plate
const PLATE_H = 1.15;             // thickness of a district platform
const TAU = Math.PI * 2;

/* ─────────────────────────── state ─────────────────────────── */

const state = {
  metric:'loc', colorBy:'lang', hScale:1.0, labelDens:0.45,
  yaw:0.62, pitch:0.60, zoom:0.62, panX:0, panY:40,
  path:[],                       // drill-down breadcrumb (names)
  hidden:new Set(),              // languages toggled off
  query:'', matches:new Set(),
  hover:null, root:null, boxes:[], pickDirty:true
};

/* ─────────────────────────── layout: squarified treemap ─────────────────────────── */

function weightOf(n){
  const v = n.type==='file'
    ? (n.loc || Math.max(2, n.bytes/400))
    : (n.subtotal.loc || Math.max(2, n.subtotal.bytes/400));
  return Math.pow(Math.max(v, 4), 0.62);
}

function worst(row, area, side){
  let mx=-Infinity, mn=Infinity;
  for(const r of row){ if(r.__a>mx) mx=r.__a; if(r.__a<mn) mn=r.__a; }
  const s2 = side*side, a2 = area*area;
  return Math.max(s2*mx/a2, a2/(s2*mn));
}

function squarify(items, x, y, w, h){
  const total = items.reduce((s,n)=>s+n.__w, 0) || 1;
  const scale = (w*h)/total;
  items.forEach(n=> n.__a = Math.max(n.__w*scale, 1e-6));
  let i=0;
  while(i<items.length){
    if(w<=0.01 || h<=0.01){ for(;i<items.length;i++) items[i].rect={x,y,w:0,h:0}; break; }
    const side = Math.min(w,h);
    const row=[items[i]]; let rowArea=items[i].__a, best=worst(row,rowArea,side), j=i+1;
    while(j<items.length){
      const na = rowArea + items[j].__a;
      row.push(items[j]);
      const wr = worst(row,na,side);
      if(wr > best){ row.pop(); break; }
      rowArea = na; best = wr; j++;
    }
    if(w>=h){
      const rw = rowArea/h; let cy=y;
      for(const n of row){ const rh=n.__a/rw; n.rect={x,y:cy,w:rw,h:rh}; cy+=rh; }
      x+=rw; w-=rw;
    } else {
      const rh = rowArea/w; let cx=x;
      for(const n of row){ const rw2=n.__a/rh; n.rect={x:cx,y,w:rw2,h:rh}; cx+=rw2; }
      y+=rh; h-=rh;
    }
    i=j;
  }
}

function layout(node, x, y, w, h, depth){
  node.rect = {x,y,w,h};
  node.depth = depth;
  if(node.type==='file') return;
  const pad = Math.min(Math.min(w,h)*0.06, depth===0 ? 7 : 4) + 1.1;
  const ix=x+pad, iy=y+pad, iw=Math.max(w-2*pad,0.2), ih=Math.max(h-2*pad,0.2);
  const kids = node.children.filter(k=>!isHidden(k));
  kids.forEach(k=> k.__w = weightOf(k));
  kids.sort((a,b)=> b.__w - a.__w);
  squarify(kids, ix, iy, iw, ih);
  node.visible = kids;
  for(const k of kids){ k.parent = node; layout(k, k.rect.x, k.rect.y, k.rect.w, k.rect.h, depth+1); }
}

function isHidden(n){
  if(!state.hidden.size) return false;
  if(n.type==='file') return state.hidden.has(n.lang);
  return subLangs(n).every(l=> state.hidden.has(l));
}
const _langCache = new WeakMap();
function subLangs(n){
  if(n.type==='file') return [n.lang];
  let v=_langCache.get(n);
  if(!v){ v=[...new Set(n.children.flatMap(subLangs))]; _langCache.set(n,v); }
  return v;
}

/* ─────────────────────────── metrics ─────────────────────────── */

function metricOf(f){
  if(state.metric==='commits') return f.commits||1;
  if(state.metric==='bytes') return Math.max(1, f.bytes/50);
  return f.loc || Math.max(1, f.bytes/400);
}
let maxMetric = 1;
function computeMax(node){
  maxMetric = 1;
  (function walk(n){
    if(n.type==='file'){ maxMetric = Math.max(maxMetric, metricOf(n)); return; }
    n.children.forEach(walk);
  })(node);
}
function heightOf(f){
  const t = Math.sqrt(metricOf(f)/maxMetric);        // sqrt keeps outliers legible
  return (2 + 250*t) * state.hScale;
}

/* ─────────────────────────── color ─────────────────────────── */

function hex(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
const AGE_NEW = hex('#5ac8fa'), AGE_MID = hex('#4a6b8a'), AGE_OLD = hex('#3a3f4b');
const CHURN_LO = hex('#39485c'), CHURN_HI = hex('#e0603a');

function baseColor(f){
  if(state.colorBy==='age'){
    // Log ramp: almost everything in an active repo is recent, so a linear
    // days scale would paint the whole city one colour.
    const d = f.age==null ? 400 : f.age;
    const t = Math.min(1, Math.log(1+d)/Math.log(181));
    return t<0.5 ? mix(AGE_NEW,AGE_MID,t*2) : mix(AGE_MID,AGE_OLD,(t-0.5)*2);
  }
  if(state.colorBy==='churn'){
    const t = Math.min(1, Math.log(1+(f.commits||1))/Math.log(40));
    return mix(CHURN_LO, CHURN_HI, t);
  }
  return hex(LANG_COLOR[f.lang] || LANG_COLOR.other);
}
// Face colors repeat heavily (a handful of languages × five shades), and
// building rgba() strings per face was the single largest cost per frame.
const _cssCache = new Map();
function css(rgb, k){
  const kq = k < 0 ? 0 : k > 1.27 ? 254 : Math.round(k*200);
  const key = ((((rgb[0]|0) << 8 | (rgb[1]|0)) << 8) | (rgb[2]|0)) * 256 + kq;
  let s = _cssCache.get(key);
  if(s===undefined){
    const f = x=> { const v = x*(kq/200); return v<0?0:v>255?255:Math.round(v); };
    s = `rgb(${f(rgb[0])},${f(rgb[1])},${f(rgb[2])})`;
    if(_cssCache.size > 4000) _cssCache.clear();
    _cssCache.set(key, s);
  }
  return s;
}

/* ─────────────────────────── camera ─────────────────────────── */

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const pickCv = document.createElement('canvas');
const pickCtx = pickCv.getContext('2d', {willReadFrequently:true});
let W=0, H=0, DPR=1;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  pickCv.width = W; pickCv.height = H;
  draw();
}

let cy_=0, sy_=0, cp_=0, sp_=0;
function syncCam(){
  cy_=Math.cos(state.yaw); sy_=Math.sin(state.yaw);
  cp_=Math.cos(state.pitch); sp_=Math.sin(state.pitch);
  // Wall shading depends only on yaw, so the four values are computed per
  // frame rather than per face.
  for(let i=0;i<4;i++) _shade[i] = faceShade(_NX[i], _NY[i]);
}
function proj(x,y,z){
  const cx = x-GROUND/2, cyw = y-GROUND/2;
  const rx = cx*cy_ - cyw*sy_;
  const ry = cx*sy_ + cyw*cy_;
  return [rx*state.zoom + state.panX + W/2,
          (ry*sp_ - z*cp_)*state.zoom + state.panY + H/2,
          ry];
}

/* ─────────────────────────── drawing ─────────────────────────── */

const LIGHT = [-0.55, -0.83];
function faceShade(nx,ny){
  const rx = nx*cy_ - ny*sy_, ry = nx*sy_ + ny*cy_;
  return 0.52 + 0.30*Math.max(0, rx*LIGHT[0] + ry*LIGHT[1]);
}

// Flat scratch buffers: box() runs ~2,300× per frame, so it allocates nothing.
const _tx=new Float64Array(4), _ty=new Float64Array(4),
      _bx=new Float64Array(4), _by=new Float64Array(4);
const _NX=[0,1,0,-1], _NY=[-1,0,1,0];
const _shade=new Float64Array(4);

function box(g, r, z0, z1, rgb, opts){
  const o = opts||{};
  const x1=r.x+r.w, y1=r.y+r.h, hg=GROUND/2;
  const ox = state.panX + W/2, oy = state.panY + H/2, zm = state.zoom;
  for(let i=0;i<4;i++){
    const px = (i===1||i===2) ? x1 : r.x, py = (i>=2) ? y1 : r.y;
    const cx = px-hg, cyw = py-hg;
    const rx = (cx*cy_ - cyw*sy_)*zm + ox, ry = (cx*sy_ + cyw*cy_)*sp_*zm;
    _tx[i]=rx; _ty[i]= ry - z1*cp_*zm + oy;
    _bx[i]=rx; _by[i]= ry - z0*cp_*zm + oy;
  }

  if(z1-z0 > 0.01){
    for(let i=0;i<4;i++){
      const j=(i+1)&3;
      // screen-space winding cull — only the two or three faces turned
      // toward the camera are drawn
      const area = (_tx[j]-_tx[i])*(_by[j]-_ty[i]) - (_bx[j]-_tx[i])*(_ty[j]-_ty[i]);
      if(area <= 0) continue;
      g.beginPath();
      g.moveTo(_tx[i],_ty[i]); g.lineTo(_tx[j],_ty[j]);
      g.lineTo(_bx[j],_by[j]); g.lineTo(_bx[i],_by[i]);
      g.closePath();
      g.fillStyle = o.flat || css(rgb, _shade[i]);
      g.fill();
    }
  }
  g.beginPath(); g.moveTo(_tx[0],_ty[0]);
  for(let i=1;i<4;i++) g.lineTo(_tx[i],_ty[i]);
  g.closePath();
  g.fillStyle = o.flat || css(rgb, o.topShade||1.0);
  g.fill();
  if(o.stroke){ g.strokeStyle=o.stroke; g.lineWidth=o.lw||1; g.stroke(); }
}
// Screen-space centre of the top face box() just drew (used to place labels).
function topCentre(){
  return [(_tx[0]+_tx[1]+_tx[2]+_tx[3])/4, (_ty[0]+_ty[1]+_ty[2]+_ty[3])/4];
}

// Reused scratch object — screenSpan runs once per node per frame and the
// garbage from allocating a fresh box each time was showing up in profiles.
const _span = {minx:0,maxx:0,miny:0,maxy:0,w:0,h:0};
function screenSpan(r, z){
  const x1=r.x+r.w, y1=r.y+r.h;
  let minx=Infinity, maxx=-Infinity, miny=Infinity, maxy=-Infinity;
  for(let i=0;i<4;i++){
    const px = (i===1||i===2) ? x1 : r.x, py = (i>=2) ? y1 : r.y;
    const cx = px-GROUND/2, cyw = py-GROUND/2;
    const sx = (cx*cy_ - cyw*sy_)*state.zoom + state.panX + W/2;
    const sy = ((cx*sy_ + cyw*cy_)*sp_ - z*cp_)*state.zoom + state.panY + H/2;
    if(sx<minx) minx=sx; if(sx>maxx) maxx=sx;
    if(sy<miny) miny=sy; if(sy>maxy) maxy=sy;
  }
  _span.minx=minx; _span.maxx=maxx; _span.miny=miny; _span.maxy=maxy;
  _span.w=maxx-minx; _span.h=maxy-miny;
  return _span;
}
function offscreen(sp, pad){ pad=pad||120;
  return sp.maxx < -pad || sp.minx > W+pad || sp.maxy < -pad || sp.miny > H+pad; }

let pickList = [];
const labelQueue = [];

function drawNode(g, n, pick){
  const r = n.rect;
  if(!r || r.w<=0.02 || r.h<=0.02) return;
  const isFile = n.type==='file';
  const zBase = n.depth*PLATE_H;

  if(isFile){
    const m = Math.min(Math.min(r.w,r.h)*0.16, 1.5);
    const fr = {x:r.x+m, y:r.y+m, w:Math.max(r.w-2*m,0.25), h:Math.max(r.h-2*m,0.25)};
    // Cap the footprint so a district holding two files renders as two towers
    // on a plaza rather than two floor-slabs filling the plate.
    const CAP = 78;
    if(fr.w > CAP){ fr.x += (fr.w-CAP)/2; fr.w = CAP; }
    if(fr.h > CAP){ fr.y += (fr.h-CAP)/2; fr.h = CAP; }
    const h = heightOf(n);
    const sp = screenSpan(fr, zBase+h);
    if(offscreen(sp)) return;
    let rgb = baseColor(n);
    let stroke = null;
    const dim = state.query && !state.matches.has(n.path);
    if(pick){
      pickList.push(n);
      box(g, fr, zBase, zBase+h, rgb, {flat:idColor(pickList.length)});
    } else {
      if(dim) rgb = mix(rgb, [40,46,56], 0.78);
      if(state.matches.has(n.path)) stroke = '#ffd166';
      if(state.hover===n) stroke = '#ffffff';
      box(g, fr, zBase, zBase+h, rgb, {stroke, lw: stroke?1.4:1});
      const area = sp.w*sp.h;
      if(area > 1400*(1.25-state.labelDens) && n.name.length<34)
        labelQueue.push({node:n, pt:topCentre(), pri:area, kind:'file'});
    }
    return;
  }

  // ── district plate
  const sp = screenSpan(r, zBase+PLATE_H);
  if(offscreen(sp)) return;
  const plateArea = sp.w*sp.h;
  const kids = n.visible || n.children;

  if(!pick){
    const d = n.depth;
    const tone = 0.10 + Math.min(d,4)*0.028;
    box(g, r, Math.max(0,zBase-PLATE_H), zBase, [255,255,255], {
      flat:`rgba(${Math.round(255*tone)},${Math.round(262*tone)},${Math.round(275*tone)},1)`
    });
    // rim
    const top = [[r.x,r.y],[r.x+r.w,r.y],[r.x+r.w,r.y+r.h],[r.x,r.y+r.h]].map(p=>proj(p[0],p[1],zBase));
    g.beginPath(); g.moveTo(top[0][0],top[0][1]);
    for(let i=1;i<4;i++) g.lineTo(top[i][0],top[i][1]);
    g.closePath();
    g.strokeStyle = d<=1 ? 'rgba(90,200,250,.30)' : 'rgba(140,160,190,.13)';
    g.lineWidth = d<=1 ? 1.3 : 1; g.stroke();

    // Root plate is named in the breadcrumb bar — labelling it here would just
    // stamp a nameplate over the middle of the city.
    if(n.depth>0 && (plateArea > 5200*(1.3-state.labelDens) || n.depth===1))
      labelQueue.push({node:n, pt:frontCorner(top), pri:plateArea*3, kind:'dir'});
  } else {
    pickList.push(n);
    box(g, r, Math.max(0,zBase-PLATE_H), zBase, null, {flat:idColor(pickList.length)});
  }

  // Level of detail: a district too small to read draws as one massing block.
  if(plateArea < 900 && n.depth>0){
    const agg = aggregate(n);
    if(!pick){
      box(g, r, zBase, zBase+agg.h, agg.rgb, {});
    } else { pickList.push(n); box(g, r, zBase, zBase+agg.h, null, {flat:idColor(pickList.length)}); }
    return;
  }

  // Painter's order: far plates first. Keys are computed once per node, not
  // once per comparison — recomputing inside the comparator was O(n log n).
  const sorted = kids.slice();
  for(const k of sorted) k.__d = depthKey(k.rect);
  sorted.sort(byDepth);
  for(const k of sorted) drawNode(g, k, pick);
}
function byDepth(a,b){ return a.__d - b.__d; }

function depthKey(r){
  if(!r) return 0;
  const x1=r.x+r.w, y1=r.y+r.h, h=GROUND/2;
  const a=(r.x-h)*sy_+(r.y-h)*cy_, b=(x1-h)*sy_+(r.y-h)*cy_;
  const c=(x1-h)*sy_+(y1-h)*cy_, d=(r.x-h)*sy_+(y1-h)*cy_;
  return Math.max(a,b,c,d);
}
function centroid(pts){
  let x=0,y=0; for(const p of pts){ x+=p[0]; y+=p[1]; } return [x/pts.length, y/pts.length];
}
// Nearest (lowest on screen) corner of a plate — district nameplates sit there,
// on the plate's front kerb, instead of over its buildings.
function frontCorner(pts){
  let best = pts[0];
  for(const p of pts) if(p[1] > best[1]) best = p;
  const c = centroid(pts);
  return [best[0]*0.55 + c[0]*0.45, best[1] - 3];
}
const _agg = new WeakMap();
function aggregate(n){
  let v = _agg.get(n);
  if(!v || v.metric!==state.metric || v.cb!==state.colorBy || v.hs!==state.hScale){
    let sum=0, best=null, bestv=-1, counts={};
    (function walk(x){
      if(x.type==='file'){
        const m=metricOf(x); sum+=m;
        counts[x.lang]=(counts[x.lang]||0)+m;
        if(m>bestv){ bestv=m; best=x; }
      } else x.children.forEach(walk);
    })(n);
    const top = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
    const fake = best ? Object.assign({}, best, {lang:top}) : {lang:'other', age:null, commits:1};
    v = {metric:state.metric, cb:state.colorBy, hs:state.hScale,
         rgb: baseColor(fake),
         h: (2 + 250*Math.sqrt(Math.min(1, (sum/3)/maxMetric)))*state.hScale};
    _agg.set(n, v);
  }
  return v;
}
function idColor(i){ return `rgb(${(i>>16)&255},${(i>>8)&255},${i&255})`; }

/* ─────────────────────────── labels ─────────────────────────── */

function drawLabels(g){
  labelQueue.sort((a,b)=> b.pri - a.pri);
  const placed = [];
  const cap = 14 + Math.round(state.labelDens*90);
  let n=0;
  for(const L of labelQueue){
    if(n>=cap) break;
    const isDir = L.kind==='dir';
    const txt = isDir ? L.node.name + (L.node.depth<=1 ? '/' : '') : L.node.name;
    g.font = isDir
      ? `${L.node.depth<=1?600:500} ${L.node.depth<=1?13:11}px ui-monospace,Menlo,monospace`
      : '10px ui-monospace,Menlo,monospace';
    const w = g.measureText(txt).width, h = isDir ? (L.node.depth<=1?15:13) : 12;
    let [x,y] = L.pt; x = Math.round(x-w/2); y = Math.round(y);
    if(x<6 || x+w>W-6 || y<14 || y>H-6) continue;
    const bb = {x:x-4, y:y-h+2, w:w+8, h:h+3};
    if(placed.some(p=> !(bb.x>p.x+p.w || bb.x+bb.w<p.x || bb.y>p.y+p.h || bb.y+bb.h<p.y))) continue;
    placed.push(bb); n++;
    g.fillStyle = isDir ? 'rgba(9,12,17,.80)' : 'rgba(9,12,17,.62)';
    roundRect(g, bb.x, bb.y, bb.w, bb.h, 3); g.fill();
    if(isDir && L.node.depth<=1){
      g.strokeStyle='rgba(90,200,250,.45)'; g.lineWidth=1; g.stroke();
    }
    g.fillStyle = isDir ? (L.node.depth<=1 ? '#9fe0ff' : '#dbe3ec') : 'rgba(214,224,236,.86)';
    g.fillText(txt, x, y);
  }
  labelQueue.length = 0;
}
function roundRect(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

/* ─────────────────────────── frame ─────────────────────────── */

let raf = 0;
function draw(){
  if(raf) return;
  raf = requestAnimationFrame(()=>{ raf=0; render(); });
}
function render(){
  syncCam();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // sky
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0d1117'); sky.addColorStop(1,'#11161f');
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
  ctx.textBaseline='alphabetic';
  drawNode(ctx, state.root, false);
  drawLabels(ctx);
  state.pickDirty = true;
  updateCompass();
}
function renderPick(){
  syncCam();
  pickList = [];
  pickCtx.setTransform(1,0,0,1,0,0);
  pickCtx.clearRect(0,0,W,H);
  pickCtx.fillStyle='#000'; pickCtx.fillRect(0,0,W,H);
  drawNode(pickCtx, state.root, true);
  labelQueue.length = 0;
  state.pickDirty = false;
}
function hitTest(px,py){
  if(state.pickDirty) renderPick();
  const d = pickCtx.getImageData(px,py,1,1).data;
  const id = (d[0]<<16)|(d[1]<<8)|d[2];
  return id>0 ? pickList[id-1] : null;
}

/* ─────────────────────────── interaction ─────────────────────────── */

let drag=null;
cv.addEventListener('mousedown', e=>{
  if(e.button===2) return;
  drag = {x:e.clientX, y:e.clientY, yaw:state.yaw, pitch:state.pitch,
          px:state.panX, py:state.panY, pan:e.shiftKey, moved:0};
  cv.classList.add('drag');
});
window.addEventListener('mousemove', e=>{
  if(drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.moved = Math.max(drag.moved, Math.abs(dx)+Math.abs(dy));
    if(drag.pan){ state.panX = drag.px+dx; state.panY = drag.py+dy; }
    else {
      state.yaw = drag.yaw + dx*0.006;
      state.pitch = Math.max(0.12, Math.min(1.45, drag.pitch + dy*0.004));
    }
    draw();
    return;
  }
  const n = hitTest(e.clientX, e.clientY);
  if(n!==state.hover){ state.hover=n; showTip(n, e); draw(); }
  else if(n) moveTip(e);
});
window.addEventListener('mouseup', ()=>{ if(drag){ cv.classList.remove('drag'); } drag=null; });
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const k = Math.exp(-e.deltaY*0.0016);
  const mx=e.clientX-W/2-state.panX, my=e.clientY-H/2-state.panY;
  state.zoom = Math.max(0.06, Math.min(14, state.zoom*k));
  state.panX -= mx*(k-1); state.panY -= my*(k-1);
  draw();
},{passive:false});

cv.addEventListener('click', e=>{
  if(drag && drag.moved>4) return;
  const n = hitTest(e.clientX, e.clientY);
  if(!n) return;
  // Clicking a plate enters that district; clicking a building enters the
  // district it stands in, so drilling down works anywhere you can point.
  const target = n.type==='dir' ? n : n.parent;
  if(target && target!==state.root && target.type==='dir') enter(target);
});
cv.addEventListener('contextmenu', e=>{ e.preventDefault(); if(state.path.length) up(state.path.length-1); });
window.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='r'||e.key==='R') resetCam();
  if(e.key==='Escape' && state.path.length) up(state.path.length-1);
});
window.addEventListener('resize', resize);

const tip = document.getElementById('tip');
function fmt(n){ return n.toLocaleString(); }
function fmtBytes(b){
  const u=['B','KB','MB','GB']; let i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;}
  return (b<10&&i>0?b.toFixed(1):Math.round(b))+' '+u[i];
}
function showTip(n, e){
  if(!n){ tip.style.display='none'; return; }
  if(n.type==='file'){
    tip.innerHTML = `<div class="t">${esc(n.name)}</div><div class="p">${esc(n.path)}</div>
      <div class="m"><span><b>${fmt(n.loc)}</b> lines</span><span><b>${fmt(n.commits)}</b> commits</span>
      <span><b>${fmtBytes(n.bytes)}</b></span></div>
      <div class="m" style="margin-top:3px"><span>${esc(LANG_LABEL[n.lang]||n.lang)}</span>
      <span>last touched ${n.modified||'—'}</span></div>`;
  } else {
    const s=n.subtotal, note = DISTRICT_NOTES[n.name];
    tip.innerHTML = `<div class="t">${esc(n.name)}/</div>
      ${note?`<div class="p">${esc(note)}</div>`:''}
      <div class="m"><span><b>${fmt(s.files)}</b> files</span><span><b>${fmt(s.loc)}</b> lines</span>
      <span><b>${fmtBytes(s.bytes)}</b></span></div>
      <div class="m" style="margin-top:3px"><span>click to enter district</span></div>`;
  }
  tip.style.display='block'; moveTip(e);
}
function moveTip(e){
  const r = tip.getBoundingClientRect();
  let x=e.clientX+16, y=e.clientY+16;
  if(x+r.width>W-8) x = e.clientX-r.width-14;
  if(y+r.height>H-8) y = e.clientY-r.height-14;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ─────────────────────────── navigation ─────────────────────────── */

function nodeAtPath(p){
  let n = DATA.tree;
  for(const name of p){ n = n.children.find(c=>c.name===name && c.type==='dir') || n; }
  return n;
}
function enter(n){
  const p = [];
  (function find(node, trail){
    if(node===n){ p.push(...trail); return true; }
    if(node.type!=='dir') return false;
    return node.children.some(c=> find(c, trail.concat(c.name)));
  })(DATA.tree, []);
  if(p.length){ state.path = p; rebuild(true); }
}
function up(i){ state.path = state.path.slice(0,i); rebuild(true); }

function rebuild(recenter){
  state.root = nodeAtPath(state.path);
  computeMax(state.root);
  _langCache.delete && 0;
  layout(state.root, 0, 0, GROUND, GROUND, 0);
  if(recenter) resetCam();
  renderCrumbs(); renderSidebar(); draw();
}
function resetCam(){
  // panX offsets the city clear of the sidebar.
  state.yaw=0.62; state.pitch=0.60; state.zoom=0.62; state.panX=105; state.panY=40; draw();
}

function renderCrumbs(){
  const el = document.getElementById('crumbs');
  const parts = [`<a data-i="0">${esc(DATA.repo)}</a>`];
  state.path.forEach((p,i)=> parts.push(`<span class="sep">/</span><a data-i="${i+1}">${esc(p)}</a>`));
  const r = state.root, s = r.type==='dir' ? r.subtotal : null;
  el.innerHTML = parts.join('') + (s? `<span class="sep">·</span><span style="color:#8b949e">${fmt(s.files)} files · ${fmt(s.loc)} lines</span>`:'');
  el.querySelectorAll('a').forEach(a=> a.onclick = ()=> up(+a.dataset.i));
}

/* ─────────────────────────── sidebar ─────────────────────────── */

function renderSidebar(){
  document.getElementById('meta').innerHTML =
    `${esc(DATA.repo)} · <span style="color:#5ac8fa">${esc(DATA.branch)}</span> @ ${esc(DATA.head)}<br>generated ${esc(DATA.generated)}`;
  const t = DATA.totals;
  document.getElementById('s-files').textContent = fmt(t.files);
  document.getElementById('s-loc').textContent = t.loc>=1000 ? (t.loc/1000).toFixed(0)+'k' : t.loc;
  document.getElementById('s-commits').textContent = fmt(t.commits);
  document.getElementById('s-size').textContent = fmtBytes(t.bytes);

  renderScale();
  const lg = document.getElementById('legend');
  lg.innerHTML = Object.entries(DATA.langLoc).map(([k,v])=>
    `<div class="lg ${state.hidden.has(k)?'off':''}" data-l="${k}">
       <span class="sw" style="background:${LANG_COLOR[k]||LANG_COLOR.other}"></span>
       <span class="n">${esc(LANG_LABEL[k]||k)}</span>
       <span class="v">${v>=1000?(v/1000).toFixed(0)+'k':v}</span></div>`).join('');
  lg.querySelectorAll('.lg').forEach(el=> el.onclick = ()=>{
    const l = el.dataset.l;
    state.hidden.has(l) ? state.hidden.delete(l) : state.hidden.add(l);
    rebuild(false);
  });

  const dd = document.getElementById('districts');
  dd.innerHTML = DATA.tree.children.filter(c=>c.type==='dir').map(c=>
    `<div class="dist" data-n="${esc(c.name)}"><span class="k">${esc(c.name)}/</span>
      <span class="d">${esc(DISTRICT_NOTES[c.name]||'')}</span></div>`).join('');
  dd.querySelectorAll('.dist').forEach(el=> el.onclick = ()=>{
    const n = DATA.tree.children.find(c=>c.name===el.dataset.n);
    if(n) enter(n);
  });
}
// When painting by age or churn the language swatches no longer describe the
// buildings, so a labelled ramp for the active scale is drawn above them.
function renderScale(){
  const el = document.getElementById('scale');
  const title = document.getElementById('legend-title');
  if(state.colorBy==='lang'){
    el.innerHTML=''; title.textContent='Legend — language';
    return;
  }
  const isAge = state.colorBy==='age';
  title.textContent = isAge ? 'Legend — last touched' : 'Legend — commit churn';
  const stops = isAge
    ? [[0,'today'],[7,'1 wk'],[30,'1 mo'],[90,'3 mo'],[180,'6 mo+']]
    : [[1,'1'],[4,'4'],[12,'12'],[25,'25'],[40,'40+']];
  const swatch = stops.map(([v])=>{
    const rgb = baseColor(isAge ? {age:v, lang:'other'} : {commits:v, lang:'other'});
    return `<span style="flex:1;height:10px;background:rgb(${rgb.map(Math.round).join(',')})"></span>`;
  }).join('');
  el.innerHTML =
    `<div style="display:flex;border-radius:3px;overflow:hidden;margin-bottom:4px">${swatch}</div>
     <div style="display:flex;justify-content:space-between;color:var(--dim);font-size:9px;margin-bottom:10px">
       ${stops.map(s=>`<span>${s[1]}</span>`).join('')}
     </div>
     <div style="color:var(--dim);font-size:10px;margin-bottom:8px">
       ${isAge?'days since the file&rsquo;s last commit':'commits touching the file, all history'}
     </div>
     <div style="color:var(--dim);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px">Filter by language</div>`;
}

/* controls */
function segment(id, key, after){
  document.querySelectorAll(`#${id} button`).forEach(b=> b.onclick = ()=>{
    document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); state[key] = b.dataset.v; after && after();
  });
}
segment('metric','metric', ()=>{ computeMax(state.root); draw(); });
segment('colorby','colorBy', ()=>{ renderScale(); draw(); });
document.getElementById('hscale').oninput = e=>{ state.hScale = +e.target.value/100; draw(); };
document.getElementById('ldens').oninput = e=>{ state.labelDens = +e.target.value/100; draw(); };

const search = document.getElementById('search');
search.oninput = ()=>{
  state.query = search.value.trim().toLowerCase();
  state.matches = new Set();
  if(state.query){
    (function walk(n){
      if(n.type==='file'){ if(n.path.toLowerCase().includes(state.query)) state.matches.add(n.path); }
      else n.children.forEach(walk);
    })(state.root);
  }
  document.getElementById('hits').textContent = state.query
    ? `${state.matches.size} match${state.matches.size===1?'':'es'} in ${state.path.length?state.path.join('/'):DATA.repo}`
    : ' ';
  draw();
};

function updateCompass(){
  const deg = Math.round(((-state.yaw/TAU)*360 % 360 + 360) % 360);
  document.getElementById('compass').innerHTML =
    `<b>${deg}°</b> yaw · <b>${Math.round(state.pitch*57.3)}°</b> pitch · <b>${state.zoom.toFixed(2)}×</b>`;
}

/* ─────────────────────────── boot ─────────────────────────── */

resize();
rebuild(true);
})();
</script>
</body>
</html>
