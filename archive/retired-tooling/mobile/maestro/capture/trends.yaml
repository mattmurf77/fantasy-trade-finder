appId: com.fantasytradefinder.app
# tc: TC-CAP-TRENDS
# profile: standard
# flags: release
# captures: error, loading, populated
# source: mobile/src/screens/TrendsScreen.tsx, mobile/src/components/TrendBar.tsx, mobile/src/components/PositionChip.tsx
# interactive-stop: populated
#
# Screen-library capture flow for Trends (matrix rows 75-78). Preamble
# copied from capture/trades.yaml through the league pick; no OutlookSheet
# dismissal (Acquire tab is never visited). No /__test__/reset anywhere —
# reset signs us out.
#
# TrendsScreen carries ZERO testIDs (verified by grep), so every anchor is a
# text / a11y matcher. That is allowed — the banned pattern is a
# text-selector TAP (lld.md §4.4 rule 1); waits may match text. Maestro text
# matching is FULL-MATCH regex, hence the .* wrappers (batch-A lesson: bare
# "Easiest sells" never matched "Easiest sells & easiest buys").
#
# ORDERING IS FORCED BY THE CACHE (run-1..3 lessons):
#   • Both queries are staleTime 60 s and the cache is PERSISTED
#     (App.tsx:241), so a successful load blocks any later error injection.
#     Error goes first, on the cold query.
#   • Re-entering after the error does NOT produce a spinner: an errored
#     query keeps status 'error' while it refetches, so SectionBody's
#     `loading` (:286) stays false and the error branch re-renders. The only
#     honest spinner is a cold query — hence the clearState relaunch before
#     the loading/populated block.
#   • Nothing preloads these keys (RankMenu deliberately does not prefetch
#     Trends, TabNav.tsx:822-824), so the fetch starts at mount and 6 s of
#     latency is plenty. That also means the error budget is exactly 2 —
#     1 attempt + 1 react-query retry (state/queryClient.ts:26).
tags: [capture, trends]
---
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 15000
- tapOn:
    id: "signin.username-input"
- inputText: "qa_standard"
- tapOn:
    id: "signin.continue-btn"
- extendedWaitUntil:
    visible:
      id: "leagues.row.990000000000000001"
    timeout: 30000
- tapOn:
    id: "leagues.row.990000000000000001"
- extendedWaitUntil:
    visible:
      id: "tab.rank"
    timeout: 60000
- tapOn:
    id: "tab.rank"
- extendedWaitUntil:
    visible:
      id: "rank.more-ways"
    timeout: 60000

# ── error ────────────────────────────────────────────────────────────────
# Risers and fallers share ONE query, so both sections show the failure
# together (matrix row 77) while the consensus-gap section below them loads
# normally — that contrast IS the state. Body is the real production 500
# (backend/server.py:2071 handle_unexpected_error); the section renders
# readErrorCopy's fallback for a non-verification failure (:156), and the
# "Try again" ghost button exists only on the error branch (:297).
- runScript:
    file: helpers/inject.js
    env:
      INJECT_KIND: fail_next
      INJECT_PATH: "/api/trends/risers-fallers"
      INJECT_STATUS: "500"
      INJECT_COUNT: "2"
      INJECT_BODY: '{"error": "internal_error", "message": "Unexpected server error."}'
- assertTrue: ${output.inject.ok}
- tapOn:
    id: "rank.more-ways"
- extendedWaitUntil:
    visible:
      id: "rankmenu.more-toggle"
    timeout: 15000
- tapOn:
    id: "rankmenu.more-toggle"
- extendedWaitUntil:
    visible:
      id: "rankmenu.trends"
    timeout: 15000
- tapOn:
    id: "rankmenu.trends"
- extendedWaitUntil:
    visible:
      text: ".*Try again.*"
    timeout: 60000
- takeScreenshot: trends__error

# ── loading ──────────────────────────────────────────────────────────────
# Cold restart (the only way to a spinner — see the ordering note) with 6 s
# of latency on both trends endpoints armed first. The three section headers
# render outside SectionBody (:152/172/192), so they paint immediately and
# prove we are on Trends while the bodies are still spinners.
- runScript:
    file: helpers/inject.js
    env:
      INJECT_KIND: latency
      INJECT_PATH: "/api/trends/*"
      INJECT_MS: "6000"
- assertTrue: ${output.inject.ok}
- launchApp:
    clearState: true
    clearKeychain: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "signin.username-input"
    timeout: 20000
- tapOn:
    id: "signin.username-input"
- inputText: "qa_standard"
- tapOn:
    id: "signin.continue-btn"
- extendedWaitUntil:
    visible:
      id: "leagues.row.990000000000000001"
    timeout: 40000
- tapOn:
    id: "leagues.row.990000000000000001"
- extendedWaitUntil:
    visible:
      id: "tab.rank"
    timeout: 60000
- tapOn:
    id: "tab.rank"
- extendedWaitUntil:
    visible:
      id: "rank.more-ways"
    timeout: 60000
- tapOn:
    id: "rank.more-ways"
- extendedWaitUntil:
    visible:
      id: "rankmenu.more-toggle"
    timeout: 15000
- tapOn:
    id: "rankmenu.more-toggle"
- extendedWaitUntil:
    visible:
      id: "rankmenu.trends"
    timeout: 15000
- tapOn:
    id: "rankmenu.trends"
- extendedWaitUntil:
    visible:
      text: ".*Easiest sells.*"
    timeout: 40000
- takeScreenshot: trends__loading

# ── populated ────────────────────────────────────────────────────────────
# The ELO label renders only inside a MoveRow's delta cluster (:368) — i.e.
# only once risers/fallers actually have rows. `standard` seeds 30 d of
# history plus one ranked opponent, so the movers and consensus-gap sections
# both fill.
- extendedWaitUntil:
    visible:
      text: ".*ELO.*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: trends__populated
