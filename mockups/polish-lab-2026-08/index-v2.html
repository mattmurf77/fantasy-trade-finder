<script id="pages" type="application/json">[{"label": "Trade DNA v2", "fb": "#212 #231 #206", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish Lab \u2014 Trade DNA &amp; Outlook V2 (#212 \u00b7 #231 \u00b7 #206)<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink0:#0C0E11; --ink1:#13161B; --ink2:#1A1E25; --ink3:#232833;\n  --line:#262C35; --lineStrong:#59647A;\n  --chalk:#ECEFF4; --dim:#97A1AE; --faint:#626C79;\n  --ice:#56D9EC; --icePress:#3FC2D6; --onIce:#071013;\n  --flare:#F0508C; --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n  --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n  --first1:#2dd4bf;\n  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;\n  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;\n  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:#07090c;color:var(--chalk);font-family:var(--f-ui);\n  display:flex;flex-direction:column;align-items:center;padding:24px 12px 64px;gap:22px;min-height:100vh}\n\n.note{max-width:840px;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:13px;line-height:1.55;color:var(--dim)}\n.note h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:22px;color:var(--chalk);margin-bottom:4px}\n.note h2{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:13px;color:var(--ice);margin:12px 0 4px}\n.note b{color:var(--chalk)}\n.note ul{margin:4px 0 0 18px} .note li{margin:3px 0}\n.q{border-left:3px solid var(--lineStrong);padding-left:10px;margin:6px 0;font-style:italic}\n\n.pairwrap{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}\n.slot{display:flex;flex-direction:column;gap:8px;align-items:center}\n.slotlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:7px}\n.slotlbl::before{content:\"\";width:3px;height:12px;background:var(--lineStrong)}\n.slot.proposed .slotlbl{color:var(--ice)} .slot.proposed .slotlbl::before{background:var(--ice)}\n.slot.rejected .slotlbl{color:var(--warn)} .slot.rejected .slotlbl::before{background:var(--warn)}\n.caption{max-width:390px;font-size:12px;line-height:1.5;color:var(--dim);text-align:left}\n\n/* mock annotation chips \u2014 meta, not UI */\n.hchip{font-family:var(--f-mono);font-size:11px;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:3px 9px;background:rgba(245,158,11,.06)}\n.hchip b{color:var(--warn);font-weight:600}\n\n.phone{width:390px;background:var(--ink0);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55)}\n.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:var(--dim);font-family:var(--f-mono)}\n.scroll{padding:4px 16px 14px;display:flex;flex-direction:column;gap:12px}\n/* row-1 + row-2 phones share one fixed viewport so the fold comparison is honest */\n.vp .scroll{height:600px;overflow:hidden;position:relative}\n.vp .scroll::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(transparent,var(--ink0))}\n/* the gradient above is a mockup viewport cue, not a UI gradient */\n.pagetitle{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:22px}\n.leaguepill{align-self:flex-start;display:flex;align-items:center;gap:6px;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--dim)}\n.leaguepill .dot{width:7px;height:7px;border-radius:999px;background:var(--ice)}\n.leaguepill b{color:var(--chalk);font-weight:600}\n\n/* ---- shared bits ---- */\n.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.pdot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;display:inline-block}\n.pos-qb{background:var(--qb)} .pos-rb{background:var(--rb)} .pos-wr{background:var(--wr)} .pos-te{background:var(--te)} .pos-pk{background:var(--first1)}\nsvg.ic{stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:square}\n.grouplbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);margin-top:4px}\n.editbtn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--lineStrong);border-radius:4px;background:transparent;color:var(--chalk);font-family:var(--f-ui);font-size:13px;font-weight:600;cursor:pointer}\n.editbtn:hover{border-color:var(--ice)}\n.editbtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:square}\n.donebtn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 14px;border:none;border-radius:4px;background:var(--ice);color:var(--onIce);font-family:var(--f-ui);font-size:13px;font-weight:700;cursor:pointer}\n.donebtn:hover{background:var(--icePress)}\n\n.seclabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);margin-top:2px}\n.modecard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:12px;cursor:pointer}\n.modecard .icwell{width:40px;height:40px;border-radius:8px;background:var(--ink2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--ice)}\n.modecard .body{flex:1;min-width:0}\n.modecard .trow{display:flex;align-items:center;gap:8px}\n.modecard .t{font-size:16px;font-weight:600}\n.modecard .rec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--flare)}\n.modecard .d{font-size:13px;color:var(--dim);margin-top:1px;line-height:1.4}\n.modecard .chev{color:var(--faint);flex:0 0 auto}\n\n.tabbar{display:flex;border-top:1px solid var(--line);background:var(--ink1)}\n.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}\n.tab svg{width:20px;height:20px;stroke:var(--faint);stroke-width:1.75;fill:none;stroke-linecap:square}\n.tab.on{color:var(--ice)} .tab.on svg{stroke:var(--ice)}\n\n/* ---- V1 PROPOSED panel (reproduced from trade-dna-outlook.html, unchanged) ---- */\n.dna2{border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:12px;display:flex;flex-direction:column;gap:10px}\n.dna2 .top{display:flex;align-items:center;justify-content:space-between}\n.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.outcard{border:1px solid var(--line);border-radius:8px;background:var(--ink2);padding:10px 10px 9px;cursor:pointer;position:relative}\n.outcard .t{font-size:14px;font-weight:600}\n.outcard .d{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.35}\n.outcard.sel{border-color:var(--ice)}\n.outcard.sel::after{content:\"\";position:absolute;top:8px;right:8px;width:3px;height:12px;background:var(--ice)}\n.outcard.sel .d{color:var(--chalk)}\n.needchips{display:flex;flex-wrap:wrap;gap:8px}\n.needchip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--ink2);font-size:13px;font-weight:600;color:var(--chalk)}\n.needchip .tag{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-left:2px}\n.tag.starter{color:var(--flare)}\n.tag.depth{color:var(--dim)}\n.needkey{font-size:11px;color:var(--faint);line-height:1.45}\n\n/* ---- V2 collapsed panel ---- */\n.dna3{border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:10px 12px;display:flex;flex-direction:column;gap:8px}\n.dna3 .top{display:flex;align-items:center;justify-content:space-between}\n.outchip{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:var(--ink2);padding:4px 11px;font-size:12px;font-weight:600;color:var(--chalk)}\n.outchip .tick{width:3px;height:11px;background:var(--ice);flex:0 0 auto}\n.outchip .bias{color:var(--dim);font-weight:400}\n.sumline{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;font-size:13px;color:var(--chalk);line-height:1.4}\n.sumline .k{color:var(--faint)}\n.sumline .sep{color:var(--faint)}\n.sumline .n{font-family:var(--f-mono);font-weight:600;font-size:13px}\n.mini{display:inline-flex;align-items:center;gap:5px;font-weight:600}\n.mini .pdot{width:7px;height:7px}\n\n/* ---- V2 expanded panel ---- */\n.outcard.tight{padding:8px 9px 7px}\n.outcard.tight .t{font-size:13px}\n.outgrid.tight{gap:6px}\n.togglerow{display:flex;gap:6px}\n.pt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}\n.ptb{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:4px;border:1px solid var(--lineStrong);background:transparent;color:var(--chalk);font-family:var(--f-ui);font-size:13px;font-weight:600;cursor:pointer;padding:0 2px}\n.ptb:hover{background:var(--ink3)}\n.ptb .pdot{width:7px;height:7px}\n.ptb svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:square;flex:0 0 auto}\n.ptb.on{border-color:transparent;color:var(--onIce)}\n.ptb.on-qb{background:var(--qb)} .ptb.on-rb{background:var(--rb)} .ptb.on-wr{background:var(--wr);color:#04070C} .ptb.on-te{background:var(--te)} .ptb.on-pk{background:var(--first1)}\n.ptag{font-size:11px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;min-height:15px;line-height:15px;text-align:center}\n.ptag.need{color:var(--flare)} .ptag.deep{color:var(--dim)}\n.untline{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--chalk)}\n.untline .k{color:var(--faint)}\n.untline .n{font-family:var(--f-mono);font-weight:600}\n.untline .manage{margin-left:auto;color:var(--ice);font-weight:600;font-size:13px;cursor:pointer}\n\n/* ---- reference frame: deck + bias receipt (verbatim from v1) ---- */\n.ref{zoom:.85}\n.modebar .back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ice);margin-bottom:8px}\n.swrow{display:flex;gap:6px;overflow:hidden}\n.sw{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink1);font-size:12px;color:var(--dim);min-height:32px;display:flex;align-items:center}\n.sw.on{border-color:var(--ice);background:var(--ink2);color:var(--chalk)}\n.receipt{display:flex;align-items:center;gap:8px;background:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12.5px;color:var(--dim)}\n.receipt .tick{width:3px;height:12px;background:var(--flare);flex:0 0 auto}\n.receipt b{color:var(--chalk);font-weight:600}\n.receipt .chg{margin-left:auto;color:var(--ice);font-weight:600;cursor:pointer;flex:0 0 auto}\n.tcard{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}\n.tcard .hdr .lbl{display:block}\n.tcard .opp{font-size:16px;font-weight:600;margin-top:1px}\n.strength{display:flex;flex-direction:column;gap:4px}\n.strength .row{display:flex;justify-content:space-between;align-items:baseline}\n.strength .val{font-family:var(--f-mono);font-size:13px}\n.track{height:4px;background:var(--ink3)}\n.track .fill{height:4px;background:var(--rb)}\n.split{display:flex;gap:12px}\n.split .vrule{width:1px;background:var(--line)}\n.side{flex:1;display:flex;flex-direction:column;gap:6px}\n.ticklbl{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.ticklbl::before{content:\"\";width:3px;height:12px;background:var(--ice)}\n.prow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-left:3px solid var(--wr);border-radius:8px;background:var(--ink2);padding:8px}\n.prow .nm{font-size:13px;font-weight:600;line-height:1.25}\n.prow .meta{font-size:11px;color:var(--dim);font-family:var(--f-mono)}\n.vbar{display:flex;flex-direction:column;gap:6px}\n.vbar .who{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:18px;color:var(--pos)}\n.vbar .margin{font-size:12px;color:var(--dim)}\n.vbar .margin b{font-family:var(--f-mono);color:var(--pos);font-weight:600}\n.vbar .pick{color:var(--first1);font-weight:600}\n.dtrack{position:relative;height:14px;background:var(--ink3);border-radius:2px;margin-top:2px}\n.dtrack .cen{position:absolute;left:50%;top:-4px;width:1px;height:22px;background:var(--lineStrong)}\n.dtrack .t1{position:absolute;left:21.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .t2{position:absolute;left:78.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .fillr{position:absolute;left:50%;width:11%;height:14px;background:var(--pos);border-radius:2px}\n.scalerow{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;color:var(--faint)}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"note\">\n  <h1>Polish Lab \u00b7 Trade DNA &amp; Outlook \u2014 V2 iteration (#212 \u00b7 #231 \u00b7 #206)<\/h1>\n  <p><b>Operator feedback on v1:<\/b><\/p>\n  <p class=\"q\">\"Aligned with the second design [the deck bias-receipt frame \u2014 keep that approach]. The first is still not right. First, it's too tall. By default we need a smaller version that expands when the user clicks edit. Second, I think the simpler approach for the 'chasing', 'shopping' (when editing) is to simply present all positions and have the buttons for the selected ones highlighted. So two asks \u2014 work on a more compact, shorter design on page entry &amp; improve the edit experience as well.\"<\/p>\n  <p style=\"margin-top:8px\"><b>V2 answers both asks:<\/b> the hub panel collapses to a two-line summary on entry (outlook chip + inline chasing/shopping/untouchables) with a single Edit button; tapping Edit expands the same card in place into the full editor \u2014 outlook cards (tightened from v1) plus <b>all-positions toggle rows<\/b> for Chasing and Shopping (selected = solid position-color fill, unselected = outline; no picker sheets). The deck bias receipt is reproduced untouched as a reference frame.<\/p>\n<\/div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 ROW 1 \u00b7 V1 proposed vs V2 collapsed \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div class=\"pairwrap\">\n\n  <!-- V1 PROPOSED (too tall) -->\n  <div class=\"slot rejected\">\n    <div class=\"slotlbl\">V1 proposed \u2014 too tall<\/div>\n    <div class=\"hchip\">DNA panel: <b>355px<\/b> tall on entry (measured)<\/div>\n    <div class=\"phone vp\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"pagetitle\">Find a Trade<\/div>\n        <div class=\"leaguepill\"><span class=\"dot\"><\/span>Trading in&nbsp;\u00b7&nbsp;<b>Dynasty Degens<\/b><\/div>\n\n        <div class=\"dna2\" id=\"v1panel\">\n          <div class=\"top\">\n            <span class=\"lbl\">Your Trade DNA<\/span>\n            <button class=\"editbtn\"><svg viewBox=\"0 0 20 20\"><path d=\"M13 3l4 4L7 17H3v-4z\"/><\/svg>Edit<\/button>\n          <\/div>\n          <div class=\"grouplbl\" style=\"margin-top:0\">My team is\u2026<\/div>\n          <div class=\"outgrid\">\n            <div class=\"outcard sel\"><div class=\"t\">Rebuilding<\/div><div class=\"d\">Leans young + picks<\/div><\/div>\n            <div class=\"outcard\"><div class=\"t\">Contending<\/div><div class=\"d\">Balanced moves<\/div><\/div>\n            <div class=\"outcard\"><div class=\"t\">All-in<\/div><div class=\"d\">Win now, spend picks<\/div><\/div>\n            <div class=\"outcard\"><div class=\"t\">Tanking<\/div><div class=\"d\">Max youth, high picks<\/div><\/div>\n          <\/div>\n          <div class=\"grouplbl\">Chasing<\/div>\n          <div class=\"needchips\">\n            <span class=\"needchip\"><span class=\"pdot pos-te\"><\/span>TE<span class=\"tag starter\">Starter need<\/span><\/span>\n            <span class=\"needchip\"><span class=\"pdot pos-wr\"><\/span>WR<span class=\"tag depth\">Depth<\/span><\/span>\n          <\/div>\n          <div class=\"grouplbl\">Shopping<\/div>\n          <div class=\"needchips\">\n            <span class=\"needchip\"><span class=\"pdot pos-rb\"><\/span>RB<span class=\"tag depth\">Deep<\/span><\/span>\n          <\/div>\n          <div class=\"needkey\">Starter need = a hole in your lineup. Depth = your bench is thin there.<\/div>\n        <\/div>\n\n        <div class=\"seclabel\">How do you want to find trades?<\/div>\n        <div class=\"modecard\">\n          <div class=\"icwell\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 20 20\"><path d=\"M3 14 6 6l4 5 4-7 3 10z\"/><\/svg><\/div>\n          <div class=\"body\">\n            <div class=\"trow\"><span class=\"t\">Fully Guided<\/span><span class=\"rec\">recommended<\/span><\/div>\n            <div class=\"d\">We read your roster &amp; league and walk you to the best deals.<\/div>\n          <\/div>\n          <svg class=\"ic chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n        <\/div>\n        <div class=\"modecard\">\n          <div class=\"icwell\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg><\/div>\n          <div class=\"body\">\n            <div class=\"    <\/div>\n          <div class=\"strength\">\n            <div class=\"row\"><span class=\"lbl\">Match strength<\/span><span class=\"val\">78<\/span><\/div>\n            <div class=\"track\"><div class=\"fill\" style=\"width:78%\"><\/div><\/div>\n          <\/div>\n          <div class=\"split\">\n            <div class=\"side\">\n              <div class=\"ticklbl\">You send<\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--rb)\"><div><div class=\"nm\">Breece Hall<\/div><div class=\"meta\">RB \u00b7 NYJ<\/div><\/div><\/div>\n            <\/div>\n            <div class=\"vrule\"><\/div>\n            <div class=\"side\">\n              <div class=\"ticklbl\">You get<\/div>\n              <div class=\"prow\"><div><div class=\"nm\">Marvin Harrison Jr.<\/div><div class=\"meta\">WR \u00b7 ARI \u00b7 23 yrs<\/div><\/div><\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--first1)\"><div><div class=\"nm\">2027 2nd (mid)<\/div><div class=\"meta\">PICK<\/div><\/div><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"vbar\">\n            <span class=\"lbl\">Dynasty value swing<\/span>\n            <div class=\"who\">You win<\/div>\n            <div class=\"margin\">by <b>+380<\/b> &nbsp;\u00b7&nbsp; <span class=\"pick\">a Mid 3rd<\/span> (\u2248 0.2 firsts)<\/div>\n            <div class=\"dtrack\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"fillr\"><\/div><div class=\"cen\"><\/div><\/div>\n            <div class=\"scalerow\"><span>\u22121st<\/span><span>\u22122nd<\/span><span>Even<\/span><span>+2nd<\/span><span>+1st<\/span><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <\/div>\n    <div class=\"caption\">Approved in v1 \u2014 reproduced here untouched for context: one receipt line above the deck connects its shape to the outlook, with an ice <b>Change<\/b> link back to the panel (which now lands on the compact card and auto-expands the editor).<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"note\">\n  <h2>What changed from v1, and the interaction rules<\/h2>\n  <ul>\n    <li><b>Compact by default.<\/b> Trade DNA is read a hundred times for every one edit. The collapsed card carries the full state in 111px \u2014 outlook chip with its plain-words bias, inline chasing/shopping position chips, untouchables count \u2014 a ~244px (\u221269%) saving vs the v1 panel, which puts all three finder modes back above the fold.<\/li>\n    <li><b>One affordance when collapsed.<\/b> Edit is the only control (the whole card is also tappable to expand). No inline Manage links, no tappable chips in the summary \u2014 nothing to learn until you opt into editing.<\/li>\n    <li><b>Expand in place, not a sheet.<\/b> Edit grows the same card (200ms, <code>--t-base<\/code> family); Done collapses it. Scroll position is preserved; the receipt's \"Change\" link deep-links here and auto-expands.<\/li>\n    <li><b>All positions, always visible (operator's ask).<\/b> Chasing and Shopping each show QB \u00b7 RB \u00b7 WR \u00b7 TE \u00b7 Picks as one row of toggles. <b>Selected = solid position-color fill + check glyph; unselected = outline (<code>--line-strong<\/code>) + position dot.<\/b> One tap toggles; no add/remove flows, no picker sheet. Check + fill together keep state legible without relying on color alone.<\/li>\n    <li><b>Mutual exclusion.<\/b> A position can't be both chased and shopped: tapping a position on one row that's selected on the other <b>moves<\/b> it (selects here, clears there) rather than erroring \u2014 the clearing button animates out its fill so the move is visible. Multi-select within a row is fine (chase WR + TE simultaneously).<\/li>\n    <li><b>Hints are not selections (#206 kept).<\/b> The roster scan's STARTER NEED / DEPTH recommendations render as passive 11px tags in the reserved line under the relevant toggle \u2014 flare <b>NEED<\/b> for a lineup hole, dim <b>DEPTH/DEEP<\/b> for bench strength \u2014 with one key line defining both. Tags aren't tappable and persist whether or not the position is selected (compressed from v1's \"Starter need\" to fit the type floor under a 60px button; the key line carries the full definition).<\/li>\n    <li><b>Outlook cards survive, tighter.<\/b> The v1 four-card grid was right for <i>editing<\/i> \u2014 it lives only in the expanded state now, at reduced padding/type (13px titles, 11px bias lines). Tap still switches directly.<\/li>\n    <li><b>Receipt untouched.<\/b> The deck bias receipt frame is the v1 design verbatim \u2014 approved, no iteration.<\/li>\n    <li><b>Build-time note.<\/b> Dark-on-fill text passes 4.5:1 on QB/RB/TE/Picks fills; WR blue (#3B82F6) sits at \u22484.1:1 \u2014 at implementation either bump the WR selected label to 14px bold (large-text threshold) or pair the fill with the check glyph as the primary state cue, per the a11y floor in the design system.<\/li>\n  <\/ul>\n<\/div>\n\n<\/body>\n<\/html>\n"}, {"label": "Find-a-trade v2", "fb": "#216 #209", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish Lab \u2014 Find-a-Trade-for-Player Layout v2 (#216 \u00b7 #209 iteration)<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink0:#0C0E11; --ink1:#13161B; --ink2:#1A1E25; --ink3:#232833;\n  --line:#262C35; --lineStrong:#59647A;\n  --chalk:#ECEFF4; --dim:#97A1AE; --faint:#626C79;\n  --ice:#56D9EC; --icePress:#3FC2D6; --onIce:#071013;\n  --flare:#F0508C; --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n  --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n  --first1:#2dd4bf;\n  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;\n  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;\n  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:#07090c;color:var(--chalk);font-family:var(--f-ui);\n  display:flex;flex-direction:column;align-items:center;padding:24px 12px 64px;gap:22px;min-height:100vh}\n\n.note{max-width:840px;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:13px;line-height:1.55;color:var(--dim)}\n.note h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:22px;color:var(--chalk);margin-bottom:4px}\n.note h2{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:13px;color:var(--ice);margin:12px 0 4px}\n.note b{color:var(--chalk)}\n.note ul{margin:4px 0 0 18px} .note li{margin:3px 0}\n.q{border-left:3px solid var(--lineStrong);padding-left:10px;margin:6px 0;font-style:italic}\n\n.pairwrap{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}\n.slot{display:flex;flex-direction:column;gap:8px;align-items:center}\n.slotlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ice);display:flex;align-items:center;gap:7px}\n.slotlbl::before{content:\"\";width:3px;height:12px;background:var(--ice)}\n.caption{max-width:390px;font-size:12px;line-height:1.5;color:var(--dim);text-align:left}\n.caption b{color:var(--chalk)}\n\n.phone{width:390px;background:var(--ink0);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55)}\n.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:var(--dim);font-family:var(--f-mono)}\n.scroll{padding:4px 16px 14px;display:flex;flex-direction:column;gap:12px;height:648px;overflow-y:auto}\n/* fixed-height scrollable viewport so the demo behaves like a phone */\n\n.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.pdot{width:7px;height:7px;border-radius:2px;flex:0 0 auto;display:inline-block}\n.pos-qb{background:var(--qb)} .pos-rb{background:var(--rb)} .pos-wr{background:var(--wr)} .pos-te{background:var(--te)}\nsvg.ic{stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:square}\n\n/* mode bar */\n.back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ice);margin-bottom:8px}\n.swrow{display:flex;gap:6px;overflow:hidden}\n.sw{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink1);font-size:12px;color:var(--dim);min-height:32px;display:flex;align-items:center}\n.sw.on{border-color:var(--ice);background:var(--ink2);color:var(--chalk)}\n\n/* pin board (#209 order: away left, for right) */\n.ctrlcard{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}\n.board{display:flex;gap:8px}\n.col{flex:1;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:8px}\n.col.for{border-top:2px solid var(--pos)} .col.away{border-top:2px solid var(--flare)}\n.colh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}\n.col.for .colh{color:var(--pos)} .col.away .colh{color:var(--flare)}\n.mini{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 8px;border-radius:4px;background:var(--ink2);font-size:12.5px;font-weight:600}\n.mini .x{margin-left:auto;color:var(--faint);font-size:12px}\n.addbtn{min-height:40px;border:1px dashed var(--lineStrong);background:transparent;color:var(--dim);border-radius:4px;font-size:12px;font-family:var(--f-ui);cursor:pointer}\n\n/* \u2550\u2550\u2550 featured trade window \u2550\u2550\u2550 */\n.tcard{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}\n.ticklbl{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.ticklbl::before{content:\"\";width:3px;height:12px;background:var(--ice)}\n.fwhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}\n.backchip{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 10px 0 6px;border:1px solid var(--lineStrong);border-radius:4px;background:var(--ink2);color:var(--ice);font-family:var(--f-ui);font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto}\n.backchip:hover{background:var(--ink3);border-color:var(--ice)}\n.backchip:active{background:var(--ink3);color:var(--icePress)}\n.backchip svg{width:12px;height:12px}\n.tcard .opp{font-size:16px;font-weight:600;margin-top:1px}\n.split{display:flex;gap:12px}\n.split .vrule{width:1px;background:var(--line)}\n.side{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}\n.prow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-left:3px solid var(--rb);border-radius:8px;background:var(--ink2);padding:8px}\n.prow .nm{font-size:13px;font-weight:600;line-height:1.25}\n.prow .meta{font-size:11px;color:var(--dim);font-family:var(--f-mono)}\n\n/* Dynasty Value Swing verdict (v1 format, carried forward verbatim) */\n.vbar{display:flex;flex-direction:column;gap:6px}\n.vbar .who{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:18px;color:var(--pos)}\n.vbar .who.neg{color:var(--neg)}\n.vbar .margin{font-size:12px;color:var(--dim)}\n.vbar .margin b{font-family:var(--f-mono);color:var(--pos);font-weight:600}\n.vbar .margin b.neg{color:var(--neg)}\n.vbar .pick{color:var(--first1);font-weight:600}\n.dtrack{position:relative;height:14px;background:var(--ink3);border-radius:2px;margin-top:2px}\n.dtrack .cen{position:absolute;left:50%;top:-4px;width:1px;height:22px;background:var(--lineStrong)}\n.dtrack .t1{position:absolute;left:21.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .t2{position:absolute;left:78.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .fillr{position:absolute;height:14px;background:var(--pos);border-radius:2px}\n.scalerow{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;color:var(--faint)}\n\n/* \u2550\u2550\u2550 \"More trades\" list \u2014 rows are tappable cards \u2550\u2550\u2550 */\n.ideas{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}\n.grouph{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);margin-top:8px}\n.idea{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px;border:1px solid var(--line);border-radius:2px;background:var(--ink1);\n  font-family:var(--f-ui);color:var(--chalk);text-align:left;cursor:pointer}\n.idea:hover{background:var(--ink2);border-color:var(--lineStrong)}\n.idea:active{background:var(--ink3);border-color:var(--lineStrong)}          /* pressed: surface + border shift, no lift */\n.idea:focus-visible,.backchip:focus-visible{outline:2px solid var(--ice);outline-offset:2px}\n.idea .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}\n.idea .sides{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}\n.idea .sides svg{flex:0 0 auto;color:var(--faint)}\n.idea .meta{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}\n.diff{padding:2px 8px;border-radius:2px;border:1px solid rgba(34,197,94,.4);font-family:var(--f-mono);font-size:12px;color:var(--pos);flex:0 0 auto}\n.diff.neg{border-color:rgba(239,68,68,.4);color:var(--neg)}\n.idea .go{flex:0 0 auto;color:var(--faint)}\n.idea:hover .go{color:var(--ice)}\n.idea.featured{border-color:var(--ice);background:var(--ink2);cursor:default}\n.idea.featured .go{display:none}\n.intag{display:none;flex:0 0 auto;padding:2px 6px;border-radius:2px;background:var(--ink3);border:1px solid var(--line);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ice);font-weight:600}\n.idea.featured .intag{display:inline-block}\n\n.tabbar{display:flex;border-top:1px solid var(--line);background:var(--ink1)}\n.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}\n.tab svg{width:20px;height:20px;stroke:var(--faint);stroke-width:1.75;fill:none;stroke-linecap:square}\n.tab.on{color:var(--ice)} .tab.on svg{stroke:var(--ice)}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"note\">\n  <h1>Polish Lab \u00b7 Find-a-Trade-for-Player v2 \u2014 operator iteration on #216 + #209<\/h1>\n  <p><b>Operator feedback on v1 (verbatim):<\/b><\/p>\n  <p class=\"q\">\"I prefer the 'Dynasty Value Swing' format for the calc, and the More trades for Breece Hall section presented by default underneath it. Are the trade cards 'clickable'? They should be. And clicking them should open that trade in the window above instead. There should also be a back button for the user to revert the window to the previous trade (this should actually be available by default, not just for this use case.\"<\/p>\n  <p style=\"margin-top:8px\"><b>What changed from v1:<\/b> the <b>Dynasty Value Swing<\/b> verdict block (label + You-win headline + margin-in-picks line + diverging \u22121st\u2026+1st track) is kept as the calc presentation. The <b>\"More trades for Breece Hall\"<\/b> list is now visible by default under the featured window \u2014 the \"More options / Fewer options\" gate is gone. Every idea row is a real tappable card (chevron, pressed state) that <b>loads its trade into the featured window above<\/b>; a compact <b>\u2039 Previous trade<\/b> chip in the window's corner reverts. The left frame below is a <b>live demo \u2014 tap the rows<\/b>.<\/p>\n<\/div>\n\n<div class=\"pairwrap\">\n\n  <!-- \u2550\u2550\u2550 FRAME A \u00b7 default state (interactive) \u2550\u2550\u2550 -->\n  <div class=\"slot\">\n    <div class=\"slotlbl\">V2 \u2014 default state (live demo: tap the rows)<\/div>\n    <div class=\"phone\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\" id=\"demoScroll\">\n        <div class=\"back\"><svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Hub<\/div>\n        <div class=\"swrow\">\n          <span class=\"sw\">Guided<\/span><span class=\"sw\">Team<\/span><span class=\"sw on\">Player<\/span><span class=\"sw\">Calc<\/span>\n        <\/div>\n\n        <div class=\"ctrlcard\">\n          <div class=\"board\">\n            <div class=\"col away\">\n              <div class=\"colh\">Trade away<\/div>\n              <div class=\"mini\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<span class=\"x\">\u2715<\/span><\/div>\n              <button class=\"addbtn\">+ Add asset<\/button>\n            <\/div>\n            <div class=\"col for\">\n              <div class=\"colh\">Trade for<\/div>\n              <button class=\"addbtn\">+ Add target<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- featured trade window -->\n        <div class=\"tcard\" id=\"fw\">\n          <div class=\"fwhead\">\n            <div class=\"ticklbl\" style=\"margin-bottom:2px\">Featured trade \u00b7 Breece Hall<\/div>\n            <button class=\"backchip\" id=\"backChip\" hidden aria-label=\"Back to previous trade\">\n              <svg class=\"ic\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Previous trade\n            <\/button>\n          <\/div>\n          <div class=\"opp\" id=\"fwOpp\"><\/div>\n          <div class=\"split\">\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade away<\/div>\n              <div style=\"display:flex;flex-direction:column;gap:6px\" id=\"fwAway\"><\/div>\n            <\/div>\n            <div class=\"vrule\"><\/div>\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade for<\/div>\n              <div style=\"display:flex;flex-direction:column;gap:6px\" id=\"fwGet\"><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"vbar\">\n            <span class=\"lbl\">Dynasty value swing<\/span>\n            <div class=\"who\" id=\"fwWho\"><\/div>\n            <div class=\"margin\" id=\"fwMargin\"><\/div>\n            <div class=\"dtrack\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"fillr\" id=\"fwFill\"><\/div><div class=\"cen\"><\/div><\/div>\n            <div class=\"scalerow\"><span>\u22121st<\/span><span>\u22122nd<\/span><span>Even<\/span><span>+2nd<\/span><span>+1st<\/span><\/div>\n          <\/div>\n        <\/div>\n\n        <!-- more trades \u2014 visible by default, rows tappable -->\n        <div class=\"ideas\" id=\"demoList\">\n          <div class=\"ticklbl\">More trades for Breece Hall<\/div>\n\n          <div class=\"grouph\">Upgrade at RB<\/div>\n          <button class=\"idea\" data-id=\"up1\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Hall + 2026 2nd<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Bijan Robinson<\/div>\n              <div class=\"meta\">DynastyDan<\/div>\n            <\/div>\n            <span class=\"diff\">+440<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n          <button class=\"idea\" data-id=\"up2\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Hall + R. White<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Jahmyr Gibbs<\/div>\n              <div class=\"meta\">tundra_tim<\/div>\n            <\/div>\n            <span class=\"diff\">+310<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n\n          <div class=\"grouph\">Lateral moves at RB<\/div>\n          <button class=\"idea\" data-id=\"lat1\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Jonathan Taylor<\/div>\n              <div class=\"meta\">gridiron_gus<\/div>\n            <\/div>\n            <span class=\"diff neg\">\u2212150<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n\n          <div class=\"grouph\">Downgrade ideas<\/div>\n          <button class=\"idea\" data-id=\"best\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Cook + 2027 1st<\/div>\n              <div class=\"meta\">rebuild_randy<\/div>\n            <\/div>\n            <span class=\"diff\">+520<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n          <button class=\"idea\" data-id=\"down2\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Wright + 2026 1st<\/div>\n              <div class=\"meta\">TankCommand<\/div>\n            <\/div>\n            <span class=\"diff\">+380<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n        <\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\"><b>Default state.<\/b> Best trade leads with the full Dynasty Value Swing verdict; \"More trades for Breece Hall\" sits directly beneath, expanded by default \u2014 no gate. <b>This frame is interactive:<\/b> tap any row to load that trade into the window above (the window scrolls back into view; the list keeps its scroll position). The row now in the window is tagged <b>In window<\/b> and stops being tappable. The \u2039 Previous trade chip appears once there's history.<\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550 FRAME B \u00b7 after tapping a Downgrade idea (static snapshot) \u2550\u2550\u2550 -->\n  <div class=\"slot\">\n    <div class=\"slotlbl\">V2 \u2014 after tapping a Downgrade idea (static snapshot)<\/div>\n    <div class=\"phone\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"back\"><svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Hub<\/div>\n        <div class=\"swrow\">\n          <span class=\"sw\">Guided<\/span><span class=\"sw\">Team<\/span><span class=\"sw on\">Player<\/span><span class=\"sw\">Calc<\/span>\n        <\/div>\n\n        <div class=\"ctrlcard\">\n          <div class=\"board\">\n            <div class=\"col away\">\n              <div class=\"colh\">Trade away<\/div>\n              <div class=\"mini\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<span class=\"x\">\u2715<\/span><\/div>\n              <button class=\"addbtn\">+ Add asset<\/button>\n            <\/div>\n            <div class=\"col for\">\n              <div class=\"colh\">Trade for<\/div>\n              <button class=\"addbtn\">+ Add target<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"tcard\">\n          <div class=\"fwhead\">\n            <div class=\"ticklbl\" style=\"margin-bottom:2px\">Featured trade \u00b7 Breece Hall<\/div>\n            <button class=\"backchip\">\n              <svg class=\"ic\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Previous trade\n            <\/button>\n          <\/div>\n          <div class=\"opp\">@TankCommand<\/div>\n          <div class=\"split\">\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade away<\/div>\n              <div class=\"prow\"><div><div class=\"nm\">Breece Hall<\/div><div class=\"meta\">RB \u00b7 NYJ<\/div><\/div><\/div>\n            <\/div>\n            <div class=\"vrule\"><\/div>\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade for<\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--rb)\"><div><div class=\"nm\">Jaylen Wright<\/div><div class=\"meta\">RB \u00b7 MIA<\/div><\/div><\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--first1)\"><div><div class=\"nm\">2026 1st (early)<\/div><div class=\"meta\">PICK<\/div><\/div><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"vbar\">\n            <span class=\"lbl\">Dynasty value swing<\/span>\n            <div class=\"who\">You win<\/div>\n            <div class=\"margin\">by <b>+380<\/b> &nbsp;\u00b7&nbsp; <span class=\"pick\">an Early 4th<\/span> (\u2248 0.22 firsts)<\/div>\n            <div class=\"dtrack\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"fillr\" style=\"left:50%;width:11%\"><\/div><div class=\"cen\"><\/div><\/div>\n            <div class=\"scalerow\"><span>\u22121st<\/span><span>\u22122nd<\/span><span>Even<\/span><span>+2nd<\/span><span>+1st<\/span><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"ideas\">\n          <div class=\"ticklbl\">More trades for Breece Hall<\/div>\n\n          <div class=\"grouph\">Downgrade ideas<\/div>\n          <button class=\"idea\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Cook + 2027 1st<\/div>\n              <div class=\"meta\">rebuild_randy<\/div>\n            <\/div>\n            <span class=\"diff\">+520<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n          <button class=\"idea featured\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Wright + 2026 1st<\/div>\n              <div class=\"meta\">TankCommand<\/div>\n            <\/div>\n            <span class=\"diff\">+380<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n        <\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\"><b>Static depiction<\/b> of the state frame A reaches after tapping the TankCommand downgrade idea (scrolled to the Downgrade group): the trade now fills the featured window with its own Dynasty Value Swing verdict, the tapped row is tagged <b>In window<\/b> with an ice border, and the <b>\u2039 Previous trade<\/b> chip sits in the window's corner ready to revert to rebuild_randy's trade. Frame A is the live version of this exact flow.<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"note\">\n  <h2>Interaction rules<\/h2>\n  <ul>\n    <li><b>Tap a row \u2192 it becomes the featured trade.<\/b> The window above re-renders with the tapped trade (opponent, both sides, full Dynasty Value Swing verdict); the viewport scrolls the window back into view; the list itself keeps its scroll position and never reflows.<\/li>\n    <li><b>The replaced trade becomes the back target.<\/b> A compact <b>\u2039 Previous trade<\/b> chip appears in the featured window's top-right corner; tapping it reverts the window.<\/li>\n    <li><b>The back chip is part of the FeaturedTradeWindow pattern by default<\/b> \u2014 per operator: any surface that swaps a trade into this window (idea rows here, deck skips, calc hand-offs, notification deep links) gets the same revert affordance for free. It renders whenever the window has history and hides when there is none.<\/li>\n    <li><b>Back-stack depth \u2014 recommendation: full per-pin history, not 1-level.<\/b> The demo keeps a simple array of previously-featured trades (reset when the pinned player changes). 1-level was considered and rejected: tapping through A \u2192 B \u2192 C and wanting A back is the common comparison loop, and a stack is no more code than a single slot. Cap at ~10 entries if memory ever matters.<\/li>\n    <li><b>No no-op taps.<\/b> The row whose trade is currently featured is tagged \"In window\" (ice border, chevron hidden) and ignores taps until another trade takes the window.<\/li>\n  <\/ul>\n  <h2>Why this design<\/h2>\n  <ul>\n    <li><b>Verdict format locked (operator pick).<\/b> The Dynasty Value Swing block from v1 \u2014 label, You-win headline, margin translated into pick currency (\"+380 \u00b7 an Early 4th \u2248 0.22 firsts\"), diverging \u22121st\u2026+1st track \u2014 is the calc presentation for every trade that enters the window, including negative verdicts (They win, red fill left of center).<\/li>\n    <li><b>Browse and verdict on one screen.<\/b> With the list open by default, the flow becomes glance-the-verdict \u2192 scan alternatives \u2192 tap to re-run the verdict \u2014 no expand/collapse mode to learn, and the #216 \"answer first\" win is preserved because the featured card still leads.<\/li>\n    <li><b>Rows earn their tap affordance.<\/b> Chevron on the right, \u226548px targets, hover/pressed = surface + border shift per Chalkline (no lift, no shadow); the signed diff chip stays as the scent that makes tapping worth it.<\/li>\n    <li><b>#209 order holds everywhere:<\/b> pin board, featured window, and idea rows all read give \u2192 get, left \u2192 right.<\/li>\n  <\/ul>\n<\/div>\n\n<script>\n(function(){\n  var T = {\n    best:{opp:'@rebuild_randy',\n      away:[{nm:'Breece Hall',meta:'RB \u00b7 NYJ',c:'var(--rb)'}],\n      get:[{nm:'James Cook',meta:'RB \u00b7 BUF',c:'var(--rb)'},{nm:'2027 1st (mid)',meta:'PICK',c:'var(--first1)'}],\n      who:'You win',neg:false,margin:'+520',pick:'a Mid 3rd',firsts:'\u2248 0.3 firsts',fill:13},\n    up1:{opp:'@DynastyDan',\n      away:[{nm:'Breece Hall',meta:'RB \u00b7 NYJ',c:'var(--rb)'},{nm:'2026 2nd (own)',meta:'PICK',c:'var(--first1)'}],\n      get:[{nm:'Bijan Robinson',meta:'RB \u00b7 ATL',c:'var(--rb)'}],\n      who:'You win',neg:false,margin:'+440',pick:'a Late 3rd',firsts:'\u2248 0.25 firsts',fill:12},\n    up2:{opp:'@tundra_tim',\n      away:[{nm:'Breece Hall',meta:'RB \u00b7 NYJ',c:'var(--rb)'},{nm:'Rachaad White',meta:'RB \u00b7 TB',c:'var(--rb)'}],\n      get:[{nm:'Jahmyr Gibbs',meta:'RB \u00b7 DET',c:'var(--rb)'}],\n      who:'You win',neg:false,margin:'+310',pick:'a Mid 4th',firsts:'\u2248 0.18 firsts',fill:9},\n    lat1:{opp:'@gridiron_gus',\n      away:[{nm:'Breece Hall',meta:'RB \u00b7 NYJ',c:'var(--rb)'}],\n      get:[{nm:'Jonathan Taylor',meta:'RB \u00b7 IND',c:'var(--rb)'}],\n      who:'They win',neg:true,margin:'\u2212150',pick:'a Late 4th',firsts:'\u2248 0.09 firsts',fill:4},\n    down2:{opp:'@TankCommand',\n      away:[{nm:'Breece Hall',meta:'RB \u00b7 NYJ',c:'var(--rb)'}],\n      get:[{nm:'Jaylen Wright',meta:'RB \u00b7 MIA',c:'var(--rb)'},{nm:'2026 1st (early)',meta:'PICK',c:'var(--first1)'}],\n      who:'You win',neg:false,margin:'+380',pick:'an Early 4th',firsts:'\u2248 0.22 firsts',fill:11}\n  };\n  var cur='best', stack=[];\n  function prow(a){return '<div class=\"prow\" style=\"border-left-color:'+a.c+'\"><div><div class=\"nm\">'+a.nm+'<\/div><div class=\"meta\">'+a.meta+'<\/div><\/div><\/div>';}\n  function render(scroll){\n    var t=T[cur];\n    document.getElementById('fwOpp').textContent=t.opp;\n    document.getElementById('fwAway').innerHTML=t.away.map(prow).join('');\n    document.getElementById('fwGet').innerHTML=t.get.map(prow).join('');\n    var who=document.getElementById('fwWho');\n    who.textContent=t.who; who.className='who'+(t.neg?' neg':'');\n    document.getElementById('fwMargin').innerHTML='by <b class=\"'+(t.neg?'neg':'')+'\">'+t.margin+'<\/b> &nbsp;\u00b7&nbsp; <span class=\"pick\">'+t.pick+'<\/span> ('+t.firsts+')';\n    var f=document.getElementById('fwFill');\n    if(t.neg){f.style.left='calc(50% - '+t.fill+'%)';f.style.width=t.fill+'%';f.style.background='var(--neg)';}\n    else{f.style.left='50%';f.style.width=t.fill+'%';f.style.background='var(--pos)';}\n    document.getElementById('backChip').hidden = stack.length===0;\n    var rows=document.querySelectorAll('#demoList .idea');\n    for(var i=0;i<rows.length;i++){rows[i].classList.toggle('featured', rows[i].getAttribute('data-id')===cur);}\n    if(scroll){document.getElementById('demoScroll').scrollTo({top:0,behavior:'smooth'});}\n  }\n  document.getElementById('demoList').addEventListener('click',function(e){\n    var btn=e.target.closest('.idea'); if(!btn) return;\n    var id=btn.getAttribute('data-id');\n    if(!id||id===cur) return;\n    stack.push(cur); cur=id; render(true);\n  });\n  document.getElementById('backChip').addEventListener('click',function(){\n    if(!stack.length) return;\n    cur=stack.pop(); render(true);\n  });\n  render(false);\n})();\n<\/script>\n\n<\/body>\n<\/html>\n"}, {"label": "Empty states v2 (A/B)", "fb": "#229 #230 #234", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish lab \u2014 Empty states &amp; progress v2 (#229 \u00b7 #230 \u00b7 #234)<\/title>\n<style>\n  /* \u2500\u2500 Chalkline tokens (docs/design/design-system.md, ADR-005) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     Canonical hexes; --line-strong is the 2026-07-19 a11y value #59647A.\n     Fonts fall back to Arial Narrow / Helvetica / Menlo \u2014 no external requests. */\n  :root{\n    --ink-0:#0C0E11; --ink-1:#13161B; --ink-2:#1A1E25; --ink-3:#232833;\n    --line:#262C35;  --line-strong:#59647A;\n    --chalk:#ECEFF4; --chalk-dim:#97A1AE; --chalk-faint:#626C79;\n    --ice:#56D9EC; --ice-press:#3FC2D6; --on-ice:#071013; --flare:#F0508C;\n    --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n    --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n    --tier-1st:#2DD4BF;\n    --cond:'Barlow Condensed','Arial Narrow',sans-serif;\n    --ui:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;\n    --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--ink-0);color:var(--chalk);font-family:var(--ui);\n       -webkit-font-smoothing:antialiased;padding:24px 16px 64px}\n  .wrap{max-width:880px;margin:0 auto}\n\n  .note{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;\n        padding:16px 20px;margin-bottom:24px}\n  .note h1{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1;\n           letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;display:flex;\n           align-items:center;gap:10px}\n  .note h1::before{content:\"\";width:16px;height:3px;background:var(--ice);flex:none}\n  .note p,.note ul{margin:0;font-size:13px;line-height:1.55;color:var(--chalk-dim)}\n  .note ul{padding-left:18px;margin-top:6px}\n  .note li{margin-bottom:4px}\n  .note strong{color:var(--chalk);font-weight:600}\n  .note a{color:var(--ice);text-decoration:none}\n\n  .sec{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n       color:var(--chalk-dim);display:flex;align-items:center;gap:8px;margin:32px 0 12px}\n  .sec::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n\n  .compare{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}\n  .col{flex:1 1 390px;max-width:420px}\n  .colcap{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n          color:var(--chalk-dim);margin:0 0 8px;display:flex;align-items:center;gap:8px}\n  .colcap .dot{width:8px;height:8px;border-radius:2px;background:var(--line-strong)}\n  .colcap.prop .dot{background:var(--ice)}\n  .cap{font:400 12px/1.5 var(--ui);color:var(--chalk-faint);margin-top:10px}\n\n  /* \u2500\u2500 iPhone frame \u2500\u2500 */\n  .phone{position:relative;width:390px;background:var(--ink-0);\n         border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}\n  .statusbar{height:40px;display:flex;align-items:flex-end;justify-content:space-between;\n             padding:0 20px 6px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim)}\n  .batt{display:inline-block;width:20px;height:10px;border:1px solid var(--chalk-dim);\n        border-radius:2px;position:relative}\n  .batt::after{content:\"\";position:absolute;left:1px;top:1px;bottom:1px;width:70%;\n               background:var(--chalk-dim)}\n\n  /* TopBar (global) + stack header */\n  .topbar{height:48px;display:flex;align-items:center;justify-content:space-between;\n          padding:0 16px;border-bottom:1px solid var(--line)}\n  .wordmark{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:600;\n            font-size:17px;letter-spacing:.06em;text-transform:uppercase}\n  .wordmark::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .stackhdr{height:44px;display:flex;align-items:center;padding:0 16px;position:relative}\n  .backctl{display:flex;align-items:center;gap:4px;font:600 14px var(--ui);color:var(--chalk)}\n  .stackhdr .shtitle{position:absolute;left:0;right:0;text-align:center;font-family:var(--cond);\n           font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;\n           pointer-events:none}\n\n  .scroll{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}\n\n  .tick{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n        color:var(--chalk-dim);display:flex;align-items:center;gap:8px;margin-top:4px}\n  .tick::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n\n  .card{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;padding:16px}\n\n  /* hero */\n  .herohead{display:flex;align-items:center;justify-content:space-between}\n  .lab{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .heroname{font-family:var(--cond);font-weight:600;font-size:22px;line-height:26px;\n            letter-spacing:.03em;text-transform:uppercase;margin-top:8px}\n  .chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}\n  .badge{display:inline-block;padding:2px 6px;border-radius:2px;font:600 11px/14px var(--ui);\n         text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line-strong);\n         color:var(--chalk)}\n  .badge.rankchip{border-radius:4px;font-family:var(--mono);text-transform:none;letter-spacing:0}\n\n  /* explore rows */\n  .xrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}\n  .xrow .m{flex:1}\n  .xrow .t{font:600 16px/22px var(--ui)}\n  .xrow .s{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n\n  .statbetween{display:flex;justify-content:space-between;align-items:center}\n  .mono{font:500 13px/18px var(--mono);font-variant-numeric:tabular-nums}\n\n  /* buttons */\n  .btn{height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;\n       font:600 14px var(--ui);padding:0 16px}\n  .btn.primary{background:var(--ice);color:var(--on-ice)}\n  .btn.secondary{border:1px solid var(--line-strong);color:var(--chalk)}\n  .btn.ghost{color:var(--chalk-dim)}\n  .btn.compact{height:36px;font-size:13px}\n  .btnrow{display:flex;gap:8px}\n  .btnrow .btn{flex:1;white-space:nowrap}\n\n  /* tab bar */\n  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--ink-0)}\n  .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;\n      color:var(--chalk-dim);font:600 11px var(--ui)}\n  .tb.on{color:var(--ice)}\n\n  svg.i{display:block}\n\n  /* \u2500\u2500 progress module blocks (v1) \u2500\u2500 */\n  .ringrow{display:flex;gap:16px;align-items:center}\n  .ringwrap{position:relative;width:72px;height:72px;flex:none}\n  .ringwrap .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;\n                justify-content:center;gap:1px}\n  .ringwrap .rv{font:600 16px var(--mono);font-variant-numeric:tabular-nums}\n  .ringwrap .rl{font:600 8px var(--ui);letter-spacing:.06em;color:var(--chalk-dim);text-transform:uppercase}\n  .ptitle{font:600 16px/22px var(--ui)}\n  .pbody{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n\n  .segbar{display:flex;gap:2px;margin-top:8px}\n  .segbar .seg{flex:1;height:8px;background:var(--ink-3)}\n  .segbar .seg.you{background:var(--ice)}\n  .unlockline{font:400 13px/18px var(--ui);color:var(--chalk);margin-top:8px}\n  .unlockline .em{color:var(--ice);font-weight:600}\n  .foldline{font:400 13px/18px var(--ui);color:var(--chalk-dim);border-top:1px solid var(--line);\n            margin-top:12px;padding-top:10px}\n\n  /* example trade card */\n  .exlabel{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--flare)}\n  .extrade{border:1px solid var(--line);border-radius:8px;background:var(--ink-0);\n           padding:10px 12px;margin-top:8px}\n  .excols{display:flex;gap:0;margin-top:6px}\n  .excol{flex:1;padding:0 10px}\n  .excol:first-child{padding-left:0;border-right:1px solid var(--line)}\n  .excol:last-child{padding-right:0;padding-left:12px}\n  .exhead{font:600 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n          color:var(--chalk-dim);display:flex;align-items:center;gap:6px}\n  .exhead::before{content:\"\";width:3px;height:10px;background:var(--ice)}\n  .exrow{display:flex;align-items:center;gap:6px;margin-top:6px}\n  .prail{width:3px;height:14px;flex:none}\n  .exnm{font:600 12px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .expos{font:600 9px var(--ui);letter-spacing:.05em}\n\n  /* \u2500\u2500 TradeValueBar recreation (mobile/src/components/TradeValueBar.tsx) \u2500\u2500\n     Diverging bar centered on Even, \u00b11 Mid 1st half-scale; inner ticks at the\n     \u00b12nd landmark (SECOND_IN_FIRSTS = 0.57 \u2192 21.5% / 78.5%). Example gap:\n     favors=receive (You win), gap.value=380, gap.firsts=0.6 \u2192 fill grows right\n     from center, width = 0.6 \u00d7 50% = 30%; fill color = --pos (semantic.pos). */\n  .vb{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}\n  .vbhead{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .vbwin{font-family:var(--cond);font-weight:600;font-size:18px;line-height:22px;\n         letter-spacing:.03em;text-transform:uppercase;color:var(--pos);margin-top:4px}\n  .vbmargin{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n  .vbdata{font:500 13px var(--mono);font-variant-numeric:tabular-nums}\n  .vbpick{font:600 13px var(--ui);color:var(--tier-1st)}\n  .vbtrack{position:relative;height:16px;margin-top:12px}\n  .vbrail{position:absolute;left:0;right:0;top:1px;height:14px;background:var(--ink-3);border-radius:2px}\n  .vbfill{position:absolute;top:1px;height:14px;border-radius:2px;background:var(--pos);\n          left:50%;width:30%}\n  .vbtick{position:absolute;top:-4px;height:24px;width:1px;background:var(--line)}\n  .vbcenter{position:absolute;left:50%;margin-left:-1px;top:-4px;height:24px;width:1px;\n            background:var(--line-strong)}\n  .vbscale{display:flex;align-items:center;margin-top:8px}\n  .vbend{font:500 9px var(--mono);color:var(--chalk-faint);width:30px}\n  .vbend.r{text-align:right}\n  .vbmid{flex:1;position:relative;height:12px}\n  .vblbl{position:absolute;width:44px;margin-left:-22px;text-align:center;\n         font:500 9px var(--mono);color:var(--chalk-faint)}\n  .vbends{display:flex;justify-content:space-between;margin-top:4px}\n  .vbendlbl{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .vbverdict{margin-top:10px;background:var(--ink-2);border:1px solid var(--line);\n             border-left:3px solid var(--pos);border-radius:8px;padding:12px;\n             font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n  .vbverdict strong{color:var(--chalk);font-weight:600}\n\n  /* v1 reference frame, shrunk */\n  .v1ref{zoom:.72}\n\n  .rationale{margin-top:36px}\n  .rationale .card{padding:16px 20px}\n  .rationale h2{font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.03em;\n                text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}\n  .rationale h2::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .rationale ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--chalk-dim)}\n  .rationale li{margin-bottom:6px}\n  .rationale strong{color:var(--chalk);font-weight:600}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"note\">\n    <h1>Empty states &amp; progress v2 \u2014 #229 \u00b7 #230 \u00b7 #234<\/h1>\n    <p>Iteration on <a href=\"empty-states-progress.html\">v1<\/a> from operator review. Both\n       variants apply the same corrections: <strong>Explore moves to the top<\/strong> (under the\n       League card), <strong>League progress sits above \"Works right now\"<\/strong>, the example\n       trade carries the <strong>real TradeValueBar<\/strong> (diverging pick-denominated bar from\n       <code style=\"color:var(--chalk)\">mobile/src/components/TradeValueBar.tsx<\/code>), and the\n       two CTAs lose their descriptions and get terse labels\n       (<strong>Find a trade<\/strong> \u00b7 <strong>Rank players<\/strong>).<\/p>\n    <ul>\n      <li><strong>Variant A<\/strong> \u2014 corrected order; each button stays inside its own section, as in v1.<\/li>\n      <li><strong>Variant B<\/strong> \u2014 operator's alternative: both actions as an equal-width\n          side-by-side row directly under the League card; the sections below carry no buttons.<\/li>\n    <\/ul>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Variants A + B side by side \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">Proposed v2 \u2014 League home, day-one low-activity state (full scroll shown)<\/div>\n  <div class=\"compare\">\n\n    <!-- \u2500\u2500 VARIANT A \u2500\u2500 -->\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>Variant A \u2014 buttons in place<\/div>\n      <div class=\"phone\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"topbar\">\n          <span class=\"wordmark\">Trade Finder<\/span>\n          <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M10 3a5 5 0 0 1 5 5v3l1.5 2.5H3.5L5 11V8a5 5 0 0 1 5-5Z\"/><path d=\"M8.5 16a1.5 1.5 0 0 0 3 0\"/><\/svg>\n        <\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle\">League Home<\/span>\n          <span class=\"backctl\"><svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#ECEFF4\" stroke-width=\"1.75\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Back<\/span>\n        <\/div>\n        <div class=\"scroll\">\n\n          <div class=\"card\">\n            <div class=\"herohead\">\n              <span class=\"lab\">League<\/span>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 6l5 5 5-5\"/><\/svg>\n            <\/div>\n            <div class=\"heroname\">The Gridiron Gang<\/div>\n            <div class=\"chips\">\n              <span class=\"badge\">1QB PPR<\/span>\n              <span class=\"badge rankchip\">#7 of 12<\/span>\n              <span class=\"badge\">12 teams<\/span>\n            <\/div>\n          <\/div>\n\n          <!-- Explore first (operator) -->\n          <div class=\"tick\">Explore<\/div>\n          <div>\n            <div class=\"xrow\">\n              <div class=\"m\"><div class=\"t\">League rankings<\/div>\n                <div class=\"s\">Every team ranked by total roster value<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg>\n            <\/div>\n            <div class=\"xrow\">\n              <div class=\"m\"><div class=\"t\">Free agents<\/div>\n                <div class=\"s\">Best available players in this league<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg>\n            <\/div>\n          <\/div>\n\n          <!-- League progress above Works right now (operator) -->\n          <div class=\"tick\">League progress<\/div>\n          <div class=\"card\">\n            <div class=\"ringrow\">\n              <div class=\"ringwrap\">\n                <svg class=\"i\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" fill=\"none\">\n                  <circle cx=\"36\" cy=\"36\" r=\"31\" stroke=\"#232833\" stroke-width=\"5\"/>\n                  <!-- 0 of 4 positions: start nub only -->\n                  <path d=\"M36 5 A31 31 0 0 1 38.4 5.1\" stroke=\"#56D9EC\" stroke-width=\"5\" stroke-linecap=\"square\"/>\n                <\/svg>\n                <div class=\"rc\"><span class=\"rv\">0/4<\/span><span class=\"rl\">positions<\/span><\/div>\n              <\/div>\n              <div style=\"flex:1\">\n                <div class=\"btn primary compact\">Rank players<\/div>\n              <\/div>\n            <\/div>\n\n            <div class=\"foldline\" style=\"margin-top:14px;padding-top:0;border-top:1px solid var(--line)\"><\/div>\n            <div class=\"statbetween\" style=\"margin-top:2px\">\n              <span class=\"lab\">Leaguemates ranked<\/span>\n              <span class=\"mono\">1/12 <span style=\"color:var(--chalk-dim)\">(you)<\/span><\/span>\n            <\/div>\n            <div class=\"segbar\">\n              <span class=\"seg you\"><\/span><span class=\"seg\"><\/span><span class=\"seg\"><\/span>\n              <span class=\"seg\"><\/span><span class=\"seg\"><\/span><span class=\"seg\"><\/span>\n              <span class=\"seg\"><\/span><span class=\"seg\"><\/span><span class=\"seg\"><\/span>\n              <span class=\"seg\"><\/span><span class=\"seg\"><\/span><span class=\"seg\"><\/span>\n            <\/div>\n            <div class=\"unlockline\"><span class=\"em\">2 more ranked leaguemates<\/span> unlocks\n              mutual matches \u2014 trades both sides already like.<\/div>\n            <div class=\"btn ghost compact\" style=\"align-self:flex-start;padding:0;justify-content:flex-start\">Invite leaguemates<\/div>\n\n            <div class=\"foldline\">Leaderboards and contrarian ranks appear here once\n              3 leaguemates have ranked.<\/
