strip with the 3px winner-colored left border.\n          Replaces v1's flat \"Fairness 88\" meter. Still explicitly labeled\n          <strong>EXAMPLE \u2014 not from your league<\/strong> (flare).<\/li>\n        <li><strong>Terse CTAs, no descriptions:<\/strong> \"Start Quick set\" + two lines of copy\n          becomes <strong>Rank players<\/strong>; the \"Find trades today\u2026\" title/body above the\n          example is gone \u2014 <strong>Find a trade<\/strong> stands alone. Both cards get\n          meaningfully shorter.<\/li>\n        <li><strong>A vs B tradeoff:<\/strong> A keeps each action next to the thing it acts on\n          (ring \u2192 Rank players, example \u2192 Find a trade). B fronts both actions in one equal-width\n          row under the League card \u2014 fastest possible access, at the cost of separating the\n          buttons from their context; the in-section buttons are removed in B so no action appears\n          twice, and only \"Find a trade\" keeps the ice fill (one primary per screen).<\/li>\n        <li><strong>Unchanged from v1:<\/strong> the Matches empty-state proposal (section B of\n          <a href=\"empty-states-progress.html\" style=\"color:var(--ice);text-decoration:none\">v1<\/a>)\n          is untouched by this feedback and is not repeated here; all zero-row collapsing rules\n          (#229/#230/#234) carry over as specced in v1.<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n<\/div>\n<\/body>\n<\/html>\n"}, {"label": "Rank chooser v2", "fb": "#232 #233 + import", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish lab \u2014 Rank method consolidation v2 (#232 \u00b7 #233)<\/title>\n<style>\n  /* \u2500\u2500 Chalkline tokens (docs/design/design-system.md, ADR-005) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     Canonical hexes; --line-strong is the 2026-07-19 a11y value #59647A.\n     Tier hexes from docs/cross-client-invariants.md.\n     Fonts fall back to Arial Narrow / Helvetica / Menlo \u2014 no external requests. */\n  :root{\n    --ink-0:#0C0E11; --ink-1:#13161B; --ink-2:#1A1E25; --ink-3:#232833;\n    --line:#262C35;  --line-strong:#59647A;\n    --chalk:#ECEFF4; --chalk-dim:#97A1AE; --chalk-faint:#626C79;\n    --ice:#56D9EC; --ice-press:#3FC2D6; --on-ice:#071013; --flare:#F0508C;\n    --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n    --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n    --tier-firsts-4plus:#f87171; --tier-firsts-3:#e879f9; --tier-firsts-2:#fbbf24;\n    --tier-first-1:#2dd4bf; --tier-second:#38bdf8; --tier-third:#f472b6;\n    --tier-fourth:#a3e635; --tier-fa:#7a7f96;\n    --cond:'Barlow Condensed','Arial Narrow',sans-serif;\n    --ui:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;\n    --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--ink-0);color:var(--chalk);font-family:var(--ui);\n       -webkit-font-smoothing:antialiased;padding:24px 16px 64px}\n  .wrap{max-width:880px;margin:0 auto}\n\n  .note{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;\n        padding:16px 20px;margin-bottom:24px}\n  .note h1{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1;\n           letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;display:flex;\n           align-items:center;gap:10px}\n  .note h1::before{content:\"\";width:16px;height:3px;background:var(--ice);flex:none}\n  .note p,.note ul{margin:0;font-size:13px;line-height:1.55;color:var(--chalk-dim)}\n  .note ul{padding-left:18px;margin-top:6px}\n  .note li{margin-bottom:4px}\n  .note strong{color:var(--chalk);font-weight:600}\n\n  .sec{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n       color:var(--chalk-dim);display:flex;align-items:center;gap:8px;margin:32px 0 12px}\n  .sec::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n\n  .compare{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}\n  .col{flex:1 1 390px;max-width:420px;display:flex;flex-direction:column;gap:20px}\n  .colcap{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n          color:var(--chalk-dim);margin:0 0 -8px;display:flex;align-items:center;gap:8px}\n  .colcap .dot{width:8px;height:8px;border-radius:2px;background:var(--line-strong)}\n  .colcap.prop .dot{background:var(--ice)}\n  .cap{font:400 12px/1.5 var(--ui);color:var(--chalk-faint)}\n\n  .phone{position:relative;width:390px;background:var(--ink-0);\n         border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}\n  .phone.fixed{height:844px}\n  .statusbar{height:40px;display:flex;align-items:flex-end;justify-content:space-between;\n             padding:0 20px 6px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim)}\n  .batt{display:inline-block;width:20px;height:10px;border:1px solid var(--chalk-dim);\n        border-radius:2px;position:relative}\n  .batt::after{content:\"\";position:absolute;left:1px;top:1px;bottom:1px;width:70%;\n               background:var(--chalk-dim)}\n  .stackhdr{height:44px;display:flex;align-items:center;justify-content:space-between;\n            padding:0 16px;position:relative}\n  .backctl{display:flex;align-items:center;gap:4px;font:600 14px var(--ui);color:var(--chalk);z-index:1}\n  .stackhdr .shtitle{position:absolute;left:0;right:0;text-align:center;font-family:var(--cond);\n           font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;\n           pointer-events:none}\n  .moreways{font:600 13px var(--ui);color:var(--chalk-dim);z-index:1}\n  .shtitle.narrow{left:36px !important;right:140px !important;text-align:left !important}\n\n  .scroll{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}\n  .lab{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .mono{font:500 13px/18px var(--mono);font-variant-numeric:tabular-nums}\n  .heading{font-family:var(--cond);font-weight:600;font-size:22px;line-height:26px;\n           letter-spacing:.03em;text-transform:uppercase}\n\n  /* RankHome callout + cards */\n  .callout{display:flex;gap:8px;background:var(--ink-2);border:1px solid var(--line-strong);\n           border-radius:4px;padding:12px}\n  .callout .tx{font:400 13px/19px var(--ui);color:var(--chalk-dim);flex:1}\n  .callout .tx b{color:var(--chalk);font-weight:500}\n  .mcard{background:var(--ink-1);border:1px solid var(--line);border-radius:4px;\n         padding:12px;display:flex;flex-direction:column;gap:8px}\n  .mcard.featured{border-color:var(--ice)}\n  .mhead{display:flex;align-items:center;gap:8px}\n  .mtitle{font:600 16px/22px var(--ui);flex:1}\n  .rectag{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--flare)}\n  .mbody{font:400 13px/19px var(--ui);color:var(--chalk-dim)}\n  .roletag{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .subrow{border-top:1px solid var(--line);margin-top:2px;padding-top:8px;\n          font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n  .subrow b{color:var(--chalk);font-weight:600}\n  .morehdr{display:flex;align-items:center;gap:8px;padding:12px 4px 4px;font:600 14px var(--ui);\n           color:var(--chalk)}\n  .qrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}\n  .qrow .m{flex:1}\n  .qrow .t{font:600 14px/20px var(--ui)}\n  .qrow .s{font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n  .mixnote{font:400 13px/18px var(--ui);color:var(--chalk-faint);text-align:center}\n\n  /* import entry chip */\n  .importrow{display:flex;align-items:center;gap:8px;align-self:flex-start;\n             border:1px solid var(--line-strong);border-radius:4px;background:var(--ink-1);\n             padding:0 12px;min-height:36px;font:600 13px var(--ui);color:var(--chalk-dim)}\n  .importrow b{color:var(--ice);font-weight:600}\n\n  /* sheet */\n  .sheetstage{position:relative;width:390px;height:800px;border:1px solid var(--line-strong);\n              border-radius:8px;overflow:hidden;background:var(--ink-0)}\n  .sheetstage.short{height:620px}\n  .scrim{position:absolute;inset:0;background:rgba(7,9,12,0.78)}\n  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ink-2);\n         border:1px solid var(--line);border-radius:8px 8px 0 0;padding:16px 16px 32px;\n         display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 32px rgba(0,0,0,.55)}\n  .grabber{align-self:center;width:32px;height:4px;border-radius:2px;background:var(--line-strong);\n           margin-bottom:8px}\n  .srow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:4px;\n        border-bottom:1px solid var(--line)}\n  .srow .m{flex:1}\n  .srow .t{font:600 16px/22px var(--ui);display:flex;align-items:center;gap:8px}\n  .srow .s{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n  .sheetsub{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-bottom:8px}\n  .honesty{display:flex;gap:8px;background:var(--ink-3);border-radius:4px;padding:10px 12px;\n           font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:4px}\n\n  /* paste state */\n  .pastebox{background:var(--ink-2);border:1px solid var(--line-strong);border-radius:4px;\n            padding:10px 12px;font:500 12px/19px var(--mono);color:var(--chalk);min-height:170px;\n            white-space:pre}\n  .pastebox .ph{color:var(--chalk-faint)}\n\n  /* match review */\n  .mrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}\n  .mrow .rk{font:500 12px var(--mono);color:var(--chalk-dim);width:22px;text-align:right;flex:none}\n  .mrow .raw{font:400 13px var(--ui);color:var(--chalk-dim);flex:1;white-space:nowrap;\n             overflow:hidden;text-overflow:ellipsis}\n  .mrow .hit{font:600 13px var(--ui);color:var(--chalk);display:flex;align-items:center;gap:6px;\n             white-space:nowrap}\n  .mrow.miss{border-left:3px solid var(--warn);padding-left:9px;background:var(--ink-2);\n             flex-wrap:wrap;row-gap:8px}\n  .misslab{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}\n  .candwrap{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding-left:32px}\n  .cand{border:1px solid var(--line-strong);border-radius:4px;background:var(--ink-1);\n        min-height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;\n        font:600 12px var(--ui);color:var(--chalk)}\n  .cand .tm{font:600 11px var(--ui);color:var(--chalk-dim);letter-spacing:.5px}\n  .cand.skip{color:var(--chalk-dim)}\n  .counts{display:flex;align-items:center;gap:8px;font:500 13px var(--mono);color:var(--chalk-dim)}\n\n  /* buttons */\n  .btn{height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;\n       font:600 14px var(--ui);padding:0 16px}\n  .btn.primary{background:var(--ice);color:var(--on-ice)}\n  .btn.secondary{border:1px solid var(--line-strong);color:var(--chalk)}\n  .btn.ghost{color:var(--chalk-dim)}\n  .btn.compact{height:36px;font-size:13px}\n  .btn.dis{opacity:.45}\n\n  /* quick set walk (Section C, unchanged from v1) */\n  .fmt{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--ink-1)}\n  .fmt div{flex:1;min-height:36px;display:flex;align-items:center;justify-content:center;\n           font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .fmt div.on{background:var(--ink-3);color:var(--chalk);border-bottom:2px solid var(--ice)}\n  .postabs{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--ink-1)}\n  .postabs div{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;\n               font:600 11px var(--ui);letter-spacing:.08em;color:var(--chalk-dim);\n               border-bottom:2px solid transparent}\n  .postabs div.on{background:var(--ink-3);color:var(--chalk);border-bottom-color:var(--qb)}\n  .stephead{display:flex;align-items:center;gap:8px}\n  .stephead .tl{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n                color:var(--tier-firsts-4plus);display:flex;align-items:center;gap:8px}\n  .stephead .tl::before{content:\"\";width:3px;height:14px;background:var(--tier-firsts-4plus)}\n  .stephead .pg{margin-left:auto;font:600 11px var(--ui);letter-spacing:.08em;\n                text-transform:uppercase;color:var(--chalk-dim)}\n  .stephint{font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n  .search{height:40px;background:var(--ink-2);border:1px solid var(--line-strong);border-radius:4px;\n          display:flex;align-items:center;padding:0 12px;font:400 14px var(--ui);color:var(--chalk-faint)}\n  .grid{display:flex;flex-direction:column;gap:4px}\n  .grow{display:flex;gap:4px}\n  .chip{flex:1;min-height:48px;background:var(--ink-1);border:1px solid var(--line);border-radius:4px;\n        padding:6px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px}\n  .chip .nm{font:600 12px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n            display:flex;align-items:center;gap:4px}\n  .chip .meta{display:flex;align-items:center;gap:6px}\n  .chip .tm{font:600 11px var(--ui);letter-spacing:.5px;color:var(--chalk-dim);text-transform:uppercase}\n  .chip .ag{font:500 11px var(--mono);color:var(--chalk-dim)}\n  .chip .tr{font:600 11px var(--ui);letter-spacing:.5px;text-transform:uppercase}\n  .walkfoot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;\n            padding:12px;background:var(--ink-0);border-top:1px solid var(--line)}\n  .walkfoot .btn.grow1{flex:1}\n\n  svg.i{display:block;flex:none}\n\n  .rationale{margin-top:36px}\n  .rationale .card{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;\n                   padding:16px 20px}\n  .rationale h2{font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.03em;\n                text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}\n  .rationale h2::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .rationale ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--chalk-dim)}\n  .rationale li{margin-bottom:6px}\n  .rationale strong{color:var(--chalk);font-weight:600}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"note\">\n    <h1>Rank method consolidation \u2014 v2 (#232 \u00b7 #233)<\/h1>\n    <p>Iteration on operator review of\n       <code style=\"color:var(--chalk)\">rank-method-consolidation.html<\/code> (v1). Two changes:<\/p>\n    <ul>\n      <li><strong>Most control = the Tiers board<\/strong> (drag players between value tiers),\n        not the overall 1-to-N list. The overall list (\"Overall ranks\", today's ManualRanks)\n        moves into the \"More ways to rank\" disclosure.<\/li>\n      <li><strong>Import entry:<\/strong> a small quiet button at the top of the chooser \u2014\n        <strong>\"Have rankings already? Import them\"<\/strong> \u2014 opens a \"Bring your rankings\"\n        sheet (CSV \u00b7 XLSX \u00b7 paste a table), with the match-review state shown so the real cost\n        of ingest is visible before we commit to building it.<\/li>\n    <\/ul>\n    <p style=\"margin-top:8px\">Section C restates v1's empty-tier CTA fix unchanged, so this page\n       stands alone as the current proposal.<\/p>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 SECTION A \u2014 chooser v2 \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">A \u00b7 The chooser \u2014 v1 proposal vs v2<\/div>\n  <div class=\"compare\">\n\n    <!-- v1 proposed, for reference -->\n    <div class=\"col\">\n      <div class=\"colcap\"><span class=\"dot\"><\/span>v1 proposed (reference)<\/div>\n      <div class=\"phone\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle\">Rank<\/span>\n          <span class=\"backctl\"><svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#ECEFF4\" stroke-width=\"1.75\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Back<\/span>\n        <\/div>\n        <div class=\"scroll\">\n          <div class=\"heading\">Build your board<\/div>\n\n          <div class=\"callout\">\n            <svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F0508C\" stroke-width=\"1.75\"><path d=\"M3 7h11l-2.5-2.5M17 13H6l2.5 2.5\"/><\/svg>\n            <div class=\"tx\"><b>Trades are priced off this board.<\/b> The better it matches you,\n              the better the deals we find.<\/div>\n          <\/div>\n\n          <div class=\"mcard featured\">\n            <div class=\"mhead\">\n              <span class=\"roletag\">Fastest<\/span>\n              <span style=\"flex:1\"><\/span><span class=\"rectag\">recommended<\/span>\n            <\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M4 10.5 8.5 15 16 6\"/><\/svg>\n              <span class=\"mtitle\">Quick set<\/span>\n            <\/div>\n            <div class=\"mbody\">Tap players into value tiers, one tier at a time. A usable board\n              in a few minutes per position.<\/div>\n            <div class=\"subrow\"><b>Then, if you want:<\/b> Quick rank \u2014 a follow-on pass that\n              fine-tunes the order inside each tier. Offered when you finish.<\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\"><span class=\"roletag\">Most precise<\/span><\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 17v-6M10 17V3M17 17v-9\"/><\/svg>\n              <span class=\"mtitle\">Head-to-heads<\/span>\n            <\/div>\n            <div class=\"mbody\">Put three players in order at a time \u2014 a few seconds each, and\n              your board sharpens with every answer.<\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\"><span class=\"roletag\">Most control<\/span><\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 14l4-4 3 3 7-7\"/><path d=\"M13 6h4v4\"/><\/svg>\n              <span class=\"mtitle\">Your full board<\/span>\n            <\/div>\n            <div class=\"mbody\">Drag every player into your exact order. Nothing inferred,\n              nothing suggested.<\/div>\n          <\/div>\n\n          <div class=\"morehdr\">\n            More ways to rank\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 6l5 5 5-5\"/><\/svg>\n          <\/div>\n          <div style=\"border:1px solid var(--line);border-radius:4px;padding:0 12px;background:var(--ink-1)\">\n            <div class=\"qrow\"><div class=\"m\"><div class=\"t\">Pick Anchors<\/div>\n              <div class=\"s\">Price players in draft picks, one at a time<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n            <div class=\"qrow\"><div class=\"m\"><div class=\"t\">Tiers board<\/div>\n              <div class=\"s\">Drag players between tiers on the full board<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n            <div class=\"qrow\" style=\"border-bottom:0\"><div class=\"m\"><div class=\"t\">Trends<\/div>\n              <div class=\"s\">Your biggest movers vs consensus<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <\/div>\n\n          <div class=\"mixnote\">Every method writes to the same board \u2014 mix anytime.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">v1's \"Most control\" card is the overall 1-to-N list and the Tiers drag\n        board sits in the disclosure. Operator review: control belongs to the Tiers board \u2014 and\n        there's no path at all for someone whose rankings already exist elsewhere.<\/div>\n    <\/div>\n\n    <!-- v2 proposed -->\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>v2 proposed \u2014 Tiers board up, import entry in<\/div>\n      <div class=\"phone\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle\">Rank<\/span>\n          <span class=\"backctl\"><svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#ECEFF4\" stroke-width=\"1.75\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Back<\/span>\n        <\/div>\n        <div class=\"scroll\">\n          <div class=\"heading\">Build your board<\/div>\n\n          <div class=\"importrow\">\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M8 2v7M5 6.5 8 9.5l3-3M3 11v2.5h10V11\"/><\/svg>\n            <span>Have rankings already?&nbsp;<b>Import them<\/b><\/span>\n          <\/div>\n\n          <div class=\"callout\">\n            <svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F0508C\" stroke-width=\"1.75\"><path d=\"M3 7h11l-2.5-2.5M17 13H6l2.5 2.5\"/><\/svg>\n            <div class=\"tx\"><b>Trades are priced off this board.<\/b> The better it matches you,\n              the better the deals we find.<\/div>\n          <\/div>\n\n          <div class=\"mcard featured\">\n            <div class=\"mhead\">\n              <span class=\"roletag\">Fastest<\/span>\n              <span style=\"flex:1\"><\/span><span class=\"rectag\">recommended<\/span>\n            <\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M4 10.5 8.5 15 16 6\"/><\/svg>\n              <span class=\"mtitle\">Quick set<\/span>\n            <\/div>\n            <div class=\"mbody\">Tap players into value tiers, one tier at a time. A usable board\n              in a few minutes per position.<\/div>\n            <div class=\"subrow\"><b>Then, if you want:<\/b> Quick rank \u2014 a follow-on pass that\n              fine-tunes the order inside each tier. Offered when you finish.<\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\"><span class=\"roletag\">Most precise<\/span><\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 17v-6M10 17V3M17 17v-9\"/><\/svg>\n              <span class=\"mtitle\">Head-to-heads<\/span>\n            <\/div>\n            <div class=\"mbody\">Put three players in order at a time \u2014 a few seconds each, and\n              your board sharpens with every answer.<\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\"><span class=\"roletag\">Most control<\/span><\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 15 4 8l3.5 2.5L10 5l2.5 5.5L16 8l1 7H3Z\"/><\/svg>\n              <span class=\"mtitle\">Tiers board<\/span>\n            <\/div>\n            <div class=\"mbody\">Your whole board as drag-and-drop value tiers \u2014 every placement\n              is your call, from 4+ 1sts down to FA.<\/div>\n          <\/div>\n\n          <div class=\"morehdr\">\n            More ways to rank\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 6l5 5 5-5\"/><\/svg>\n          <\/div>\n          <div style=\"border:1px solid var(--line);border-radius:4px;padding:0 12px;background:var(--ink-1)\">\n            <div class=\"qrow\"><div class=\"m\"><div class=\"t\">Pick Anchors<\/div>\n              <div class=\"s\">Price players in draft picks, one at a time<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n            <div class=\"qrow\"><div class=\"m\"><div class=\"t\">Overall ranks<\/div>\n              <div class=\"s\">Order every player 1-to-N yourself \u2014 drag rows or tap a rank number<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n            <div class=\"qrow\" style=\"border-bottom:0\"><div class=\"m\"><div class=\"t\">Trends<\/div>\n              <div class=\"s\">Your biggest movers vs consensus<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <\/div>\n\n          <div class=\"mixnote\">Every method writes to the same board \u2014 mix anytime.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\"><b>Most control is now the Tiers board<\/b> \u2014 the drag-players-into-tiers\n        surface (TiersScreen), described in its own terms. The overall 1-to-N list becomes\n        \"Overall ranks\" in the disclosure. The <b>import entry<\/b> is one quiet 36px chip under\n        the heading: dim question + ice verb, deliberately a tier below the cards \u2014 it's a\n        bypass, not a fourth method. Shown with the disclosure OPEN; it defaults closed.<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 SECTION B \u2014 import flow \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">B \u00b7 \"Import them\" \u2014 the Bring-your-rankings flow<\/div>\n  <div class=\"compare\">\n\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>B1 \u2014 method sheet<\/div>\n      <div class=\"sheetstage short\">\n        <div class=\"scrim\"><\/div>\n        <div class=\"sheet\">\n          <div class=\"grabber\"><\/div>\n          <div class=\"heading\">Bring your rankings<\/div>\n          <div class=\"sheetsub\">Pull in a board you keep somewhere else. Ranks only \u2014 a numbered\n            list of players is all we need.<\/div>\n          <div class=\"srow\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M5 2.5h7l3.5 3.5v11.5h-10.5Z\"/><path d=\"M12 2.5V6h3.5\"/><\/svg>\n            <div class=\"m\"><div class=\"t\">Upload a CSV<\/div>\n            <div class=\"s\">An export from KTC, FantasyCalc, or any spreadsheet<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"srow\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 4h14v12H3Z\"/><path d=\"M3 8h14M3 12h14M8 4v12\"/><\/svg>\n            <div class=\"m\"><div class=\"t\">Upload a spreadsheet<\/div>\n            <div class=\"s\">XLSX from Excel, Numbers, or Google Sheets<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"srow\" style=\"border-bottom:0\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M7 3.5h6M6 3.5H5a1 1 0 0 0-1 1V17h12V4.5a1 1 0 0 0-1-1h-1\"/><path d=\"M7 2h6v3H7Z\"/><\/svg>\n            <div class=\"m\"><div class=\"t\">Paste a table<\/div>\n            <div class=\"s\">Copy rows from any sheet or site and paste them here<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"honesty\">\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><circle cx=\"8\" cy=\"8\" r=\"6\"/><path d=\"M8 7v4M8 5v.5\"/><\/svg>\n            <span>We'll match player names to your league's player pool \u2014 you review anything\n              we can't match.<\/span>\n          <\/div>\n          <div class=\"btn ghost\" style=\"margin-top:4px\">Cancel<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">Opened by the \"Import them\" chip. Three method rows in the operator's\n        order; the honesty line sets the expectation that a review step follows, so the match\n        screen isn't a surprise. Copy avoids \"sync\" \u2014 this is a one-shot import onto the same\n        board every other method writes to.<\/div>\n    <\/div>\n\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>B2 \u2014 paste-a-table state<\/div>\n      <div class=\"sheetstage short\">\n        <div class=\"scrim\"><\/div>\n        <div class=\"sheet\">\n          <div class=\"grabber\"><\/div>\n          <div class=\"heading\">Paste a table<\/div>\n          <div class=\"sheetsub\">Paste rows straight from a spreadsheet or site. A rank column\n            helps but isn't required \u2014 row order works too.<\/div>\n          <div class=\"pastebox\">1&#9;Ja'Marr Chase&#9;WR\n2&#9;Justin Jefferson&#9;WR\n3&#9;Bijan Robinson&#9;RB\n4&#9;Josh Allen&#9;QB\n5&#9;CeeDee Lamb&#9;WR\n6&#9;Jahmyr Gibbs&#9;RB\n7&#9;Malik Nabers&#9;WR\n8&#9;Marvin Harrison&#9;WR\n<span class=\"ph\">\u2026<\/span><\/div>\n          <div class=\"counts\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#22C55E\" stroke-width=\"1.75\"><path d=\"M3 8.5 6.5 12 13 4.5\"/><\/svg>\n            54 rows detected<\/div>\n          <div class=\"btn primary\" style=\"margin-top:4px\">Match 54 players<\/div>\n          <div class=\"btn ghost\">Back<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">Tab-, comma- or space-separated all parse; extra columns (position, team,\n        values) are ignored. This one state also covers most CSV files \u2014 open the file, copy the\n        rows, paste \u2014 which is what makes paste-only a viable v1 scope.<\/div>\n    <\/div>\n\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>B3 \u2014 match review (the honest hard part)<\/div>\n      <div class=\"phone\" style=\"min-height:620px\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle\">Review your import<\/span>\n          <span class=\"backctl\"><svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#ECEFF4\" stroke-width=\"1.75\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Back<\/span>\n        <\/div>\n        <div class=\"scroll\" style=\"gap:8px\">\n          <div class=\"counts\">\n            <svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#22C55E\" stroke-width=\"1.75\"><path d=\"M3 8.5 6.5 12 13 4.5\"/><\/svg>\n            <span>53 of 54 matched<\/span>\n            <span style=\"color:var(--warn)\">\u00b7 1 needs you<\/span>\n          <\/div>\n          <div style=\"border:1px solid var(--line);border-radius:4px;background:var(--ink-1)\">\n            <div class=\"mrow\"><span class=\"rk\">5<\/span><span class=\"raw\">CeeDee Lamb<\/span>\n              <span class=\"hit\">CeeDee Lamb <span class=\"lab\" style=\"color:var(--chalk-dim)\">DAL<\/span>\n              <svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#22C55E\" stroke-width=\"1.75\"><path d=\"M3 8.5 6.5 12 13 4.5\"/><\/svg><\/span><\/div>\n            <div class=\"mrow\"><span class=\"rk\">6<\/span><span class=\"raw\">Jahmyr Gibbs<\/span>\n              <span class=\"hit\">Jahmyr Gibbs <span class=\"lab\" style=\"color:var(--chalk-dim)\">DET<\/span>\n              <svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#22C55E\" stroke-width=\"1.75\"><path d=\"M3 8.5 6.5 12 13 4.5\"/><\/svg><\/span><\/div>\n            <div class=\"mrow\"><span class=\"rk\">7<\/span><span class=\"raw\">Malik Nabers<\/span>\n              <span class=\"hit\">Malik Nabers <span class=\"lab\" style=\"color:var(--chalk-dim)\">NYG<\/span>\n              <svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#22C55E\" stroke-width=\"1.75\"><path d=\"M3 8.5 6.5 12 13 4.5\"/><\/svg><\/span><\/div>\n            <div class=\"mrow miss\">\n              <span class=\"rk\">8<\/span><span class=\"raw\" style=\"color:var(--chalk)\">Marvin Harrison<\/span>\n              <span class=\"misslab\">Which one?<\/span>\n              <div class=\"candwrap\">\n                <div class=\"cand\">Marvin Harrison Jr. <span class=\"tm\">ARI \u00b7 WR<\/span><\/div>\n                <div class=\"cand\">Marvin Harrison Sr. <span class=\"tm\">retired<\/span><\/div>\n                <div class=\"cand skip\">Skip this row<\/div>\n              <\/div>\n            <\/div>\n            <div class=\"mrow\" style=\"border-bottom:0\"><span class=\"rk\">9<\/span><span class=\"raw\">Kenneth Walker<\/span>\n              <span class=\"hit\">Kenneth Walker III <span class=\"lab\" style=\"color:var(--chalk-dim)\">SEA<\/span>\n              <svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#22C55E\" stroke-width=\"1.75\"><path d=\"M3 8.5 6.5 12 13 4.5\"/><\/svg><\/span><\/div>\n          <\/div>\n          <div class=\"stephint\">Close matches (suffixes, punctuation, nicknames) are accepted\n            automatically and shown here so you can catch a wrong one. Skipped rows keep their\n            current value on your board.<\/div>\n        <\/div>\n        <div class=\"walkfoot\">\n          <div class=\"btn ghost compact\">Cancel<\/div>\n          <div class=\"btn primary grow1 dis\">Apply 53 ranks \u2014 1 to resolve<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">The UX cost of ingest, made visible: fuzzy name matching against the\n        league's Sleeper pool auto-resolves suffixes (\"Kenneth Walker\" \u2192 III) but ambiguous or\n        unknown names need a human tap. Primary stays disabled until every row is matched or\n        skipped; applying writes ranks onto the same board, and unlisted players keep their\n        current values.<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 SECTION C \u2014 empty-tier CTA (unchanged from v1) \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">C \u00b7 Quick set empty-tier CTA \u2014 unchanged from v1 (#233)<\/div>\n  <div class=\"compare\">\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>Proposed \u2014 action-first, one advance path (as v1)<\/div>\n      <div class=\"phone fixed\" style=\"height:700px\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle narrow\">Quick Set Tiers<\/span>\n          <span><\/span>\n          <span class=\"moreways\">More ways to rank<\/span>\n        <\/div>\n        <div class=\"scroll\" style=\"gap:8px\">\n          <div class=\"fmt\"><div class=\"on\">1QB PPR<\/div><div>SF TEP<\/div><\/div>\n          <div class=\"postabs\"><div class=\"on\">QB<\/div><div>RB<\/div><div>WR<\/div><div>TE<\/div><\/div>\n          <div class=\"stephead\"><span class=\"tl\">4+ 1sts<\/span><span class=\"pg\">Tier 1 of 8<\/span><\/div>\n          <div class=\"stephint\">Tap every QB who belongs in 4+ 1sts, then save to move on. Each\n            card shows the tier the player is in now.<\/div>\n          <div class=\"search\">Search QBs\u2026<\/div>\n          <div class=\"grid\">\n            <div class=\"grow\">\n              <div class=\"chip\"><span class=\"nm\">Josh Allen<\/span>\n                <span class=\"meta\"><span class=\"tm\">BUF<\/span><span class=\"ag\">29<\/span><span class=\"tr\" style=\"color:var(--tier-firsts-2)\">2 1sts<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Lamar Jackson<\/span>\n                <span class=\"meta\"><span class=\"tm\">BAL<\/span><span class=\"ag\">29<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Jayden Daniels<\/span>\n                <span class=\"meta\"><span class=\"tm\">WAS<\/span><span class=\"ag\">25<\/span><span class=\"tr\" style=\"color:var(--tier-firsts-2)\">2 1sts<\/span><\/span><\/div>\n            <\/div>\n            <div class=\"grow\">\n              <div class=\"chip\"><span class=\"nm\">Patrick Mahomes<\/span>\n                <span class=\"meta\"><span class=\"tm\">KC<\/span><span class=\"ag\">30<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Jalen Hurts<\/span>\n                <span class=\"meta\"><span class=\"tm\">PHI<\/span><span class=\"ag\">27<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">C.J. Stroud<\/span>\n                <span class=\"meta\"><span class=\"tm\">HOU<\/span><span class=\"ag\">24<\/span><span class=\"tr\" style=\"color:var(--tier-second)\">2nd<\/span><\/span><\/div>\n            <\/div>\n            <div class=\"grow\">\n              <div class=\"chip\"><span class=\"nm\">Joe Burrow<\/span>\n                <span class=\"meta\"><span class=\"tm\">CIN<\/span><span class=\"ag\">29<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Caleb Williams<\/span>\n                <span class=\"meta\"><span class=\"tm\">CHI<\/span><span class=\"ag\">24<\/span><span class=\"tr\" style=\"color:var(--tier-second)\">2nd<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Drake Maye<\/span>\n                <span class=\"meta\"><span class=\"tm\">NE<\/span><span class=\"ag\">23<\/span><span class=\"tr\" style=\"color:var(--tier-second)\">2nd<\/span><\/span><\/div>\n            <\/div>\n          <\/div>\n\n          <!-- selected-state inset -->\n          <div style=\"margin-top:16px;border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px\">\n            <div class=\"lab\" style=\"margin-bottom:8px\">With 1+ selected (unchanged behavior)<\/div>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <div class=\"btn ghost compact dis\">Back<\/div>\n              <div class=\"btn secondary compact\">Skip<\/div>\n              <div class=\"btn primary compact\" style=\"flex:1\">Save 4+ 1sts (1)<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div class=\"walkfoot\">\n          <div class=\"btn ghost compact dis\">Back<\/div>\n          <div class=\"btn primary grow1\">Continue \u2014 no QBs this high<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\"><b>Unchanged from v1<\/b>, restated so v2 stands alone: at 0 selected the\n        primary reads \"Continue \u2014 no QBs this high\" (last tier: \"Continue &amp; finish\") and the\n        redundant Skip is hidden; tap a chip and the footer reverts to Back / Skip /\n        \"Save 4+ 1sts (1)\" (inset).<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 RATIONALE \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"rationale\">\n    <div class=\"card\">\n      <h2>Rationale \u2014 v2 deltas<\/h2>\n      <ul>\n        <li><strong>Most control = Tiers board (operator correction):<\/strong> \"control\" to a\n          dynasty player means owning where every player SITS, and the tier board delivers that\n          while staying survey-able \u2014 8 buckets, not 250 ordered slots. The overall 1-to-N list\n          is maximal effort, not maximal usefulness (the engine prices trades off tier-scale\n          values, so slot-level order past the top of the board barely moves suggestions); it\n          stays available as \"Overall ranks\" in the disclosure for the tinkerers.<\/li>\n        <li><strong>Import copy \u2014 \"Have rankings already? Import them\":<\/strong> the operator's\n          sentence (\"I already have my rankings stored elsewhere\") is the user's thought;\n          compressing it to a dim question + ice verb keeps the thought and makes only the verb\n          look tappable. Runner-up \"Import my rankings\" was rejected because bare, it reads like\n          a fourth method (\"import\" as another way to build) \u2014 the question form self-selects:\n          only people who HAVE rankings elsewhere engage. Rendered as one 36px bordered chip,\n          a full visual tier below the cards.<\/li>\n        <li><strong>Sheet before file picker:<\/strong> \"Bring your rankings\" shows the three\n          methods AND the honesty line (\"we'll match names\u2026you review anything we can't match\")\n          before any OS picker opens \u2014 the review step is promised up front, so B3 lands as\n          the deal the user accepted, not a failure state.<\/li>\n        <li><strong>Match review is the real cost (B3):<\/strong> any import lives or dies on\n          name matching against the league's Sleeper pool. Auto-accept close matches (suffixes,\n          punctuation, \"Kenneth Walker\" \u2192 III) but show them for audit; ambiguous names get\n          candidate chips + Skip; primary disabled until every row is matched or skipped;\n          skipped/unlisted players keep their current board values. This screen exists in EVERY\n          scope \u2014 it's the floor cost of the feature, not gold-plating.<\/li>\n        <li><strong>Defer-if-complex scoping (operator's option):<\/strong> a v1 scope is\n          <strong>paste-only<\/strong> \u2014 one textarea, one tolerant line parser, plus B3. It\n          covers the CSV case for free (open file \u2192 copy \u2192 paste) with no file-picker,\n          MIME or encoding work. CSV upload is a small follow-on (same parser behind a\n          document picker); <strong>XLSX is the deferrable chunk<\/strong> \u2014 it needs a real\n          parser dependency (SheetJS or server-side openpyxl) and multi-sheet/column-picking\n          UX. If even paste feels heavy, the whole entry chip can ship later: nothing else on\n          the chooser depends on it.<\/li>\n        <li><strong>Carried from v1 unchanged:<\/strong> one chooser rendered on both surfaces\n          (screen + Rank-tab sheet), outcome labels (Fastest / Most precise / Most control),\n          Quick rank as Quick set's follow-on pass rather than a peer, and the #233\n          \"Continue \u2014 no QBs this high\" empty-tier CTA with Skip hidden at 0 selected.<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n<\/div>\n<\/body>\n<\/html>\n"}]</script>
<script>
const PAGES = JSON.parse(document.getElementById('pages').textContent);
const nav = document.getElementById('tabs');
const frame = document.getElementById('frame');
const note = document.getElementById('note');
const notecount = document.getElementById('notecount');
const KEY = 'ftf-polish-lab-2026-08-v2-notes';
let current = 0;
let notes = {};
try { notes = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { notes = {}; }

PAGES.forEach((p, i) => {
  const b = document.createElement('button');
  b.innerHTML = p.label + '<span class="fb">' + p.fb + '</span><span class="dot"></span>';
  b.onclick = () => select(i);
  nav.appendChild(b);
});

function refreshBadges(){
  let n = 0;
  [...nav.children].forEach((b, j) => {
    const has = !!(notes[PAGES[j].label] || '').trim();
    b.classList.toggle('noted', has);
    if (has) n++;
  });
  notecount.textContent = n ? (n + ' of ' + PAGES.length + ' noted') : 'no notes yet';
}

function select(i){
  current = i;
  [...nav.children].forEach((b, j) => b.classList.toggle('active', j === i));
  frame.srcdoc = PAGES[i].html;
  note.value = notes[PAGES[i].label] || '';
  refreshBadges();
}

note.addEventListener('input', () => {
  notes[PAGES[current].label] = note.value;
  try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
  refreshBadges();
});

document.getElementById('copyall').addEventListener('click', async () => {
  const lines = [];
  PAGES.forEach((p) => {
    const t = (notes[p.label] || '').trim();
    if (t) lines.push('## ' + p.label + ' (' + p.fb + ')\n' + t);
  });
  const text = lines.length ? lines.join('\n\n') : '(no notes)';
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  const btn = document.getElementById('copyall');
  const orig = btn.textContent;
  btn.textContent = ok ? 'Copied!' : 'Copy failed';
  setTimeout(() => { btn.textContent = orig; }, 1500);
});

document.addEventListener('keydown', (e) => {
  if (e.target === note) return;
  if (e.key === 'ArrowRight') select((current + 1) % PAGES.length);
  if (e.key === 'ArrowLeft')  select((current - 1 + PAGES.length) % PAGES.length);
});
select(0);
</script>
</body>
</html>
