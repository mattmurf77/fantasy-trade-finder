&lt;div class=&quot;note&quot;&gt;
  &lt;h1&gt;Polish Lab · Pin-Mode Collapsed Controls — single-pin find-a-trade (#243 scroll audit, finding A/#1)&lt;/h1&gt;
  &lt;p&gt;&lt;b&gt;Audit finding (verbatim, &lt;code&gt;docs/feedback/items/243-scroll-audit/trades-surfaces.md&lt;/code&gt;, §A):&lt;/b&gt;&lt;/p&gt;
  &lt;p class=&quot;q&quot;&gt;&quot;State: single-pin featured-trade mode (#216/#209/#241) — worst offender. Minimal case (1 idea per group) ≈ 1497pt → overflows ~839pt (2.3 screens)… &lt;b&gt;The full Controls Card (286pt: outlook row + fairness row + two-column pin board) still renders above the featured window&lt;/b&gt; — #241 removed the deck/Find button/progress strip but the card never shrank; its primary action is gone yet the editable chrome persists.&quot;&lt;/p&gt;
  &lt;p&gt;The audit&#x27;s #1 top-10 lever (impact × ease): &lt;b&gt;&quot;Single-pin mode: collapse the Controls Card to a pinned-summary one-liner (~240pt, the hero state of the app&#x27;s newest flow).&quot;&lt;/b&gt; This lab mocks that fix plus a further variant. Grounded in real code: &lt;code&gt;mobile/src/screens/TradesScreen.tsx&lt;/code&gt; — the controls &lt;code&gt;&amp;lt;Card&amp;gt;&lt;/code&gt; (outlook row ~3153-3170, fairness row ~3179-3225, two-column pin board ~3273-3382) renders unconditionally, then the Find button (~3489-3501) and progress strip (~3507-3537) are already hidden in single-pin mode via &lt;code&gt;singlePin&lt;/code&gt;, then &lt;code&gt;&amp;lt;FeaturedTradeWindow&amp;gt;&lt;/code&gt; mounts at ~3563 followed by &lt;code&gt;&amp;lt;AssetIdeasPanel&amp;gt;&lt;/code&gt;. &lt;code&gt;mobile/src/components/FeaturedTradeWindow.tsx&lt;/code&gt; is a thin wrap: optional back-chip row, a &quot;Featured trade&quot; &lt;code&gt;TickLabel&lt;/code&gt;, then the reused read-only &lt;code&gt;TradeCard&lt;/code&gt; (give left / receive right, &lt;code&gt;hideMatchStrength&lt;/code&gt;, its own &lt;code&gt;TradeValueBar&lt;/code&gt;).&lt;/p&gt;
  &lt;p&gt;Method: same as the #218 hub pass — nominal heights against the audit&#x27;s &lt;b&gt;658pt usable viewport&lt;/b&gt; (852 − 59 top inset − 52 TopBar − 49 tab bar − 34 bottom inset). Frames below are real 393pt phone mockups with a &lt;span style=&quot;color:var(--flare)&quot;&gt;dashed fold line&lt;/span&gt; marking that budget in place, so you can see literally how far the featured trade sits below it today. Pt figures on the mock frames are the audit&#x27;s own where cited; V2&#x27;s are my own estimate (flagged &quot;Est.&quot;) since V2 goes beyond what the audit specified.&lt;/p&gt;
&lt;/div&gt;

  &lt;button class=&quot;copybtn&quot; id=&quot;copyall&quot;&gt;Copy all notes&lt;/button&gt;
  &lt;div class=&quot;notecount&quot; id=&quot;notecount&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;div class=&quot;note&quot;&gt;
  &lt;h2&gt;Recommendation&lt;/h2&gt;
  &lt;p&gt;&lt;b&gt;Ship V1.&lt;/b&gt; It is literally the audit&#x27;s #1-ranked lever, phrased almost exactly as the audit&#x27;s own suggested fix (&quot;Pinned: &amp;lt;player&amp;gt; · Edit, tap-to-expand&quot;), it&#x27;s scoped entirely inside &lt;code&gt;TradesScreen.tsx&lt;/code&gt; (swap the &lt;code&gt;&amp;lt;Card&amp;gt;&lt;/code&gt; body for a one-liner + local expand/collapse state — no new navigation, no changes to &lt;code&gt;FeaturedTradeWindow.tsx&lt;/code&gt; or where outlook/fairness live), and it recovers ~246pt of the audit&#x27;s cited ~839pt overflow with the lowest implementation risk. V2 recovers ~16pt more by removing the card shell entirely, but it&#x27;s a materially bigger change (couples &lt;code&gt;FeaturedTradeWindow&lt;/code&gt; to pin state, relocates outlook/fairness editing, changes what &quot;Edit&quot; does) for a small additional saving — worth a follow-on once V1 ships and if outlook/fairness editing genuinely belongs at the hub level instead of here. Neither variant alone closes the full 839pt gap; the audit&#x27;s other single-pin items (verdict-paragraph disclosure ~68pt, AssetIdeasPanel row cap, screen padding/gap trims) still apply on top.&lt;/p&gt;
&lt;/div&gt;

&lt;script&gt;
(function(){
  var KEY = &#x27;ftf-polish-lab-2026-08-pin-mode-collapsed-controls-notes&#x27;;
  var notes = {};
  try { notes = JSON.parse(localStorage.getItem(KEY) || &#x27;{}&#x27;); } catch (e) { notes = {}; }

  var boxes = Array.prototype.slice.call(document.querySelectorAll(&#x27;.pagenote&#x27;));
  var notecount = document.getElementById(&#x27;notecount&#x27;);

  function refresh(){
    var n = 0;
    boxes.forEach(function(b){
      var has = !!(notes[b.dataset.key] || &#x27;&#x27;).trim();
      b.closest(&#x27;.notewrap&#x27;).classList.toggle(&#x27;noted&#x27;, has);
      if (has) n++;
    });
    notecount.textContent = n ? (n + &#x27; of &#x27; + boxes.length + &#x27; noted&#x27;) : &#x27;no notes yet&#x27;;
  }

  boxes.forEach(function(b){
    b.value = notes[b.dataset.key] || &#x27;&#x27;;
    b.addEventListener(&#x27;input&#x27;, function(){
      notes[b.dataset.key] = b.value;
      try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
      refresh();
    });
  });

  document.getElementById(&#x27;copyall&#x27;).addEventListener(&#x27;click&#x27;, async function(){
    var lines = [];
    boxes.forEach(function(b){
      var t = (notes[b.dataset.key] || &#x27;&#x27;).trim();
      if (t) lines.push(&#x27;## &#x27; + b.dataset.key + &#x27;\n&#x27; + t);
    });
    var text = lines.length ? lines.join(&#x27;\n\n&#x27;) : &#x27;(no notes)&#x27;;
    var ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      var ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand(&#x27;copy&#x27;); } catch (e2) {}
      ta.remove();
    }
    var btn = document.getElementById(&#x27;copyall&#x27;);
    var orig = btn.textContent;
    btn.textContent = ok ? &#x27;Copied!&#x27; : &#x27;Copy failed&#x27;;
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  });

  refresh();
})();
&lt;/script&gt;

  &lt;p class=&quot;q&quot;&gt;&quot;&lt;code&gt;TradeValueBar&lt;/code&gt; is the single most expensive shared widget on every trade surface (label + heading + margin sentence + track + scale + end labels + a bordered verdict paragraph), and it appears &lt;b&gt;twice&lt;/b&gt; in single-pin mode.&quot; — nominal height &lt;b&gt;≈240–248pt&lt;/b&gt;, cited against &lt;code&gt;TradeValueBar.tsx:178-248&lt;/code&gt;.&lt;/p&gt;
  &lt;p&gt;Top-10 list items #4 and #6 both target this component: &lt;i&gt;&quot;collapse verdict paragraph behind a disclosure (~68pt × every instance, app-wide)&quot;&lt;/i&gt; and &lt;i&gt;&quot;fontSize:9 → 11px floor fix (violation, trivial)&quot;&lt;/i&gt;. This page mocks both fixes plus a more aggressive third option, rendered in situ inside a faithful mini &lt;code&gt;TradeCard&lt;/code&gt; wrapper (give/receive rows above the bar, no &lt;code&gt;StrengthBar&lt;/code&gt; — matching how &lt;code&gt;FeaturedTradeWindow.tsx&lt;/code&gt; mounts it in single-pin mode) so relative card height is directly visible.&lt;/p&gt;
  &lt;div class=&quot;violation&quot;&gt;
    &lt;svg class=&quot;ic&quot; width=&quot;14&quot; height=&quot;14&quot; viewBox=&quot;0 0 20 20&quot;&gt;&lt;path d=&quot;M10 4l8 13H2z&quot;/&gt;&lt;path d=&quot;M10 8v4M10 14v.01&quot;/&gt;&lt;/svg&gt;

  &lt;p style=&quot;margin-top:10px&quot;&gt;All pt math below uses the component&#x27;s real token values (&lt;code&gt;mobile/src/theme/chalkline.ts&lt;/code&gt;: &lt;code&gt;space.xs=4 / sm=8 / md=12&lt;/code&gt;, &lt;code&gt;type.label&lt;/code&gt; 11/14, &lt;code&gt;type.heading&lt;/code&gt; 22/26, &lt;code&gt;type.title&lt;/code&gt; 16/22, &lt;code&gt;type.bodySm&lt;/code&gt; 13/18) and React Native&#x27;s gap-plus-margin compounding (a parent &lt;code&gt;gap&lt;/code&gt; and a child&#x27;s own &lt;code&gt;marginTop&lt;/code&gt; both apply and stack — not one-or-the-other). Assumes the verdict sentence wraps to 2 lines at 393pt width and the margin sentence stays on 1 line, both verified visually in the CURRENT frame below.&lt;/p&gt;

  &lt;h2&gt;Recommendation&lt;/h2&gt;

&lt;script&gt;
(function(){
  var KEY = &#x27;ftf-polish-lab-2026-08-243-tvb-density-notes&#x27;;
  var notes = {};
  try { notes = JSON.parse(localStorage.getItem(KEY) || &#x27;{}&#x27;); } catch (e) { notes = {}; }

  var boxes = Array.prototype.slice.call(document.querySelectorAll(&#x27;.pagenote&#x27;));
  var notecount = document.getElementById(&#x27;notecount&#x27;);

  function refresh(){
    var n = 0;
    boxes.forEach(function(b){
      var has = !!(notes[b.dataset.key] || &#x27;&#x27;).trim();
      b.closest(&#x27;.notewrap&#x27;).classList.toggle(&#x27;noted&#x27;, has);
      if (has) n++;
    });
    notecount.textContent = n ? (n + &#x27; of &#x27; + boxes.length + &#x27; noted&#x27;) : &#x27;no notes yet&#x27;;
  }

  boxes.forEach(function(b){
    b.value = notes[b.dataset.key] || &#x27;&#x27;;
    b.addEventListener(&#x27;input&#x27;, function(){
      notes[b.dataset.key] = b.value;
      try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
      refresh();
    });
  });

  document.getElementById(&#x27;copyall&#x27;).addEventListener(&#x27;click&#x27;, async function(){
    var lines = [];
    boxes.forEach(function(b){
      var t = (notes[b.dataset.key] || &#x27;&#x27;).trim();
      if (t) lines.push(&#x27;## &#x27; + b.dataset.key + &#x27;\n&#x27; + t);
    });
    var text = lines.length ? lines.join(&#x27;\n\n&#x27;) : &#x27;(no notes)&#x27;;
    var ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      var ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand(&#x27;copy&#x27;); } catch (e2) {}
      ta.remove();
    }
    var btn = document.getElementById(&#x27;copyall&#x27;);
    var orig = btn.textContent;
    btn.textContent = ok ? &#x27;Copied!&#x27; : &#x27;Copy failed&#x27;;
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  });

  refresh();

  // V1 / V2 disclosure toggle demo
  document.querySelectorAll(&#x27;.tvb-toggle&#x27;).forEach(function(btn){
    btn.addEventListener(&#x27;click&#x27;, function(){
      var verdict = btn.nextElementSibling;
      var open = verdict.hasAttribute(&#x27;hidden&#x27;);
      if (open) { verdict.removeAttribute(&#x27;hidden&#x27;); } else { verdict.setAttribute(&#x27;hidden&#x27;, &#x27;&#x27;); }
      btn.setAttribute(&#x27;aria-expanded&#x27;, open ? &#x27;true&#x27; : &#x27;false&#x27;);
      btn.querySelector(&#x27;.dtxt&#x27;).textContent = open ? btn.dataset.expanded : btn.dataset.collapsed;
    });
  });
})();
&lt;/script&gt;

.badge{display:inline-block;padding:2px 6px;border-radius:2px;font:600 11px/14px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--lineStrong);color:var(--chalk)}
.badge.rankchip{border-radius:4px;font-family:var(--f-mono);text-transform:none;letter-spacing:0}

.actionrow{display:flex;gap:8px}
.btn{flex:1;height:44px;border-radius:4px;display:flex;align-items:center;justify-content:center;font:600 14px var(--f-ui)}
.btn.primary{background:var(--ice);color:var(--onIce)}
.btn.secondary{border:1px solid var(--lineStrong);color:var(--chalk)}
.btn.ghost{color:var(--dim);height:32px;padding:0;justify-content:flex-start;flex:none}
.btn.compact{height:36px;font-size:13px;padding:0 12px;flex:none}

.tick{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.tick::before{content:&quot;&quot;;width:3px;height:14px;background:var(--ice)}

/* explore rows (current/v2) */
.xrows{display:flex;flex-direction:column}
.xrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.xrow .m{flex:1;display:flex;flex-direction:column;gap:2px}
.xrow .t{font:600 16px/22px var(--f-ui)}
.xrow .s{font:400 13px/18px var(--f-ui);color:var(--dim)}

/* explore tiles (v1, 3-across reflow) */
.xtiles{display:flex;gap:8px}
.xtile{flex:1;border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.xtile svg{stroke:var(--dim)}
.xtile .t{font:600 13px/16px var(--f-ui)}
.xtile .s{font:400 10.5px/13px var(--f-ui);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* divider — buggy (marginTop ON TOP of the ScrollView gap) vs fixed */
.divider{height:1px;background:var(--line);margin-top:12px}
.divider.fixed{margin-top:0}

/* progress module */
.module{border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:16px;display:flex;flex-direction:column;gap:8px}
.ringrow{display:flex;gap:16px;align-items:center}
.ringwrap{width:72px;height:72px;flex:0 0 auto;position:relative}
.ringwrap svg{position:absolute;inset:0}
.ringcenter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 16px var(--f-mono)}
.ringside{flex:1;display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0}
.mdivider{height:1px;background:var(--line)}
.statbetween{display:flex;justify-content:space-between;align-items:center;width:100%}
.mono{font:500 13px var(--f-mono)}
.segbar{display:flex;gap:2px}
.seg{flex:1;height:8px;background:var(--ink3)}
.seg.on{background:var(--ice)}
.unlockline{font:400 13px/18px var(--f-ui);color:var(--chalk)}
.unlockline .em{color:var(--ice);font-weight:600}
.unlockline .inlinelink{color:var(--ice);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.foldtext{font:400 13px/18px var(--f-ui);color:var(--dim);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}

/* works-now / example trade */
.extrade{border:1px solid var(--line);border-radius:8px;background:var(--ink0);padding:10px 12px;margin-top:8px}
.exlabel{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--flare)}
.excols{display:flex;margin-top:6px}
.excol{flex:1;padding:0 10px;display:flex;flex-direction:column;gap:6px}
.excol:first-child{padding-left:0;border-right:1px solid var(--line)}
.excol:last-child{padding-right:0}
.exrow{display:flex;align-items:center;gap:6px}
.prail{width:3px;height:14px;flex:none}
.exnm{font:600 12px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expos{font:600 9px var(--f-ui);letter-spacing:.05em}
.exmeter{height:4px;background:var(--ink3);margin-top:10px}
.exmeter .f{height:4px;background:var(--pos);width:88%}
.exmeterlab{display:flex;justify-content:space-between;margin-top:4px;font-size:10px;color:var(--dim)}
.exmeterlab .mono{font-size:11px;color:var(--dim)}

/* ── per-frame note box ── */
.notewrap{width:100%;display:flex;flex-direction:column;gap:4px}
.notelbl{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--dim)}
.notelbl .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);display:none}
.notewrap.noted .notelbl .dot{display:block}
.pagenote{width:100%;background:var(--ink1);color:var(--chalk);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;font-family:var(--f-ui);font-size:12.5px;min-height:48px;resize:vertical}
.pagenote::placeholder{color:var(--faint)}
.pagenote:focus{outline:none;border-color:var(--ice)}

.rationale{max-width:1200px;width:100%;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:16px 20px}
.rationale h2{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px;color:var(--chalk)}
.rationale h2::before{content:&quot;&quot;;width:3px;height:14px;background:var(--ice)}
.rationale ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--dim)}
.rationale li{margin-bottom:6px}
.rationale strong{color:var(--chalk)}
.rationale table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px}
.rationale th,.rationale td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.rationale th{color:var(--chalk);background:var(--ink2)}
.rationale td{color:var(--dim)}
.rationale td b{color:var(--chalk)}

  &lt;h1&gt;League home — progress-module fold (#243 scroll audit)&lt;/h1&gt;
  &lt;p&gt;The &lt;b&gt;#243 scroll audit&lt;/b&gt; (&lt;code&gt;docs/feedback/items/243-scroll-audit/league-misc-surfaces.md&lt;/code&gt;, §2)
     found that on &lt;code&gt;LeagueScreen.tsx&lt;/code&gt;&#x27;s low-activity state — a quiet/new league (0 matches, ring &amp;lt;4/4,
     contrarian &lt;code&gt;insufficient_data&lt;/code&gt;) — the page&#x27;s single most important first-run explainer,
     &lt;code&gt;LeagueProgressModule&lt;/code&gt;, starts too low and gets clipped by the tab-bar viewport. Usable-viewport
     budget for a Main-tab screen (iPhone 15/16-class, 393×852), same method as the #218 hub density pass:&lt;/p&gt;
  &lt;div class=&quot;formula&quot;&gt;852 − 59 (top safe inset) − 52 (TopBar) − 49 (tab bar) − 34 (bottom inset) = &lt;b&gt;658pt&lt;/b&gt;&lt;/div&gt;
  &lt;p&gt;Contributing waste: a &lt;b&gt;divider double-margin bug&lt;/b&gt; (&lt;code&gt;styles.divider&lt;/code&gt; carries its own
     &lt;code&gt;marginTop: space.md(12)&lt;/code&gt; &lt;i&gt;on top of&lt;/i&gt; the ScrollView&#x27;s own &lt;code&gt;gap: space.md(12)&lt;/code&gt; —
     24pt spent for what should be a 12pt gap, ×2 dividers in this state) and &lt;b&gt;three stacked Explore rows&lt;/b&gt;
     at ~67pt each (201pt) that could reflow denser. All three frames below use the same data
     (positions 0/4 ranked, 1/12 ranked-incl-you, 12 teams — identical to the shipped
     &lt;code&gt;empty-states-progress-v3&lt;/code&gt; mock) so only layout changes, never content.&lt;/p&gt;

    &lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th&gt;V1 — combined density fix&lt;/th&gt;&lt;th&gt;V2 — reorder only&lt;/th&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Effort&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Medium — 4 small edits (2 style-only, 1 layout reflow, 1 component change), all localized to &lt;code&gt;LeagueScreen.tsx&lt;/code&gt; + &lt;code&gt;LeagueProgressModule.tsx&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Low — pure JSX reorder in &lt;code&gt;LeagueScreen.tsx&lt;/code&gt;, zero style edits&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Risk&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Low-medium — the Explore tile reflow is new layout that needs its own visual QA (icon/label truncation at longer position names, e.g. &quot;Rookie draft board&quot;)&lt;/td&gt;&lt;td&gt;Very low — every element keeps its existing styling; only sibling order changes&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;What&#x27;s traded away&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Nothing removed — Explore stays visible, just denser&lt;/td&gt;&lt;td&gt;Explore (the whole section) drops below the fold every time the module is showing — a returning user who already ranked can&#x27;t see &quot;Free agents&quot; / &quot;Rookie board&quot; without scrolling&lt;/td&gt;&lt;/tr&gt;
    &lt;tr&gt;&lt;td&gt;&lt;b&gt;Net effect&lt;/b&gt;&lt;/td&gt;&lt;td&gt;Fixes the actual bug (module clipped) &lt;i&gt;and&lt;/i&gt; the underlying cause (bloated spacing) — the gain compounds for every future addition to this screen&lt;/td&gt;&lt;td&gt;Fixes the symptom for THIS state only — a wide open-ended list still stacks the same way once matches/leaderboards return, and the divider bug ships unfixed everywhere else it appears (audit item 2: up to 60pt project-wide)&lt;/td&gt;&lt;/tr&gt;
  &lt;/table&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;strong&gt;Recommend V1.&lt;/strong&gt; It resolves the audit&#x27;s root causes (items 1–3+5, ~108–138pt reclaimed
      depending on measured render) rather than shuffling the same bytes around, and the divider fix alone is
      worth landing project-wide regardless of which layout wins — every other divider on this screen (and
      likely others) pays the same 12pt tax.&lt;/li&gt;
    &lt;li&gt;V2 is the right move only if Explore genuinely has near-zero value in the low-activity state (arguably

      patch while V1&#x27;s tile reflow gets proper design review. It&#x27;s a reasonable stopgap, not a replacement for V1.&lt;/li&gt;
    &lt;li&gt;The two are not mutually exclusive: V1&#x27;s density fixes (divider, hero padding, inline invite link) can
      land underneath V2&#x27;s reorder later if both the &quot;explore is de-prioritized&quot; and &quot;nothing should look

(function(){
  var BUDGET = 658;

  function instrument(phoneId, spillId){
    var phone = document.getElementById(phoneId);
    var spill = document.getElementById(spillId);
    var content = phone.querySelector(&#x27;.content&#x27;);
    var scroll = phone.querySelector(&#x27;.scroll&#x27;);
    var fold = phone.querySelector(&#x27;.foldline&#x27;);
    var flabel = fold.querySelector(&#x27;.flabel&#x27;);

    var full = scroll.scrollHeight;
    var contentTop = content.getBoundingClientRect().top;

    // per-block chips
    var blocks = scroll.querySelectorAll(&#x27;:scope &gt; [data-blk]&#x27;);
    var criticalBottom = null;
    blocks.forEach(function(b){
      var r = b.getBoundingClientRect();
      var top = r.top - contentTop;
      var bottom = r.bottom - contentTop;
      var h = Math.round(r.height);
      var over = bottom &gt; BUDGET + 0.5;
      var chip = document.createElement(&#x27;div&#x27;);
      chip.className = &#x27;blkchip&#x27; + (over ? &#x27; over&#x27; : &#x27;&#x27;);
      chip.textContent = b.dataset.blk + &#x27; · &#x27; + h + &#x27;pt → &#x27; + Math.round(bottom) + &#x27;pt&#x27;;
      chip.style.top = Math.max(2, Math.round(top)) + &#x27;px&#x27;;
      content.appendChild(chip);
      if (b.dataset.critical === &#x27;module&#x27;) criticalBottom = bottom;
    });

    // fold label — judged against the CRITICAL block (the progress module),
    // since the page legitimately continues below it (works-now/explore) in
    // every variant; that trailing scroll is expected, not the finding.
    if (criticalBottom != null) {
      if (criticalBottom &gt; BUDGET + 0.5) {
        var moduleOver = Math.round(criticalBottom - BUDGET);
        flabel.textContent = &#x27;658pt fold — module CUT OFF, &#x27; + moduleOver + &#x27;pt hidden&#x27;;
      } else {
        var moduleSpare = Math.round(BUDGET - criticalBottom);
        fold.classList.add(&#x27;fits&#x27;);
        flabel.textContent = &#x27;658pt fold — module fits, &#x27; + moduleSpare + &#x27;pt spare (page continues below)&#x27;;
      }
    } else if (full &gt; BUDGET + 0.5) {
      flabel.textContent = &#x27;658pt fold — OVERFLOW +&#x27; + Math.round(full - BUDGET) + &#x27;pt&#x27;;
    } else {
      fold.classList.add(&#x27;fits&#x27;);
      flabel.textContent = &#x27;658pt fold — fits, &#x27; + Math.round(BUDGET - full) + &#x27;pt spare&#x27;;
    }

    // spill preview of the cropped tail
    if (full &gt; BUDGET + 0.5 &amp;&amp; spill) {
      var overflowAmt = Math.ceil(full - BUDGET);
      spill.style.height = (overflowAmt + 22) + &#x27;px&#x27;;
      spill.classList.add(&#x27;show&#x27;);
      var slabel = document.createElement(&#x27;div&#x27;);
      slabel.className = &#x27;slabel&#x27;;
      slabel.textContent = &#x27;below the fold — &#x27; + overflowAmt + &#x27;pt cut off, requires scroll&#x27;;
      spill.appendChild(slabel);
      var wrap = document.createElement(&#x27;div&#x27;);
      wrap.className = &#x27;clonewrap&#x27;;
      var clone = scroll.cloneNode(true);
      clone.style.marginTop = (-BUDGET) + &#x27;px&#x27;;
      wrap.appendChild(clone);
      spill.appendChild(wrap);
    }
  }

  instrument(&#x27;phoneCurrent&#x27;, &#x27;spillCurrent&#x27;);
  instrument(&#x27;phoneV1&#x27;, &#x27;spillV1&#x27;);
  instrument(&#x27;phoneV2&#x27;, &#x27;spillV2&#x27;);

  // ── notes / localStorage ──
  var KEY = &#x27;ftf-polish-lab-2026-08-243-league-home-fold-notes&#x27;;
  var notes = {};
  try { notes = JSON.parse(localStorage.getItem(KEY) || &#x27;{}&#x27;); } catch (e) { notes = {}; }

  var boxes = Array.prototype.slice.call(document.querySelectorAll(&#x27;.pagenote&#x27;));
  var notecount = document.getElementById(&#x27;notecount&#x27;);

  function refresh(){
    var n = 0;
    boxes.forEach(function(b){
      var has = !!(notes[b.dataset.key] || &#x27;&#x27;).trim();
      b.closest(&#x27;.notewrap&#x27;).classList.toggle(&#x27;noted&#x27;, has);
      if (has) n++;
    });
    notecount.textContent = n ? (n + &#x27; of &#x27; + boxes.length + &#x27; noted&#x27;) : &#x27;no notes yet&#x27;;
  }

  boxes.forEach(function(b){
    b.value = notes[b.dataset.key] || &#x27;&#x27;;
    b.addEventListener(&#x27;input&#x27;, function(){
      notes[b.dataset.key] = b.value;
      try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
      refresh();
    });
  });

  document.getElementById(&#x27;copyall&#x27;).addEventListener(&#x27;click&#x27;, async function(){
    var lines = [];
    boxes.forEach(function(b){
      var t = (notes[b.dataset.key] || &#x27;&#x27;).trim();
      if (t) lines.push(&#x27;## &#x27; + b.dataset.key + &#x27;\n&#x27; + t);
    });
    var text = lines.length ? lines.join(&#x27;\n\n&#x27;) : &#x27;(no notes)&#x27;;
    var ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      var ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand(&#x27;copy&#x27;); } catch (e2) {}
      ta.remove();
    }
    var btn = document.getElementById(&#x27;copyall&#x27;);
    var orig = btn.textContent;
    btn.textContent = ok ? &#x27;Copied!&#x27; : &#x27;Copy failed&#x27;;
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  });

  refresh();
})();
&lt;/script&gt;

.denserow{height:56px;background:var(--ink1);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;padding:0 12px;gap:10px;position:relative;overflow:hidden}
.denserow.sel{border-color:var(--ice)}
.denserow .rail{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--wr)}
.drmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-left:6px}
.drline1{display:flex;align-items:baseline;gap:6px}
.drname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.drteam{font-size:11px;color:var(--dim);flex:0 0 auto}
.drline2{display:flex;align-items:center;gap:6px}
.drpos{font-family:var(--f-mono);font-size:11px;color:var(--wr);border:1px solid var(--wr);padding:0 5px;border-radius:2px}
.drrk{font-size:9px;font-weight:700;color:var(--flare);border:1px solid var(--flare);padding:0 4px;border-radius:2px;letter-spacing:.04em}
.drrank{margin-left:auto;width:24px;height:24px;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--onIce);flex:0 0 auto}
.drrank.r1{background:var(--gold)}

/* ── fold / spill / annotation overlay (current-frame overflow proof) ── */
.fold{position:absolute;left:0;right:0;bottom:0;border-top:2px dashed var(--flare);z-index:6}
.fold .flabel{position:absolute;right:8px;top:-22px;font-family:var(--f-mono);font-size:11px;color:var(--flare);background:rgba(12,14,17,.9);padding:1px 6px;border:1px solid var(--flare);border-radius:2px}
.spill{width:393px;border:1px dashed var(--flare);border-top:none;border-radius:0 0 12px 12px;opacity:.6;overflow:hidden;position:relative;background:var(--ink0)}
.spill .slabel{position:absolute;right:8px;top:6px;font-family:var(--f-mono);font-size:11px;color:var(--flare);background:rgba(12,14,17,.92);border:1px solid var(--flare);border-radius:2px;padding:1px 6px;z-index:3}
.ann{position:absolute;z-index:7;font-size:11px;font-family:var(--f-mono);color:var(--ice);background:rgba(12,14,17,.94);border:1px solid var(--ice);border-radius:2px;padding:2px 6px;line-height:1.45;max-width:150px}
.ann.f{color:var(--flare);border-color:var(--flare)}
.fit{position:absolute;left:12px;right:12px;bottom:8px;z-index:6;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--pos);border:1px dashed var(--pos);border-radius:2px;padding:4px}

/* ── per-frame note box ── */
.notewrap{width:100%;display:flex;flex-direction:column;gap:4px}
.notelbl{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--dim)}
.notelbl .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);display:none}
.notewrap.noted .notelbl .dot{display:block}
.pagenote{width:100%;background:var(--ink1);color:var(--chalk);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;font-family:var(--f-ui);font-size:12.5px;min-height:48px;resize:vertical}
.pagenote::placeholder{color:var(--faint)}
.pagenote:focus{outline:none;border-color:var(--ice)}

  &lt;h1&gt;Polish Lab · Trios Three-Up Reflow — #243 scroll audit, biggest rank-surface lever&lt;/h1&gt;
  &lt;p&gt;&lt;b&gt;Source:&lt;/b&gt; &lt;code&gt;docs/feedback/items/243-scroll-audit/rank-surfaces.md&lt;/code&gt; — &lt;code&gt;RankScreen&lt;/code&gt; (Trios / head-to-heads). The audit measured the screen&#x27;s nominal state (no streak chip, no unlock-payoff copy, no Confirm button pre-selection, no unlocked banner) against the Rank-stack content budget: &lt;code&gt;852 − 59 (top inset) − 52 (global TopBar) − 44 (native stack header) − 49 (tab bar) − 34 (bottom inset) = 614pt&lt;/code&gt;.&lt;/p&gt;
  &lt;p class=&quot;q&quot;&gt;&quot;The three &lt;code&gt;PlayerCard&lt;/code&gt;s stacked vertically are &lt;b&gt;43% of total content height&lt;/b&gt; and by far the dominant line item… A horizontal 3-up row (each card ~1/3 width) would collapse this block from ~324pt to roughly one card&#x27;s height (~110-130pt) — &lt;b&gt;potential savings ~180-200pt&lt;/b&gt;, the single largest lever in this entire audit. Caveat: this needs a narrower card treatment (name truncation, badge wrapping at ~110pt width) — it&#x27;s a real design pass, not a pure prop change, and readability at 1/3 width needs a mock before committing.&quot;&lt;/p&gt;
  &lt;p&gt;This file &lt;b&gt;is&lt;/b&gt; that design pass. Row 1 recreates today&#x27;s screen faithfully (&lt;code&gt;mobile/src/screens/RankScreen.tsx&lt;/code&gt; + &lt;code&gt;mobile/src/components/PlayerCard.tsx&lt;/code&gt;, classic branch — position rail, badge row, name, team·age·experience meta) at real token values, proving the audit&#x27;s 747pt / 133pt-overflow math. Rows 2–4 mock three reflow treatments against the SAME trio (including one long name, &lt;b&gt;Marvin Harrison Jr.&lt;/b&gt;, tagged rookie — the audit&#x27;s own &quot;badge wrapping at ~110pt width&quot; stress case) so truncation and tap-target behavior can be judged directly, not estimated.&lt;/p&gt;

(function(){
  var KEY = &#x27;ftf-polish-lab-2026-08-243-trios-notes&#x27;;
  var notes = {};
  try { notes = JSON.parse(localStorage.getItem(KEY) || &#x27;{}&#x27;); } catch (e) { notes = {}; }

  var boxes, notecount;

  function refresh(){
    var n = 0;
    boxes.forEach(function(b){
      var has = !!(notes[b.dataset.key] || &#x27;&#x27;).trim();
      b.closest(&#x27;.notewrap&#x27;).classList.toggle(&#x27;noted&#x27;, has);
      if (has) n++;
    });
    notecount.textContent = n ? (n + &#x27; of &#x27; + boxes.length + &#x27; noted&#x27;) : &#x27;no notes yet&#x27;;
  }

  function init(){
    boxes = Array.prototype.slice.call(document.querySelectorAll(&#x27;.pagenote&#x27;));
    notecount = document.getElementById(&#x27;notecount&#x27;);
    boxes.forEach(function(b){
      b.value = notes[b.dataset.key] || &#x27;&#x27;;
      b.addEventListener(&#x27;input&#x27;, function(){
        notes[b.dataset.key] = b.value;
        try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
        refresh();
      });
    });
    refresh();
  }

  document.getElementById(&#x27;copyall&#x27;).addEventListener(&#x27;click&#x27;, async function(){
    var lines = [];
    (boxes || []).forEach(function(b){
      var t = (notes[b.dataset.key] || &#x27;&#x27;).trim();
      if (t) lines.push(&#x27;## &#x27; + b.dataset.key + &#x27;\n&#x27; + t);
    });
    var text = lines.length ? lines.join(&#x27;\n\n&#x27;) : &#x27;(no notes)&#x27;;
    var ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      var ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand(&#x27;copy&#x27;); } catch (e2) {}
      ta.remove();
    }
    var btn = document.getElementById(&#x27;copyall&#x27;);
    var orig = btn.textContent;
    btn.textContent = ok ? &#x27;Copied!&#x27; : &#x27;Copy failed&#x27;;
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  });

  init();
})();

    &lt;h1&gt;Drill-in filter dedup — League tab roster focus (#237 · #243)&lt;/h1&gt;
    &lt;p&gt;&lt;strong&gt;#237 (just shipped, 2026-08-02):&lt;/strong&gt; the League tab&#x27;s power-rankings chart card and
      the roster drill-in panel now share ONE filter state (&lt;code&gt;subset&lt;/code&gt; + &lt;code&gt;posFilter&lt;/code&gt;)
      — the All/Starters/Bench segmented control and the position pills render in &lt;strong&gt;both&lt;/strong&gt;
      sections, so changing a filter anywhere updates both instantly and they can never disagree. This is
      an explicit operator requirement (&lt;code&gt;mobile/src/screens/LeagueSummaryScreen.tsx&lt;/code&gt;, the
      &lt;code&gt;SubsetControl&lt;/code&gt;/&lt;code&gt;PosFilterPills&lt;/code&gt; comment block) and it must survive whatever
      ships here.&lt;/p&gt;
    &lt;p&gt;&lt;strong&gt;#243 scroll audit (`docs/feedback/items/243-scroll-audit/league-misc-surfaces.md`, §1b):&lt;/strong&gt;
      while a team is focused, the two identical control sets cost &lt;strong&gt;84pt of pure duplication&lt;/strong&gt;
      — the same two controls, doing the same thing, both on screen at once — and combined with the
      still-visible &quot;League home&quot; row (79pt, irrelevant once you&#x27;re reviewing a roster), the
      &lt;strong&gt;658pt tab-screen viewport&lt;/strong&gt; (iPhone 15/16-class, 393×852, minus safe insets +
      TopBar + tab bar) is exhausted at &lt;strong&gt;692pt before a single roster row renders&lt;/strong&gt;. Every
      drilled-in team focus forces a scroll before the user sees any player — the screen&#x27;s actual payload.&lt;/p&gt;
    &lt;p&gt;Three frames below, all sharing the identical 658pt viewport budget: &lt;strong&gt;Current&lt;/strong&gt;
      (faithful recreation, focused state) vs two proposed fixes — &lt;strong&gt;V1&lt;/strong&gt; (the audit&#x27;s own
      suggested fix: collapse the chart card to a slim summary strip while focused, dedup down to one
      visible control set) and &lt;strong&gt;V2&lt;/strong&gt; (lighter touch: keep the chart card as-is, pin the
      drill panel&#x27;s controls sticky, only hide the home row). Both variants apply &lt;strong&gt;only while a
      team is focused&lt;/strong&gt; — the nominal/unfocused view is untouched in every variant; see the
      callout after the frames.&lt;/p&gt;

      &lt;h2&gt;Recommendation&lt;/h2&gt;
      &lt;p&gt;&lt;strong&gt;V1&lt;/strong&gt; — it&#x27;s the audit&#x27;s own top-ranked fix (#243&#x27;s ranked list, items #3 and #4:

        caption row; V2 only needs &lt;code&gt;position: &#x27;sticky&#x27;, top: 0&lt;/code&gt; on &lt;code&gt;drillFilter&lt;/code&gt;&#x27;s

        &lt;code&gt;stickyHeaderIndices&lt;/code&gt;, which would need the drill control row promoted to a direct
        &lt;code&gt;ScrollView&lt;/code&gt; child — a slightly bigger lift than the CSS-only web equivalent implies;
        flag this for the engineering pass). Neither variant touches
        &lt;code&gt;subset&lt;/code&gt;/&lt;code&gt;posFilter&lt;/code&gt; state, &lt;code&gt;togglePos&lt;/code&gt;, or
        &lt;code&gt;switchSubset&lt;/code&gt; — the #237 shared-state model is untouched.&lt;/p&gt;
    &lt;/div&gt;

&lt;script&gt;
(function(){
  var KEY = &#x27;ftf-polish-lab-2026-08-237-243-drilldown-dedup-notes&#x27;;
  var notes = {};
  try { notes = JSON.parse(localStorage.getItem(KEY) || &#x27;{}&#x27;); } catch (e) { notes = {}; }

  var boxes = Array.prototype.slice.call(document.querySelectorAll(&#x27;.pagenote&#x27;));
  var notecount = document.getElementById(&#x27;notecount&#x27;);

  function refresh(){
    var n = 0;
    boxes.forEach(function(b){
      var has = !!(notes[b.dataset.key] || &#x27;&#x27;).trim();
      b.closest(&#x27;.notewrap&#x27;).classList.toggle(&#x27;noted&#x27;, has);
      if (has) n++;
    });
    notecount.textContent = n ? (n + &#x27; of &#x27; + boxes.length + &#x27; noted&#x27;) : &#x27;no notes yet&#x27;;
  }

  boxes.forEach(function(b){
    b.value = notes[b.dataset.key] || &#x27;&#x27;;
    b.addEventListener(&#x27;input&#x27;, function(){
      notes[b.dataset.key] = b.value;
      try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
      refresh();
    });
  });

  document.getElementById(&#x27;copyall&#x27;).addEventListener(&#x27;click&#x27;, async function(){
    var lines = [];
    boxes.forEach(function(b){
      var t = (notes[b.dataset.key] || &#x27;&#x27;).trim();
      if (t) lines.push(&#x27;## &#x27; + b.dataset.key + &#x27;\n&#x27; + t);
    });
    var text = lines.length ? lines.join(&#x27;\n\n&#x27;) : &#x27;(no notes)&#x27;;
    var ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      var ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand(&#x27;copy&#x27;); } catch (e2) {}
      ta.remove();
    }
    var btn = document.getElementById(&#x27;copyall&#x27;);
    var orig = btn.textContent;
    btn.textContent = ok ? &#x27;Copied!&#x27; : &#x27;Copy failed&#x27;;
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  });

  refresh();
})();
&lt;/script&gt;

.mvmeta{font-size:10.5px;color:var(--faint);font-family:var(--f-mono)}
.spark{flex:0 0 auto;display:block}
.mvdelta{flex:0 0 auto;font-family:var(--f-mono);font-size:12px;font-weight:600;min-width:38px;text-align:right}
.mvdelta.up{color:var(--pos)} .mvdelta.down{color:var(--neg)}

/* ── V1 tap-to-expand detail (live demo) ── */
.mvdetail{display:none;border-top:1px dashed var(--line);margin-top:2px;padding-top:8px;font-size:12px;color:var(--dim);line-height:1.5}
.mvdetail.open{display:block}
.mvdetail b{color:var(--chalk)}
.mvdetail .close{float:right;color:var(--ice);font-weight:600;cursor:pointer;font-size:11px}
.mvdetail .flag{color:var(--flare);font-size:11px}

/* ═══ V2: full-width horizontal swipe cards ═══ */
.swiperow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px}
.swipecard{flex:0 0 300px;scroll-snap-align:start;border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:14px;display:flex;flex-direction:column;gap:10px}
.swipehead{display:flex;align-items:center;gap:8px}
.swipename{font-size:16px;font-weight:600}
.swipemeta{font-size:11px;color:var(--dim);font-family:var(--f-mono)}
.bigheadline{font-family:var(--f-mono);font-size:26px;font-weight:600}
.bigheadline.up{color:var(--pos)} .bigheadline.down{color:var(--neg)}
.bigsub{font-size:11px;color:var(--dim);margin-top:-6px}
.tierchip{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--flare);border:1px solid rgba(240,80,140,.4);border-radius:999px;padding:4px 10px}
.playerlink{font-size:12px;color:var(--ice);font-weight:600;cursor:pointer}
.swipedots{display:flex;gap:5px;justify-content:center;padding-top:2px}
.swipedots span{width:5px;height:5px;border-radius:50%;background:var(--line)}
.swipedots span.on{background:var(--ice)}

/* ═══ V3: compact market-pulse strip ═══ */
.pulsestrip{display:flex;align-items:center;gap:7px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--ink1);font-size:12px;white-space:nowrap;overflow:hidden}
.pulseitem{display:flex;align-items:center;gap:4px;flex:0 1 auto;overflow:hidden}
.pulseitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulseitem.up{color:var(--pos)} .pulseitem.down{color:var(--neg)}
.pulsesep{color:var(--faint);flex:0 0 auto}
.pulselink{margin-left:auto;flex:0 0 auto;color:var(--ice);font-weight:600;font-size:12px}

/* ── per-frame note box ── */
.notewrap{width:100%;display:flex;flex-direction:column;gap:4px}
.notelbl{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--dim)}
.notelbl .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);display:none}
.notewrap.noted .notelbl .dot{display:block}
.pagenote{width:100%;background:var(--ink1);color:var(--chalk);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;font-family:var(--f-ui);font-size:12.5px;min-height:48px;resize:vertical}
.pagenote::placeholder{color:var(--faint)}
.pagenote:focus{outline:none;border-color:var(--ice)}

&lt;div class=&quot;note&quot;&gt;
  &lt;h1&gt;Polish Lab · Risers &amp;amp; Fallers Cards — DynastyGM teardown pre-approval&lt;/h1&gt;
  &lt;p&gt;&lt;b&gt;Operator directive (verbatim, from &lt;code&gt;docs/plans/market-data-readiness.md&lt;/code&gt;):&lt;/b&gt;&lt;/p&gt;
  &lt;p class=&quot;q&quot;&gt;&quot;I like the risers and fallers cards and the concept of market driven rankings (plus risers and fallers). This feels like something that can be app wide and league specific. I don&#x27;t think either are super big value adds for now, but just ensure that the data architecture exists to build in the future.&quot;&lt;/p&gt;
  &lt;p&gt;That was audited as a &lt;b&gt;data-plumbing pass, not a UI build&lt;/b&gt; (see &lt;code&gt;docs/business/product/2026-07-26-dynastygm-app-teardown.md&lt;/code&gt;, which surfaced the idea from a DynastyGM screen recording, and the readiness doc above). This mock is the UI half the operator explicitly deferred — it exists so a shape can be &lt;b&gt;pre-approved&lt;/b&gt; now and built the moment the backing data has accumulated enough to be meaningful, without a design detour later.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Data framing — read this before the frames below:&lt;/b&gt; every number here is labeled &lt;b&gt;&quot;FTF community value,&quot;&lt;/b&gt; never &quot;market consensus.&quot; The daily snapshot table (&lt;code&gt;player_value_history&lt;/code&gt;) already exists and already records (cron-provisioned, &lt;code&gt;#57&lt;/code&gt;/this readiness pass) — it&#x27;s the cleanest source for a daily sparkline — but its &lt;code&gt;consensus_value&lt;/code&gt; column is itself seeded from external DP+KTC blends, so calling it &quot;the market&quot; would overclaim what FTF observed. It&#x27;s the same number the app already calls &lt;b&gt;&quot;Consensus&quot;&lt;/b&gt; everywhere else (&lt;code&gt;ConsensusVerdictCard&lt;/code&gt;, the &quot;hasn&#x27;t ranked yet — balanced trade by consensus value&quot; copy) — this mock just uses the plainer word &quot;community&quot; for a card whose whole pitch is trustworthiness. The genuinely FTF-native alternative — aggregating real users&#x27; &lt;code&gt;elo_history&lt;/code&gt; board edits — is real (writers cover every ranking flow since &lt;code&gt;#164&lt;/code&gt;) but has no aggregation query built yet at all, app-wide or cross-league; see the data notes at the bottom.&lt;/p&gt;

&lt;div class=&quot;note&quot;&gt;
  &lt;h2&gt;Data notes — what exists today vs what each variant needs&lt;/h2&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Exists and already recording:&lt;/b&gt; &lt;code&gt;player_value_history&lt;/code&gt; — one row per universal-pool player per scoring format per UTC day (&lt;code&gt;consensus_elo&lt;/code&gt;, &lt;code&gt;consensus_value&lt;/code&gt;, &lt;code&gt;search_rank&lt;/code&gt;, &lt;code&gt;adp&lt;/code&gt;), written by the unflagged &lt;code&gt;POST /api/cron/value-snapshot&lt;/code&gt; route, now reliably cron-provisioned (&lt;code&gt;value-snapshot-daily&lt;/code&gt; in &lt;code&gt;render.yaml&lt;/code&gt;) with an hourly-tick fallback guard so a missed day is nearly impossible. This is the cleanest source for all three variants&#x27; sparklines — daily granularity, no gaps, already used for the &lt;code&gt;/api/rankings&lt;/code&gt; trend glyphs (&lt;code&gt;FB4-61&lt;/code&gt;).&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Also exists, different scope:&lt;/b&gt; &lt;code&gt;elo_history&lt;/code&gt; — per-user personal Elo snapshots, written on every board-mutating action since &lt;code&gt;#164&lt;/code&gt; (trios, tiers, reorder, anchors). &lt;code&gt;trends_service.compute_risers_fallers&lt;/code&gt; + &lt;code&gt;GET /api/trends/risers-fallers&lt;/code&gt; already use it — but that endpoint answers &lt;b&gt;&quot;how has MY board moved,&quot;&lt;/b&gt; and only powers &lt;code&gt;TrendsScreen&lt;/code&gt; in the Rank tab. It is the &quot;genuinely FTF-native&quot; alternative signal described in the framing note above, but nobody has written the aggregation-across-users query this mock&#x27;s &quot;FTF community value&quot; language would need to justify itself fully; today&#x27;s &lt;code&gt;consensus_value&lt;/code&gt; trend is the honest fallback.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Missing — the read endpoint (all variants):&lt;/b&gt; no &lt;code&gt;GET /api/market/risers-fallers&lt;/code&gt; exists. Per the readiness doc&#x27;s §3a it&#x27;s a pure read — join today&#x27;s &lt;code&gt;player_value_history&lt;/code&gt; rows against a baseline via the existing &lt;code&gt;load_value_snapshot_baseline(scoring_format, days=N)&lt;/code&gt;, rank by &lt;code&gt;consensus_value&lt;/code&gt; or &lt;code&gt;search_rank&lt;/code&gt; delta, take top-N each direction. No new writes, no schema change — this is the single blocking piece for V1 and D1.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Missing — league-specific variant (operator explicitly asked for this too):&lt;/b&gt; a &lt;b&gt;different&lt;/b&gt; signal, described but not built in §3b of the readiness doc — aggregate leaguemates&#x27; &lt;code&gt;elo_history&lt;/code&gt; rows for a &lt;code&gt;league_id&lt;/code&gt;, average the per-user Elo delta over the window, gate on movement shared by ≥K members (&quot;your league is warming up on X&quot;). None of the three frames above show this variant; it would reuse V1&#x27;s exact card shell with a source toggle (&quot;App-wide&quot; ↔ &quot;Your league&quot;) and its own endpoint.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Missing — V2&#x27;s tier-change chip specifically:&lt;/b&gt; tiers are derived live from current Elo via &lt;code&gt;tier_config.json&lt;/code&gt;; nothing snapshots the tier label itself at each historical date, only the raw value. Computing &quot;Tier 4 → Tier 2&quot; needs re-running the tier-band lookup against the baseline-date value, a small but real addition beyond the plain delta V1/D1 need.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Missing — &quot;tap → player context&quot; (V1) / &quot;Player context →&quot; (V2) / &quot;See all movers ›&quot; (V3):&lt;/b&gt; there is no single-player detail screen anywhere in the app today. The closest primitives are &lt;code&gt;PlayerContextMenu&lt;/code&gt; (a long-press action sheet for in-trade commands, not value history) and &lt;code&gt;TrendsScreen&lt;/code&gt; (personal board only, wrong scope for a community/consensus number). Any of the three taps needs either a new lightweight destination or an extension of an existing screen — not assumed to exist, and not designed here.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Recommendation:&lt;/b&gt; build &lt;b&gt;V1&lt;/b&gt; first — it&#x27;s the most literal match to the operator&#x27;s own words (&quot;risers and fallers cards&quot;), the cheapest data lift (one read endpoint over data already accumulating), and mounts exactly where the operator&#x27;s DynastyGM comparison pointed (the Explore-rows region). Ship &lt;b&gt;V3&lt;/b&gt; alongside it for near-zero extra cost once V1&#x27;s endpoint exists — same data, and the operator&#x27;s &quot;app-wide&quot; note makes a second lightweight mount worth having. Hold &lt;b&gt;V2&lt;/b&gt; — the extra tier-diff field plus the still-missing player-context destination make it the most expensive of the three for a feature the operator already called &quot;not a big value-add for now.&quot;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/div&gt;

&lt;script&gt;
(function(){
  var KEY = &#x27;ftf-polish-lab-2026-08-risers-fallers-notes&#x27;;
  var notes = {};
  try { notes = JSON.parse(localStorage.getItem(KEY) || &#x27;{}&#x27;); } catch (e) { notes = {}; }

  var boxes = Array.prototype.slice.call(document.querySelectorAll(&#x27;.pagenote&#x27;));
  var notecount = document.getElementById(&#x27;notecount&#x27;);

  function refresh(){
    var n = 0;
    boxes.forEach(function(b){
      var has = !!(notes[b.dataset.key] || &#x27;&#x27;).trim();
      b.closest(&#x27;.notewrap&#x27;).classList.toggle(&#x27;noted&#x27;, has);
      if (has) n++;
    });
    notecount.textContent = n ? (n + &#x27; of &#x27; + boxes.length + &#x27; noted&#x27;) : &#x27;no notes yet&#x27;;
  }

  boxes.forEach(function(b){
    b.value = notes[b.dataset.key] || &#x27;&#x27;;
    b.addEventListener(&#x27;input&#x27;, function(){
      notes[b.dataset.key] = b.value;
      try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
      refresh();
    });
  });

  document.getElementById(&#x27;copyall&#x27;).addEventListener(&#x27;click&#x27;, async function(){
    var lines = [];
    boxes.forEach(function(b){
      var t = (notes[b.dataset.key] || &#x27;&#x27;).trim();
      if (t) lines.push(&#x27;## &#x27; + b.dataset.key + &#x27;\n&#x27; + t);
    });
    var text = lines.length ? lines.join(&#x27;\n\n&#x27;) : &#x27;(no notes)&#x27;;
    var ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      var ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand(&#x27;copy&#x27;); } catch (e2) {}
      ta.remove();
    }
    var btn = document.getElementById(&#x27;copyall&#x27;);
    var orig = btn.textContent;
    btn.textContent = ok ? &#x27;Copied!&#x27; : &#x27;Copy failed&#x27;;
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  });

  refresh();

  &lt;h1&gt;Polish Lab · Lineup Before/After — trade-summary addition (#238)&lt;/h1&gt;
  &lt;p&gt;&lt;b&gt;Operator ask (verbatim):&lt;/b&gt;&lt;/p&gt;
  &lt;p class=&quot;q&quot;&gt;&quot;Adding a visual of a user&#x27;s starting lineup before/after a trade is a valuable tool to the trade summary. Let&#x27;s mock up that addition.&quot;&lt;/p&gt;
  &lt;p&gt;Grounded in a real, already-shipped backend field: &lt;code&gt;POST /api/trade/evaluate&lt;/code&gt; (Mode B, In-league) returns &lt;code&gt;starter_impact: {your_delta, their_delta, note}&lt;/code&gt; via &lt;code&gt;backend/server.py&lt;/code&gt; &lt;code&gt;_starter_impact()&lt;/code&gt;, which fills the league&#x27;s roster slots with each side&#x27;s highest-value eligible players via &lt;code&gt;backend/power_rankings.py&lt;/code&gt; &lt;code&gt;optimal_starters()&lt;/code&gt; — before and after the trade — and diffs the totals. Today that field carries &lt;b&gt;one summary sentence&lt;/b&gt; only; it does not name which slot changed or who filled it. The variants below explore how much slot-level detail to add and where the module mounts. Trade example used throughout is internally consistent: the lineup totals are computed the same way &lt;code&gt;optimal_starters()&lt;/code&gt; would (best value fills QB / RB / RB / WR / WR / TE / FLEX), so every delta shown ties back to real player values, not arbitrary numbers.&lt;/p&gt;
  &lt;p&gt;&lt;b&gt;Example trade:&lt;/b&gt; you send &lt;b&gt;James Cook&lt;/b&gt; (RB) + a &lt;b&gt;2026 4th&lt;/b&gt;, you receive &lt;b&gt;Jaylen Waddle&lt;/b&gt; (WR). Cook&#x27;s roster spot is backfilled by bench RB &lt;b&gt;Tyjae Spears&lt;/b&gt;; Waddle outvalues incumbent WR2 &lt;b&gt;DeVonta Smith&lt;/b&gt;, who slides down into FLEX ahead of &lt;b&gt;Tony Pollard&lt;/b&gt;. Net effect: RB2 gets weaker (−325), WR2 and FLEX both get stronger (+285, +330) — starting lineup total &lt;b&gt;5,422 → 5,712 (+290)&lt;/b&gt;, even though the raw trade-value edge is a modest +123.&lt;/p&gt;

&lt;div class=&quot;note&quot;&gt;
  &lt;h2&gt;Data notes — what exists today vs what this needs&lt;/h2&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Exists today:&lt;/b&gt; &lt;code&gt;starter_impact&lt;/code&gt; is computed and served ONLY by &lt;code&gt;POST /api/trade/evaluate&lt;/code&gt; in &lt;b&gt;Mode B (In-league calculator)&lt;/b&gt; — it needs two known rosters (caller + opponent) and the league&#x27;s Sleeper roster-slot template (&lt;code&gt;_sleeper_lineup_slots&lt;/code&gt;); see &lt;code&gt;backend/server.py&lt;/code&gt; around lines 991–1050 and the call site at ~line 7305. The payload is currently just &lt;code&gt;{your_delta, their_delta, note}&lt;/code&gt; — a single sentence, no per-slot names. That sentence is already live at &lt;code&gt;calc.starter-impact&lt;/code&gt; in &lt;code&gt;InLeagueCalculator.tsx&lt;/code&gt; (line 878) — &lt;b&gt;frame A2 above is not hypothetical, it&#x27;s what ships right now.&lt;/b&gt;&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Missing for V1/V2/D1&#x27;s per-slot detail (any mount):&lt;/b&gt; &lt;code&gt;optimal_starters()&lt;/code&gt; in &lt;code&gt;backend/power_rankings.py&lt;/code&gt; (line 50) returns a flat list of starter player IDs — it fills slots in order internally but discards WHICH slot each starter landed in before returning. Showing &quot;RB2: Cook → Spears&quot; needs that function (or a wrapper) to return &lt;code&gt;{slot, player_id}&lt;/code&gt; pairs instead, computed before AND after the trade, then diffed by slot position. This is new backend work, not just new UI.&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Missing entirely for the deck/featured trade window:&lt;/b&gt; checked &lt;code&gt;mobile/src/shared/types.ts&lt;/code&gt; (the &lt;code&gt;TradeCard&lt;/code&gt; interface, ~line 111) — it has no &lt;code&gt;starter_impact&lt;/code&gt; field, and neither &lt;code&gt;/api/trades/generate&lt;/code&gt; nor the asset-ideas endpoint that feeds &lt;code&gt;FeaturedTradeWindow&lt;/code&gt; computes it. Mode B&#x27;s on-demand evaluate call is fine for one calculator submission; computing full before/after optimal lineups for every card in a generated deck (tens of cards per sweep) is a materially different cost and would need its own perf pass before it ships there. &lt;b&gt;Frames A1, B1 and D1 above are illustrative of the target design — they are not describing an existing capability.&lt;/b&gt;&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Recommended sequencing:&lt;/b&gt; ship the slot-labeled backend change once (extend &lt;code&gt;_starter_impact&lt;/code&gt;/&lt;code&gt;optimal_starters&lt;/code&gt;), land it in the calculator first (V1 or V2 — cheapest integration, reuses the existing Mode B call), then evaluate the deck/featured-window cost separately before committing to V3 there.&lt;/li&gt;
  &lt;/ul&gt;
&lt;/div&gt;

&lt;script&gt;
(function(){
  var KEY = &#x27;ftf-polish-lab-2026-08-238-lineup-notes&#x27;;
  var notes = {};
  try { notes = JSON.parse(localStorage.getItem(KEY) || &#x27;{}&#x27;); } catch (e) { notes = {}; }

  var boxes = Array.prototype.slice.call(document.querySelectorAll(&#x27;.pagenote&#x27;));
  var notecount = document.getElementById(&#x27;notecount&#x27;);

  function refresh(){
    var n = 0;
    boxes.forEach(function(b){
      var has = !!(notes[b.dataset.key] || &#x27;&#x27;).trim();
      b.closest(&#x27;.notewrap&#x27;).classList.toggle(&#x27;noted&#x27;, has);
      if (has) n++;
    });
    notecount.textContent = n ? (n + &#x27; of &#x27; + boxes.length + &#x27; noted&#x27;) : &#x27;no notes yet&#x27;;
  }

  boxes.forEach(function(b){
    b.value = notes[b.dataset.key] || &#x27;&#x27;;
    b.addEventListener(&#x27;input&#x27;, function(){
      notes[b.dataset.key] = b.value;
      try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
      refresh();
    });
  });

  document.getElementById(&#x27;copyall&#x27;).addEventListener(&#x27;click&#x27;, async function(){
    var lines = [];
    boxes.forEach(function(b){
      var t = (notes[b.dataset.key] || &#x27;&#x27;).trim();
      if (t) lines.push(&#x27;## &#x27; + b.dataset.key + &#x27;\n&#x27; + t);
    });
    var text = lines.length ? lines.join(&#x27;\n\n&#x27;) : &#x27;(no notes)&#x27;;
    var ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      var ta = document.createElement(&#x27;textarea&#x27;);
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand(&#x27;copy&#x27;); } catch (e2) {}
      ta.remove();
    }
    var btn = document.getElementById(&#x27;copyall&#x27;);
    var orig = btn.textContent;
    btn.textContent = ok ? &#x27;Copied!&#x27; : &#x27;Copy failed&#x27;;
    setTimeout(function(){ btn.textContent = orig; }, 1500);
  });

  refresh();

  // V3 collapsed → expanded demo
  var v3toggle = document.getElementById(&#x27;v3toggle&#x27;);
  var v3panel = document.getElementById(&#x27;v3panel&#x27;);
  var v3chev = document.getElementById(&#x27;v3chev&#x27;);
  v3toggle.addEventListener(&#x27;click&#x27;, function(){
    var open = v3panel.classList.toggle(&#x27;open&#x27;);
    v3chev.style.transform = open ? &#x27;rotate(180deg)&#x27; : &#x27;rotate(0)&#x27;;
  });
})();
&lt;/script&gt;

&lt;/body&gt;
