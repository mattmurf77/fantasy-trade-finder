<script id="pages" type="application/json">[{"label": "Trade DNA v3", "fb": "#212 #231 #206", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish Lab \u2014 Trade DNA &amp; Outlook V3 (#212 \u00b7 #231 \u00b7 #206)<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink0:#0C0E11; --ink1:#13161B; --ink2:#1A1E25; --ink3:#232833;\n  --line:#262C35; --lineStrong:#59647A;\n  --chalk:#ECEFF4; --dim:#97A1AE; --faint:#626C79;\n  --ice:#56D9EC; --icePress:#3FC2D6; --onIce:#071013;\n  --flare:#F0508C; --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n  --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n  --first1:#2dd4bf;\n  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;\n  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;\n  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:#07090c;color:var(--chalk);font-family:var(--f-ui);\n  display:flex;flex-direction:column;align-items:center;padding:24px 12px 64px;gap:22px;min-height:100vh}\n\n.note{max-width:840px;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:13px;line-height:1.55;color:var(--dim)}\n.note h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:22px;color:var(--chalk);margin-bottom:4px}\n.note h2{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:13px;color:var(--ice);margin:12px 0 4px}\n.note b{color:var(--chalk)}\n.note ul{margin:4px 0 0 18px} .note li{margin:3px 0}\n.q{border-left:3px solid var(--lineStrong);padding-left:10px;margin:6px 0;font-style:italic}\n\n.pairwrap{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}\n.slot{display:flex;flex-direction:column;gap:8px;align-items:center}\n.slotlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:7px}\n.slotlbl::before{content:\"\";width:3px;height:12px;background:var(--lineStrong)}\n.slot.proposed .slotlbl{color:var(--ice)} .slot.proposed .slotlbl::before{background:var(--ice)}\n.caption{max-width:390px;font-size:12px;line-height:1.5;color:var(--dim);text-align:left}\n\n/* mock annotation chips \u2014 meta, not UI */\n.hchip{font-family:var(--f-mono);font-size:11px;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:3px 9px;background:rgba(245,158,11,.06)}\n.hchip b{color:var(--warn);font-weight:600}\n\n.phone{width:390px;background:var(--ink0);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55)}\n.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:var(--dim);font-family:var(--f-mono)}\n.scroll{padding:4px 16px 14px;display:flex;flex-direction:column;gap:12px}\n/* both v3 phones share one fixed viewport so the fold story stays honest */\n.vp .scroll{height:600px;overflow:hidden;position:relative}\n.vp .scroll::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(transparent,var(--ink0))}\n/* the gradient above is a mockup viewport cue, not a UI gradient */\n.pagetitle{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:22px}\n.leaguepill{align-self:flex-start;display:flex;align-items:center;gap:6px;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--dim)}\n.leaguepill .dot{width:7px;height:7px;border-radius:999px;background:var(--ice)}\n.leaguepill b{color:var(--chalk);font-weight:600}\n\n/* ---- shared bits ---- */\n.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.pdot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;display:inline-block}\n.pos-qb{background:var(--qb)} .pos-rb{background:var(--rb)} .pos-wr{background:var(--wr)} .pos-te{background:var(--te)} .pos-pk{background:var(--first1)}\nsvg.ic{stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:square}\n.grouplbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);margin-top:4px}\n.grouplbl .ms{color:var(--ice)}\n.editbtn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--lineStrong);border-radius:4px;background:transparent;color:var(--chalk);font-family:var(--f-ui);font-size:13px;font-weight:600;cursor:pointer}\n.editbtn:hover{border-color:var(--ice)}\n.editbtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:square}\n.donebtn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 14px;border:none;border-radius:4px;background:var(--ice);color:var(--onIce);font-family:var(--f-ui);font-size:13px;font-weight:700;cursor:pointer}\n.donebtn:hover{background:var(--icePress)}\n\n.seclabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);margin-top:2px}\n.modecard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:12px;cursor:pointer}\n.modecard .icwell{width:40px;height:40px;border-radius:8px;background:var(--ink2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--ice)}\n.modecard .body{flex:1;min-width:0}\n.modecard .trow{display:flex;align-items:center;gap:8px}\n.modecard .t{font-size:16px;font-weight:600}\n.modecard .rec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--flare)}\n.modecard .d{font-size:13px;color:var(--dim);margin-top:1px;line-height:1.4}\n.modecard .chev{color:var(--faint);flex:0 0 auto}\n\n.tabbar{display:flex;border-top:1px solid var(--line);background:var(--ink1)}\n.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}\n.tab svg{width:20px;height:20px;stroke:var(--faint);stroke-width:1.75;fill:none;stroke-linecap:square}\n.tab.on{color:var(--ice)} .tab.on svg{stroke:var(--ice)}\n\n/* ---- collapsed panel (v3) ---- */\n.dna3{border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:10px 12px;display:flex;flex-direction:column;gap:8px}\n.dna3 .top{display:flex;align-items:center;justify-content:space-between}\n.outchip{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:var(--ink2);padding:4px 11px;font-size:12px;font-weight:600;color:var(--chalk)}\n.outchip .tick{width:3px;height:11px;background:var(--ice);flex:0 0 auto}\n.outchip .bias{color:var(--dim);font-weight:400}\n.sumline{display:flex;align-items:center;flex-wrap:wrap;gap:4px 7px;font-size:13px;color:var(--chalk);line-height:1.4}\n.sumline .k{color:var(--faint)}\n.sumline .sep{color:var(--faint)}\n.mini{display:inline-flex;align-items:center;gap:5px;font-weight:600}\n.mini .pdot{width:7px;height:7px}\n/* v3: untouchable mini-cards (collapsed only) */\n.untrow{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:12px}\n.untrow .k{color:var(--faint);margin-right:1px}\n.pchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;background:var(--ink2);padding:3px 9px;font-size:12px;font-weight:600;color:var(--chalk)}\n.pchip .dot6{width:6px;height:6px;border-radius:999px;flex:0 0 auto;display:inline-block}\n.untrow .more{color:var(--dim);font-family:var(--f-mono);font-weight:600}\n\n/* ---- expanded panel ---- */\n.dna2{border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:12px;display:flex;flex-direction:column;gap:10px}\n.dna2 .top{display:flex;align-items:center;justify-content:space-between}\n.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.outcard{border:1px solid var(--line);border-radius:8px;background:var(--ink2);padding:10px 10px 9px;cursor:pointer;position:relative}\n.outcard .t{font-size:14px;font-weight:600}\n.outcard .d{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.35}\n.outcard.sel{border-color:var(--ice)}\n.outcard.sel::after{content:\"\";position:absolute;top:8px;right:8px;width:3px;height:12px;background:var(--ice)}\n.outcard.sel .d{color:var(--chalk)}\n.outcard.tight{padding:8px 9px 7px}\n.outcard.tight .t{font-size:13px}\n.outgrid.tight{gap:6px}\n.togglerow{display:flex;gap:6px}\n.pt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}\n.ptb{width:100%;min-height:44px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:4px;border:1px solid var(--lineStrong);background:transparent;color:var(--chalk);font-family:var(--f-ui);font-size:13px;font-weight:600;cursor:pointer;padding:0 2px}\n.ptb:hover{background:var(--ink3)}\n.ptb .pdot{width:7px;height:7px}\n.ptb svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:square;flex:0 0 auto}\n.ptb.on{border-color:transparent;color:var(--onIce)}\n.ptb.on-qb{background:var(--qb)} .ptb.on-rb{background:var(--rb)} .ptb.on-wr{background:var(--wr);color:#04070C} .ptb.on-te{background:var(--te)} .ptb.on-pk{background:var(--first1)}\n.ptag{font-size:11px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;min-height:15px;line-height:15px;text-align:center}\n.ptag.need{color:var(--flare)} .ptag.deep{color:var(--dim)}\n.needkey{font-size:11px;color:var(--faint);line-height:1.45}\n.untline{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--chalk)}\n.untline .k{color:var(--faint)}\n.untline .n{font-family:var(--f-mono);font-weight:600}\n.untline .manage{margin-left:auto;color:var(--ice);font-weight:600;font-size:13px;cursor:pointer}\n\n/* ---- reference frame: deck + bias receipt (verbatim from v1/v2) ---- */\n.ref{zoom:.85}\n.modebar .back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ice);margin-bottom:8px}\n.swrow{display:flex;gap:6px;overflow:hidden}\n.sw{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink1);font-size:12px;color:var(--dim);min-height:32px;display:flex;align-items:center}\n.sw.on{border-color:var(--ice);background:var(--ink2);color:var(--chalk)}\n.receipt{display:flex;align-items:center;gap:8px;background:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12.5px;color:var(--dim)}\n.receipt .tick{width:3px;height:12px;background:var(--flare);flex:0 0 auto}\n.receipt b{color:var(--chalk);font-weight:600}\n.receipt .chg{margin-left:auto;color:var(--ice);font-weight:600;cursor:pointer;flex:0 0 auto}\n.tcard{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}\n.tcard .hdr .lbl{display:block}\n.tcard .opp{font-size:16px;font-weight:600;margin-top:1px}\n.strength{display:flex;flex-direction:column;gap:4px}\n.strength .row{display:flex;justify-content:space-between;align-items:baseline}\n.strength .val{font-family:var(--f-mono);font-size:13px}\n.track{height:4px;background:var(--ink3)}\n.track .fill{height:4px;background:var(--rb)}\n.split{display:flex;gap:12px}\n.split .vrule{width:1px;background:var(--line)}\n.side{flex:1;display:flex;flex-direction:column;gap:6px}\n.ticklbl{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.ticklbl::before{content:\"\";width:3px;height:12px;background:var(--ice)}\n.prow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-left:3px solid var(--wr);border-radius:8px;background:var(--ink2);padding:8px}\n.prow .nm{font-size:13px;font-weight:600;line-height:1.25}\n.prow .meta{font-size:11px;color:var(--dim);font-family:var(--f-mono)}\n.vbar{display:flex;flex-direction:column;gap:6px}\n.vbar .who{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:18px;color:var(--pos)}\n.vbar .margin{font-size:12px;color:var(--dim)}\n.vbar .margin b{font-family:var(--f-mono);color:var(--pos);font-weight:600}\n.vbar .pick{color:var(--first1);font-weight:600}\n.dtrack{position:relative;height:14px;background:var(--ink3);border-radius:2px;margin-top:2px}\n.dtrack .cen{position:absolute;left:50%;top:-4px;width:1px;height:22px;background:var(--lineStrong)}\n.dtrack .t1{position:absolute;left:21.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .t2{position:absolute;left:78.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .fillr{position:absolute;left:50%;width:11%;height:14px;background:var(--pos);border-radius:2px}\n.scalerow{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;color:var(--faint)}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"note\">\n  <h1>Polish Lab \u00b7 Trade DNA &amp; Outlook \u2014 V3 iteration (#212 \u00b7 #231 \u00b7 #206)<\/h1>\n  <p><b>Operator feedback on v2:<\/b><\/p>\n  <p class=\"q\">\"Perfect. Just confirm that both the initial and the edit screens support multiselect for trading for and away preferences. Also, the untouchable list should have the players present as little player cards with color coded dots for position next to the player name (only for the initial, collapsed version).\"<\/p>\n  <p style=\"margin-top:8px\"><b>V3 = v2 with two adjustments.<\/b> \u2460 Multi-select was already the v2 rule \u2014 this iteration makes it undeniable: the collapsed summary and the edit rows both show <b>multiple selections per row<\/b> (Chasing: WR + TE \u00b7 Shopping: QB + RB), and the editor carries an explicit <b>multi-select<\/b> caption. \u2461 The collapsed card's bare untouchables count is replaced with <b>player mini-cards<\/b> \u2014 6px position-color dot + name, wrapping row, capped at 3 + \"+2\". The mini-cards are <b>collapsed-only<\/b> per the operator; the expanded editor keeps v2's count + Manage line. Everything else \u2014 outlook cards, toggle mechanics, mutual exclusion, hint tags, the deck bias receipt \u2014 is v2 verbatim.<\/p>\n<\/div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 ROW 1 \u00b7 V3 collapsed + V3 expanded \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div class=\"pairwrap\">\n\n  <!-- V3 collapsed -->\n  <div class=\"slot proposed\">\n    <div class=\"slotlbl\">V3 \u2014 collapsed (default on entry)<\/div>\n    <div class=\"hchip\">\u2460 multi summary &nbsp;\u2461 untouchable mini-cards \u00b7 panel <b>140px<\/b> (v2: 111px, v1: 355px \u2014 measured)<\/div>\n    <div class=\"phone vp\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"pagetitle\">Find a Trade<\/div>\n        <div class=\"leaguepill\"><span class=\"dot\"><\/span>Trading in&nbsp;\u00b7&nbsp;<b>Dynasty Degens<\/b><\/div>\n\n        <div class=\"dna3\" id=\"v3collapsed\">\n          <div class=\"top\">\n            <span class=\"lbl\">Your Trade DNA<\/span>\n            <button class=\"editbtn\"><svg viewBox=\"0 0 20 20\"><path d=\"M13 3l4 4L7 17H3v-4z\"/><\/svg>Edit<\/button>\n          <\/div>\n          <div class=\"outchip\"><span class=\"tick\"><\/span>Rebuilding<span class=\"bias\">\u00b7&nbsp;leans young + picks<\/span><\/div>\n          <div class=\"sumline\">\n            <span class=\"k\">Chasing<\/span>\n            <span class=\"mini\"><span class=\"pdot pos-wr\"><\/span>WR<\/span>\n            <span class=\"mini\"><span class=\"pdot pos-te\"><\/span>TE<\/span>\n            <span class=\"sep\">\u2014<\/span>\n            <span class=\"k\">Shopping<\/span>\n            <span class=\"mini\"><span class=\"pdot pos-qb\"><\/span>QB<\/span>\n            <span class=\"mini\"><span class=\"pdot pos-rb\"><\/span>RB<\/span>\n          <\/div>\n          <div class=\"untrow\">\n            <span class=\"k\">Untouchables<\/span>\n            <span class=\"pchip\"><span class=\"dot6 pos-rb\"><\/span>Jeanty<\/span>\n            <span class=\"pchip\"><span class=\"dot6 pos-wr\"><\/span>Chase<\/span>\n            <span class=\"pchip\"><span class=\"dot6 pos-te\"><\/span>Bowers<\/span>\n            <span class=\"more\">+2<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"seclabel\">How do you want to find trades?<\/div>\n        <div class=\"modecard\">\n          <div class=\"icwell\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 20 20\"><path d=\"M3 14 6 6l4 5 4-7 3 10z\"/><\/svg><\/div>\n          <div class=\"body\">\n            <div class=\"trow\"><span class=\"t\">Fully Guided<\/span><span class=\"rec\">recommended<\/span><\/div>\n            <div class=\"d\">We read your roster &amp; league and walk you to the best deals.<\/div>\n          <\/div>\n          <svg class=\"ic chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n        <\/div>\n        <div class=\"modecard\">\n          <div class=\"icwell\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg><\/div>\n          <div class=\"body\">\n            <div class=\"trow\"><span class=\"t\">Specific Team<\/span><\/div>\n            <div class=\"d\">Target one league-mate and see only mutual-gain deals.<\/div>\n          <\/div>\n          <svg class=\"ic chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n        <\/div>\n        <div class=\"modecard\">\n          <div class=\"icwell\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><\/div>\n          <div class=\"body\">\n            <div class=\"trow\"><span class=\"t\">Specific Player<\/span><\/div>\n            <div class=\"d\">Trade for someone, away someone, or both \u2014 engine fills the rest.<\/div>\n          <\/div>\n          <svg class=\"ic chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n        <\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\"><b>\u2460 Multi-select, visible in the summary:<\/b> the chasing/shopping line lists <i>every<\/i> selected position (\"Chasing WR \u00b7 TE \u2014 Shopping QB \u00b7 RB\"), not one exemplar each \u2014 the line wraps if a row somehow carries all four. <b>\u2461 Untouchable mini-cards (collapsed only):<\/b> compact pill chips \u2014 6px round position-color dot + last name \u2014 replace the bare count. Capped at 3 chips + a mono \"+2\" overflow chip; the row wraps if names run long. All three mode cards still clear the 600px fold. Nothing in the summary is tappable \u2014 Edit (or the card itself) remains the single affordance.<\/div>\n  <\/div>\n\n  <!-- V3 expanded -->\n  <div class=\"slot proposed\">\n    <div class=\"slotlbl\">V3 \u2014 tap Edit \u2192 expands in place<\/div>\n    <div class=\"hchip\">\u2460 two filled toggles per row + <b>multi-select<\/b> caption \u00b7 editor <b>498px<\/b> (measured)<\/div>\n    <div class=\"phone vp\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"pagetitle\">Find a Trade<\/div>\n        <div class=\"leaguepill\"><span class=\"dot\"><\/span>Trading in&nbsp;\u00b7&nbsp;<b>Dynasty Degens<\/b><\/div>\n\n        <div class=\"dna2\" id=\"v3expanded\">\n          <div class=\"top\">\n            <span class=\"lbl\">Your Trade DNA<\/span>\n            <button class=\"donebtn\"><svg viewBox=\"0 0 20 20\" style=\"width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:square\"><path d=\"M4 11l4 4 8-10\"/><\/svg>Done<\/button>\n          <\/div>\n\n          <div class=\"grouplbl\" style=\"margin-top:0\">My team is\u2026<\/div>\n          <div class=\"outgrid tight\">\n            <div class=\"outcard tight sel\"><div class=\"t\">Rebuilding<\/div><div class=\"d\">Leans young + picks<\/div><\/div>\n            <div class=\"outcard tight\"><div class=\"t\">Contending<\/div><div class=\"d\">Balanced moves<\/div><\/div>\n            <div class=\"outcard tight\"><div class=\"t\">All-in<\/div><div class=\"d\">Win now, spend picks<\/div><\/div>\n            <div class=\"outcard tight\"><div class=\"t\">Tanking<\/div><div class=\"d\">Max youth, high picks<\/div><\/div>\n          <\/div>\n\n          <div class=\"grouplbl\">Chasing \u2014 tap all that apply <span class=\"ms\">\u00b7 multi-select<\/span><\/div>\n          <div class=\"togglerow\">\n            <div class=\"pt\">\n              <button class=\"ptb\"><span class=\"pdot pos-qb\"><\/span>QB<\/button>\n              <span class=\"ptag\"><\/span>\n            <\/div>\n            <div class=\"pt\">\n              <button class=\"ptb\"><span class=\"pdot pos-rb\"><\/span>RB<\/button>\n              <span class=\"ptag\"><\/span>\n            <\/div>\n            <div class=\"pt\">\n              <button class=\"ptb on on-wr\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 11l4 4 8-10\"/><\/svg>WR<\/button>\n              <span class=\"ptag deep\">Depth<\/span>\n            <\/div>\n            <div class=\"pt\">\n              <button class=\"ptb on on-te\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 11l4 4 8-10\"/><\/svg>TE<\/button>\n              <span class=\"ptag need\">Need<\/span>\n            <\/div>\n            <div class=\"pt\">\n              <button class=\"ptb\"><span class=\"pdot pos-pk\"><\/span>Picks<\/button>\n              <span class=\"ptag\"><\/span>\n            <\/div>\n          <\/div>\n\n          <div class=\"grouplbl\" style=\"margin-top:0\">Shopping \u2014 tap all that apply <span class=\"ms\">\u00b7 multi-select<\/span><\/div>\n          <div class=\"togglerow\">\n            <div class=\"pt\">\n              <button class=\"ptb on on-qb\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 11l4 4 8-10\"/><\/svg>QB<\/button>\n              <span class=\"ptag\"><\/span>\n            <\/div>\n            <div class=\"pt\">\n              <button class=\"ptb on on-rb\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 11l4 4 8-10\"/><\/svg>RB<\/button>\n              <span class=\"ptag deep\">Deep<\/span>\n            <\/div>\n            <div class=\"pt\">\n              <button class=\"ptb\"><span class=\"pdot pos-wr\"><\/span>WR<\/button>\n              <span class=\"ptag\"><\/span>\n            <\/div>\n            <div class=\"pt\">\n              <button class=\"ptb\"><span class=\"pdot pos-te\"><\/span>TE<\/button>\n              <span class=\"ptag\"><\/span>\n            <\/div>\n            <div class=\"pt\">\n              <button class=\"ptb\"><span class=\"pdot pos-pk\"><\/span>Picks<\/button>\n              <span class=\"ptag\"><\/span>\n            <\/div>\n          <\/div>\n\n          <div class=\"needkey\">Pick as many per row as apply \u2014 every toggle is independent. A position still can't be both chased and shopped: tapping it on one row clears it on the other. Need = hole in your starting lineup \u00b7 Depth/Deep = bench strength; tags are hints from your roster scan, not selections.<\/div>\n\n          <div class=\"untline\">\n            <span class=\"k\">Untouchables<\/span><span class=\"n\">5<\/span><span style=\"color:var(--dim)\">protected<\/span>\n            <span class=\"manage\">Manage<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"seclabel\">How do you want to find trades?<\/div>\n        <div class=\"modecard\">\n          <div class=\"icwell\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 20 20\"><path d=\"M3 14 6 6l4 5 4-7 3 10z\"/><\/svg><\/div>\n          <div class=\"body\">\n            <div class=\"trow\"><span class=\"t\">Fully Guided<\/span><span class=\"rec\">recommended<\/span><\/div>\n            <div class=\"d\">We read your roster &amp; league and walk you to the best deals.<\/div>\n          <\/div>\n          <svg class=\"ic chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n        <\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\"><b>\u2460 Multi-select demonstrated:<\/b> Chasing carries two filled toggles (WR blue + TE purple) and Shopping carries two (QB orange + RB green) \u2014 each row's toggles are independent checkboxes, not radios, and the ice \"\u00b7 multi-select\" caption on both group labels says so in the UI itself. Mutual exclusion across rows is unchanged from v2. <b>\u2461 Expanded untouchables keep v2's treatment<\/b> \u2014 count + Manage link only; the mini-cards are the collapsed card's job (operator: \"only for the initial, collapsed version\"). Managing the list stays behind Manage, where full player rows with search live.<\/div>\n  <\/div>\n<\/div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 ROW 2 \u00b7 reference: deck bias receipt (unchanged) \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div class=\"pairwrap\">\n  <div class=\"slot\">\n    <div class=\"slotlbl\">Reference \u2014 deck bias receipt (unchanged, approved in v1)<\/div>\n    <div class=\"ref\">\n    <div class=\"phone\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"modebar\">\n          <div class=\"back\"><svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Hub<\/div>\n          <div class=\"swrow\">\n            <span class=\"sw on\">Guided<\/span><span class=\"sw\">Team<\/span><span class=\"sw\">Player<\/span><span class=\"sw\">Calc<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"receipt\">\n          <span class=\"tick\"><\/span>\n          <span>Leaning <b>young + picks<\/b> \u2014 you're <b>Rebuilding<\/b>.<\/span>\n          <span class=\"chg\">Change<\/span>\n        <\/div>\n\n        <div class=\"tcard\">\n          <div class=\"hdr\">\n            <span class=\"lbl\">Trade with<\/span>\n            <div class=\"opp\">@rebuild_randy<\/div>\n          <\/div>\n          <div class=\"strength\">\n            <div class=\"row\"><span class=\"lbl\">Match strength<\/span><span class=\"val\">78<\/span><\/div>\n            <div class=\"track\"><div class=\"fill\" style=\"width:78%\"><\/div><\/div>\n          <\/div>\n          <div class=\"split\">\n            <div class=\"side\">\n              <div class=\"ticklbl\">You send<\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--rb)\"><div><div class=\"nm\">Breece Hall<\/div><div class=\"meta\">RB \u00b7 NYJ<\/div><\/div><\/div>\n            <\/div>\n            <div class=\"vrule\"><\/div>\n            <div class=\"side\">\n              <div class=\"ticklbl\">You get<\/div>\n              <div class=\"prow\"><div><div class=\"nm\">Marvin Harrison Jr.<\/div><div class=\"meta\">WR \u00b7 ARI \u00b7 23 yrs<\/div><\/div><\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--first1)\"><div><div class=\"nm\">2027 2nd (mid)<\/div><div class=\"meta\">PICK<\/div><\/div><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"vbar\">\n            <span class=\"lbl\">Dynasty value swing<\/span>\n            <div class=\"who\">You win<\/div>\n            <div class=\"margin\">by <b>+380<\/b> &nbsp;\u00b7&nbsp; <span class=\"pick\">a Mid 3rd<\/span> (\u2248 0.2 firsts)<\/div>\n            <div class=\"dtrack\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"fillr\"><\/div><div class=\"cen\"><\/div><\/div>\n            <div class=\"scalerow\"><span>\u22121st<\/span><span>\u22122nd<\/span><span>Even<\/span><span>+2nd<\/span><span>+1st<\/span><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <\/div>\n    <div class=\"caption\">Approved in v1, untouched through v2 and v3: one receipt line above the deck connects its shape to the outlook, with an ice <b>Change<\/b> link back to the panel (lands on the compact card, auto-expands the editor).<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"note\">\n  <h2>V3 rationale \u2014 what changed from v2<\/h2>\n  <ul>\n    <li><b>Multi-select made undeniable (operator confirm).<\/b> It was always the v2 spec (\"multi-select within a row is fine\") but v2's frames showed one selection per row, which read as radio behavior. V3 demonstrates it in both states: collapsed lists every selection (\"Chasing WR \u00b7 TE \u2014 Shopping QB \u00b7 RB\"), expanded shows two filled toggles per row, and both group labels now carry an in-UI \"\u00b7 multi-select\" caption so the rule survives without this document.<\/li>\n    <li><b>Untouchable mini-cards, collapsed only (operator ask).<\/b> The bare count told you protection existed but not <i>who<\/i> \u2014 the one fact you actually want at a glance before shopping a player. Mini-cards are read-only pill chips: 6px round position-color dot + last name, ink-2 fill, hairline border. Capped at 3 + a mono \"+N\" chip so a 10-player list can't blow up the compact card; the row wraps under long names. Not tappable \u2014 Edit stays the panel's single affordance.<\/li>\n    <li><b>Expanded keeps the count.<\/b> Per the operator the mini-cards are for the initial, collapsed version only \u2014 the editor keeps v2's \"Untouchables 5 protected \u00b7 Manage\" line. Duplicating the chips there would just pad the editor's height for a list you manage behind Manage anyway.<\/li>\n    <li><b>Cost of the chips: +29px.<\/b> Collapsed grows from v2's 111px to 140px (measured) \u2014 still \u221261% vs v1's 355px, and all three finder modes stay above the 600px fold with room to spare.<\/li>\n    <li><b>Position color is never the only encoding.<\/b> Chip dots pair with the name, and position is recoverable in Manage; summary minis keep their QB/RB/WR/TE text labels, per the a11y floor.<\/li>\n    <li><b>Everything else is v2 verbatim.<\/b> Outlook chip + tight cards, toggle fill/check mechanics, chase/shop mutual exclusion, passive NEED/DEPTH tags, the WR-fill contrast build note, and the deck bias receipt.<\/li>\n  <\/ul>\n<\/div>\n\n<\/body>\n<\/html>\n"}, {"label": "Find-a-trade v3", "fb": "#216 #209", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish Lab \u2014 Find-a-Trade-for-Player Layout v3 (#216 \u00b7 #209 iteration)<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink0:#0C0E11; --ink1:#13161B; --ink2:#1A1E25; --ink3:#232833;\n  --line:#262C35; --lineStrong:#59647A;\n  --chalk:#ECEFF4; --dim:#97A1AE; --faint:#626C79;\n  --ice:#56D9EC; --icePress:#3FC2D6; --onIce:#071013;\n  --flare:#F0508C; --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n  --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n  --first1:#2dd4bf;\n  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;\n  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;\n  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:#07090c;color:var(--chalk);font-family:var(--f-ui);\n  display:flex;flex-direction:column;align-items:center;padding:24px 12px 64px;gap:22px;min-height:100vh}\n\n.note{max-width:840px;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:13px;line-height:1.55;color:var(--dim)}\n.note h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:22px;color:var(--chalk);margin-bottom:4px}\n.note h2{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:13px;color:var(--ice);margin:12px 0 4px}\n.note b{color:var(--chalk)}\n.note ul{margin:4px 0 0 18px} .note li{margin:3px 0}\n.q{border-left:3px solid var(--lineStrong);padding-left:10px;margin:6px 0;font-style:italic}\n\n.pairwrap{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}\n.slot{display:flex;flex-direction:column;gap:8px;align-items:center}\n.slotlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ice);display:flex;align-items:center;gap:7px}\n.slotlbl::before{content:\"\";width:3px;height:12px;background:var(--ice)}\n.caption{max-width:390px;font-size:12px;line-height:1.5;color:var(--dim);text-align:left}\n.caption b{color:var(--chalk)}\n\n.phone{width:390px;background:var(--ink0);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55)}\n.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:var(--dim);font-family:var(--f-mono)}\n.scroll{padding:4px 16px 14px;display:flex;flex-direction:column;gap:12px;height:648px;overflow-y:auto}\n/* fixed-height scrollable viewport so the demo behaves like a phone */\n\n.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.pdot{width:7px;height:7px;border-radius:2px;flex:0 0 auto;display:inline-block}\n.pos-qb{background:var(--qb)} .pos-rb{background:var(--rb)} .pos-wr{background:var(--wr)} .pos-te{background:var(--te)}\nsvg.ic{stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:square}\n\n/* mode bar */\n.back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ice);margin-bottom:8px}\n.swrow{display:flex;gap:6px;overflow:hidden}\n.sw{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink1);font-size:12px;color:var(--dim);min-height:32px;display:flex;align-items:center}\n.sw.on{border-color:var(--ice);background:var(--ink2);color:var(--chalk)}\n\n/* pin board (#209 order: away left, for right) */\n.ctrlcard{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}\n.board{display:flex;gap:8px}\n.col{flex:1;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:8px}\n.col.for{border-top:2px solid var(--pos)} .col.away{border-top:2px solid var(--flare)}\n.colh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}\n.col.for .colh{color:var(--pos)} .col.away .colh{color:var(--flare)}\n.mini{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 8px;border-radius:4px;background:var(--ink2);font-size:12.5px;font-weight:600}\n.mini .x{margin-left:auto;color:var(--faint);font-size:12px}\n.addbtn{min-height:40px;border:1px dashed var(--lineStrong);background:transparent;color:var(--dim);border-radius:4px;font-size:12px;font-family:var(--f-ui);cursor:pointer}\n\n/* \u2550\u2550\u2550 featured trade window \u2550\u2550\u2550 */\n.tcard{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}\n.ticklbl{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.ticklbl::before{content:\"\";width:3px;height:12px;background:var(--ice)}\n.backchip{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 10px 0 6px;border:1px solid var(--lineStrong);border-radius:4px;background:var(--ink2);color:var(--ice);font-family:var(--f-ui);font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto;align-self:flex-start}\n.backchip:hover{background:var(--ink3);border-color:var(--ice)}\n.backchip:active{background:var(--ink3);color:var(--icePress)}\n.backchip svg{width:12px;height:12px}\n/* Variant A: chip on its own row above the header (standard) */\n.backrow{display:flex;margin-bottom:-2px}\n.backrow[hidden]{display:none}\n/* Variant B: chip inside the header row, label pushed right (denser) */\n.fwheadB{display:flex;align-items:center;justify-content:space-between;gap:8px}\n.tcard .opp{font-size:16px;font-weight:600;margin-top:1px}\n.split{display:flex;gap:12px}\n.split .vrule{width:1px;background:var(--line)}\n.side{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}\n.prow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-left:3px solid var(--rb);border-radius:8px;background:var(--ink2);padding:8px}\n.prow .nm{font-size:13px;font-weight:600;line-height:1.25}\n.prow .meta{font-size:11px;color:var(--dim);font-family:var(--f-mono)}\n\n/* Dynasty Value Swing verdict (v2 format, carried forward verbatim) */\n.vbar{display:flex;flex-direction:column;gap:6px}\n.vbar .who{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:18px;color:var(--pos)}\n.vbar .who.neg{color:var(--neg)}\n.vbar .margin{font-size:12px;color:var(--dim)}\n.vbar .margin b{font-family:var(--f-mono);color:var(--pos);font-weight:600}\n.vbar .margin b.neg{color:var(--neg)}\n.vbar .pick{color:var(--first1);font-weight:600}\n.dtrack{position:relative;height:14px;background:var(--ink3);border-radius:2px;margin-top:2px}\n.dtrack .cen{position:absolute;left:50%;top:-4px;width:1px;height:22px;background:var(--lineStrong)}\n.dtrack .t1{position:absolute;left:21.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .t2{position:absolute;left:78.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .fillr{position:absolute;height:14px;background:var(--pos);border-radius:2px}\n.scalerow{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;color:var(--faint)}\n\n/* \u2550\u2550\u2550 \"More trades\" list \u2014 rows are tappable cards \u2550\u2550\u2550 */\n.ideas{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}\n.grouph{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);margin-top:8px}\n.idea{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px;border:1px solid var(--line);border-radius:2px;background:var(--ink1);\n  font-family:var(--f-ui);color:var(--chalk);text-align:left;cursor:pointer}\n.idea:hover{background:var(--ink2);border-color:var(--lineStrong)}\n.idea:active{background:var(--ink3);border-color:var(--lineStrong)}          /* pressed: surface + border shift, no lift */\n.idea:focus-visible,.backchip:focus-visible{outline:2px solid var(--ice);outline-offset:2px}\n.idea .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}\n.idea .sides{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}\n.idea .sides svg{flex:0 0 auto;color:var(--faint)}\n.idea .meta{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}\n.diff{padding:2px 8px;border-radius:2px;border:1px solid rgba(34,197,94,.4);font-family:var(--f-mono);font-size:12px;color:var(--pos);flex:0 0 auto}\n.diff.neg{border-color:rgba(239,68,68,.4);color:var(--neg)}\n.idea .go{flex:0 0 auto;color:var(--faint)}\n.idea:hover .go{color:var(--ice)}\n.idea.featured{border-color:var(--ice);background:var(--ink2);cursor:default}\n.idea.featured .go{display:none}\n.intag{display:none;flex:0 0 auto;padding:2px 6px;border-radius:2px;background:var(--ink3);border:1px solid var(--line);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ice);font-weight:600}\n.idea.featured .intag{display:inline-block}\n\n.tabbar{display:flex;border-top:1px solid var(--line);background:var(--ink1)}\n.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}\n.tab svg{width:20px;height:20px;stroke:var(--faint);stroke-width:1.75;fill:none;stroke-linecap:square}\n.tab.on{color:var(--ice)} .tab.on svg{stroke:var(--ice)}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"note\">\n  <h1>Polish Lab \u00b7 Find-a-Trade-for-Player v3 \u2014 operator iteration on v2<\/h1>\n  <p><b>Operator feedback on v2 (verbatim):<\/b><\/p>\n  <p class=\"q\">\"Remove the player name from the 'Featured Trade' header. Present the previous trade button in the top left (either above or below it. Not sure so draft both options - or just tell me what is the common approach.\"<\/p>\n  <p style=\"margin-top:8px\"><b>What changed from v2:<\/b> the featured-window header is now just <b>Featured trade<\/b> \u2014 the \"\u00b7 Breece Hall\" suffix is gone (the pinned player is already visible in the pin board and inside the trade itself). The <b>\u2039 Previous trade<\/b> chip moves from the top-right corner to the <b>top left<\/b>, drafted both ways: <b>Variant A<\/b> puts the chip on its own slim row <b>above<\/b> the header (the standard); <b>Variant B<\/b> puts it <b>in<\/b> the header row, left-aligned, with the label pushed right (denser). Frame 1 below is the <b>live demo \u2014 tap the rows<\/b>; frames 2\u20133 are static post-tap snapshots of A and B.<\/p>\n<\/div>\n\n<div class=\"pairwrap\">\n\n  <!-- \u2550\u2550\u2550 FRAME 1 \u00b7 Variant A, default state (interactive) \u2550\u2550\u2550 -->\n  <div class=\"slot\">\n    <div class=\"slotlbl\">V3 Variant A \u2014 chip above the header (live demo: tap the rows)<\/div>\n    <div class=\"phone\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\" id=\"demoScroll\">\n        <div class=\"back\"><svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Hub<\/div>\n        <div class=\"swrow\">\n          <span class=\"sw\">Guided<\/span><span class=\"sw\">Team<\/span><span class=\"sw on\">Player<\/span><span class=\"sw\">Calc<\/span>\n        <\/div>\n\n        <div class=\"ctrlcard\">\n          <div class=\"board\">\n            <div class=\"col away\">\n              <div class=\"colh\">Trade away<\/div>\n              <div class=\"mini\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<span class=\"x\">\u2715<\/span><\/div>\n              <button class=\"addbtn\">+ Add asset<\/button>\n            <\/div>\n            <div class=\"col for\">\n              <div class=\"colh\">Trade for<\/div>\n              <button class=\"addbtn\">+ Add target<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- featured trade window \u00b7 variant A: back chip on its own row above the header -->\n        <div class=\"tcard\" id=\"fw\">\n          <div class=\"backrow\" id=\"backRow\" hidden>\n            <button class=\"backchip\" id=\"backChip\" aria-label=\"Back to previous trade\">\n              <svg class=\"ic\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Previous trade\n            <\/button>\n          <\/div>\n          <div class=\"ticklbl\">Featured trade<\/div>\n          <div class=\"opp\" id=\"fwOpp\"><\/div>\n          <div class=\"split\">\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade away<\/div>\n              <div style=\"display:flex;flex-direction:column;gap:6px\" id=\"fwAway\"><\/div>\n            <\/div>\n            <div class=\"vrule\"><\/div>\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade for<\/div>\n              <div style=\"display:flex;flex-direction:column;gap:6px\" id=\"fwGet\"><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"vbar\">\n            <span class=\"lbl\">Dynasty value swing<\/span>\n            <div class=\"who\" id=\"fwWho\"><\/div>\n            <div class=\"margin\" id=\"fwMargin\"><\/div>\n            <div class=\"dtrack\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"fillr\" id=\"fwFill\"><\/div><div class=\"cen\"><\/div><\/div>\n            <div class=\"scalerow\"><span>\u22121st<\/span><span>\u22122nd<\/span><span>Even<\/span><span>+2nd<\/span><span>+1st<\/span><\/div>\n          <\/div>\n        <\/div>\n\n        <!-- more trades \u2014 visible by default, rows tappable -->\n        <div class=\"ideas\" id=\"demoList\">\n          <div class=\"ticklbl\">More trades for Breece Hall<\/div>\n\n          <div class=\"grouph\">Upgrade at RB<\/div>\n          <button class=\"idea\" data-id=\"up1\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Hall + 2026 2nd<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Bijan Robinson<\/div>\n              <div class=\"meta\">DynastyDan<\/div>\n            <\/div>\n            <span class=\"diff\">+440<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n          <button class=\"idea\" data-id=\"up2\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Hall + R. White<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Jahmyr Gibbs<\/div>\n              <div class=\"meta\">tundra_tim<\/div>\n            <\/div>\n            <span class=\"diff\">+310<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n\n          <div class=\"grouph\">Lateral moves at RB<\/div>\n          <button class=\"idea\" data-id=\"lat1\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Jonathan Taylor<\/div>\n              <div class=\"meta\">gridiron_gus<\/div>\n            <\/div>\n            <span class=\"diff neg\">\u2212150<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n\n          <div class=\"grouph\">Downgrade ideas<\/div>\n          <button class=\"idea\" data-id=\"best\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Cook + 2027 1st<\/div>\n              <div class=\"meta\">rebuild_randy<\/div>\n            <\/div>\n            <span class=\"diff\">+520<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n          <button class=\"idea\" data-id=\"down2\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Wright + 2026 1st<\/div>\n              <div class=\"meta\">TankCommand<\/div>\n            <\/div>\n            <span class=\"diff\">+380<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n        <\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\"><b>Variant A, default state.<\/b> Header reads just <b>Featured trade<\/b> \u2014 no player name. <b>This frame is interactive:<\/b> tap any row to load that trade into the window above; once there's history, the \u2039 Previous trade chip appears on its own slim row at the <b>top left, above the header<\/b>, and the whole card grows by one 28px row. When history empties the row collapses again \u2014 no dead reserved space.<\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550 FRAME 2 \u00b7 Variant A, post-tap (static snapshot) \u2550\u2550\u2550 -->\n  <div class=\"slot\">\n    <div class=\"slotlbl\">V3 Variant A \u2014 post-tap state (static snapshot)<\/div>\n    <div class=\"phone\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"back\"><svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Hub<\/div>\n        <div class=\"swrow\">\n          <span class=\"sw\">Guided<\/span><span class=\"sw\">Team<\/span><span class=\"sw on\">Player<\/span><span class=\"sw\">Calc<\/span>\n        <\/div>\n\n        <div class=\"ctrlcard\">\n          <div class=\"board\">\n            <div class=\"col away\">\n              <div class=\"colh\">Trade away<\/div>\n              <div class=\"mini\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<span class=\"x\">\u2715<\/span><\/div>\n              <button class=\"addbtn\">+ Add asset<\/button>\n            <\/div>\n            <div class=\"col for\">\n              <div class=\"colh\">Trade for<\/div>\n              <button class=\"addbtn\">+ Add target<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"tcard\">\n          <div class=\"backrow\">\n            <button class=\"backchip\">\n              <svg class=\"ic\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Previous trade\n            <\/button>\n          <\/div>\n          <div class=\"ticklbl\">Featured trade<\/div>\n          <div class=\"opp\">@TankCommand<\/div>\n          <div class=\"split\">\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade away<\/div>\n              <div class=\"prow\"><div><div class=\"nm\">Breece Hall<\/div><div class=\"meta\">RB \u00b7 NYJ<\/div><\/div><\/div>\n            <\/div>\n            <div class=\"vrule\"><\/div>\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade for<\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--rb)\"><div><div class=\"nm\">Jaylen Wright<\/div><div class=\"meta\">RB \u00b7 MIA<\/div><\/div><\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--first1)\"><div><div class=\"nm\">2026 1st (early)<\/div><div class=\"meta\">PICK<\/div><\/div><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"vbar\">\n            <span class=\"lbl\">Dynasty value swing<\/span>\n pan><span>Even<\/span><span>+2nd<\/span><span>+1st<\/span><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"ideas\">\n          <div class=\"ticklbl\">More trades for Breece Hall<\/div>\n\n          <div class=\"grouph\">Downgrade ideas<\/div>\n          <button class=\"idea\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Cook + 2027 1st<\/div>\n              <div class=\"meta\">rebuild_randy<\/div>\n            <\/div>\n            <span class=\"diff\">+520<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n          <button class=\"idea featured\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Wright + 2026 1st<\/div>\n              <div class=\"meta\">TankCommand<\/div>\n            <\/div>\n            <span class=\"diff\">+380<\/span><span class=\"intag\">In window<\/span>\n            <svg class=\"ic go\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n          <\/button>\n        <\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\"><b>Variant B, post-tap (static).<\/b> Same state, but the chip shares the header row: chip left, <b>Featured trade<\/b> label pushed right. One row shorter than A, at a cost \u2014 the section label leaves the left edge where every other Chalkline tick-label sits, and when the chip is hidden (no history) the label either snaps back left or stays orphaned right; either way the header jumps.<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"note\">\n  <h2>Back-chip placement \u2014 the common approach, honestly<\/h2>\n  <ul>\n    <li><b>The convention: back affordances sit at the top left, ABOVE the content they revert.<\/b> iOS puts Back at the leading edge of the navigation bar, its own strip above the page; Android's app bar does the same. Users reach top-left expecting \"take me back one step\" without reading. <b>Variant A follows that convention;<\/b> Variant B is the denser non-standard cousin.<\/li>\n    <li><b>Recommendation: Variant A.<\/b> It costs one 28px row (only while history exists \u2014 the row collapses when the stack is empty), keeps the Featured-trade tick-label in the same left-aligned position as every other section label on the screen, and the header never reflows when the chip appears/disappears. B saves that row but makes the header the only right-aligned tick-label in the app and shifts layout on chip show/hide.<\/li>\n    <li><b>Header de-named:<\/b> \"Featured trade \u00b7 Breece Hall\" \u2192 <b>Featured trade<\/b>. The pinned player already appears in the pin board directly above and on the Trade-away side of every trade in the window \u2014 the header repeat was noise.<\/li>\n  <\/ul>\n  <h2>Carried forward from v2 (unchanged)<\/h2>\n  <ul>\n    <li><b>Tap a row \u2192 it becomes the featured trade;<\/b> the replaced trade becomes the back target; full per-pin history (reset on pin change); the in-window row is tagged and inert; Dynasty Value Swing verdict is the calc presentation for every trade in the window; #209 give-left/get-right order holds everywhere.<\/li>\n    <li><b>The back chip stays part of the FeaturedTradeWindow pattern by default<\/b> \u2014 any surface that swaps a trade into the window gets the same revert affordance; it renders only when history exists.<\/li>\n  <\/ul>\n<\/div>\n\n<script>\n(function(){\n  var T = {\n    best:{opp:'@rebuild_randy',\n      away:[{nm:'Breece Hall',meta:'RB \u00b7 NYJ',c:'var(--rb)'}],\n      get:[{nm:'James Cook',meta:'RB \u00b7 BUF',c:'var(--rb)'},{nm:'2027 1st (mid)',meta:'PICK',c:'var(--first1)'}],\n      who:'You win',neg:false,margin:'+520',pick:'a Mid 3rd',firsts:'\u2248 0.3 firsts',fill:13},\n    up1:{opp:'@DynastyDan',\n      away:[{nm:'Breece Hall',meta:'RB \u00b7 NYJ',c:'var(--rb)'},{nm:'2026 2nd (own)',meta:'PICK',c:'var(--first1)'}],\n      get:[{nm:'Bijan Robinson',meta:'RB \u00b7 ATL',c:'var(--rb)'}],\n      who:'You win',neg:false,margin:'+440',pick:'a Late 3rd',firsts:'\u2248 0.25 firsts',fill:12},\n    up2:{opp:'@tundra_tim',\n      away:[{nm:'Breece Hall',meta:'RB \u00b7 NYJ',c:'var(--rb)'},{nm:'Rachaad White',meta:'RB \u00b7 TB',c:'var(--rb)'}],\n      get:[{nm:'Jahmyr Gibbs',meta:'RB \u00b7 DET',c:'var(--rb)'}],\n      who:'You win',neg:false,margin:'+310',pick:'a Mid 4th',firsts:'\u2248 0.18 firsts',fill:9},\n    lat1:{opp:'@gridiron_gus',\n      away:[{nm:'Breece Hall',meta:'RB \u00b7 NYJ',c:'var(--rb)'}],\n      get:[{nm:'Jonathan Taylor',meta:'RB \u00b7 IND',c:'var(--rb)'}],\n      who:'They win',neg:true,margin:'\u2212150',pick:'a Late 4th',firsts:'\u2248 0.09 firsts',fill:4},\n    down2:{opp:'@TankCommand',\n      away:[{nm:'Breece Hall',meta:'RB \u00b7 NYJ',c:'var(--rb)'}],\n      get:[{nm:'Jaylen Wright',meta:'RB \u00b7 MIA',c:'var(--rb)'},{nm:'2026 1st (early)',meta:'PICK',c:'var(--first1)'}],\n      who:'You win',neg:false,margin:'+380',pick:'an Early 4th',firsts:'\u2248 0.22 firsts',fill:11}\n  };\n  var cur='best', stack=[];\n  function prow(a){return '<div class=\"prow\" style=\"border-left-color:'+a.c+'\"><div><div class=\"nm\">'+a.nm+'<\/div><div class=\"meta\">'+a.meta+'<\/div><\/div><\/div>';}\n  function render(scroll){\n    var t=T[cur];\n    document.getElementById('fwOpp').textContent=t.opp;\n    document.getElementById('fwAway').innerHTML=t.away.map(prow).join('');\n    document.getElementById('fwGet').innerHTML=t.get.map(prow).join('');\n    var who=document.getElementById('fwWho');\n    who.textContent=t.who; who.className='who'+(t.neg?' neg':'');\n    document.getElementById('fwMargin').innerHTML='by <b class=\"'+(t.neg?'neg':'')+'\">'+t.margin+'<\/b> &nbsp;\u00b7&nbsp; <span class=\"pick\">'+t.pick+'<\/span> ('+t.firsts+')';\n    var f=document.getElementById('fwFill');\n    if(t.neg){f.style.left='calc(50% - '+t.fill+'%)';f.style.width=t.fill+'%';f.style.background='var(--neg)';}\n    else{f.style.left='50%';f.style.width=t.fill+'%';f.style.background='var(--pos)';}\n    /* v3: the back chip lives on its own row ABOVE the header (variant A);\n       the whole row hides when there is no history so no dead space is reserved */\n    document.getElementById('backRow').hidden = stack.length===0;\n    var rows=document.querySelectorAll('#demoList .idea');\n    for(var i=0;i<rows.length;i++){rows[i].classList.toggle('featured', rows[i].getAttribute('data-id')===cur);}\n    if(scroll){document.getElementById('demoScroll').scrollTo({top:0,behavior:'smooth'});}\n  }\n  document.getElementById('demoList').addEventListener('click',function(e){\n    var btn=e.target.closest('.idea'); if(!btn) return;\n    var id=btn.getAttribute('data-id');\n    if(!id||id===cur) return;\n    stack.push(cur); cur=id; render(true);\n  });\n  document.getElementById('backChip').addEventListener('click',function(){\n    if(!stack.length) return;\n    cur=stack.pop(); render(true);\n  });\n  render(false);\n})();\n<\/script>\n\n<\/body>\n<\/html>\n"}, {"label": "Empty states v3", "fb": "#229 #230 #234", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish lab \u2014 Empty states &amp; progress v3 (#229 \u00b7 #230 \u00b7 #234)<\/title>\n<style>\n  /* \u2500\u2500 Chalkline tokens (docs/design/design-system.md, ADR-005) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     Canonical hexes; --line-strong is the 2026-07-19 a11y value #59647A.\n     Fonts fall back to Arial Narrow / Helvetica / Menlo \u2014 no external requests. */\n  :root{\n    --ink-0:#0C0E11; --ink-1:#13161B; --ink-2:#1A1E25; --ink-3:#232833;\n    --line:#262C35;  --line-strong:#59647A;\n    --chalk:#ECEFF4; --chalk-dim:#97A1AE; --chalk-faint:#626C79;\n    --ice:#56D9EC; --ice-press:#3FC2D6; --on-ice:#071013; --flare:#F0508C;\n    --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n    --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n    --tier-1st:#2DD4BF;\n    --cond:'Barlow Condensed','Arial Narrow',sans-serif;\n    --ui:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;\n    --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--ink-0);color:var(--chalk);font-family:var(--ui);\n       -webkit-font-smoothing:antialiased;padding:24px 16px 64px}\n  .wrap{max-width:880px;margin:0 auto}\n\n  .note{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;\n        padding:16px 20px;margin-bottom:24px}\n  .note h1{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1;\n           letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;display:flex;\n           align-items:center;gap:10px}\n  .note h1::before{content:\"\";width:16px;height:3px;background:var(--ice);flex:none}\n  .note p,.note ul{margin:0;font-size:13px;line-height:1.55;color:var(--chalk-dim)}\n  .note ul{padding-left:18px;margin-top:6px}\n  .note li{margin-bottom:4px}\n  .note strong{color:var(--chalk);font-weight:600}\n  .note a{color:var(--ice);text-decoration:none}\n  .q{border-left:3px solid var(--line-strong);padding-left:10px;margin:8px 0;font-style:italic;\n     font-size:13px;line-height:1.55;color:var(--chalk-dim)}\n  .interp{margin-top:10px;background:var(--ink-2);border:1px solid var(--line);\n          border-left:3px solid var(--flare);border-radius:8px;padding:10px 12px;\n          font-size:13px;line-height:1.55;color:var(--chalk-dim)}\n  .interp strong{color:var(--chalk)}\n\n  .sec{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n       color:var(--chalk-dim);display:flex;align-items:center;gap:8px;margin:32px 0 12px}\n  .sec::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n\n  .compare{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}\n  .col{flex:1 1 390px;max-width:420px}\n  .colcap{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n          color:var(--chalk-dim);margin:0 0 8px;display:flex;align-items:center;gap:8px}\n  .colcap .dot{width:8px;height:8px;border-radius:2px;background:var(--line-strong)}\n  .colcap.prop .dot{background:var(--ice)}\n  .cap{font:400 12px/1.5 var(--ui);color:var(--chalk-faint);margin-top:10px}\n\n  /* \u2500\u2500 iPhone frame \u2500\u2500 */\n  .phone{position:relative;width:390px;background:var(--ink-0);\n         border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}\n  .statusbar{height:40px;display:flex;align-items:flex-end;justify-content:space-between;\n             padding:0 20px 6px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim)}\n  .batt{display:inline-block;width:20px;height:10px;border:1px solid var(--chalk-dim);\n        border-radius:2px;position:relative}\n  .batt::after{content:\"\";position:absolute;left:1px;top:1px;bottom:1px;width:70%;\n               background:var(--chalk-dim)}\n\n  /* TopBar (global) + stack header */\n  .topbar{height:48px;display:flex;align-items:center;justify-content:space-between;\n          padding:0 16px;border-bottom:1px solid var(--line)}\n  .wordmark{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:600;\n            font-size:17px;letter-spacing:.06em;text-transform:uppercase}\n  .wordmark::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .stackhdr{height:44px;display:flex;align-items:center;padding:0 16px;position:relative}\n  .backctl{display:flex;align-items:center;gap:4px;font:600 14px var(--ui);color:var(--chalk)}\n  .stackhdr .shtitle{position:absolute;left:0;right:0;text-align:center;font-family:var(--cond);\n           font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;\n           pointer-events:none}\n\n  .scroll{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}\n\n  .tick{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n        color:var(--chalk-dim);display:flex;align-items:center;gap:8px;margin-top:4px}\n  .tick::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n\n  .card{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;padding:16px}\n\n  /* hero */\n  .herohead{display:flex;align-items:center;justify-content:space-between}\n  .lab{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .heroname{font-family:var(--cond);font-weight:600;font-size:22px;line-height:26px;\n            letter-spacing:.03em;text-transform:uppercase;margin-top:8px}\n  .chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}\n  .badge{display:inline-block;padding:2px 6px;border-radius:2px;font:600 11px/14px var(--ui);\n         text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line-strong);\n         color:var(--chalk)}\n  .badge.rankchip{border-radius:4px;font-family:var(--mono);text-transform:none;letter-spacing:0}\n\n  /* explore rows */\n  .xrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}\n  .xrow .m{flex:1}\n  .xrow .t{font:600 16px/22px var(--ui)}\n  .xrow .s{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n\n  .statbetween{display:flex;justify-content:space-between;align-items:center}\n  .mono{font:500 13px/18px var(--mono);font-variant-numeric:tabular-nums}\n\n  /* buttons */\n  .btn{height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;\n       font:600 14px var(--ui);padding:0 16px}\n  .btn.primary{background:var(--ice);color:var(--on-ice)}\n  .btn.secondary{border:1px solid var(--line-strong);color:var(--chalk)}\n  .btn.ghost{color:var(--chalk-dim)}\n  .btn.compact{height:36px;font-size:13px}\n  .btnrow{display:flex;gap:8px}\n  .btnrow .btn{flex:1;white-space:nowrap}\n\n  /* tab bar */\n  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--ink-0)}\n  .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;\n      color:var(--chalk-dim);font:600 11px var(--ui)}\n  .tb.on{color:var(--ice)}\n\n  svg.i{display:block}\n\n  /* \u2500\u2500 progress module blocks \u2500\u2500 */\n  .ringrow{display:flex;gap:16px;align-items:center}\n  .ringwrap{position:relative;width:72px;height:72px;flex:none}\n  .ringwrap .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;\n                justify-content:center;gap:1px}\n  .ringwrap .rv{font:600 16px var(--mono);font-variant-numeric:tabular-nums}\n  .ringwrap .rl{font:600 8px var(--ui);letter-spacing:.06em;color:var(--chalk-dim);text-transform:uppercase}\n  .ptitle{font:600 16px/22px var(--ui)}\n  .pbody{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n\n  .segbar{display:flex;gap:2px;margin-top:8px}\n  .segbar .seg{flex:1;height:8px;background:var(--ink-3)}\n  .segbar .seg.you{background:var(--ice)}\n  .unlockline{font:400 13px/18px var(--ui);color:var(--chalk);margin-top:8px}\n  .unlockline .em{color:var(--ice);font-weight:600}\n  .foldline{font:400 13px/18px var(--ui);color:var(--chalk-dim);border-top:1px solid var(--line);\n            margin-top:12px;padding-top:10px}\n\n  /* example trade card */\n  .exlabel{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--flare)}\n  .extrade{border:1px solid var(--line);border-radius:8px;background:var(--ink-0);\n           padding:10px 12px;margin-top:8px}\n  .excols{display:flex;gap:0;margin-top:6px}\n  .excol{flex:1;padding:0 10px}\n  .excol:first-child{padding-left:0;border-right:1px solid var(--line)}\n  .excol:last-child{padding-right:0;padding-left:12px}\n  .exhead{font:600 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n          color:var(--chalk-dim);display:flex;align-items:center;gap:6px}\n  .exhead::before{content:\"\";width:3px;height:10px;background:var(--ice)}\n  .exrow{display:flex;align-items:center;gap:6px;margin-top:6px}\n  .prail{width:3px;height:14px;flex:none}\n  .exnm{font:600 12px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .expos{font:600 9px var(--ui);letter-spacing:.05em}\n\n  /* \u2500\u2500 TradeValueBar recreation (mobile/src/components/TradeValueBar.tsx) \u2500\u2500\n     Diverging bar centered on Even, \u00b11 Mid 1st half-scale; inner ticks at the\n     \u00b12nd landmark (SECOND_IN_FIRSTS = 0.57 \u2192 21.5% / 78.5%). Example gap:\n     favors=receive (You win), gap.value=380, gap.firsts=0.6 \u2192 fill grows right\n     from center, width = 0.6 \u00d7 50% = 30%; fill color = --pos (semantic.pos). */\n  .vb{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}\n  .vbhead{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .vbwin{font-family:var(--cond);font-weight:600;font-size:18px;line-height:22px;\n         letter-spacing:.03em;text-transform:uppercase;color:var(--pos);margin-top:4px}\n  .vbmargin{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n  .vbdata{font:500 13px var(--mono);font-variant-numeric:tabular-nums}\n  .vbpick{font:600 13px var(--ui);color:var(--tier-1st)}\n  .vbtrack{position:relative;height:16px;margin-top:12px}\n  .vbrail{position:absolute;left:0;right:0;top:1px;height:14px;background:var(--ink-3);border-radius:2px}\n  .vbfill{position:absolute;top:1px;height:14px;border-radius:2px;background:var(--pos);\n          left:50%;width:30%}\n  .vbtick{position:absolute;top:-4px;height:24px;width:1px;background:var(--line)}\n  .vbcenter{position:absolute;left:50%;margin-left:-1px;top:-4px;height:24px;width:1px;\n            background:var(--line-strong)}\n  .vbscale{display:flex;align-items:center;margin-top:8px}\n  .vbend{font:500 9px var(--mono);color:var(--chalk-faint);width:30px}\n  .vbend.r{text-align:right}\n  .vbmid{flex:1;position:relative;height:12px}\n  .vblbl{position:absolute;width:44px;margin-left:-22px;text-align:center;\n         font:500 9px var(--mono);color:var(--chalk-faint)}\n  .vbends{display:flex;justify-content:space-between;margin-top:4px}\n  .vbendlbl{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .vbverdict{margin-top:10px;background:var(--ink-2);border:1px solid var(--line);\n             border-left:3px solid var(--pos);border-radius:8px;padding:12px;\n             font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n  .vbverdict strong{color:var(--chalk);font-weight:600}\n\n  /* superseded v2 reference frames, shrunk */\n  .v2ref{zoom:.62}\n\n  .rationale{margin-top:36px}\n  .rationale .card{padding:16px 20px}\n  .rationale h2{font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.03em;\n                text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}\n  .rationale h2::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .rationale ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--chalk-dim)}\n  .rationale li{margin-bottom:6px}\n  .rationale strong{color:var(--chalk);font-weight:600}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"note\">\n    <h1>Empty states &amp; progress v3 \u2014 #229 \u00b7 #230 \u00b7 #234<\/h1>\n    <p>Iteration on <a href=\"empty-states-progress-v2.html\">v2<\/a> from operator review.<\/p>\n    <p class=\"q\">\"Switch the sides for 'Find a trade' and 'rank players'. Keep 'Find a trade'\n       the same cyan color it is. Also, the buttons should be in both sections from each mockup.\"<\/p>\n    <div class=\"interp\"><strong>Interpretation implemented (flagging so any misread is visible):<\/strong>\n       one combined layout folding v2's A and B together \u2014 the side-by-side <strong>action row from\n       Variant B<\/strong> stays under the League card <em>and<\/em> the <strong>in-section buttons from\n       Variant A<\/strong> return to their cards, so both CTAs appear twice. Order is switched\n       everywhere it applies: <strong>Rank players LEFT, Find a trade RIGHT<\/strong> in the top row.\n       \"Find a trade\" keeps the solid ice (cyan) fill in both placements; \"Rank players\" is the\n       outlined secondary in both. If \"switch the sides\" meant something else (e.g. swapping which\n       sections host which button), say so and v4 will re-cut it.<\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 Combined v3 \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">Proposed v3 \u2014 League home, day-one low-activity state (full scroll shown)<\/div>\n  <div class=\"compare\">\n\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>V3 combined \u2014 action row + in-section buttons<\/div>\n      <div class=\"phone\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"topbar\">\n          <span class=\"wordmark\">Trade Finder<\/span>\n          <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M10 3a5 5 0 0 1 5 5v3l1.5 2.5H3.5L5 11V8a5 5 0 0 1 5-5Z\"/><path d=\"M8.5 16a1.5 1.5 0 0 0 3 0\"/><\/svg>\n        <\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle\">League Home<\/span>\n          <span class=\"backctl\"><svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#ECEFF4\" stroke-width=\"1.75\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Back<\/span>\n        <\/div>\n        <div class=\"scroll\">\n\n          <div class=\"card\">\n            <div class=\"herohead\">\n              <span class=\"lab\">League<\/span>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 6l5 5 5-5\"/><\/svg>\n            <\/div>\n            <div class=\"heroname\">The Gridiron Gang<\/div>\n            <div class=\"chips\">\n              <span class=\"badge\">1QB PPR<\/span>\n              <span class=\"badge rankchip\">#7 of 12<\/span>\n              <span class=\"badge\">12 teams<\/span>\n            <\/div>\n          <\/div>\n\n          <!-- Action row (from v2 Variant B) \u2014 sides switched: Rank players LEFT, Find a trade RIGHT -->\n          <div class=\"btnrow\">\n            <div class=\"btn secondary\">Rank players<\/div>\n            <div class=\"btn primary\">Find a trade<\/div>\n          <\/div>\n\n          <!-- Explore first (kept from v2) -->\n          <div class=\"tick\">Explore<\/div>\n          <div>\n            <div class=\"xrow\">\n              <div class=\"m\"><div class=\"t\">League rankings<\/div>\n                <div class=\"s\">Every team ranked by total roster value<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg>\n            <\/div>\n            <div class=\"xrow\">\n              <div class=\"m\"><div class=\"t\">Free agents<\/div>\n                <div class=\"s\">Best available players in this league<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg>\n            <\/div>\n          <\/div>\n\n          <!-- League progress above Works right now (kept from v2); in-section button back (from v2 Variant A) -->\n          <div class=\"tick\">League progress<\/div>\n          <div class=\"card\">\n            <div class=\"ringrow\">\n              <div class=\"ringwrap\">\n                <svg class=\"i\" width=\"72\" height=\"72\" viewBox=\"0 0 72 72\" fill=\"none\">\n                  <circle cx=\"36\" cy=\"36\" r=\"31\" stroke=\"#232833\" stroke-width=\"5\"/>\n                  <!-- 0 of 4 positions: start nub only -->\n                  <path d=\"M36 5 A31 31 0 0 1 38.4 5.1\" stroke=\"#56D9EC\" stroke-width=\"5\" stroke-linecap=\"square\"/>\n                <\/svg>\n                <div class=\"rc\"><span class=\"rv\">0/4<\/span><span class=\"rl\">positions<\/span><\/div>\n              <\/div>\n              <div style=\"flex:1\">\n                <div class=\"btn secondary compact\">Rank players<\/div>\n              <\/div>\n            <\/div>\n\n            <div class=\"foldline\" style=\"margin-top:14px;padding-top:0;border-top:1px solid var(--line)\"><\/div>\n            <div class=\"statbetween\" style=\"margin-top:2px\">\n              <span class=\"lab\">Leaguemates ranked<\/span>\n              <span class=\"mono\">1/12 <span style=\"color:var(--chalk-dim)\">(you)<\/span><\/span>\n            <\/div>\n            <div class=\"segbar\">\n              <span class=\"seg you\"><\/span><span class=\"seg\"><\/span><span class=\"seg\"><\/span>\n              <
