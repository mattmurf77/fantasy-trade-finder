he League card <em>and<\/em> the in-section buttons from Variant A\n          return \u2014 \"Rank players\" beside the progress ring, \"Find a trade\" under the example\n          trade. Both CTAs are therefore reachable at the top without scrolling and again in the\n          context they act on.<\/li>\n        <li><strong>Sides switched (operator):<\/strong> the top row now reads\n          <strong>Rank players (left) \u00b7 Find a trade (right)<\/strong>. A side benefit of the\n          switch: left-to-right now matches the product sequence (rank first \u2192 trade second) and\n          the primary lands on the right, where paired dialogs put the emphasized action.<\/li>\n        <li><strong>Color roles kept (operator):<\/strong> \"Find a trade\" keeps the solid ice\n          (cyan) fill in both placements; \"Rank players\" is the outlined secondary in both, so the\n          hierarchy between the two actions never flips between the top row and the sections.<\/li>\n        <li><strong>Honest note on the double presence:<\/strong> each action now appears twice on\n          one screen \u2014 including two ice-filled \"Find a trade\" buttons \u2014 which is redundant by\n          one-primary-per-screen convention and costs one extra row of vertical space. Built as\n          asked; if it reads heavy in practice, the cheapest retreat is dropping the two\n          in-section buttons (back to v2-B with switched sides) without touching anything else.<\/li>\n        <li><strong>Everything else carries over from v2 unchanged:<\/strong> Explore-first order,\n          League progress above \"Works right now\", the faithful TradeValueBar on the example card\n          (diverging \u00b11st scale, \u00b12nd ticks at 21.5%/78.5%, pick-denominated margin, verdict\n          strip), terse CTA labels, and v1's Matches empty-state + zero-row collapsing rules\n          (#229/#230/#234).<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n<\/div>\n<\/body>\n<\/html>\n"}, {"label": "Rank chooser v3", "fb": "#232 #233 + import", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish lab \u2014 Rank method consolidation v3 (#232 \u00b7 #233)<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap\" rel=\"stylesheet\">\n<style>\n  /* \u2500\u2500 Chalkline tokens (docs/design/design-system.md, ADR-005) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     Canonical hexes; --line-strong is the 2026-07-19 a11y value #59647A.\n     Real Chalkline fonts loaded (unlike v2's fallback-only approach) because the\n     v3 question \u2014 does the entry share the heading's line at 390px? \u2014 depends on\n     Barlow Condensed's actual width. */\n  :root{\n    --ink-0:#0C0E11; --ink-1:#13161B; --ink-2:#1A1E25; --ink-3:#232833;\n    --line:#262C35;  --line-strong:#59647A;\n    --chalk:#ECEFF4; --chalk-dim:#97A1AE; --chalk-faint:#626C79;\n    --ice:#56D9EC; --ice-press:#3FC2D6; --on-ice:#071013; --flare:#F0508C;\n    --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n    --cond:'Barlow Condensed','Arial Narrow',sans-serif;\n    --ui:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;\n    --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--ink-0);color:var(--chalk);font-family:var(--ui);\n       -webkit-font-smoothing:antialiased;padding:24px 16px 64px}\n  .wrap{max-width:1300px;margin:0 auto}\n\n  .note{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;\n        padding:16px 20px;margin-bottom:24px;max-width:880px}\n  .note h1{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1;\n           letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;display:flex;\n           align-items:center;gap:10px}\n  .note h1::before{content:\"\";width:16px;height:3px;background:var(--ice);flex:none}\n  .note p,.note ul{margin:0;font-size:13px;line-height:1.55;color:var(--chalk-dim)}\n  .note ul{padding-left:18px;margin-top:6px}\n  .note li{margin-bottom:4px}\n  .note strong{color:var(--chalk);font-weight:600}\n  .q{border-left:3px solid var(--line-strong);padding-left:10px;margin:6px 0;font-style:italic}\n\n  .sec{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n       color:var(--chalk-dim);display:flex;align-items:center;gap:8px;margin:32px 0 12px}\n  .sec::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n\n  .compare{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}\n  .col{flex:0 1 420px;display:flex;flex-direction:column;gap:12px}\n  .colcap{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n          color:var(--chalk-dim);margin:0;display:flex;align-items:center;gap:8px}\n  .colcap .dot{width:8px;height:8px;border-radius:2px;background:var(--line-strong)}\n  .colcap.prop .dot{background:var(--ice)}\n  .cap{font:400 12px/1.5 var(--ui);color:var(--chalk-faint);max-width:390px}\n\n  /* mock annotation chips \u2014 meta, not UI */\n  .hchip{align-self:flex-start;font-family:var(--mono);font-size:11px;color:var(--warn);\n         border:1px dashed var(--warn);border-radius:4px;padding:3px 9px;\n         background:rgba(245,158,11,.06)}\n  .hchip b{color:var(--warn);font-weight:600}\n\n  .phone{position:relative;width:390px;background:var(--ink-0);\n         border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}\n  .phone.crop{height:470px}\n  .phone.crop::after{content:\"CHOOSER CONTINUES \u2014 UNCHANGED FROM V2\";position:absolute;left:0;right:0;\n         bottom:0;padding:8px 0 10px;text-align:center;background:var(--ink-0);\n         border-top:1px dashed var(--line-strong);\n         font:600 10px var(--ui);letter-spacing:.08em;color:var(--chalk-faint)}\n  .phone.narrow{width:330px}\n  .statusbar{height:40px;display:flex;align-items:flex-end;justify-content:space-between;\n             padding:0 20px 6px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim)}\n  .batt{display:inline-block;width:20px;height:10px;border:1px solid var(--chalk-dim);\n        border-radius:2px;position:relative}\n  .batt::after{content:\"\";position:absolute;left:1px;top:1px;bottom:1px;width:70%;\n               background:var(--chalk-dim)}\n  .stackhdr{height:44px;display:flex;align-items:center;justify-content:space-between;\n            padding:0 16px;position:relative}\n  .backctl{display:flex;align-items:center;gap:4px;font:600 14px var(--ui);color:var(--chalk);z-index:1}\n  .stackhdr .shtitle{position:absolute;left:0;right:0;text-align:center;font-family:var(--cond);\n           font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;\n           pointer-events:none}\n\n  .scroll{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}\n  .heading{font-family:var(--cond);font-weight:600;font-size:22px;line-height:26px;\n           letter-spacing:.03em;text-transform:uppercase}\n  /* v3: heading row \u2014 heading left, import entry right.\n     Heading never wraps internally; if the pair can't share the row, the whole\n     entry wraps to its own line and margin-left:auto keeps it right-aligned. */\n  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}\n  .hrow .heading{flex:0 0 auto;white-space:nowrap}\n  .hrow .implink,.hrow .impbtn,.hrow .impchip{margin-left:auto}\n  .hrow.center{align-items:center}\n\n  /* variant A \u2014 text link */\n  .implink{display:inline-flex;align-items:center;gap:6px;flex:none;\n           font:600 13px/18px var(--ui);color:var(--chalk-dim);cursor:pointer;\n           text-decoration:underline;text-underline-offset:3px;\n           text-decoration-color:var(--ice);text-decoration-thickness:1.5px;white-space:nowrap}\n  .implink svg{flex:none}\n  .implink.wrapln{margin-top:-2px}\n\n  /* variant B \u2014 compact solid ice button */\n  .impbtn{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:32px;\n          padding:0 12px;border-radius:4px;background:var(--ice);color:var(--on-ice);\n          font:600 13px var(--ui);cursor:pointer;white-space:nowrap}\n\n  /* variant C \u2014 ice-outlined chip */\n  .impchip{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:32px;\n           padding:0 12px;border-radius:4px;border:1px solid var(--ice);background:transparent;\n           color:var(--ice);font:600 13px var(--ui);cursor:pointer;white-space:nowrap}\n\n  /* chooser body (verbatim from v2) */\n  .callout{display:flex;gap:8px;background:var(--ink-2);border:1px solid var(--line-strong);\n           border-radius:4px;padding:12px}\n  .callout .tx{font:400 13px/19px var(--ui);color:var(--chalk-dim);flex:1}\n  .callout .tx b{color:var(--chalk);font-weight:500}\n  .mcard{background:var(--ink-1);border:1px solid var(--line);border-radius:4px;\n         padding:12px;display:flex;flex-direction:column;gap:8px}\n  .mcard.featured{border-color:var(--ice)}\n  .mhead{display:flex;align-items:center;gap:8px}\n  .mtitle{font:600 16px/22px var(--ui);flex:1}\n  .rectag{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--flare)}\n  .mbody{font:400 13px/19px var(--ui);color:var(--chalk-dim)}\n  .roletag{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .subrow{border-top:1px solid var(--line);margin-top:2px;padding-top:8px;\n          font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n  .subrow b{color:var(--chalk);font-weight:600}\n\n  /* glyph correction inset */\n  .glyphbox{display:flex;gap:20px;align-items:center;background:var(--ink-1);\n            border:1px solid var(--line);border-radius:8px;padding:14px 18px;max-width:520px}\n  .gcell{display:flex;flex-direction:column;align-items:center;gap:6px;\n         font:600 10px var(--ui);letter-spacing:.08em;text-transform:uppercase}\n  .gcell.bad{color:var(--neg)} .gcell.good{color:var(--pos)}\n  .gnote{font:400 12px/1.5 var(--ui);color:var(--chalk-dim);flex:1}\n\n  /* reference frame (v2 sheet, scaled) */\n  .ref{zoom:.62}\n  .sheetstage{position:relative;width:390px;height:620px;border:1px solid var(--line-strong);\n              border-radius:8px;overflow:hidden;background:var(--ink-0)}\n  .scrim{position:absolute;inset:0;background:rgba(7,9,12,0.78)}\n  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ink-2);\n         border:1px solid var(--line);border-radius:8px 8px 0 0;padding:16px 16px 32px;\n         display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 32px rgba(0,0,0,.55)}\n  .grabber{align-self:center;width:32px;height:4px;border-radius:2px;background:var(--line-strong);\n           margin-bottom:8px}\n  .srow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:4px;\n        border-bottom:1px solid var(--line)}\n  .srow .m{flex:1}\n  .srow .t{font:600 16px/22px var(--ui);display:flex;align-items:center;gap:8px}\n  .srow .s{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n  .sheetsub{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-bottom:8px}\n  .honesty{display:flex;gap:8px;background:var(--ink-3);border-radius:4px;padding:10px 12px;\n           font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:4px}\n  .btn{height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;\n       font:600 14px var(--ui);padding:0 16px}\n  .btn.ghost{color:var(--chalk-dim)}\n\n  svg.i{display:block;flex:none}\n\n  .rationale{margin-top:36px}\n  .rationale .card{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;\n                   padding:16px 20px;max-width:880px}\n  .rationale h2{font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.03em;\n                text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}\n  .rationale h2::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .rationale ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--chalk-dim)}\n  .rationale li{margin-bottom:6px}\n  .rationale strong{color:var(--chalk);font-weight:600}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"note\">\n    <h1>Rank method consolidation \u2014 v3 (#232 \u00b7 #233)<\/h1>\n    <p><strong>Operator feedback on v2:<\/strong><\/p>\n    <p class=\"q\">\"Can we try fitting it to the right of the 'Build your board'? And it should be an upload icon rather than a download icon. Try a few versions of examples that fit it to the right. One with the 'Have rankings already' text be a link. Another version just 'Import Rankings' as a cyan button.\"<\/p>\n    <p style=\"margin-top:8px\"><strong>V3 scope = the chooser header row only.<\/strong> Three\n      variants of the import entry fitted to the right of \"Build your board\", all using a\n      corrected <strong>upload<\/strong> glyph (arrow UP out of the tray \u2014 v2's icon pointed\n      down). The Bring-your-rankings sheet, paste state, and match review are unchanged from\n      v2 \u2014 one scaled reference frame below. Section C (empty-tier CTA) is also unchanged and\n      not repeated here; see <code style=\"color:var(--chalk)\">rank-method-consolidation-v2.html<\/code>.<\/p>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 glyph correction \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">Icon correction \u2014 upload, not download<\/div>\n  <div class=\"glyphbox\">\n    <div class=\"gcell bad\">\n      <svg class=\"i\" width=\"28\" height=\"28\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#EF4444\" stroke-width=\"1.5\"><path d=\"M8 2v7M5 6.5 8 9.5l3-3M3 11v2.5h10V11\"/><\/svg>\n      v2 \u2014 down\n    <\/div>\n    <div class=\"gcell good\">\n      <svg class=\"i\" width=\"28\" height=\"28\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#22C55E\" stroke-width=\"1.5\"><path d=\"M8 9.5v-7M5 5 8 2l3 3M3 11v2.5h10V11\"/><\/svg>\n      v3 \u2014 up\n    <\/div>\n    <div class=\"gnote\">v2's chip glyph had the arrow pointing <b>down into<\/b> the tray \u2014\n      that reads \"download\". The user is <b>giving us<\/b> their rankings, so the arrow now\n      points <b>up out of<\/b> the tray. Same 16\u00d716 stroke geometry otherwise; every variant\n      below uses the corrected glyph.<\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 SECTION A \u2014 three header-row variants \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">A \u00b7 Import entry to the right of \"Build your board\" \u2014 three variants<\/div>\n  <div class=\"compare\">\n\n    <!-- Variant A \u2014 text link -->\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>A \u2014 text link (recommended)<\/div>\n      <div class=\"hchip\">quiet: chalk-dim text \u00b7 ice underline \u00b7 upload glyph<\/div>\n      <div class=\"phone crop\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle\">Rank<\/span>\n          <span class=\"backctl\"><svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#ECEFF4\" stroke-width=\"1.75\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Back<\/span>\n        <\/div>\n        <div class=\"scroll\">\n          <div class=\"hrow\">\n            <div class=\"heading\">Build your board<\/div>\n            <span class=\"implink\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M8 9.5v-7M5 5 8 2l3 3M3 11v2.5h10V11\"/><\/svg>Have rankings already?<\/span>\n          <\/div>\n\n          <div class=\"callout\">\n            <svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F0508C\" stroke-width=\"1.75\"><path d=\"M3 7h11l-2.5-2.5M17 13H6l2.5 2.5\"/><\/svg>\n            <div class=\"tx\"><b>Trades are priced off this board.<\/b> The better it matches you,\n              the better the deals we find.<\/div>\n          <\/div>\n\n          <div class=\"mcard featured\">\n            <div class=\"mhead\">\n              <span class=\"roletag\">Fastest<\/span>\n              <span style=\"flex:1\"><\/span><span class=\"rectag\">recommended<\/span>\n            <\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M4 10.5 8.5 15 16 6\"/><\/svg>\n              <span class=\"mtitle\">Quick set<\/span>\n            <\/div>\n            <div class=\"mbody\">Tap players into value tiers, one tier at a time. A usable board\n              in a few minutes per position.<\/div>\n            <div class=\"subrow\"><b>Then, if you want:<\/b> Quick rank \u2014 a follow-on pass that\n              fine-tunes the order inside each tier. Offered when you finish.<\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\"><span class=\"roletag\">Most precise<\/span><\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 17v-6M10 17V3M17 17v-9\"/><\/svg>\n              <span class=\"mtitle\">Head-to-heads<\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">The whole phrase is the link: 13px chalk-dim with an ice underline and\n        an ice upload glyph \u2014 the operator's sentence, reading as a question only people with\n        existing rankings will answer. Baseline-aligned with the 22px condensed heading. It is\n        the quietest of the three: zero competition with the cards' Fastest / Most precise /\n        Most control hierarchy.<\/div>\n\n      <!-- narrow-width wrap treatment -->\n      <div class=\"colcap prop\" style=\"margin-top:8px\"><span class=\"dot\"><\/span>A \u2014 narrow width: link wraps under, right-aligned<\/div>\n      <div class=\"phone narrow\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"scroll\" style=\"padding-top:4px;padding-bottom:16px\">\n          <div class=\"hrow\" style=\"row-gap:2px\">\n            <div class=\"heading\">Build your board<\/div>\n            <span class=\"implink wrapln\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M8 9.5v-7M5 5 8 2l3 3M3 11v2.5h10V11\"/><\/svg>Have rankings already?<\/span>\n          <\/div>\n          <div class=\"callout\">\n            <svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F0508C\" stroke-width=\"1.75\"><path d=\"M3 7h11l-2.5-2.5M17 13H6l2.5 2.5\"/><\/svg>\n            <div class=\"tx\"><b>Trades are priced off this board.<\/b> The better it matches you\u2026<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">When the row can't fit both (330px frame, or large Dynamic Type), the\n        link never truncates or squeezes the heading \u2014 the row wraps and the intact link drops\n        to its own line, right-aligned under the heading. Same rule for B and C.<\/div>\n    <\/div>\n\n    <!-- Variant B \u2014 solid ice button -->\n    <div class=\"col\">\n      <div class=\"colcap\"><span class=\"dot\"><\/span>B \u2014 compact ice button (operator's ask, shown honestly)<\/div>\n      <div class=\"hchip\">loud: solid ice fill \u2014 competes with Quick set's primary slot<\/div>\n      <div class=\"phone crop\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle\">Rank<\/span>\n          <span class=\"backctl\"><svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#ECEFF4\" stroke-width=\"1.75\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Back<\/span>\n        <\/div>\n        <div class=\"scroll\">\n          <div class=\"hrow center\">\n            <div class=\"heading\">Build your board<\/div>\n            <span class=\"impbtn\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#071013\" stroke-width=\"1.75\"><path d=\"M8 9.5v-7M5 5 8 2l3 3M3 11v2.5h10V11\"/><\/svg>Import Rankings<\/span>\n          <\/div>\n\n          <div class=\"callout\">\n            <svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F0508C\" stroke-width=\"1.75\"><path d=\"M3 7h11l-2.5-2.5M17 13H6l2.5 2.5\"/><\/svg>\n            <div class=\"tx\"><b>Trades are priced off this board.<\/b> The better it matches you,\n              the better the deals we find.<\/div>\n          <\/div>\n\n          <div class=\"mcard featured\">\n            <div class=\"mhead\">\n              <span class=\"roletag\">Fastest<\/span>\n              <span style=\"flex:1\"><\/span><span class=\"rectag\">recommended<\/span>\n            <\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M4 10.5 8.5 15 16 6\"/><\/svg>\n              <span class=\"mtitle\">Quick set<\/span>\n            <\/div>\n            <div class=\"mbody\">Tap players into value tiers, one tier at a time. A usable board\n              in a few minutes per position.<\/div>\n            <div class=\"subrow\"><b>Then, if you want:<\/b> Quick rank \u2014 a follow-on pass that\n              fine-tunes the order inside each tier. Offered when you finish.<\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\"><span class=\"roletag\">Most precise<\/span><\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 17v-6M10 17V3M17 17v-9\"/><\/svg>\n              <span class=\"mtitle\">Head-to-heads<\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">\"Import Rankings\" as a 32px solid ice button, center-aligned to the\n        heading's cap height (baseline alignment floats a filled box oddly). Most discoverable\n        by far \u2014 but it is the only ice <i>fill<\/i> on the screen, which makes it read as the\n        page's primary action before the eye ever reaches the recommended Quick set card. See\n        rationale: we'd only ship this if import discoverability is the top goal.<\/div>\n    <\/div>\n\n    <!-- Variant C \u2014 ice-outlined chip -->\n    <div class=\"col\">\n      <div class=\"colcap\"><span class=\"dot\"><\/span>C \u2014 ice-outlined chip (\"a few versions\")<\/div>\n      <div class=\"hchip\">middle: ice border + text, no fill \u00b7 shortest label<\/div>\n      <div class=\"phone crop\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle\">Rank<\/span>\n          <span class=\"backctl\"><svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#ECEFF4\" stroke-width=\"1.75\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Back<\/span>\n        <\/div>\n        <div class=\"scroll\">\n          <div class=\"hrow center\">\n            <div class=\"heading\">Build your board<\/div>\n            <span class=\"impchip\"><svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M8 9.5v-7M5 5 8 2l3 3M3 11v2.5h10V11\"/><\/svg>Import<\/span>\n          <\/div>\n\n          <div class=\"callout\">\n            <svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F0508C\" stroke-width=\"1.75\"><path d=\"M3 7h11l-2.5-2.5M17 13H6l2.5 2.5\"/><\/svg>\n            <div class=\"tx\"><b>Trades are priced off this board.<\/b> The better it matches you,\n              the better the deals we find.<\/div>\n          <\/div>\n\n          <div class=\"mcard featured\">\n            <div class=\"mhead\">\n              <span class=\"roletag\">Fastest<\/span>\n              <span style=\"flex:1\"><\/span><span class=\"rectag\">recommended<\/span>\n            <\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M4 10.5 8.5 15 16 6\"/><\/svg>\n              <span class=\"mtitle\">Quick set<\/span>\n            <\/div>\n            <div class=\"mbody\">Tap players into value tiers, one tier at a time. A usable board\n              in a few minutes per position.<\/div>\n            <div class=\"subrow\"><b>Then, if you want:<\/b> Quick rank \u2014 a follow-on pass that\n              fine-tunes the order inside each tier. Offered when you finish.<\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\"><span class=\"roletag\">Most precise<\/span><\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 17v-6M10 17V3M17 17v-9\"/><\/svg>\n              <span class=\"mtitle\">Head-to-heads<\/span>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">Upload glyph + \"Import\" in an ice-outlined 32px chip \u2014 a clear control\n        without a fill, and the shortest label, so it survives the narrowest headings without\n        wrapping. Louder than A (ice border draws the eye) but it stays in the \"secondary\n        control\" register: outlined, not filled, so Quick set keeps the only solid-ice claim\n        on the screen. The chip alone loses A's self-selecting question \u2014 the sheet's\n        \"Bring your rankings\" title does that work one tap later.<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 reference: import flow unchanged \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">Reference \u2014 import flow unchanged from v2 (sheet \u00b7 paste \u00b7 match review)<\/div>\n  <div class=\"compare\">\n    <div class=\"col\">\n      <div class=\"colcap\"><span class=\"dot\"><\/span>v2 \"Bring your rankings\" sheet \u2014 reference only, not iterated here<\/div>\n      <div class=\"ref\">\n      <div class=\"sheetstage\">\n        <div class=\"scrim\"><\/div>\n        <div class=\"sheet\">\n          <div class=\"grabber\"><\/div>\n          <div class=\"heading\">Bring your rankings<\/div>\n          <div class=\"sheetsub\">Pull in a board you keep somewhere else. Ranks only \u2014 a numbered\n            list of players is all we need.<\/div>\n          <div class=\"srow\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M5 2.5h7l3.5 3.5v11.5h-10.5Z\"/><path d=\"M12 2.5V6h3.5\"/><\/svg>\n            <div class=\"m\"><div class=\"t\">Upload a CSV<\/div>\n            <div class=\"s\">An export from KTC, FantasyCalc, or any spreadsheet<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"srow\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 4h14v12H3Z\"/><path d=\"M3 8h14M3 12h14M8 4v12\"/><\/svg>\n            <div class=\"m\"><div class=\"t\">Upload a spreadsheet<\/div>\n            <div class=\"s\">XLSX from Excel, Numbers, or Google Sheets<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"srow\" style=\"border-bottom:0\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M7 3.5h6M6 3.5H5a1 1 0 0 0-1 1V17h12V4.5a1 1 0 0 0-1-1h-1\"/><path d=\"M7 2h6v3H7Z\"/><\/svg>\n            <div class=\"m\"><div class=\"t\">Paste a table<\/div>\n            <div class=\"s\">Copy rows from any sheet or site and paste them here<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"honesty\">\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><circle cx=\"8\" cy=\"8\" r=\"6\"/><path d=\"M8 7v4M8 5v.5\"/><\/svg>\n            <span>We'll match player names to your league's player pool \u2014 you review anything\n              we can't match.<\/span>\n          <\/div>\n          <div class=\"btn ghost\" style=\"margin-top:4px\">Cancel<\/div>\n        <\/div>\n      <\/div>\n      <\/div>\n      <div class=\"cap\">All three variants open this same sheet; the paste-a-table state and the\n        match-review screen behind it are exactly the v2 frames (B1\u2013B3 in\n        <code>rank-method-consolidation-v2.html<\/code>), including the paste-only v1 scoping.\n        Nothing downstream of the entry point changed in v3.<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 RATIONALE \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"rationale\">\n    <div class=\"card\">\n      <h2>Rationale \u2014 v3 deltas &amp; recommendation<\/h2>\n      <ul>\n        <li><strong>Recommendation: A (text link)<\/strong> \u2014 the tenets say quiet entry and one\n          primary per screen, and a solid ice button to the right of the heading (B) genuinely\n          competes with the three method cards' hierarchy: it's the only ice fill in view, so it\n          out-shouts the recommended Quick set card the screen exists to sell. We agree with\n          that concern, honestly stated on B's frame. A keeps the operator's self-selecting\n          question (\"Have rankings already?\"), costs zero vertical space (it shares the\n          heading's line), and the ice underline + glyph make it read as tappable without\n          claiming primacy. If usage shows people with existing boards missing it, step up to\n          <strong>C<\/strong> \u2014 outlined ice chip, still no fill \u2014 before ever going to B.<\/li>\n        <li><strong>Fitted right, not stacked (operator's ask):<\/strong> the v2 entry was a\n          full-width chip between heading and callout \u2014 a row of its own. All three v3 variants\n          sit the entry in the heading's right margin: A baseline-aligned (text-to-text), B/C\n          center-aligned (box-to-cap-height). Net \u221236px of chooser height vs v2.<\/li>\n        <li><strong>Upload glyph corrected (operator's ask):<\/strong> arrow now points UP out of\n          the tray (<code>M8 9.5v-7 \u00b7 M5 5 8 2l3 3<\/code> over the same tray path) \u2014 importing\n          is the user handing rankings to us. The correction applies to every variant and, at\n          build time, to the sheet rows' file icons if we ever add direction arrows there.<\/li>\n        <li><strong>Wrap rule (shown on A):<\/strong> when heading + entry can't share 390px \u2014\n          long localized headings or large Dynamic Type \u2014 the row wraps and the intact entry\n          right-aligns on its own line below. Never truncate the entry, never shrink the\n          heading. C's one-word label is the most wrap-resistant; A wraps most often but\n          degrades the most gracefully since it's plain text.<\/li>\n        <li><strong>Unchanged from v2:<\/strong> the Bring-your-rankings sheet (CSV \u00b7 XLSX \u00b7\n          paste), honesty line, match-review screen with disabled-until-resolved primary,\n          paste-only v1 scoping, Most control = Tiers board, and the #233 empty-tier CTA.<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n<\/div>\n<\/body>\n<\/html>\n"}]</script>
<script>
const PAGES = JSON.parse(document.getElementById('pages').textContent);
const nav = document.getElementById('tabs');
const frame = document.getElementById('frame');
const note = document.getElementById('note');
const notecount = document.getElementById('notecount');
const KEY = 'ftf-polish-lab-2026-08-v3-notes';
let current = 0;
let notes = {};
try { notes = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { notes = {}; }

PAGES.forEach((p, i) => {
  const b = document.createElement('button');
  b.innerHTML = p.label + '<span class="fb">' + p.fb + '</span><span class="dot"></span>';
  b.onclick = () => select(i);
  nav.appendChild(b);
});

function refreshBadges(){
  let n = 0;
  [...nav.children].forEach((b, j) => {
    const has = !!(notes[PAGES[j].label] || '').trim();
    b.classList.toggle('noted', has);
    if (has) n++;
  });
  notecount.textContent = n ? (n + ' of ' + PAGES.length + ' noted') : 'no notes yet';
}

function select(i){
  current = i;
  [...nav.children].forEach((b, j) => b.classList.toggle('active', j === i));
  frame.srcdoc = PAGES[i].html;
  note.value = notes[PAGES[i].label] || '';
  refreshBadges();
}

note.addEventListener('input', () => {
  notes[PAGES[current].label] = note.value;
  try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
  refreshBadges();
});

document.getElementById('copyall').addEventListener('click', async () => {
  const lines = [];
  PAGES.forEach((p) => {
    const t = (notes[p.label] || '').trim();
    if (t) lines.push('## ' + p.label + ' (' + p.fb + ')\n' + t);
  });
  const text = lines.length ? lines.join('\n\n') : '(no notes)';
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  const btn = document.getElementById('copyall');
  const orig = btn.textContent;
  btn.textContent = ok ? 'Copied!' : 'Copy failed';
  setTimeout(() => { btn.textContent = orig; }, 1500);
});

document.addEventListener('keydown', (e) => {
  if (e.target === note) return;
  if (e.key === 'ArrowRight') select((current + 1) % PAGES.length);
  if (e.key === 'ArrowLeft')  select((current - 1 + PAGES.length) % PAGES.length);
});
select(0);
</script>
</body>
