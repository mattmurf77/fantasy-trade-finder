class=\"ann\" style=\"top:150px;left:10px\">Trades adds its own<br>\"Trading in\" pill \u2014 a second,<br>screen-local switcher<\/div>\n          <div class=\"status\"><span>9:41<\/span><span>&#9679;&#9679;&#9679;<\/span><\/div>\n          <div class=\"topbar\">\n            <div class=\"wordmark\"><div class=\"tick\"><\/div><div class=\"txt\">Trade Finder<\/div><\/div>\n            <div class=\"tbActions\">\n              <div class=\"iconBtn\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"3.2\"/><path d=\"M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M15.7 4.3l-2.1 2.1M6.4 13.6l-2.1 2.1\"/><\/svg><\/div>\n              <div class=\"iconBtn\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><path d=\"M4 14h12l-1.5-2.5V8a4.5 4.5 0 0 0-9 0v3.5L4 14z\"/><path d=\"M8.5 16.5a1.5 1.5 0 0 0 3 0\"/><\/svg><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"body\" style=\"min-height:300px\">\n            <div style=\"font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:22px\">Find a Trade<\/div>\n            <div class=\"leaguepill\">\n              <div style=\"flex:1;min-width:0\"><div class=\"lbl\">Trading in<\/div>\n                <div class=\"nm\" style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Dynasty Degens Superflex<\/div><\/div>\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" style=\"stroke:var(--dim)\"><path d=\"M5 8l5 5 5-5\"/><\/svg>\n            <\/div>\n            <div class=\"ghostrow\" style=\"height:120px\"><\/div>\n            <div class=\"ghostrow\"><\/div>\n          <\/div>\n          <div class=\"tabbar\">\n            <div class=\"tab\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M4 18v-6h4v6M9 18V6h4v12M14 18v-9h4v9\"/><\/svg>Rank<\/div>\n            <div class=\"tab on\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M4 8h12M13 5l3 3-3 3M18 15H6M9 12l-3 3 3 3\"/><\/svg>Trades<\/div>\n            <div class=\"tab\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M8 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M14 9a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n            <div class=\"tab\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M11 3l7 4v8l-7 4-7-4V7z\"/><\/svg>League<\/div>\n          <\/div>\n        <\/div>\n        <div class=\"cap\">Trades hub today: the <code>LeaguePill<\/code> re-states the league below the title. Rank and Matches show no league at all \u2014 you must trek to League (or a pill screen) to switch.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 PROPOSED \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"side\">\n    <div class=\"tag pro\">Proposed<\/div>\n    <div class=\"frames\">\n      <div class=\"frameWrap\">\n        <div class=\"phone\">\n          <div class=\"ann iceA\" style=\"top:78px;left:120px\">league name IS the header \u2014<br>ice chevron = \"tap to switch\"<\/div>\n          <div class=\"ann iceA\" style=\"top:196px;right:10px\">LeaguePill removed \u2014<br>header already says it<\/div>\n          <div class=\"status\"><span>9:41<\/span><span>&#9679;&#9679;&#9679;<\/span><\/div>\n          <div class=\"topbar2\">\n            <div class=\"lgBtn\">\n              <div class=\"tick\"><\/div>\n              <div class=\"lgStack\">\n                <div class=\"k\">League<\/div>\n                <div class=\"lgRow\">\n                  <span class=\"nm\">Dynasty Degens Superflex<\/span>\n                  <svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M5 8l5 5 5-5\"/><\/svg>\n                <\/div>\n              <\/div>\n            <\/div>\n            <div class=\"tbActions\">\n              <div class=\"iconBtn\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><path d=\"M4 14h12l-1.5-2.5V8a4.5 4.5 0 0 0-9 0v3.5L4 14z\"/><path d=\"M8.5 16.5a1.5 1.5 0 0 0 3 0\"/><\/svg>\n                <div class=\"dot\">2<\/div><\/div>\n              <div class=\"iconBtn\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"3.2\"/><path d=\"M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M15.7 4.3l-2.1 2.1M6.4 13.6l-2.1 2.1\"/><\/svg><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"body\" style=\"min-height:392px\">\n            <div style=\"font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:22px\">Find a Trade<\/div>\n            <div class=\"ghostrow\" style=\"height:120px\"><\/div>\n            <div class=\"ghostrow\" style=\"height:64px\"><\/div>\n            <div class=\"ghostrow\" style=\"height:64px\"><\/div>\n          <\/div>\n          <div class=\"tabbar\">\n            <div class=\"tab\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M4 18v-6h4v6M9 18V6h4v12M14 18v-9h4v9\"/><\/svg>Rank<\/div>\n            <div class=\"tab on\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M4 8h12M13 5l3 3-3 3M18 15H6M9 12l-3 3 3 3\"/><\/svg>Trades<\/div>\n            <div class=\"tab\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M8 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M14 9a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n            <div class=\"tab\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M11 3l7 4v8l-7 4-7-4V7z\"/><\/svg>League<\/div>\n          <\/div>\n        <\/div>\n        <div class=\"cap\">The same header renders on Rank, Trades, Matches and League \u2014 that's the point. On the Trades tab the pill row disappears and its ~63pt goes back to content (feeds directly into the #218 fit-to-screen pass). Long names tail-truncate at ~200pt.<\/div>\n      <\/div>\n\n      <div class=\"frameWrap\">\n        <div class=\"phone\" style=\"height:620px\">\n          <div class=\"status\"><span>9:41<\/span><span>&#9679;&#9679;&#9679;<\/span><\/div>\n          <div class=\"topbar2\">\n            <div class=\"lgBtn\">\n              <div class=\"tick\"><\/div>\n              <div class=\"lgStack\">\n                <div class=\"k\">League<\/div>\n                <div class=\"lgRow\">\n                  <span class=\"nm\">Dynasty Degens Superflex<\/span>\n                  <svg class=\"i\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M5 8l5 5 5-5\"/><\/svg>\n                <\/div>\n              <\/div>\n            <\/div>\n            <div class=\"tbActions\">\n              <div class=\"iconBtn\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><path d=\"M4 14h12l-1.5-2.5V8a4.5 4.5 0 0 0-9 0v3.5L4 14z\"/><path d=\"M8.5 16.5a1.5 1.5 0 0 0 3 0\"/><\/svg><\/div>\n              <div class=\"iconBtn\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"3.2\"/><path d=\"M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M15.7 4.3l-2.1 2.1M6.4 13.6l-2.1 2.1\"/><\/svg><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"scrim\"><\/div>\n          <div class=\"sheet\">\n            <div class=\"grab\"><\/div>\n            <div class=\"shTitle\">Switch league<\/div>\n            <div class=\"shSub\">Picking a league reloads your team rosters and trade pool.<\/div>\n            <div class=\"lrow\">\n              <div style=\"flex:1;min-width:0\"><div class=\"nm\">Dynasty Degens Superflex<\/div><div class=\"meta\">12 teams<\/div><\/div>\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" style=\"stroke:var(--ice)\"><path d=\"M4 10.5l4 4 8-9\"/><\/svg>\n            <\/div>\n            <div class=\"lrow\">\n              <div style=\"flex:1;min-width:0\"><div style=\"display:flex;align-items:center;gap:8px\"><span class=\"nm\">The Gauntlet<\/span><span class=\"badge\">ESPN<\/span><\/div><div class=\"meta\">10 teams<\/div><\/div>\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" style=\"stroke:var(--dim)\"><path d=\"M8 5l5 5-5 5\"/><\/svg>\n            <\/div>\n            <div class=\"lrow\" style=\"border-bottom:0\">\n              <div style=\"flex:1;min-width:0\"><div class=\"nm\">Murph's Dynasty Empire<\/div><div class=\"meta\">12 teams<\/div><\/div>\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" style=\"stroke:var(--dim)\"><path d=\"M8 5l5 5-5 5\"/><\/svg>\n            <\/div>\n            <div class=\"addrow\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" style=\"stroke:var(--ice)\"><path d=\"M10 4v12M4 10h12\"/><\/svg>\n              <span class=\"nm\">Add a league<\/span>\n            <\/div>\n            <div class=\"cancel\">Cancel<\/div>\n          <\/div>\n        <\/div>\n        <div class=\"cap\">Tapping the league name opens the existing <code>LeagueSwitcherSheet<\/code> \u2014 untouched: active check in ice, ESPN badge, #199 \"Add a league\" row \u2192 LeaguePicker. The sheet just becomes reachable from every tab.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"note\">\n  <h1 style=\"font-size:16px\">What changed &amp; why<\/h1>\n  <ul>\n    <li><b>League name replaces the wordmark<\/b> in the global TopBar (11px \"LEAGUE\" micro-label over the name; brand survives as the ice tick). Users think in leagues, not app names \u2014 the header should answer \"where am I trading?\" on every tab.<\/li>\n    <li><b>Ice chevron-down beside the name = the click indicator<\/b> (ice = action, per Chalkline). Whole left cluster is one \u226544pt hit target; pressed state = ink-3 fill, same as today's icon buttons.<\/li>\n    <li><b>Bell and gear stay put<\/b> (bell moved inboard of gear so the unread badge sits away from the screen edge) \u2014 muscle memory for #topbar.settings / the bell is preserved.<\/li>\n    <li><b>One switcher, everywhere:<\/b> the LeagueScreen hero keeps its card but drops the chevron affordance duty; the Trades <code>LeaguePill<\/code> row is removed, returning ~63pt to the hub (see hub-fit-to-screen.html). The sheet itself (LeagueSwitcherSheet incl. \"Add a league\") ships as-is.<\/li>\n    <li><b>Bar grows 44\u219252pt<\/b> to fit the two-line label/name stack at the 11px type floor \u2014 cheaper than it looks, since the pill/hero rows it replaces cost 60+pt per screen.<\/li>\n  <\/ul>\n<\/div>\n\n<\/body>\n<\/html>\n"}, {"label": "Trade DNA \u00b7 outlook", "fb": "#212 #231 #206", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish Lab \u2014 Trade DNA &amp; Outlook (#212 \u00b7 #231 \u00b7 #206)<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink0:#0C0E11; --ink1:#13161B; --ink2:#1A1E25; --ink3:#232833;\n  --line:#262C35; --lineStrong:#59647A;\n  --chalk:#ECEFF4; --dim:#97A1AE; --faint:#626C79;\n  --ice:#56D9EC; --icePress:#3FC2D6; --onIce:#071013;\n  --flare:#F0508C; --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n  --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n  --first1:#2dd4bf;\n  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;\n  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;\n  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:#07090c;color:var(--chalk);font-family:var(--f-ui);\n  display:flex;flex-direction:column;align-items:center;padding:24px 12px 64px;gap:22px;min-height:100vh}\n\n.note{max-width:840px;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:13px;line-height:1.55;color:var(--dim)}\n.note h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:22px;color:var(--chalk);margin-bottom:4px}\n.note h2{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:13px;color:var(--ice);margin:12px 0 4px}\n.note b{color:var(--chalk)}\n.note ul{margin:4px 0 0 18px} .note li{margin:3px 0}\n.q{border-left:3px solid var(--lineStrong);padding-left:10px;margin:6px 0;font-style:italic}\n\n.pairwrap{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}\n.slot{display:flex;flex-direction:column;gap:8px;align-items:center}\n.slotlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:7px}\n.slotlbl::before{content:\"\";width:3px;height:12px;background:var(--lineStrong)}\n.slot.proposed .slotlbl{color:var(--ice)} .slot.proposed .slotlbl::before{background:var(--ice)}\n.caption{max-width:390px;font-size:12px;line-height:1.5;color:var(--dim);text-align:left}\n\n.phone{width:390px;background:var(--ink0);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55)}\n.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:var(--dim);font-family:var(--f-mono)}\n.scroll{padding:4px 16px 14px;display:flex;flex-direction:column;gap:12px}\n.pagetitle{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:22px}\n.leaguepill{align-self:flex-start;display:flex;align-items:center;gap:6px;background:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--dim)}\n.leaguepill .dot{width:7px;height:7px;border-radius:999px;background:var(--ice)}\n.leaguepill b{color:var(--chalk);font-weight:600}\n\n/* ---- shared bits ---- */\n.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.pdot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;display:inline-block}\n.pos-qb{background:var(--qb)} .pos-rb{background:var(--rb)} .pos-wr{background:var(--wr)} .pos-te{background:var(--te)}\nsvg.ic{stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:square}\n\n/* ---- CURRENT: Trade DNA panel (TradeFinderHubScreen.tsx, faithful) ---- */\n.dna{border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:12px;display:flex;flex-direction:column;gap:8px}\n.dna .top{display:flex;align-items:center;justify-content:space-between}\n.dna .edit{font-size:13px;font-weight:600;color:var(--ice);cursor:pointer}\n.dnarow{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:14px;color:var(--chalk)}\n.dnarow .k{color:var(--faint)}\n.dnarow .manage{color:var(--ice);font-weight:600;font-size:13px}\n.grouplbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);margin-top:4px}\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.poschip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--ink2);font-size:13px;font-weight:600;color:var(--chalk)}\n.poschip.rec{border-style:dashed;border-color:var(--lineStrong)}\n.poschip .tag{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--flare);margin-left:2px}\n.emptytxt{font-size:13px;color:var(--faint)}\n\n.seclabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);margin-top:2px}\n.modecard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:12px;cursor:pointer}\n.modecard .icwell{width:40px;height:40px;border-radius:8px;background:var(--ink2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--ice)}\n.modecard .body{flex:1;min-width:0}\n.modecard .trow{display:flex;align-items:center;gap:8px}\n.modecard .t{font-size:16px;font-weight:600}\n.modecard .rec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--flare)}\n.modecard .d{font-size:13px;color:var(--dim);margin-top:1px;line-height:1.4}\n.modecard .chev{color:var(--faint);flex:0 0 auto}\n.fade{height:34px;margin:-10px -16px -14px;background:linear-gradient(transparent,var(--ink0))}\n/* the fade above is a mockup viewport cue, not a UI gradient */\n\n.tabbar{display:flex;border-top:1px solid var(--line);background:var(--ink1)}\n.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}\n.tab svg{width:20px;height:20px;stroke:var(--faint);stroke-width:1.75;fill:none;stroke-linecap:square}\n.tab.on{color:var(--ice)} .tab.on svg{stroke:var(--ice)}\n\n/* ---- PROPOSED: DNA panel v2 ---- */\n.dna2{border:1px solid var(--line);border-radius:8px;background:var(--ink1);padding:12px;display:flex;flex-direction:column;gap:10px}\n.dna2 .top{display:flex;align-items:center;justify-content:space-between}\n.editbtn{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--lineStrong);border-radius:4px;background:transparent;color:var(--chalk);font-family:var(--f-ui);font-size:13px;font-weight:600;cursor:pointer}\n.editbtn:hover{border-color:var(--ice)}\n.editbtn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:square}\n\n.outgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.outcard{border:1px solid var(--line);border-radius:8px;background:var(--ink2);padding:10px 10px 9px;cursor:pointer;position:relative}\n.outcard .t{font-size:14px;font-weight:600}\n.outcard .d{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.35}\n.outcard.sel{border-color:var(--ice)}\n.outcard.sel::after{content:\"\";position:absolute;top:8px;right:8px;width:3px;height:12px;background:var(--ice)}\n.outcard.sel .d{color:var(--chalk)}\n\n.needchips{display:flex;flex-wrap:wrap;gap:8px}\n.needchip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--ink2);font-size:13px;font-weight:600;color:var(--chalk)}\n.needchip .tag{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-left:2px}\n.tag.starter{color:var(--flare)}\n.tag.depth{color:var(--dim)}\n.needkey{font-size:11px;color:var(--faint);line-height:1.45}\n\n/* ---- PROPOSED frame 2: deck + bias receipt ---- */\n.modebar .back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ice);margin-bottom:8px}\n.swrow{display:flex;gap:6px;overflow:hidden}\n.sw{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink1);font-size:12px;color:var(--dim);min-height:32px;display:flex;align-items:center}\n.sw.on{border-color:var(--ice);background:var(--ink2);color:var(--chalk)}\n.receipt{display:flex;align-items:center;gap:8px;background:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12.5px;color:var(--dim)}\n.receipt .tick{width:3px;height:12px;background:var(--flare);flex:0 0 auto}\n.receipt b{color:var(--chalk);font-weight:600}\n.receipt .chg{margin-left:auto;color:var(--ice);font-weight:600;cursor:pointer;flex:0 0 auto}\n\n.tcard{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}\n.tcard .hdr .lbl{display:block}\n.tcard .opp{font-size:16px;font-weight:600;margin-top:1px}\n.strength{display:flex;flex-direction:column;gap:4px}\n.strength .row{display:flex;justify-content:space-between;align-items:baseline}\n.strength .val{font-family:var(--f-mono);font-size:13px}\n.track{height:4px;background:var(--ink3)}\n.track .fill{height:4px;background:var(--rb)}\n.split{display:flex;gap:12px}\n.split .vrule{width:1px;background:var(--line)}\n.side{flex:1;display:flex;flex-direction:column;gap:6px}\n.ticklbl{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.ticklbl::before{content:\"\";width:3px;height:12px;background:var(--ice)}\n.prow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-left:3px solid var(--wr);border-radius:8px;background:var(--ink2);padding:8px}\n.prow .nm{font-size:13px;font-weight:600;line-height:1.25}\n.prow .meta{font-size:11px;color:var(--dim);font-family:var(--f-mono)}\n.vbar{display:flex;flex-direction:column;gap:6px}\n.vbar .who{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:18px;color:var(--pos)}\n.vbar .margin{font-size:12px;color:var(--dim)}\n.vbar .margin b{font-family:var(--f-mono);color:var(--pos);font-weight:600}\n.vbar .pick{color:var(--first1);font-weight:600}\n.dtrack{position:relative;height:14px;background:var(--ink3);border-radius:2px;margin-top:2px}\n.dtrack .cen{position:absolute;left:50%;top:-4px;width:1px;height:22px;background:var(--lineStrong)}\n.dtrack .t1{position:absolute;left:21.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .t2{position:absolute;left:78.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .fillr{position:absolute;left:50%;width:11%;height:14px;background:var(--pos);border-radius:2px}\n.scalerow{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;color:var(--faint)}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"note\">\n  <h1>Polish Lab \u00b7 Trade DNA &amp; Outlook \u2014 #212 + #231 + #206<\/h1>\n  <p><b>Operator asks:<\/b><\/p>\n  <p class=\"q\">#212 \u2014 \"The ranking graphic/UX is a little too passive for users to realize ;<span class=\"manage\">Manage<\/span><\/span>\n          <\/div>\n          <div class=\"grouplbl\">Chasing<\/div>\n          <div class=\"chips\">\n            <span class=\"poschip\"><span class=\"pdot pos-wr\"><\/span>WR<\/span>\n            <span class=\"poschip rec\"><span class=\"pdot pos-te\"><\/span>TE<span class=\"tag\">need<\/span><\/span>\n          <\/div>\n          <div class=\"grouplbl\">Shopping<\/div>\n          <div class=\"chips\">\n            <span class=\"poschip rec\"><span class=\"pdot pos-rb\"><\/span>RB<span class=\"tag\">deep<\/span><\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"seclabel\">How do you want to find trades?<\/div>\n\n        <div class=\"modecard\">\n          <div class=\"icwell\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 20 20\"><path d=\"M3 14 6 6l4 5 4-7 3 10z\"/><\/svg><\/div>\n          <div class=\"body\">\n            <div class=\"trow\"><span class=\"t\">Fully Guided<\/span><span class=\"rec\">recommended<\/span><\/div>\n            <div class=\"d\">We read your roster &amp; league and walk you to the best deals.<\/div>\n          <\/div>\n          <svg class=\"ic chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n        <\/div>\n        <div class=\"modecard\">\n          <div class=\"icwell\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg><\/div>\n          <div class=\"body\">\n            <div class=\"trow\"><span class=\"t\">Specific Team<\/span><\/div>\n            <div class=\"d\">Target one league-mate and see only mutual-gain deals.<\/div>\n          <\/div>\n          <svg class=\"ic chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n        <\/div>\n        <div class=\"modecard\">\n          <div class=\"icwell\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><\/div>\n          <div class=\"body\">\n            <div class=\"trow\"><span class=\"t\">Specific Player<\/span><\/div>\n            <div class=\"d\">Trade for someone, away someone, or both \u2014 engine fills the rest.<\/div>\n          <\/div>\n          <svg class=\"ic chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n        <\/div>\n        <div class=\"fade\"><\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\">Outlook is one line of body text inside a KV row; \"Edit prefs\" is a quiet text link. The need/deep tags exist but are one 9px word \u2014 a single flat layer, no starter-vs-depth distinction. (Tag copy \"need\"/\"deep\" verified in <code>splitDnaChips<\/code> usage; league-pill wording approximated.)<\/div>\n  <\/div>\n\n  <!-- PROPOSED hub -->\n  <div class=\"slot proposed\">\n    <div class=\"slotlbl\">Proposed \u2014 hub<\/div>\n    <div class=\"phone\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"pagetitle\">Find a Trade<\/div>\n        <div class=\"leaguepill\"><span class=\"dot\"><\/span>Trading in&nbsp;\u00b7&nbsp;<b>Dynasty Degens<\/b><\/div>\n\n        <div class=\"dna2\">\n          <div class=    <div class=\"body\">\n            <div class=\"trow\"><span class=\"t\">Fully Guided<\/span><span class=\"rec\">recommended<\/span><\/div>\n            <div class=\"d\">We read your roster &amp; league and walk you to the best deals.<\/div>\n          <\/div>\n          <svg class=\"ic chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n        <\/div>\n        <div class=\"modecard\">\n          <div class=\"icwell\"><svg class=\"ic\" width=\"22\" height=\"22\" viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg><\/div>\n          <div class=\"body\">\n            <div class=\"trow\"><span class=\"t\">Specific Team<\/span><\/div>\n            <div class=\"d\">Target one league-mate and see only mutual-gain deals.<\/div>\n          <\/div>\n          <svg class=\"ic chev\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n        <\/div>\n        <div class=\"fade\"><\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\">Outlook = four tappable cards <b>in the panel itself<\/b> (tap switches directly; the Edit button opens the full sheet for position prefs). Selected card carries the ice border + tick and names its bias in plain words. Needs are two-tier: flare <b>STARTER NEED<\/ r.<\/div><div class=\"meta\">WR \u00b7 ARI<\/div><\/div><\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--first1)\"><div><div class=\"nm\">2027 2nd (mid)<\/div><div class=\"meta\">PICK<\/div><\/div><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"vbar\">\n            <span class=\"lbl\">Dynasty value swing<\/span>\n            <div class=\"who\">You win<\/div>\n            <div class=\"margin\">by <b>+380<\/b> &nbsp;\u00b7&nbsp; <span class=\"pick\">a Mid 3rd<\/span> (\u2248 0.2 firsts)<\/div>\n            <div class=\"dtrack\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"fillr\"><\/div><div class=\"cen\"><\/div><\/div>\n            <div class=\"scalerow\"><span>\u22121st<\/span><span>\u22122nd<\/span><span>Even<\/span><span>+2nd<\/span><span>+1st<\/span><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"fade\"><\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\">The deck never says <i>why<\/i> it looks the way it does. The outlook silently biased generation (young + picks coming back), but a user who forgot \u2014 or never noticed \u2014 the setting has no way to connect the deck's shape to it.<\/div>\n  <\/div>\n\n  <!-- PROPOSED deck with receipt -->\n  <div class=\"slot proposed\">\n    <div class=\"slotlbl\">Proposed \u2014 results carry the bias receipt<\/div>\n    <div class=\"phone\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"modebar\">\n          <div class=\"back\"><svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Hub<\/div>\n          <div class=\"swrow\">\n            <span class=\"sw on\">Guided<\/span><span class=\"sw\">Team<\/span><span class=\"sw\">Player<\/span><span class=\"sw\">Calc<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"receipt\">\n          <span class=\"tick\"><\/span>\n          <span>Leaning <b>young + picks<\/b> \u2014 you're <b>Rebuilding<\/b>.<\/span>\n          <span class=\"chg\">Change<\/span>\n        <\/div>\n\n        <div class=\"tcard\">\n          <div class=\"hdr\">\n            <span class=\"lbl\">Trade with<\/span>\n            <div class=\"opp\">@rebuild_randy<\/div>\n          <\/div>\n          <div class=\"strength\">\n            <div class=\"row\"><span class=\"lbl\">Match strength<\/span><span class=\"val\">78<\/span><\/div>\n            <div class=\"track\"><div class=\"fill\" style=\"width:78%\"><\/div><\/div>\n          <\/div>\n          <div class=\"split\">\n            <div class=\"side\">\n              <div class=\"ticklbl\">You send<\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--rb)\"><div><div class=\"nm\">Breece Hall<\/div><div class=\"meta\">RB \u00b7 NYJ<\/div><\/div><\/div>\n            <\/div>\n            <div class=\"vrule\"><\/div>\n            <div class=\"side\">\n              <div class=\"ticklbl\">You get<\/div>\n              <div class=\"prow\"><div><div class=\"nm\">Marvin Harrison Jr.<\/div><div class=\"meta\">WR \u00b7 ARI \u00b7 23 yrs<\/div><\/div><\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--first1)\"><div><div class=\"nm\">2027 2nd (mid)<\/div><div class=\"meta\">PICK<\/div><\/div><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"vbar\">\n            <span class=\"lbl\">Dynasty value swing<\/span>\n            <div class=\"who\">You win<\/div>\n            <div class=\"margin\">by <b>+380<\/b> &nbsp;\u00b7&nbsp; <span class=\"pick\">a Mid 3rd<\/span> (\u2248 0.2 firsts)<\/div>\n            <div class=\"dtrack\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"fillr\"><\/div><div class=\"cen\"><\/div><\/div>\n            <div class=\"scalerow\"><span>\u22121st<\/span><span>\u22122nd<\/span><span>Even<\/span><span>+2nd<\/span><span>+1st<\/span><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"fade\"><\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\">One quiet receipt line above the deck (flare tick = informational, ADR-005): <i>\"Leaning young + picks \u2014 you're Rebuilding.\"<\/i> The ice <b>Change<\/b> link jumps straight to the outlook cards. Same construction as the shipped \"Built from your updated board\" note, so it costs no new pattern.<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"note\">\n  <h2>Why this design<\/h2>\n  <ul>\n    <li><b>Edit is a button, not a whisper (#212).<\/b> The panel's edit affordance becomes a bordered secondary button with a pencil glyph \u2014 the Chalkline secondary-button spec \u2014 and the outlook itself is directly tappable, so \"you can change this\" is self-evident with zero context.<\/li>\n    <li><b>Outlook reads as a choice, not a fact (#231).<\/b> Four cards replace one line of body text; each names its bias in plain words (\"Leans young + picks\"), so picking one already teaches what it does \u2014 nothing to learn later.<\/li>\n    <li><b>The bias gets a receipt where it acts (#231).<\/b> Results carry one sentence connecting deck shape to the setting, with an inline Change link \u2014 closing the loop between cause and effect on the same screen.<\/li>\n    <li><b>Two-tier needs without duplication (#206).<\/b> STARTER NEED (flare) marks a lineup hole; DEPTH (dim) marks a thin bench; a chip carries at most one tag because starter need implies depth. One quiet key line defines both terms in league-speak.<\/li>\n    <li><b>Tenets check (#205):<\/b> the panel still shows exactly three things (outlook, chasing, shopping); everything added is either a label made honest or a tap made obvious \u2014 no new data, no new concepts to explain.<\/li>\n  <\/ul>\n<\/div>\n\n<\/body>\n<\/html>\n"}, {"label": "Find-a-trade layout", "fb": "#216 #209", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish Lab \u2014 Find-a-Trade-for-Player Layout (#216 \u00b7 #209)<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink0:#0C0E11; --ink1:#13161B; --ink2:#1A1E25; --ink3:#232833;\n  --line:#262C35; --lineStrong:#59647A;\n  --chalk:#ECEFF4; --dim:#97A1AE; --faint:#626C79;\n  --ice:#56D9EC; --icePress:#3FC2D6; --onIce:#071013;\n  --flare:#F0508C; --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n  --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n  --first1:#2dd4bf;\n  --f-display:'Barlow Condensed','Arial Narrow',sans-serif;\n  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;\n  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:#07090c;color:var(--chalk);font-family:var(--f-ui);\n  display:flex;flex-direction:column;align-items:center;padding:24px 12px 64px;gap:22px;min-height:100vh}\n\n.note{max-width:840px;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:13px;line-height:1.55;color:var(--dim)}\n.note h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:22px;color:var(--chalk);margin-bottom:4px}\n.note h2{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:13px;color:var(--ice);margin:12px 0 4px}\n.note b{color:var(--chalk)}\n.note ul{margin:4px 0 0 18px} .note li{margin:3px 0}\n.q{border-left:3px solid var(--lineStrong);padding-left:10px;margin:6px 0;font-style:italic}\n\n.pairwrap{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;align-items:flex-start}\n.slot{display:flex;flex-direction:column;gap:8px;align-items:center}\n.slotlbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:7px}\n.slotlbl::before{content:\"\";width:3px;height:12px;background:var(--lineStrong)}\n.slot.proposed .slotlbl{color:var(--ice)} .slot.proposed .slotlbl::before{background:var(--ice)}\n.caption{max-width:390px;font-size:12px;line-height:1.5;color:var(--dim);text-align:left}\n\n.phone{width:390px;background:var(--ink0);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55)}\n.status{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:var(--dim);font-family:var(--f-mono)}\n.scroll{padding:4px 16px 14px;display:flex;flex-direction:column;gap:12px}\n.fade{height:34px;margin:-10px -16px -14px;background:linear-gradient(transparent,var(--ink0))}\n/* the fade is a mockup viewport cue, not a UI gradient */\n\n.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.pdot{width:7px;height:7px;border-radius:2px;flex:0 0 auto;display:inline-block}\n.pos-qb{background:var(--qb)} .pos-rb{background:var(--rb)} .pos-wr{background:var(--wr)} .pos-te{background:var(--te)}\nsvg.ic{stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:square}\n\n/* mode bar */\n.back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ice);margin-bottom:8px}\n.swrow{display:flex;gap:6px;overflow:hidden}\n.sw{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink1);font-size:12px;color:var(--dim);min-height:32px;display:flex;align-items:center}\n.sw.on{border-color:var(--ice);background:var(--ink2);color:var(--chalk)}\n.mtitle{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:20px;margin-top:6px}\n.mhint{font-size:12px;color:var(--dim);line-height:1.4}\n\n/* controls card + pin board */\n.ctrlcard{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}\n.board{display:flex;gap:8px}\n.col{flex:1;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:110px;display:flex;flex-direction:column;gap:8px}\n.col.for{border-top:2px solid var(--pos)} .col.away{border-top:2px solid var(--flare)}\n.colh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}\n.col.for .colh{color:var(--pos)} .col.away .colh{color:var(--flare)}\n.mini{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 8px;border-radius:4px;background:var(--ink2);font-size:12.5px;font-weight:600}\n.mini .x{margin-left:auto;color:var(--faint);font-size:12px}\n.addbtn{min-height:40px;border:1px dashed var(--lineStrong);background:transparent;color:var(--dim);border-radius:4px;font-size:12px;font-family:var(--f-ui);cursor:pointer}\n.cta{width:100%;height:44px;border:none;border-radius:4px;background:var(--ice);color:var(--onIce);font-family:var(--f-ui);font-weight:700;font-size:14px;cursor:pointer}\n\n/* asset ideas panel (current) */\n.ideas{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}\n.ticklbl{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n.ticklbl::before{content:\"\";width:3px;height:12px;background:var(--ice)}\n.assetname{font-size:16px;font-weight:600;margin-top:2px}\n.subtitle{font-size:13px;color:var(--dim);line-height:1.45;margin-bottom:4px}\n.grouph{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim);margin-top:8px}\n.idea{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:2px;background:var(--ink1)}\n.idea .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}\n.idea .sides{display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap;overflow:hidden}\n.idea .sides svg{flex:0 0 auto;color:var(--faint)}\n.idea .meta{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.idea .meta .mono{font-family:var(--f-mono)}\n.diff{padding:2px 8px;border-radius:2px;border:1px solid rgba(34,197,94,.4);font-family:var(--f-mono);font-size:12px;color:var(--pos);flex:0 0 auto}\n.diff.neg{border-color:rgba(239,68,68,.4);color:var(--neg)}\n\n/* trade card (proposed lead + current buried) */\n.tcard{background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}\n.tcard .opp{font-size:16px;font-weight:600;margin-top:1px}\n.split{display:flex;gap:12px}\n.split .vrule{width:1px;background:var(--line)}\n.side{flex:1;display:flex;flex-direction:column;gap:6px}\n.prow{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-left:3px solid var(--rb);border-radius:8px;background:var(--ink2);padding:8px}\n.prow .nm{font-size:13px;font-weight:600;line-height:1.25}\n.prow .meta{font-size:11px;color:var(--dim);font-family:var(--f-mono)}\n.vbar{display:flex;flex-direction:column;gap:6px}\n.vbar .who{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:18px;color:var(--pos)}\n.vbar .margin{font-size:12px;color:var(--dim)}\n.vbar .margin b{font-family:var(--f-mono);color:var(--pos);font-weight:600}\n.vbar .pick{color:var(--first1);font-weight:600}\n.dtrack{position:relative;height:14px;background:var(--ink3);border-radius:2px;margin-top:2px}\n.dtrack .cen{position:absolute;left:50%;top:-4px;width:1px;height:22px;background:var(--lineStrong)}\n.dtrack .t1{position:absolute;left:21.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .t2{position:absolute;left:78.5%;top:-4px;width:1px;height:22px;background:var(--line)}\n.dtrack .fillr{position:absolute;left:50%;width:13%;height:14px;background:var(--pos);border-radius:2px}\n.scalerow{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:9px;color:var(--faint)}\n.moreopts{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ice);cursor:pointer;margin-top:2px}\n.moreopts svg{width:14px;height:14px}\n.lessopts{color:var(--dim)}\n\n/* scroll annotation */\n.buriednote{display:flex;align-items:center;gap:8px;background:var(--ink2);border:1px dashed var(--lineStrong);border-radius:4px;padding:8px 10px;font-size:12px;color:var(--warn)}\n.buriednote svg{flex:0 0 auto;color:var(--warn)}\n\n.tabbar{display:flex;border-top:1px solid var(--line);background:var(--ink1)}\n.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 12px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}\n.tab svg{width:20px;height:20px;stroke:var(--faint);stroke-width:1.75;fill:none;stroke-linecap:square}\n.tab.on{color:var(--ice)} .tab.on svg{stroke:var(--ice)}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"note\">\n  <h1>Polish Lab \u00b7 Find-a-Trade-for-Player Layout \u2014 #216 + #209<\/h1>\n  <p><b>Operator asks:<\/b><\/p>\n  <p class=\"q\">#216 \u2014 \"When finding a trade for a player, the trade suggestion and value bar should be presented first. The other options should be hidden by default and available to display via a 'More options' link under the trade away section of a suggested trade.\"<\/p>\n  <p class=\"q\">#209 \u2014 \"Trade away and trade for sides should be swapped (trade away on left, trade for on right).\"<\/p>\n  <p style=\"margin-top:8px\">CURRENT is a faithful recreation of the single-pin flow in <b>mobile/src/screens/TradesScreen.tsx<\/b> (pin board + <b>AssetIdeasPanel.tsx<\/b> + deck) and <b>TradeCard.tsx<\/b>. <b>Code fact:<\/b> today's TradeCard already renders \"YOU SEND\" (trade away) on the <b>left<\/b> \u2014 the #209 swap actually applies to the pin board, which renders TRADE FOR left / TRADE AWAY right and so contradicts the card directly above/below it.<\/p>\n<\/div>\n\n<!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 ROW \u00b7 current vs proposed collapsed vs proposed expanded \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n<div class=\"pairwrap\">\n\n  <!-- CURRENT -->\n  <div class=\"slot\">\n    <div class=\"slotlbl\">Current \u2014 single-pin result view (from code)<\/div>\n    <div class=\"phone\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"back\"><svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Hub<\/div>\n        <div class=\"swrow\">\n          <span class=\"sw\">Guided<\/span><span class=\"sw\">Team<\/span><span class=\"sw on\">Player<\/span><span class=\"sw\">Calc<\/span>\n        <\/div>\n\n        <div class=\"ctrlcard\">\n          <div class=\"board\">\n            <div class=\"col for\">\n              <div class=\"colh\">Trade for<\/div>\n              <button class=\"addbtn\">+ Add target<\/button>\n            <\/div>\n            <div class=\"col away\">\n              <div class=\"colh\">Trade away<\/div>\n              <div class=\"mini\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<span class=\"x\">\u2715<\/span><\/div>\n              <button class=\"addbtn\">+ Add asset<\/button>\n            <\/div>\n          <\/div>\n          <button class=\"cta\">Find a Trade<\/button>\n        <\/div>\n\n        <div class=\"ideas\">\n          <div class=\"ticklbl\">Ideas for trading away<\/div>\n          <div class=\"assetname\">Breece Hall<\/div>\n          <div class=\"subtitle\">A better RB back (add pieces to close the gap), a sideways RB swap, or a spread-out package.<\/div>\n\n          <div class=\"grouph\">Upgrade at RB<\/div>\n          <div class=\"idea\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall + 2026 2nd<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Bijan Robinson<\/div>\n              <div class=\"meta\">DynastyDan &nbsp;\u00b7&nbsp; <span class=\"mono\">8010<\/span> \u2194 <span class=\"mono\">8450<\/span><\/div>\n            <\/div>\n            <span class=\"diff\">+440<\/span>\n          <\/div>\n          <div class=\"idea\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall + R. White<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Jahmyr Gibbs<\/div>\n              <div class=\"meta\">tundra_tim &nbsp;\u00b7&nbsp; <span class=\"mono\">7480<\/span> \u2194 <span class=\"mono\">7790<\/span><\/div>\n            <\/div>\n            <span class=\"diff\">+310<\/span>\n          <\/div>\n\n          <div class=\"grouph\">Lateral moves at RB<\/div>\n          <div class=\"idea\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Jonathan Taylor<\/div>\n              <div class=\"meta\">gridiron_gus &nbsp;\u00b7&nbsp; <span class=\"mono\">6800<\/span> \u2194 <span class=\"mono\">6650<\/span><\/div>\n            <\/div>\n            <span class=\"diff neg\">\u2212150<\/span>\n          <\/div>\n\n          <div class=\"grouph\">Downgrade ideas<\/div>\n          <div class=\"idea\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>James Cook + 2027 1st<\/div>\n              <div class=\"meta\">rebuild_randy &nbsp;\u00b7&nbsp; <span class=\"mono\">6800<\/span> \u2194 <span class=\"mono\">7320<\/span><\/div>\n            <\/div>\n            <span class=\"diff\">+520<\/span>\n          <\/div>\n        <\/div>\n\n        <div class=\"buriednote\">\n          <svg class=\"ic\" width=\"16\" height=\"16\" viewBox=\"0 0 20 20\"><path d=\"M10 4v9m0 0-4-4m4 4 4-4\"/><\/svg>\n          The best full trade card + value bar renders below all of this \u2014 off-screen.\n        <\/div>\n        <div class=\"fade\"><\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\">Everything at once: the full Upgrade / Lateral / Downgrade list renders expanded above the deck, and the actual best suggestion (the trade card with its value bar) is pushed below the fold. The pin board also puts TRADE FOR on the left \u2014 the opposite of the trade card, where \"YOU SEND\" is the left column.<\/div>\n  <\/div>\n\n  <!-- PROPOSED collapsed -->\n  <div class=\"slot proposed\">\n    <div class=\"slotlbl\">Proposed \u2014 best trade leads (collapsed)<\/div>\n    <div class=\"phone\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"back\"><svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Hub<\/div>\n        <div class=\"swrow\">\n          <span class=\"sw\">Guided<\/span><span class=\"sw\">Team<\/span><span class=\"sw on\">Player<\/span><span class=\"sw\">Calc<\/span>\n        <\/div>\n\n        <div class=\"ctrlcard\">\n          <div class=\"board\">\n            <div class=\"col away\">\n              <div class=\"colh\">Trade away<\/div>\n              <div class=\"mini\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<span class=\"x\">\u2715<\/span><\/div>\n              <button class=\"addbtn\">+ Add asset<\/button>\n            <\/div>\n            <div class=\"col for\">\n              <div class=\"colh\">Trade for<\/div>\n              <button class=\"addbtn\">+ Add target<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"tcard\">\n          <div class=\"ticklbl\" style=\"margin-bottom:2px\">Best trade for Breece Hall<\/div>\n          <div class=\"opp\">@rebuild_randy<\/div>\n          <div class=\"split\">\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade away<\/div>\n              <div class=\"prow\"><div><div class=\"nm\">Breece Hall<\/div><div class=\"meta\">RB \u00b7 NYJ<\/div><\/div><\/div>\n              <div class=\"moreopts\">More options\n                <svg class=\"ic\" viewBox=\"0 0 20 20\"><path d=\"M7 4l6 6-6 6\"/><\/svg>\n              <\/div>\n            <\/div>\n            <div class=\"vrule\"><\/div>\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade for<\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--rb)\"><div><div class=\"nm\">James Cook<\/div><div class=\"meta\">RB \u00b7 BUF<\/div><\/div><\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--first1)\"><div><div class=\"nm\">2027 1st (mid)<\/div><div class=\"meta\">PICK<\/div><\/div><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"vbar\">\n            <span class=\"lbl\">Dynasty value swing<\/span>\n            <div class=\"who\">You win<\/div>\n            <div class=\"margin\">by <b>+520<\/b> &nbsp;\u00b7&nbsp; <span class=\"pick\">a Mid 3rd<\/span> (\u2248 0.3 firsts)<\/div>\n            <div class=\"dtrack\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"fillr\"><\/div><div class=\"cen\"><\/div><\/div>\n            <div class=\"scalerow\"><span>\u22121st<\/span><span>\u22122nd<\/span><span>Even<\/span><span>+2nd<\/span><span>+1st<\/span><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"fade\"><\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\">One clear thing first: the best suggested trade IS the screen \u2014 full card, value bar immediately visible, no Find button needed (the pin drives it). Sides swapped everywhere: <b>Trade away left, Trade for right<\/b> \u2014 board and card now agree (#209). A quiet ice \"More options\" link sits under the trade-away column (#216).<\/div>\n  <\/div>\n\n  <!-- PROPOSED expanded -->\n  <div class=\"slot proposed\">\n    <div class=\"slotlbl\">Proposed \u2014 \"More options\" expanded<\/div>\n    <div class=\"phone\">\n      <div class=\"status\"><span>9:41<\/span><span>100%<\/span><\/div>\n      <div class=\"scroll\">\n        <div class=\"back\"><svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M12 4l-6 6 6 6\"/><\/svg>Hub<\/div>\n        <div class=\"swrow\">\n          <span class=\"sw\">Guided<\/span><span class=\"sw\">Team<\/span><span class=\"sw on\">Player<\/span><span class=\"sw\">Calc<\/span>\n        <\/div>\n\n        <div class=\"tcard\">\n          <div class=\"ticklbl\" style=\"margin-bottom:2px\">Best trade for Breece Hall<\/div>\n          <div class=\"opp\">@rebuild_randy<\/div>\n          <div class=\"split\">\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade away<\/div>\n              <div class=\"prow\"><div><div class=\"nm\">Breece Hall<\/div><div class=\"meta\">RB \u00b7 NYJ<\/div><\/div><\/div>\n              <div class=\"moreopts lessopts\">Fewer options\n                <svg class=\"ic\" viewBox=\"0 0 20 20\"><path d=\"M4 13l6-6 6 6\"/><\/svg>\n              <\/div>\n            <\/div>\n            <div class=\"vrule\"><\/div>\n            <div class=\"side\">\n              <div class=\"ticklbl\">Trade for<\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--rb)\"><div><div class=\"nm\">James Cook<\/div><div class=\"meta\">RB \u00b7 BUF<\/div><\/div><\/div>\n              <div class=\"prow\" style=\"border-left-color:var(--first1)\"><div><div class=\"nm\">2027 1st (mid)<\/div><div class=\"meta\">PICK<\/div><\/div><\/div>\n            <\/div>\n          <\/div>\n          <div class=\"vbar\">\n            <div class=\"margin\">You win by <b>+520<\/b> &nbsp;\u00b7&nbsp; <span class=\"pick\">a Mid 3rd<\/span><\/div>\n            <div class=\"dtrack\"><div class=\"t1\"><\/div><div class=\"t2\"><\/div><div class=\"fillr\"><\/div><div class=\"cen\"><\/div><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"ideas\">\n          <div class=\"ticklbl\">More trades for Breece Hall<\/div>\n\n          <div class=\"grouph\">Upgrade at RB<\/div>\n          <div class=\"idea\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Hall + 2026 2nd<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Bijan Robinson<\/div>\n              <div class=\"meta\">DynastyDan<\/div>\n            <\/div>\n            <span class=\"diff\">+440<\/span>\n          <\/div>\n          <div class=\"idea\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Hall + R. White<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Jahmyr Gibbs<\/div>\n              <div class=\"meta\">tundra_tim<\/div>\n            <\/div>\n            <span class=\"diff\">+310<\/span>\n          <\/div>\n\n          <div class=\"grouph\">Lateral moves at RB<\/div>\n          <div class=\"idea\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Jonathan Taylor<\/div>\n              <div class=\"meta\">gridiron_gus<\/div>\n            <\/div>\n            <span class=\"diff neg\">\u2212150<\/span>\n          <\/div>\n\n          <div class=\"grouph\">Downgrade ideas<\/div>\n          <div class=\"idea\">\n            <div class=\"main\">\n              <div class=\"sides\"><span class=\"pdot pos-rb\"><\/span>Breece Hall<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg><span class=\"pdot pos-rb\"><\/span>Cook + 2027 1st<\/div>\n              <div class=\"meta\">rebuild_randy&nbsp;&nbsp;\u00b7&nbsp;&nbsp;shown above<\/div>\n            <\/div>\n            <span class=\"diff\">+520<\/span>\n          <\/div>\n        <\/div>\n        <div class=\"fade\"><\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M3 16v-5h3v5zM8.5 16V7h3v9zM14 16v-7h3v7z\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg viewBox=\"0 0 20 20\"><path d=\"M4 6h9m0 0-3-3m3 3-3 3M16 14H7m0 0 3-3m-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><path d=\"M7 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M13 7a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"7\"/><path d=\"M3 10h14M10 3c3 3 3 11 0 14\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"caption\">Tapping \"More options\" expands the same grouped Upgrade / Lateral / Downgrade rows beneath the lead card (which compresses its verdict to one line to stay in view). Rows drop the raw \u2194 value pair \u2014 the signed diff chip carries the number, honoring \"too much info is worse than none\". \"Fewer options\" collapses back.<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"note\">\n  <h2>Why this design<\/h2>\n  <ul>\n    <li><b>Answer first, menu second (#216).<\/b> A user who pins a player wants \"what's my best trade for him?\" \u2014 so the top of the screen IS that answer: one full card with the value bar visible, not a taxonomy of options to study first.<\/li>\n    <li><b>Depth on demand, in place (#216).<\/b> The Upgrade/Lateral/Downgrade groups survive untouched behind \"More options\" under the trade-away column \u2014 the exact spot the operator named \u2014 so power users lose nothing and newcomers never see it uninvited.<\/li>\n    <li><b>One side order everywhere (#209).<\/b> Code check: today's TradeCard already puts \"YOU SEND\" left; it's the pin board that's flipped (TRADE FOR left). Proposed swaps the board to away-left / for-right so board, card, and ideas rows all read give \u2192 get, left \u2192 right.<\/li>\n    <li><b>Fewer numbers per row.<\/b> Idea rows keep only the counterparty + the signed diff chip; the raw value pair (8010 \u2194 8450) moves behind the tap into the calculator, which already itemizes it.<\/li>\n    <li><b>Zero-context labels.<\/b> \"Best trade for Breece Hall\" and \"More trades for Breece Hall\" replace the abstract \"Ideas for trading away\" framing \u2014 no app concepts needed to parse the screen.<\/li>\n  <\/ul>\n<\/div>\n\n<\/body>\n<\/html>\n"}, {"label": "Hub fit-to-screen", "fb": "#218 #219", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish Lab \u2014 Hub Fit-to-Screen (#218/#219)<\/title>\n<style>\n:root{\n  --ink0:#0C0E11; --ink1:#13161B; --ink2:#1A1E25; --ink3:#232833;\n  --line:#262C35; --lineStrong:#59647A;\n  --chalk:#ECEFF4; --dim:#97A1AE; --faint:#626C79;\n  --ice:#56D9EC; --icePress:#3FC2D6; --onIce:#071013;\n  --flare:#F0508C; --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n  --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n  --f-display:'Barlow Condensed','Oswald','Arial Narrow',sans-serif;\n  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;\n  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:#07090c;color:var(--chalk);font-family:var(--f-ui);\n  display:flex;flex-direction:column;align-items:center;padding:24px 12px 64px;gap:20px;min-height:100vh}\n.note{max-width:980px;width:100%;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:13px;line-height:1.55;color:var(--dim)}\n.note h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:22px;color:var(--chalk);margin-bottom:4px}\n.note b{color:var(--chalk)}\n.note ul{margin:6px 0 0 18px}.note li{margin:3px 0}\n.lab{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start}\n.side{display:flex;flex-direction:column;gap:12px;align-items:center}\n.side>.tag{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px;padding:4px 12px;border-radius:2px;border:1px solid var(--line)}\n.tag.cur{color:var(--dim)} .tag.pro{color:var(--ice);border-color:var(--ice)}\n.cap{font-size:12px;color:var(--faint);max-width:420px;text-align:center;line-height:1.5}\n\n/* iPhone 15 Pro\u2013class frame: 390 \u00d7 846 (393\u00d7852pt scaled). */\n.phone{width:390px;height:846px;background:var(--ink0);border:1px solid var(--line);border-radius:22px;overflow:hidden;\n  box-shadow:0 12px 32px rgba(0,0,0,.55);position:relative;display:flex;flex-direction:column}\n.status{height:54px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;font-size:12px;color:var(--dim);font-family:var(--f-mono)}\n.topbar{height:44px;flex:0 0 auto;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px}\n.wordmark{display:flex;align-items:center;gap:8px}\n.wordmark .tick{width:3px;height:14px;background:var(--ice)}\n.wordmark .txt{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase}\n.tbIcons{display:flex;gap:8px}\n.tbIcons svg{stroke:var(--dim)}\n.content{flex:1 1 auto;position:relative;overflow:hidden}\n.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--ink0);padding-bottom:18px}\n.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 4px;font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}\n.tab svg{stroke:var(--faint)}\n.tab.on{color:var(--ice)} .tab.on svg{stroke:var(--ice)}\nsvg.i{fill:none;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter}\n\n/* \u2500\u2500 hub content, parameterized by variant class \u2500\u2500 */\n.stack{display:flex;flex-direction:column}\n.cur .stack{padding:16px;gap:12px}\n.pro .stack{padding:12px;gap:8px}\n.pageTitle{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:22px;line-height:26px}\n.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--dim)}\n\n.leaguepill{display:flex;align-items:center;gap:12px;background:var(--ink1);border:1px solid var(--lineStrong);border-radius:2px}\n.cur .leaguepill{padding:12px 16px;min-height:44px}\n.pro .leaguepill{padding:8px 12px}\n.leaguepill .nm{font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.cur .leaguepill .nm{font- gs and two compact variants. Annotations show exact value changes.<\/p>\n<\/div>\n\n<div class=\"lab\">\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 CURRENT \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"side cur\">\n    <div class=\"tag cur\">Current<\/div>\n    <div>\n      <div class=\"phone\">\n        <div class=\"ann f\" style=\"top:120px;right:8px\">pad 16 \u00b7 gap 12<\/div>\n        <div class=\"ann f\" style=\"top:196px;right:8px\">full pill \u00b7 63pt<\/div>\n        <div class=\"ann f\" style=\"top:330px;right:8px\">stacked labels<\/div>\n        <div class=\"status\"><span>9:41<\/span><span>&#9679;&#9679;&#9679;<\/span><\/div>\n        <div class=\"topbar\">\n          <div class=\"wordmark\"><div class=\"tick\"><\/div><div class=\"txt\">Trade Finder<\/div><\/div>\n          <div class=\"tbIcons\">\n            <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"3.2\"/><path d=\"M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M15.7 4.3l-2.1 2.1M6.4 13.6l-2.1 2.1\"/><\/svg>\n            <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><path d=\"M4 14h12l-1.5-2.5V8a4.5 4.5 0 0 0-9 0v3.5L4 14z\"/><path d=\"M8.5 16.5a1.5 1.5 0 0 0 3 0\"/><\/svg>\n          <\/div>\n        <\/div>\n        <div class=\"content\">\n          <div class=\"stack\">\n            <div class=\"pageTitle\">Find a Trade<\/div>\n            <div class=\"leaguepill\">\n              <div style=\"flex:1;min-width:0\"><div class=\"lbl\">Trading in<\/div><div class=\"nm\">Dynasty Degens Superflex<\/div><\/div>\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><path d=\"M5 8l5 5 5-5\"/><\/svg>\n            <\/div>\n            <div class=\"dna\">\n              <div class=\"dnaTop\"><span class=\"lbl\">Your Trade DNA<\/span><span class=\"dnaEdit\">Edit prefs<\/span><\/div>\n              <div class=\"dnaRow\">\n
