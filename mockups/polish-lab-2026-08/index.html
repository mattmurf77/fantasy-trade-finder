div class=\"ann\" style=\"top:168px;right:8px\">pill &#8594; compact: 63&#8594;46pt<br>(pad 12/16&#8594;8/12, name 16&#8594;13)<\/div>\n      <div class=\"ann\" style=\"top:282px;right:8px\">DNA pad 12&#8594;10, gap 8&#8594;6<br>labels inline: &#8722;34pt<\/div>\n      <div class=\"ann\" style=\"top:420px;right:8px\">card pad-v 12&#8594;9<br>icon well 40&#8594;34<\/div>\n      <div class=\"status\"><span>9:41<\/span><span>&#9679;&#9679;&#9679;<\/span><\/div>\n      <div class=\"topbar\">\n        <div class=\"wordmark\"><div class=\"tick\"><\/div><div class=\"txt\">Trade Finder<\/div><\/div>\n        <div class=\"tbIcons\">\n          <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><circle cx=\"10\" cy=\"10\" r=\"3.2\"/><path d=\"M10 2v3M10 15v3M2 10h3M15 10h3M4.3 4.3l2.1 2.1M13.6 13.6l2.1 2.1M15.7 4.3l-2.1 2.1M6.4 13.6l-2.1 2.1\"/><\/svg>\n          <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\"><path d=\"M4 14h12l-1.5-2.5V8a4.5 4.5 0 0 0-9 0v3.5L4 14z\"/><path d=\"M8.5 16.5a1.5 1.5 0 0 0 3 0\"/><\/svg>\n        <\/div>\n      <\/div>\n      <div class=\"content\">\n        <div class=\"stack\">\n          <div class=\"pageTitle\">Find a Trade<\/div>\n          <div class=\"leaguepill\">\n            <div style=\"flex:1;min-width:0\"><div class=\"lbl\">Trading in<\/div><div class=\"nm\">Dynasty Degens Superflex<\/div><\/div>\n            <svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M5 8l5 5 5-5\"/><\/svg>\n          <\/div>\n          <div class=\"dna\">\n            <div class=\"dnaTop\"><span class=\"lbl\">Your Trade DNA<\/span><span class=\"dnaEdit\">Edit prefs<\/span><\/div>\n            <div class=\"dnaRow\">\n              <span><span class=\"dnaK\">Outlook <\/span>Contend<\/span>\n              <span><span class=\"dnaK\">Untouchables <\/span>2<span class=\"dnaEdit\">&nbsp;&nbsp;Manage<\/span><\/span>\n            <\/div>\n            <div class=\"dnaGroup\">\n              <span class=\"lbl\">Chasing<\/span>\n              <span class=\"chips\">\n                <span class=\"posChip\"><span class=\"pdot\" style=\"background:var(--wr)\"><\/span>WR<\/span>\n                <span class=\"posChip rec\"><span class=\"pdot\" style=\"background:var(--rb)\"><\/span>RB<span class=\"tag\">need<\/span><\/span>\n              <\/span>\n            <\/div>\n            <div class=\"dnaGroup\">\n              <span class=\"lbl\">Shopping<\/span>\n              <span class=\"chips\">\n                <span class=\"posChip rec\"><span class=\"pdot\" style=\"background:var(--te)\"><\/span>TE<span class=\"tag\">deep<\/span><\/span>\n              <\/span>\n            <\/div>\n          <\/div>\n          <div class=\"secLbl\">How do you want to find trades?<\/div>\n          <div class=\"card\">\n            <div class=\"cardIcon\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 22 22\"><path d=\"M3 16l2-9 4 4 2-7 2 7 4-4 2 9zM3 16h16v2H3z\"/><\/svg><\/div>\n            <div style=\"flex:1;min-width:0\">\n              <div class=\"cardTitleRow\"><span class=\"cardTitle\">Fully Guided<\/span><span class=\"recTag\">recommended<\/span><\/div>\n              <div class=\"cardBody\">We read your roster &amp; league and walk you to the best deals.<\/div>\n            <\/div>\n            <svg class=\"i arr\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M8 5l5 5-5 5\"/><\/svg>\n          <\/div>\n          <div class=\"card\">\n            <div class=\"cardIcon\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 22 22\"><path d=\"M8 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M14 9a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg><\/div>\n            <div style=\"flex:1;min-width:0\">\n              <div class=\"cardTitleRow\"><span class=\"cardTitle\">Specific Team<\/span><\/div>\n              <div class=\"cardBody\">Target one league-mate and see only mutual-gain deals.<\/div>\n            <\/div>\n            <svg class=\"i arr\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M8 5l5 5-5 5\"/><\/svg>\n          <\/div>\n          <div class=\"card\">\n            <div class=\"cardIcon\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 22 22\"><path d=\"M14 4h4v4M18 4l-6 6M8 18H4v-4M4 18l6-6\"/><\/svg><\/div>\n            <div style=\"flex:1;min-width:0\">\n              <div class=\"cardTitleRow\"><span class=\"cardTitle\">Specific Player<\/span><\/div>\n              <div class=\"cardBody\">Trade for someone, away someone, or both \u2014 engine fills the rest.<\/div>\n            <\/div>\n            <svg class=\"i arr\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M8 5l5 5-5 5\"/><\/svg>\n          <\/div>\n          <div class=\"card\">\n            <div class=\"cardIcon\"><svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 22 22\"><path d=\"M4 8h12M13 5l3 3-3 3M18 15H6M9 12l-3 3 3 3\"/><\/svg><\/div>\n            <div style=\"flex:1;min-width:0\">\n              <div class=\"cardTitleRow\"><span class=\"cardTitle\">Manual Calculator<\/span><\/div>\n              <div class=\"cardBody\">Hand-build any trade, get the dual-board fairness verdict.<\/div>\n            <\/div>\n            <svg class=\"i arr\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\"><path d=\"M8 5l5 5-5 5\"/><\/svg>\n          <\/div>\n        <\/div>\n        <div class=\"fit\">fits \u2014 everything above the fold, ~70pt spare<\/div>\n      <\/div>\n      <div class=\"tabbar\">\n        <div class=\"tab\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M4 18v-6h4v6M9 18V6h4v12M14 18v-9h4v9\"/><\/svg>Rank<\/div>\n        <div class=\"tab on\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M4 8h12M13 5l3 3-3 3M18 15H6M9 12l-3 3 3 3\"/><\/svg>Trades<\/div>\n        <div class=\"tab\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M8 13a4 4 0 0 1 0-6l2-2a4 4 0 0 1 6 6l-1 1M14 9a4 4 0 0 1 0 6l-2 2a4 4 0 0 1-6-6l1-1\"/><\/svg>Matches<\/div>\n        <div class=\"tab\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><path d=\"M11 3l7 4v8l-7 4-7-4V7z\"/><\/svg>League<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"cap\">Same content, same order, same hierarchy \u2014 a pure density pass. Every card, chip, label and both DNA groups survive; ~120pt reclaimed puts the whole hub above the fold with headroom for a 5-line DNA panel or a longer league name.<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"note\">\n  <h1 style=\"font-size:16px\">What changed &amp; why<\/h1>\n  <ul>\n    <li><b>Screen padding <code>lg 16 \u2192 md 12<\/code> and stack gap <code>md 12 \u2192 sm 8<\/code><\/b> (both existing 4-pt-scale tokens): the hub is a launcher, not a reading surface \u2014 six inter-block gaps at \u22124pt each is the cheapest 32pt on the page.<\/li>\n    <li><b>LeaguePill switches to its existing <code>compact<\/code> variant<\/b> (padding 12/16\u21928/12, name 16\u219213): \u221217pt with zero new code. (If the #223 header-league-switcher ships, this row disappears entirely and the page gains another ~50pt.)<\/li>\n    <li><b>Trade DNA: Chasing/Shopping labels move inline<\/b> (label column beside the chips instead of stacked above), padding 12\u219210, inner gap 8\u21926: \u221234pt while both groups and every chip remain visible.<\/li>\n    <li><b>Mode cards: vertical padding 12\u21929, icon well 40\u219234<\/b> (icon 22\u219220): \u22128pt per card \u00d74. Title/body type untouched, so card hierarchy and tap targets (still \u226558pt tall) hold.<\/li>\n    <li><b>Nothing deleted, nothing reordered<\/b> \u2014 total \u2248 \u2212120pt vs an observed overflow of ~40pt, so the fix also absorbs Dynamic-Type growth and 2-line league names without the scroll returning.<\/li>\n  <\/ul>\n<\/div>\n\n<\/body>\n<\/html>\n"}, {"label": "Empty states \u00b7 progress", "fb": "#229 #230 #234", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish lab \u2014 Empty states &amp; progress (#229 \u00b7 #230 \u00b7 #234)<\/title>\n<style>\n  /* \u2500\u2500 Chalkline tokens (docs/design/design-system.md, ADR-005) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     Canonical hexes; --line-strong is the 2026-07-19 a11y value #59647A.\n     Fonts fall back to Arial Narrow / Helvetica / Menlo \u2014 no external requests. */\n  :root{\n    --ink-0:#0C0E11; --ink-1:#13161B; --ink-2:#1A1E25; --ink-3:#232833;\n    --line:#262C35;  --line-strong:#59647A;\n    --chalk:#ECEFF4; --chalk-dim:#97A1AE; --chalk-faint:#626C79;\n    --ice:#56D9EC; --ice-press:#3FC2D6; --on-ice:#071013; --flare:#F0508C;\n    --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n    --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n    --cond:'Barlow Condensed','Arial Narrow',sans-serif;\n    --ui:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;\n    --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--ink-0);color:var(--chalk);font-family:var(--ui);\n       -webkit-font-smoothing:antialiased;padding:24px 16px 64px}\n  .wrap{max-width:880px;margin:0 auto}\n\n  .note{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;\n        padding:16px 20px;margin-bottom:24px}\n  .note h1{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1;\n           letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;display:flex;\n           align-items:center;gap:10px}\n  .note h1::before{content:\"\";width:16px;height:3px;background:var(--ice);flex:none}\n  .note p,.note ul{margin:0;font-size:13px;line-height:1.55;color:var(--chalk-dim)}\n  .note ul{padding-left:18px;margin-top:6px}\n  .note li{margin-bottom:4px}\n  .note strong{color:var(--chalk);font-weight:600}\n  .note a{color:var(--ice);text-decoration:none}\n\n  .sec{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n       color:var(--chalk-dim);display:flex;align-items:center;gap:8px;margin:32px 0 12px}\n  .sec::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n\n  .compare{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}\n  .col{flex:1 1 390px;max-width:420px}\n  .colcap{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n          color:var(--chalk-dim);margin:0 0 8px;display:flex;align-items:center;gap:8px}\n  .colcap .dot{width:8px;height:8px;border-radius:2px;background:var(--line-strong)}\n  .colcap.prop .dot{background:var(--ice)}\n  .cap{font:400 12px/1.5 var(--ui);color:var(--chalk-faint);margin-top:10px}\n\n  /* \u2500\u2500 iPhone frame \u2500\u2500 */\n  .phone{position:relative;width:390px;background:var(--ink-0);\n         border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}\n  .phone.fixed{height:844px}\n  .statusbar{height:40px;display:flex;align-items:flex-end;justify-content:space-between;\n             padding:0 20px 6px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim)}\n  .batt{display:inline-block;width:20px;height:10px;border:1px solid var(--chalk-dim);\n        border-radius:2px;position:relative}\n  .batt::after{content:\"\";position:absolute;left:1px;top:1px;bottom:1px;width:70%;\n               background:var(--chalk-dim)}\n\n  /* TopBar (global) + stack header */\n  .topbar{height:48px;display:flex;align-items:center;justify-content:space-between;\n          padding:0 16px;border-bottom:1px solid var(--line)}\n  .wordmark{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:600;\n            font-size:17px;letter-spacing:.06em;text-transform:uppercase}\n  .wordmark::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .stackhdr{height:44px;display:flex;align-items:center;padding:0 16px;position:relative}\n  .backctl{display:flex;align-items:center;gap:4px;font:600 14px var(--ui);color:var(--chalk)}\n  .stackhdr .shtitle{position:absolute;left:0;right:0;text-align:center;font-family:var(--cond);\n           font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;\n           pointer-events:none}\n\n  .scroll{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}\n\n  .tick{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n        color:var(--chalk-dim);display:flex;align-items:center;gap:8px;margin-top:4px}\n  .tick::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .divider{height:1px;background:var(--line);margin-top:12px}\n\n  .card{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;padding:16px}\n\n  /* hero */\n  .herohead{display:flex;align-items:center;justify-content:space-between}\n  .lab{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .heroname{font-family:var(--cond);font-weight:600;font-size:22px;line-height:26px;\n            letter-spacing:.03em;text-transform:uppercase;margin-top:8px}\n  .chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}\n  .badge{display:inline-block;padding:2px 6px;border-radius:2px;font:600 11px/14px var(--ui);\n         text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line-strong);\n         color:var(--chalk)}\n  .badge.rankchip{border-radius:4px;font-family:var(--mono);text-transform:none;letter-spacing:0}\n  .joinedchip{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:2px;\n              border:1px solid var(--line-strong)}\n  .joinedchip .n{font:500 13px var(--mono);font-variant-numeric:tabular-nums}\n  .joinedchip .t{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n                 color:var(--chalk-dim)}\n\n  /* stat tiles */\n  .statrow{display:flex;gap:12px}\n  .stat{flex:1;background:var(--ink-1);border:1px solid var(--line);border-radius:8px;\n        padding:16px;display:flex;flex-direction:column;gap:6px}\n  .stat .v{font:600 22px/26px var(--mono);font-variant-numeric:tabular-nums}\n  .stat .lr{display:flex;align-items:center;gap:4px}\n  .stat .sub{font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n\n  /* explore rows */\n  .xrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}\n  .xrow .m{flex:1}\n  .xrow .t{font:600 16px/22px var(--ui)}\n  .xrow .s{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n\n  .emptyline{font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n\n  /* meter */\n  .meter{height:4px;background:var(--ink-3);margin-top:10px}\n  .meter .fill{height:4px;background:var(--ice)}\n  .statbetween{display:flex;justify-content:space-between;align-items:center}\n  .mono{font:500 13px/18px var(--mono);font-variant-numeric:tabular-nums}\n  .hint{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:8px}\n\n  /* leaderboard tabs + rows */\n  .ftabs{display:flex;gap:16px;margin-top:8px}\n  .ftab{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n        color:var(--chalk-dim);padding-bottom:4px;border-bottom:2px solid transparent}\n  .ftab.on{color:var(--chalk);border-bottom-color:var(--ice)}\n  .lbrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}\n  .lbrow:last-child{border-bottom:0}\n  .lbrow .rk{font:500 13px var(--mono);color:var(--chalk-dim);width:24px;text-align:right}\n  .lbrow .nm{font:600 14px var(--ui);flex:1}\n  .lbrow .sc{font:500 13px var(--mono);font-variant-numeric:tabular-nums}\n  .lbrow .un{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-faint)}\n\n  /* buttons */\n  .btn{height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;\n       font:600 14px var(--ui);padding:0 16px}\n  .btn.primary{background:var(--ice);color:var(--on-ice)}\n  .btn.secondary{border:1px solid var(--line-strong);color:var(--chalk)}\n  .btn.ghost{color:var(--chalk-dim)}\n  .btn.compact{height:36px;font-size:13px}\n\n  /* tab bar */\n  .tabbar{display:flex;border-top:1px solid var(--line);background:var(--ink-0)}\n  .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;\n      color:var(--chalk-dim);font:600 11px var(--ui)}\n  .tb.on{color:var(--ice)}\n  .phone.fixed .tabbar{position:absolute;left:0;right:0;bottom:0}\n\n  svg.i{display:block}\n\n  /* \u2500\u2500 PROPOSED building blocks \u2500\u2500 */\n  .ringrow{display:flex;gap:16px;align-items:center}\n  .ringwrap{position:relative;width:72px;height:72px;flex:none}\n  .ringwrap .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;\n                justify-content:center;gap:1px}\n  .ringwrap .rv{font:600 16px var(--mono);font-variant-numeric:tabular-nums}\n  .ringwrap .rl{font:600 8px var(--ui);letter-spacing:.06em;color:var(--chalk-dim);text-transform:uppercase}\n  .ptitle{font:600 16px/22px var(--ui)}\n  .pbody{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n\n  .segbar{display:flex;gap:2px;margin-top:8px}\n  .segbar .seg{flex:1;height:8px;background:var(--ink-3)}\n  .segbar .seg.you{background:var(--ice)}\n  .seglab{display:flex;justify-content:space-between;margin-top:6px}\n  .unlockline{font:400 13px/18px var(--ui);color:var(--chalk);margin-top:8px}\n  .unlockline .em{color:var(--ice);font-weight:600}\n  .foldline{font:400 13px/18px var(--ui);color:var(--chalk-dim);border-top:1px solid var(--line);\n            margin-top:12px;padding-top:10px}\n\n  .exlabel{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--flare)}\n  .extrade{border:1px solid var(--line);border-radius:8px;background:var(--ink-0);\n           padding:10px 12px;margin-top:8px}\n  .excols{display:flex;gap:0;margin-top:6px}\n  .excol{flex:1;padding:0 10px}\n  .excol:first-child{padding-left:0;border-right:1px solid var(--line)}\n  .excol:last-child{padding-right:0;padding-left:12px}\n  .exhead{font:600 10px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n          color:var(--chalk-dim);display:flex;align-items:center;gap:6px}\n  .exhead::before{content:\"\";width:3px;height:10px;background:var(--ice)}\n  .exrow{display:flex;align-items:center;gap:6px;margin-top:6px}\n  .prail{width:3px;height:14px;flex:none}\n  .exnm{font:600 12px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .expos{font:600 9px var(--ui);letter-spacing:.05em}\n  .exmeter{height:4px;background:var(--ink-3);margin-top:10px;position:relative}\n  .exmeter .f{height:4px;background:var(--pos);width:88%}\n  .exmeterlab{display:flex;justify-content:space-between;margin-top:4px}\n\n  .rationale{margin-top:36px}\n  .rationale .card{padding:16px 20px}\n  .rationale h2{font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.03em;\n                text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}\n  .rationale h2::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .rationale ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--chalk-dim)}\n  .rationale li{margin-bottom:6px}\n  .rationale strong{color:var(--chalk);font-weight:600}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"note\">\n    <h1>Empty states &amp; progress \u2014 #229 \u00b7 #230 \u00b7 #234<\/h1>\n    <p><strong>CURRENT<\/strong> is recreated from <code style=\"color:var(--chalk)\">mobile/src/screens/LeagueScreen.tsx<\/code>\n       and <code style=\"color:var(--chalk)\">MatchesScreen.tsx<\/code> (day-one league: 0/11 joined, nothing ranked, no matches).\n       <strong>PROPOSED<\/strong> is one system: empty states lead with the solo value that works today,\n       a single progress module owns every unlock, and zero-rows collapse until they have data.<\/p>\n    <ul>\n      <li>#229 \u2014 League home's zeros are honest but demotivating; lead with solo value.<\/
