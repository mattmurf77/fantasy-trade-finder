align-self:flex-start;padding:0;justify-content:flex-start\">Invite leaguemates<\/div>\n\n            <div class=\"foldline\">Leaderboards and contrarian ranks appear here once\n              3 leaguemates have ranked.<\/div>\n          <\/div>\n\n          <div class=\"tick\">Explore<\/div>\n          <div>\n            <div class=\"xrow\">\n              <div class=\"m\"><div class=\"t\">League rankings<\/div>\n                <div class=\"s\">Every team ranked by total roster value<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg>\n            <\/div>\n            <div class=\"xrow\">\n              <div class=\"m\"><div class=\"t\">Free agents<\/div>\n                <div class=\"s\">Best available players in this league<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg>\n            <\/div>\n          <\/div>\n\n          <div class=\"btn secondary\" style=\"margin-top:16px\">Switch league<\/div>\n        <\/div>\n        <div class=\"tabbar\">\n          <div class=\"tb\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M4 18V10M11 18V4M18 18v-6\"/><\/svg>Rank<\/div>\n          <div class=\"tb\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M4 8h12l-3-3M18 14H6l3 3\"/><\/svg>Trades<\/div>\n          <div class=\"tb\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M9 13 13 9M8 14a3 3 0 0 1 0-4l2-2a3 3 0 0 1 4 0M14 8a3 3 0 0 1 0 4l-2 2a3 3 0 0 1-4 0\"/><\/svg>Matches<\/div>\n          <div class=\"tb on\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M4 16 5 8l4 3 2-6 2 6 4-3 1 8H4Z\"/><\/svg>League<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">Same truthful zeros, reframed: solo value leads with one action; the ring\n        (your ranking \u2014 the foundation, #230), the 12-slot leaguemate bar and the unlock sentence\n        (#234) live in ONE module; the joined chip, coverage card, empty contrarian card, empty\n        league leaderboard and 0-value Matches tiles are all absorbed by it until they have data.\n        The tiles/sections return unchanged once their counts are &gt; 0.<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 SECTION B \u2014 Matches empty inbox \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">B \u00b7 Matches \u2014 empty inbox<\/div>\n  <div class=\"compare\">\n\n    <div class=\"col\">\n      <div class=\"colcap\"><span class=\"dot\"><\/span>Current \u2014 MatchesScreen.tsx<\/div>\n      <div class=\"phone fixed\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"topbar\">\n          <span class=\"wordmark\">Trade Finder<\/span>\n          <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M10 3a5 5 0 0 1 5 5v3l1.5 2.5H3.5L5 11V8a5 5 0 0 1 5-5Z\"/><path d=\"M8.5 16a1.5 1.5 0 0 0 3 0\"/><\/svg>\n        <\/div>\n        <div class=\"scroll\" style=\"height:660px\">\n          <div style=\"display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--ink-1)\">\n            <div style=\"flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;background:var(--ink-3);border-bottom:2px solid var(--ice);font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase\">Mutual matches<\/div>\n            <div style=\"flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)\">Awaiting them<\/div>\n          <\/div>\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 24px;text-align:center\">\n            <div style=\"font-family:var(--cond);font-weight:600;font-size:22px;line-height:26px;letter-spacing:.03em;text-transform:uppercase\">No matches in any of your leagues yet<\/div>\n            <div class=\"emptyline\">Head to the Trades tab and swipe on some proposals. When a\n              leaguemate likes the same trade, it'll show up here.<\/div>\n            <div class=\"btn primary\" style=\"width:200px\">Go to Trades<\/div>\n            <div class=\"btn ghost compact\">Refresh<\/div>\n            <div class=\"emptyline\" style=\"color:var(--chalk-dim);text-decoration:underline;text-underline-offset:3px\">How matching works<\/div>\n          <\/div>\n        <\/div>\n        <div class=\"tabbar\">\n          <div class=\"tb\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M4 18V10M11 18V4M18 18v-6\"/><\/svg>Rank<\/div>\n          <div class=\"tb\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M4 8h12l-3-3M18 14H6l3 3\"/><\/svg>Trades<\/div>\n          <div class=\"tb on\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M9 13 13 9M8 14a3 3 0 0 1 0-4l2-2a3 3 0 0 1 4 0M14 8a3 3 0 0 1 0 4l-2 2a3 3 0 0 1-4 0\"/><\/svg>Matches<\/div>\n          <div class=\"tb\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M4 16 5 8l4 3 2-6 2 6 4-3 1 8H4Z\"/><\/svg>League<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">Current empty state (with S4 PRD-05 CTAs on). Correct action, but it\n        never says WHY the inbox is empty or what would fill it.<\/div>\n    <\/div>\n\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>Proposed \u2014 same story as League home<\/div>\n      <div class=\"phone fixed\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"topbar\">\n          <span class=\"wordmark\">Trade Finder<\/span>\n          <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M10 3a5 5 0 0 1 5 5v3l1.5 2.5H3.5L5 11V8a5 5 0 0 1 5-5Z\"/><path d=\"M8.5 16a1.5 1.5 0 0 0 3 0\"/><\/svg>\n        <\/div>\n        <div class=\"scroll\" style=\"height:660px\">\n          <div style=\"display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--ink-1)\">\n            <div style=\"flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;background:var(--ink-3);border-bottom:2px solid var(--ice);font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase\">Mutual matches<\/div>\n            <div style=\"flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)\">Awaiting them<\/div>\n          <\/div>\n          <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 24px;text-align:center\">\n            <div style=\"font-family:var(--cond);font-weight:600;font-size:22px;line-height:26px;letter-spacing:.03em;text-transform:uppercase\">No mutual matches yet<\/div>\n            <div class=\"emptyline\">A match needs two boards \u2014 yours and a leaguemate's. You can\n              find trade ideas right now; matches appear when a leaguemate likes the same trade.<\/div>\n            <div class=\"btn primary\" style=\"width:200px\">Find a trade<\/div>\n            <div class=\"card\" style=\"width:100%;padding:12px 16px;text-align:left\">\n              <div class=\"statbetween\">\n                <span class=\"lab\">Leaguemates ranked<\/span>\n                <span class=\"mono\" style=\"font-size:12px\">1/12 <span style=\"color:var(--chalk-dim)\">(you)<\/span><\/span>\n              <\/div>\n              <div class=\"segbar\" style=\"margin-top:6px\">\n                <span class=\"seg you\"><\/span><span class=\"seg\"><\/span><span class=\"seg\"><\/span>\n                <span class=\"seg\"><\/span><span class=\"seg\"><\/span><span class=\"seg\"><\/span>\n                <span class=\"seg\"><\/span><span class=\"seg\"><\/span><span class=\"seg\"><\/span>\n                <span class=\"seg\"><\/span><span class=\"seg\"><\/span><span class=\"seg\"><\/span>\n              <\/div>\n              <div class=\"unlockline\" style=\"font-size:12px;line-height:17px\"><span class=\"em\">2 more\n                ranked leaguemates<\/span> unlocks mutual matches.<\/div>\n            <\/div>\n            <div class=\"emptyline\" style=\"color:var(--chalk-dim);text-decoration:underline;text-underline-offset:3px\">How matching works<\/div>\n          <\/div>\n        <\/div>\n        <div class=\"tabbar\">\n          <div class=\"tb\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M4 18V10M11 18V4M18 18v-6\"/><\/svg>Rank<\/div>\n          <div class=\"tb\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M4 8h12l-3-3M18 14H6l3 3\"/><\/svg>Trades<\/div>\n          <div class=\"tb on\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M9 13 13 9M8 14a3 3 0 0 1 0-4l2-2a3 3 0 0 1 4 0M14 8a3 3 0 0 1 0 4l-2 2a3 3 0 0 1-4 0\"/><\/svg>Matches<\/div>\n          <div class=\"tb\"><svg class=\"i\" width=\"22\" height=\"22\" viewBox=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\"><path d=\"M4 16 5 8l4 3 2-6 2 6 4-3 1 8H4Z\"/><\/svg>League<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">Explains the mechanic in one sentence, points at the action that works\n        today, and repeats the SAME unlock module (1/12 \u00b7 \"2 more unlocks\") so League home and\n        Matches never tell different stories. \"Refresh\" is dropped \u2014 pull-to-refresh covers it.<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 RATIONALE \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"rationale\">\n    <div class=\"card\">\n      <h2>Rationale<\/h2>\n      <ul>\n        <li><strong>Lead with what works now (#229):<\/strong> the day-one page opens with a\n          \"Works right now\" card \u2014 consensus-priced trade finding needs zero leaguemates \u2014 with\n          exactly one action (Find a trade). The sample trade is honestly labeled\n          <strong>EXAMPLE \u2014 not from your league<\/strong> (flare = informational highlight, ADR-005).<\/li>\n        <li><strong>One progress module owns every unlock (#230 + #234):<\/strong> the ring makes\n          \"rank your players\" the visibly unfinished foundation, the 12-slot bar counts ranked\n          leaguemates (you included, honestly: \"1/12 (you)\"), and one plain unlock sentence \u2014\n          \"2 more ranked leaguemates unlocks mutual matches\" \u2014 replaces the buried\n          \"100% to go\" coverage hint.<\/li>\n        <li><strong>Kill demotivating zero-rows:<\/strong> the 0-value Matches tiles, the empty\n          contrarian card, the 0% coverage card and the empty league leaderboard collapse into one\n          line inside the progress module (\"appear once 3 leaguemates have ranked\") and return\n          unchanged the moment they have real data \u2014 five \"nothing here\" surfaces become one\n          forward-looking one.<\/li>\n        <li><strong>Honesty rules respected:<\/strong> no fabricated league data, no fake sample\n          rows presented as real; every number shown is the same truth the current screen shows,\n          restated as distance-to-unlock instead of absence.<\/li>\n        <li><strong>One story across surfaces:<\/strong> the Matches empty state reuses the same\n          unlock module and the same primary action, so League home and Matches can never\n          disagree about what to do next (mirrors the FB-91 tiles-mirror-segments rule).<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n<\/div>\n<\/body>\n<\/html>\n"}, {"label": "Rank chooser", "fb": "#232 #233", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish lab \u2014 Rank method consolidation (#232 \u00b7 #233)<\/title>\n<style>\n  /* \u2500\u2500 Chalkline tokens (docs/design/design-system.md, ADR-005) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n     Canonical hexes; --line-strong is the 2026-07-19 a11y value #59647A.\n     Tier hexes from docs/cross-client-invariants.md.\n     Fonts fall back to Arial Narrow / Helvetica / Menlo \u2014 no external requests. */\n  :root{\n    --ink-0:#0C0E11; --ink-1:#13161B; --ink-2:#1A1E25; --ink-3:#232833;\n    --line:#262C35;  --line-strong:#59647A;\n    --chalk:#ECEFF4; --chalk-dim:#97A1AE; --chalk-faint:#626C79;\n    --ice:#56D9EC; --ice-press:#3FC2D6; --on-ice:#071013; --flare:#F0508C;\n    --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n    --qb:#F97316; --rb:#22C55E; --wr:#3B82F6; --te:#A855F7;\n    --tier-firsts-4plus:#f87171; --tier-firsts-3:#e879f9; --tier-firsts-2:#fbbf24;\n    --tier-first-1:#2dd4bf; --tier-second:#38bdf8; --tier-third:#f472b6;\n    --tier-fourth:#a3e635; --tier-fa:#7a7f96;\n    --cond:'Barlow Condensed','Arial Narrow',sans-serif;\n    --ui:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;\n    --mono:'IBM Plex Mono','SF Mono',Menlo,monospace;\n  }\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--ink-0);color:var(--chalk);font-family:var(--ui);\n       -webkit-font-smoothing:antialiased;padding:24px 16px 64px}\n  .wrap{max-width:880px;margin:0 auto}\n\n  .note{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;\n        padding:16px 20px;margin-bottom:24px}\n  .note h1{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1;\n           letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;display:flex;\n           align-items:center;gap:10px}\n  .note h1::before{content:\"\";width:16px;height:3px;background:var(--ice);flex:none}\n  .note p,.note ul{margin:0;font-size:13px;line-height:1.55;color:var(--chalk-dim)}\n  .note ul{padding-left:18px;margin-top:6px}\n  .note li{margin-bottom:4px}\n  .note strong{color:var(--chalk);font-weight:600}\n\n  .sec{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n       color:var(--chalk-dim);display:flex;align-items:center;gap:8px;margin:32px 0 12px}\n  .sec::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n\n  .compare{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}\n  .col{flex:1 1 390px;max-width:420px;display:flex;flex-direction:column;gap:20px}\n  .colcap{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n          color:var(--chalk-dim);margin:0 0 -8px;display:flex;align-items:center;gap:8px}\n  .colcap .dot{width:8px;height:8px;border-radius:2px;background:var(--line-strong)}\n  .colcap.prop .dot{background:var(--ice)}\n  .cap{font:400 12px/1.5 var(--ui);color:var(--chalk-faint)}\n\n  .phone{position:relative;width:390px;background:var(--ink-0);\n         border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}\n  .phone.fixed{height:844px}\n  .statusbar{height:40px;display:flex;align-items:flex-end;justify-content:space-between;\n             padding:0 20px 6px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim)}\n  .batt{display:inline-block;width:20px;height:10px;border:1px solid var(--chalk-dim);\n        border-radius:2px;position:relative}\n  .batt::after{content:\"\";position:absolute;left:1px;top:1px;bottom:1px;width:70%;\n               background:var(--chalk-dim)}\n  .topbar{height:48px;display:flex;align-items:center;justify-content:space-between;\n          padding:0 16px;border-bottom:1px solid var(--line)}\n  .wordmark{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:600;\n            font-size:17px;letter-spacing:.06em;text-transform:uppercase}\n  .wordmark::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .stackhdr{height:44px;display:flex;align-items:center;justify-content:space-between;\n            padding:0 16px;position:relative}\n  .backctl{display:flex;align-items:center;gap:4px;font:600 14px var(--ui);color:var(--chalk);z-index:1}\n  .stackhdr .shtitle{position:absolute;left:0;right:0;text-align:center;font-family:var(--cond);\n           font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;\n           pointer-events:none}\n  .moreways{font:600 13px var(--ui);color:var(--chalk-dim);z-index:1}\n  .shtitle.narrow{left:36px !important;right:140px !important;text-align:left !important}\n\n  .scroll{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}\n  .lab{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .mono{font:500 13px/18px var(--mono);font-variant-numeric:tabular-nums}\n  .heading{font-family:var(--cond);font-weight:600;font-size:22px;line-height:26px;\n           letter-spacing:.03em;text-transform:uppercase}\n\n  /* RankHome callout + cards */\n  .callout{display:flex;gap:8px;background:var(--ink-2);border:1px solid var(--line-strong);\n           border-radius:4px;padding:12px}\n  .callout .tx{font:400 13px/19px var(--ui);color:var(--chalk-dim);flex:1}\n  .callout .tx b{color:var(--chalk);font-weight:500}\n  .mcard{background:var(--ink-1);border:1px solid var(--line);border-radius:4px;\n         padding:12px;display:flex;flex-direction:column;gap:8px}\n  .mcard.featured{border-color:var(--ice)}\n  .mhead{display:flex;align-items:center;gap:8px}\n  .mtitle{font:600 16px/22px var(--ui);flex:1}\n  .rectag{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--flare)}\n  .mbody{font:400 13px/19px var(--ui);color:var(--chalk-dim)}\n  .mfoot{display:flex;align-items:center;justify-content:space-between}\n  .thint{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-faint)}\n  .meter4{display:flex;gap:3px}\n  .meter4 span{width:14px;height:4px;border-radius:2px;background:var(--ink-3)}\n  .meter4 span.on{background:var(--ice)}\n  .axis{display:flex;align-items:center;gap:8px;margin-top:4px}\n  .axis .ln{flex:1;height:1px;background:var(--line)}\n  .mixnote{font:400 13px/18px var(--ui);color:var(--chalk-faint);text-align:center}\n\n  /* sheet */\n  .sheetstage{position:relative;width:390px;height:800px;border:1px solid var(--line-strong);\n              border-radius:8px;overflow:hidden;background:var(--ink-0)}\n  .scrim{position:absolute;inset:0;background:rgba(7,9,12,0.78)}\n  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ink-2);\n         border:1px solid var(--line);border-radius:8px 8px 0 0;padding:16px 16px 32px;\n         display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 32px rgba(0,0,0,.55)}\n  .grabber{align-self:center;width:32px;height:4px;border-radius:2px;background:var(--line-strong);\n           margin-bottom:8px}\n  .srow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:4px;\n        border-bottom:1px solid var(--line)}\n  .srow .m{flex:1}\n  .srow .t{font:600 16px/22px var(--ui);display:flex;align-items:center;gap:8px}\n  .srow .s{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-top:2px}\n  .sheetsub{font:400 13px/18px var(--ui);color:var(--chalk-dim);margin-bottom:8px}\n\n  /* buttons */\n  .btn{height:40px;border-radius:4px;display:flex;align-items:center;justify-content:center;\n       font:600 14px var(--ui);padding:0 16px}\n  .btn.primary{background:var(--ice);color:var(--on-ice)}\n  .btn.secondary{border:1px solid var(--line-strong);color:var(--chalk)}\n  .btn.ghost{color:var(--chalk-dim)}\n  .btn.compact{height:36px;font-size:13px}\n  .btn.dis{opacity:.45}\n\n  /* quick set walk */\n  .fmt{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--ink-1)}\n  .fmt div{flex:1;min-height:36px;display:flex;align-items:center;justify-content:center;\n           font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .fmt div.on{background:var(--ink-3);color:var(--chalk);border-bottom:2px solid var(--ice)}\n  .postabs{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--ink-1)}\n  .postabs div{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;\n               font:600 11px var(--ui);letter-spacing:.08em;color:var(--chalk-dim);\n               border-bottom:2px solid transparent}\n  .postabs div.on{background:var(--ink-3);color:var(--chalk);border-bottom-color:var(--qb)}\n  .stephead{display:flex;align-items:center;gap:8px}\n  .stephead .tl{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;\n                color:var(--tier-firsts-4plus);display:flex;align-items:center;gap:8px}\n  .stephead .tl::before{content:\"\";width:3px;height:14px;background:var(--tier-firsts-4plus)}\n  .stephead .pg{margin-left:auto;font:600 11px var(--ui);letter-spacing:.08em;\n                text-transform:uppercase;color:var(--chalk-dim)}\n  .stephint{font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n  .search{height:40px;background:var(--ink-2);border:1px solid var(--line-strong);border-radius:4px;\n          display:flex;align-items:center;padding:0 12px;font:400 14px var(--ui);color:var(--chalk-faint)}\n  .grid{display:flex;flex-direction:column;gap:4px}\n  .grow{display:flex;gap:4px}\n  .chip{flex:1;min-height:48px;background:var(--ink-1);border:1px solid var(--line);border-radius:4px;\n        padding:6px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px}\n  .chip.sel{border-color:var(--ice)}\n  .chip .nm{font:600 12px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n            display:flex;align-items:center;gap:4px}\n  .chip .meta{display:flex;align-items:center;gap:6px}\n  .chip .tm{font:600 11px var(--ui);letter-spacing:.5px;color:var(--chalk-dim);text-transform:uppercase}\n  .chip .ag{font:500 11px var(--mono);color:var(--chalk-dim)}\n  .chip .tr{font:600 11px var(--ui);letter-spacing:.5px;text-transform:uppercase}\n  .walkfoot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:8px;\n            padding:12px;background:var(--ink-0);border-top:1px solid var(--line)}\n  .walkfoot .btn.grow1{flex:1}\n\n  /* proposed chooser */\n  .roletag{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}\n  .subrow{border-top:1px solid var(--line);margin-top:2px;padding-top:8px;\n          font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n  .subrow b{color:var(--chalk);font-weight:600}\n  .morehdr{display:flex;align-items:center;gap:8px;padding:12px 4px 4px;font:600 14px var(--ui);\n           color:var(--chalk)}\n  .qrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}\n  .qrow .m{flex:1}\n  .qrow .t{font:600 14px/20px var(--ui)}\n  .qrow .s{font:400 13px/18px var(--ui);color:var(--chalk-dim)}\n\n  svg.i{display:block}\n\n  .rationale{margin-top:36px}\n  .rationale .card{background:var(--ink-1);border:1px solid var(--line);border-radius:8px;\n                   padding:16px 20px}\n  .rationale h2{font-family:var(--cond);font-weight:600;font-size:18px;letter-spacing:.03em;\n                text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px}\n  .rationale h2::before{content:\"\";width:3px;height:14px;background:var(--ice)}\n  .rationale ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--chalk-dim)}\n  .rationale li{margin-bottom:6px}\n  .rationale strong{color:var(--chalk);font-weight:600}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"note\">\n    <h1>Rank method consolidation \u2014 #232 \u00b7 #233<\/h1>\n    <p><strong>CURRENT<\/strong> is recreated from <code style=\"color:var(--chalk)\">RankHomeScreen.tsx<\/code>\n       (5-card chooser), the <code style=\"color:var(--chalk)\">RankMenu<\/code> sheet in\n       <code style=\"color:var(--chalk)\">TabNav.tsx<\/code> (7 rows), and\n       <code style=\"color:var(--chalk)\">QuickSetTiersScreen.tsx<\/code> (empty-tier CTA, #159/#217 state).\n       <strong>PROPOSED<\/strong>: one chooser with three outcome-labeled primary paths + a\n       \"More ways to rank\" disclosure, Quick rank presented as a follow-on pass (not a peer),\n       and an action-first empty-tier CTA.<\/p>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 SECTION A \u2014 chooser surfaces \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">A \u00b7 Choosing how to rank \u2014 two surfaces today, one proposed<\/div>\n  <div class=\"compare\">\n\n    <!-- CURRENT column: two frames -->\n    <div class=\"col\">\n      <div class=\"colcap\"><span class=\"dot\"><\/span>Current 1 of 2 \u2014 RankHome chooser (5 cards)<\/div>\n      <div class=\"phone\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle\">Rank<\/span>\n          <span class=\"backctl\"><svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#ECEFF4\" stroke-width=\"1.75\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Back<\/span>\n        <\/div>\n        <div class=\"scroll\">\n          <div class=\"heading\">Build your board<\/div>\n\n          <div class=\"callout\">\n            <svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F0508C\" stroke-width=\"1.75\"><path d=\"M3 7h11l-2.5-2.5M17 13H6l2.5 2.5\"/><\/svg>\n            <div class=\"tx\"><b>Every trade we suggest is priced off this board.<\/b> The closer it\n              matches what you really believe, the better the deals we find \u2014 sharper targets,\n              fairer offers, fewer duds. Five ways to build it; pick how hands-on you want to be.<\/div>\n          <\/div>\n\n          <div class=\"mcard featured\">\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M4 10.5 8.5 15 16 6\"/><\/svg>\n              <span class=\"mtitle\">Tap players into tiers<\/span><span class=\"rectag\">recommended<\/span>\n            <\/div>\n            <div class=\"mbody\">We deal you one value tier at a time \u2014 tap the players who belong,\n              save, next. The fastest route to a board good enough to trade off.<\/div>\n            <div class=\"mfoot\"><span class=\"thint\">~2 min per position<\/span>\n              <span class=\"meter4\"><span class=\"on\"><\/span><span><\/span><span><\/span><span><\/span><\/span><\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 17v-6M10 17V3M17 17v-9\"/><\/svg>\n              <span class=\"mtitle\">Answer quick head-to-heads<\/span>\n            <\/div>\n            <div class=\"mbody\">We show you three players \u2014 you put them in order. A few seconds\n              each, and your board builds itself from the pattern of your answers.<\/div>\n            <div class=\"mfoot\"><span class=\"thint\">30 sec at a time<\/span>\n              <span class=\"meter4\"><span class=\"on\"><\/span><span><\/span><span><\/span><span><\/span><\/span><\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 7h11l-2.5-2.5M17 13H6l2.5 2.5\"/><\/svg>\n              <span class=\"mtitle\">Price players in picks<\/span>\n            <\/div>\n            <div class=\"mbody\">One player at a time: worth two 1sts? One? A mid 2nd? Each answer\n              locks in a value everyone in your league understands the same way.<\/div>\n            <div class=\"mfoot\"><span class=\"thint\">~5 min for your top 50<\/span>\n              <span class=\"meter4\"><span class=\"on\"><\/span><span class=\"on\"><\/span><span><\/span><span><\/span><\/span><\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 15 4 8l3.5 2.5L10 5l2.5 5.5L16 8l1 7H3Z\"/><\/svg>\n              <span class=\"mtitle\">Sort players into groups<\/span>\n            <\/div>\n            <div class=\"mbody\">Drag players into value groups, from untouchable to bench. You\n              decide the shape of your board \u2014 we handle the exact numbers inside each group.<\/div>\n            <div class=\"mfoot\"><span class=\"thint\">~10 min per position<\/span>\n              <span class=\"meter4\"><span class=\"on\"><\/span><span class=\"on\"><\/span><span class=\"on\"><\/span><span><\/span><\/span><\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 14l4-4 3 3 7-7\"/><path d=\"M13 6h4v4\"/><\/svg>\n              <span class=\"mtitle\">Order every player yourself<\/span>\n            <\/div>\n            <div class=\"mbody\">The full list, in your exact order, top to bottom. Nothing inferred,\n              nothing suggested \u2014 total control over every slot.<\/div>\n            <div class=\"mfoot\"><span class=\"thint\">The long way \u2014 your way<\/span>\n              <span class=\"meter4\"><span class=\"on\"><\/span><span class=\"on\"><\/span><span class=\"on\"><\/span><span class=\"on\"><\/span><\/span><\/div>\n          <\/div>\n\n          <div class=\"axis\"><span class=\"thint\">We steer<\/span><span class=\"ln\"><\/span><span class=\"thint\">You steer<\/span><\/div>\n          <div class=\"mixnote\">Mix them anytime \u2014 every method writes to the same board, and you\n            can fine-tune any player later. Change your pick in Settings.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">Reached from \"More ways to rank\" in Quick set's header. Five peer cards;\n        effort is encoded twice (time hint + hands-on meter) and the axis label is an\n        abstraction (\"we steer / you steer\").<\/div>\n\n      <div class=\"colcap\"><span class=\"dot\"><\/span>Current 2 of 2 \u2014 Rank-tab action sheet (7 rows)<\/div>\n      <div class=\"sheetstage\">\n        <div class=\"scrim\"><\/div>\n        <div class=\"sheet\">\n          <div class=\"grabber\"><\/div>\n          <div class=\"heading\">Rank<\/div>\n          <div class=\"sheetsub\">Pick how you want to rank players.<\/div>\n          <div class=\"srow\"><div class=\"m\"><div class=\"t\">Quick set <span class=\"rectag\">recommended<\/span><\/div>\n            <div class=\"s\">Tap players into pick-value tiers, one tier at a time \u2014 the fastest board<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"srow\"><div class=\"m\"><div class=\"t\">Quick rank<\/div>\n            <div class=\"s\">Order players within each tier \u2014 tap them best-first, tier by tier<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"srow\"><div class=\"m\"><div class=\"t\">Trios<\/div>\n            <div class=\"s\">3-at-a-time swipe ranking<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"srow\"><div class=\"m\"><div class=\"t\">Pick Anchors<\/div>\n            <div class=\"s\">Say what each player is worth in draft picks \u2014 4 1sts down to no value<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"srow\"><div class=\"m\"><div class=\"t\">Tiers<\/div>\n            <div class=\"s\">Drag players into pick-value tiers (4+ 1sts down to FA)<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"srow\"><div class=\"m\"><div class=\"t\">Overall Ranks<\/div>\n            <div class=\"s\">Drag rows or tap a rank number to re-order your board by hand<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"srow\"><div class=\"m\"><div class=\"t\">Trends<\/div>\n            <div class=\"s\">See your biggest movers and how you differ from consensus<\/div><\/div>\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <div class=\"btn ghost\" style=\"margin-top:8px\">Cancel<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">Opened by the Rank tab / \"More ways to rank\" (flag\n        <span class=\"mono\" style=\"font-size:11px\">ux.rank_tab_destination<\/span> on). Seven peer\n        rows with different names for the same things the chooser lists (\"Quick set\" vs \"Tap\n        players into tiers\", \"Trios\" vs \"head-to-heads\") \u2014 the #232 confusion.<\/div>\n    <\/div>\n\n    <!-- PROPOSED column: one frame -->\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>Proposed \u2014 one chooser, both entry points<\/div>\n      <div class=\"phone\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle\">Rank<\/span>\n          <span class=\"backctl\"><svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#ECEFF4\" stroke-width=\"1.75\"><path d=\"M10 3 5 8l5 5\"/><\/svg>Back<\/span>\n        <\/div>\n        <div class=\"scroll\">\n          <div class=\"heading\">Build your board<\/div>\n\n          <div class=\"callout\">\n            <svg class=\"i\" width=\"18\" height=\"18\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#F0508C\" stroke-width=\"1.75\"><path d=\"M3 7h11l-2.5-2.5M17 13H6l2.5 2.5\"/><\/svg>\n            <div class=\"tx\"><b>Trades are priced off this board.<\/b> The better it matches you,\n              the better the deals we find.<\/div>\n          <\/div>\n\n          <div class=\"mcard featured\">\n            <div class=\"mhead\">\n              <span class=\"roletag\">Fastest<\/span>\n              <span style=\"flex:1\"><\/span><span class=\"rectag\">recommended<\/span>\n            <\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#56D9EC\" stroke-width=\"1.75\"><path d=\"M4 10.5 8.5 15 16 6\"/><\/svg>\n              <span class=\"mtitle\">Quick set<\/span>\n            <\/div>\n            <div class=\"mbody\">Tap players into value tiers, one tier at a time. A usable board\n              in a few minutes per position.<\/div>\n            <div class=\"subrow\"><b>Then, if you want:<\/b> Quick rank \u2014 a follow-on pass that\n              fine-tunes the order inside each tier. Offered when you finish.<\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\"><span class=\"roletag\">Most precise<\/span><\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 17v-6M10 17V3M17 17v-9\"/><\/svg>\n              <span class=\"mtitle\">Head-to-heads<\/span>\n            <\/div>\n            <div class=\"mbody\">Put three players in order at a time \u2014 a few seconds each, and\n              your board sharpens with every answer.<\/div>\n          <\/div>\n\n          <div class=\"mcard\">\n            <div class=\"mhead\"><span class=\"roletag\">Most control<\/span><\/div>\n            <div class=\"mhead\">\n              <svg class=\"i\" width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 14l4-4 3 3 7-7\"/><path d=\"M13 6h4v4\"/><\/svg>\n              <span class=\"mtitle\">Your full board<\/span>\n            <\/div>\n            <div class=\"mbody\">Drag every player into your exact order. Nothing inferred,\n              nothing suggested.<\/div>\n          <\/div>\n\n          <div class=\"morehdr\">\n            More ways to rank\n            <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M3 6l5 5 5-5\"/><\/svg>\n          <\/div>\n          <div style=\"border:1px solid var(--line);border-radius:4px;padding:0 12px;background:var(--ink-1)\">\n            <div class=\"qrow\"><div class=\"m\"><div class=\"t\">Pick Anchors<\/div>\n              <div class=\"s\">Price players in draft picks, one at a time<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n            <div class=\"qrow\"><div class=\"m\"><div class=\"t\">Tiers board<\/div>\n              <div class=\"s\">Drag players between tiers on the full board<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n            <div class=\"qrow\" style=\"border-bottom:0\"><div class=\"m\"><div class=\"t\">Trends<\/div>\n              <div class=\"s\">Your biggest movers vs consensus<\/div><\/div>\n              <svg class=\"i\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"#97A1AE\" stroke-width=\"1.75\"><path d=\"M6 3l5 5-5 5\"/><\/svg><\/div>\n          <\/div>\n\n          <div class=\"mixnote\">Every method writes to the same board \u2014 mix anytime.<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">One content model rendered on both surfaces: as this screen (from\n        \"More ways to rank\" in a rank header) and as the Rank-tab sheet (same three cards +\n        disclosure, scrolling). Shown with the disclosure OPEN; it defaults closed. Labels are\n        outcomes (<b>Fastest / Most precise / Most control<\/b>) instead of the hands-on meter and\n        steer axis; the same names appear everywhere (\"Quick set\" is called Quick set on the card,\n        in headers, and in the walk). Quick rank is a sub-line of Quick set, not a peer row.<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 SECTION B \u2014 empty-tier CTA \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"sec\">B \u00b7 Quick set \u2014 the empty-tier primary button (#233)<\/div>\n  <div class=\"compare\">\n\n    <div class=\"col\">\n      <div class=\"colcap\"><span class=\"dot\"><\/span>Current \u2014 QuickSetTiersScreen.tsx (0 selected)<\/div>\n      <div class=\"phone fixed\" style=\"height:700px\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle narrow\">Quick Set Tiers<\/span>\n          <span><\/span>\n          <span class=\"moreways\">More ways to rank<\/span>\n        <\/div>\n        <div class=\"scroll\" style=\"gap:8px\">\n          <div class=\"fmt\"><div class=\"on\">1QB PPR<\/div><div>SF TEP<\/div><\/div>\n          <div class=\"postabs\"><div class=\"on\">QB<\/div><div>RB<\/div><div>WR<\/div><div>TE<\/div><\/div>\n          <div class=\"stephead\"><span class=\"tl\">4+ 1sts<\/span><span class=\"pg\">Tier 1 of 8<\/span><\/div>\n          <div class=\"stephint\">Tap every QB who belongs in 4+ 1sts, then save to move on. Each\n            card shows the tier the player is in now.<\/div>\n          <div class=\"search\">Search QBs\u2026<\/div>\n          <div class=\"grid\">\n            <div class=\"grow\">\n              <div class=\"chip\"><span class=\"nm\">Josh Allen<\/span>\n                <span class=\"meta\"><span class=\"tm\">BUF<\/span><span class=\"ag\">29<\/span><span class=\"tr\" style=\"color:var(--tier-firsts-2)\">2 1sts<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Lamar Jackson<\/span>\n                <span class=\"meta\"><span class=\"tm\">BAL<\/span><span class=\"ag\">29<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Jayden Daniels<\/span>\n                <span class=\"meta\"><span class=\"tm\">WAS<\/span><span class=\"ag\">25<\/span><span class=\"tr\" style=\"color:var(--tier-firsts-2)\">2 1sts<\/span><\/span><\/div>\n            <\/div>\n            <div class=\"grow\">\n              <div class=\"chip\"><span class=\"nm\">Patrick Mahomes<\/span>\n                <span class=\"meta\"><span class=\"tm\">KC<\/span><span class=\"ag\">30<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Jalen Hurts<\/span>\n                <span class=\"meta\"><span class=\"tm\">PHI<\/span><span class=\"ag\">27<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">C.J. Stroud<\/span>\n                <span class=\"meta\"><span class=\"tm\">HOU<\/span><span class=\"ag\">24<\/span><span class=\"tr\" style=\"color:var(--tier-second)\">2nd<\/span><\/span><\/div>\n            <\/div>\n            <div class=\"grow\">\n              <div class=\"chip\"><span class=\"nm\">Joe Burrow<\/span>\n                <span class=\"meta\"><span class=\"tm\">CIN<\/span><span class=\"ag\">29<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Caleb Williams<\/span>\n                <span class=\"meta\"><span class=\"tm\">CHI<\/span><span class=\"ag\">24<\/span><span class=\"tr\" style=\"color:var(--tier-second)\">2nd<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Drake Maye<\/span>\n                <span class=\"meta\"><span class=\"tm\">NE<\/span><span class=\"ag\">23<\/span><span class=\"tr\" style=\"color:var(--tier-second)\">2nd<\/span><\/span><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div class=\"walkfoot\">\n          <div class=\"btn ghost compact dis\">Back<\/div>\n          <div class=\"btn secondary compact\">Skip<\/div>\n          <div class=\"btn primary grow1\">No players for this tier<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">The #159 label: with zero chips selected the primary reads\n        \"No players for this tier\" (last tier: \"No players here &amp; finish\"). It states a fact,\n        not an action \u2014 users scanning for \"Continue\" don't find one, and it sits NEXT to a Skip\n        that does the identical thing at 0 selected.<\/div>\n    <\/div>\n\n    <div class=\"col\">\n      <div class=\"colcap prop\"><span class=\"dot\"><\/span>Proposed \u2014 action-first, one advance path<\/div>\n      <div class=\"phone fixed\" style=\"height:700px\">\n        <div class=\"statusbar\"><span>9:41<\/span><span class=\"batt\"><\/span><\/div>\n        <div class=\"stackhdr\">\n          <span class=\"shtitle narrow\">Quick Set Tiers<\/span>\n          <span><\/span>\n          <span class=\"moreways\">More ways to rank<\/span>\n        <\/div>\n        <div class=\"scroll\" style=\"gap:8px\">\n          <div class=\"fmt\"><div class=\"on\">1QB PPR<\/div><div>SF TEP<\/div><\/div>\n          <div class=\"postabs\"><div class=\"on\">QB<\/div><div>RB<\/div><div>WR<\/div><div>TE<\/div><\/div>\n          <div class=\"stephead\"><span class=\"tl\">4+ 1sts<\/span><span class=\"pg\">Tier 1 of 8<\/span><\/div>\n          <div class=\"stephint\">Tap every QB who belongs in 4+ 1sts, then save to move on. Each\n            card shows the tier the player is in now.<\/div>\n          <div class=\"search\">Search QBs\u2026<\/div>\n          <div class=\"grid\">\n            <div class=\"grow\">\n              <div class=\"chip\"><span class=\"nm\">Josh Allen<\/span>\n                <span class=\"meta\"><span class=\"tm\">BUF<\/span><span class=\"ag\">29<\/span><span class=\"tr\" style=\"color:var(--tier-firsts-2)\">2 1sts<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Lamar Jackson<\/span>\n                <span class=\"meta\"><span class=\"tm\">BAL<\/span><span class=\"ag\">29<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Jayden Daniels<\/span>\n                <span class=\"meta\"><span class=\"tm\">WAS<\/span><span class=\"ag\">25<\/span><span class=\"tr\" style=\"color:var(--tier-firsts-2)\">2 1sts<\/span><\/span><\/div>\n            <\/div>\n            <div class=\"grow\">\n              <div class=\"chip\"><span class=\"nm\">Patrick Mahomes<\/span>\n                <span class=\"meta\"><span class=\"tm\">KC<\/span><span class=\"ag\">30<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Jalen Hurts<\/span>\n                <span class=\"meta\"><span class=\"tm\">PHI<\/span><span class=\"ag\">27<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">C.J. Stroud<\/span>\n                <span class=\"meta\"><span class=\"tm\">HOU<\/span><span class=\"ag\">24<\/span><span class=\"tr\" style=\"color:var(--tier-second)\">2nd<\/span><\/span><\/div>\n            <\/div>\n            <div class=\"grow\">\n              <div class=\"chip\"><span class=\"nm\">Joe Burrow<\/span>\n                <span class=\"meta\"><span class=\"tm\">CIN<\/span><span class=\"ag\">29<\/span><span class=\"tr\" style=\"color:var(--tier-first-1)\">1st<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Caleb Williams<\/span>\n                <span class=\"meta\"><span class=\"tm\">CHI<\/span><span class=\"ag\">24<\/span><span class=\"tr\" style=\"color:var(--tier-second)\">2nd<\/span><\/span><\/div>\n              <div class=\"chip\"><span class=\"nm\">Drake Maye<\/span>\n                <span class=\"meta\"><span class=\"tm\">NE<\/span><span class=\"ag\">23<\/span><span class=\"tr\" style=\"color:var(--tier-second)\">2nd<\/span><\/span><\/div>\n            <\/div>\n          <\/div>\n\n          <!-- selected-state inset -->\n          <div style=\"margin-top:16px;border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px\">\n            <div class=\"lab\" style=\"margin-bottom:8px\">With 1+ selected (unchanged behavior)<\/div>\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <div class=\"btn ghost compact dis\">Back<\/div>\n              <div class=\"btn secondary compact\">Skip<\/div>\n              <div class=\"btn primary compact\" style=\"flex:1\">Save 4+ 1sts (1)<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div class=\"walkfoot\">\n          <div class=\"btn ghost compact dis\">Back<\/div>\n          <div class=\"btn primary grow1\">Continue \u2014 no QBs this high<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"cap\">At 0 selected the primary reads\n        <b>\"Continue \u2014 no QBs this high\"<\/b> (last tier: \"Continue &amp; finish\") and the Skip\n        secondary is hidden \u2014 at zero selections Skip and the primary were behaviorally identical,\n        so only one advance control remains. Tap a chip and the footer instantly reverts to\n        Back / Skip / \"Save 4+ 1sts (1)\" (inset), where Skip regains its distinct meaning:\n        advance WITHOUT saving your taps.<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 RATIONALE \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"rationale\">\n    <div class=\"card\">\n      <h2>Rationale<\/h2>\n      <ul>\n        <li><strong>One chooser, not two (#232):<\/strong> the RankHome cards and the Rank-tab\n          sheet currently describe the same flows under different names (\"Quick set\" vs \"Tap\n          players into tiers\", \"Trios\" vs \"head-to-heads\"). The proposal is one content model \u2014\n          three primary cards + one disclosure \u2014 rendered as either a sheet or a screen, with one\n          name per method used everywhere.<\/li>\n        <li><strong>Outcome labels beat effort abstractions:<\/strong> FASTEST / MOST PRECISE /\n          MOST CONTROL answers the only question a new user has (\"which one should I use?\") in\n          their own words; the hands-on meter, duplicate time hints and the WE STEER / YOU STEER\n          axis all required learning the app's mental model first (tenet: zero-context UX).<\/li>\n        <li><strong>Quick rank is a refinement, not a method:<\/strong> it only operates on tiers\n          Quick set already built, and the app itself offers it at Quick set's finish \u2014 listing it\n          as a peer row is the #232 confusion in miniature. It moves into the Quick set card as\n          \"Then, if you want: Quick rank\".<\/li>\n        <li><strong>Advanced paths survive, demoted:<\/strong> Pick Anchors, the Tiers drag board\n          and Trends keep their rows behind \"More ways to rank\" (default collapsed) \u2014 simple &gt;\n          complex without deleting power-user routes; 5 cards + 7 sheet rows become 3 cards + 1\n          disclosure.<\/li>\n        <li><strong>\"Continue \u2014 no players this high\" over \"Skip \u2014 no players here\" (#233):<\/strong>\n          Continue is the verb users scan for in the primary slot (the exact expectation #233\n          reports); it states the outcome positionally (\"no QBs this high\" \u2014 the walk moves DOWN\n          the ladder, so lower tiers are still coming) rather than a bare fact; and it lets the\n          redundant Skip hide at 0 selected \u2014 two side-by-side buttons that do the same thing is\n          the worse confusion. Skip returns with selections, where it means something different.<\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n\n<\/div>\n<\/body>\n<\/html>\n"}, {"label": "Notifications", "fb": "#225", "html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Polish Lab \u2014 Notifications De-Chalk (#225)<\/title>\n<style>\n:root{\n  --ink0:#0C0E11; --ink1:#13161B; --ink2:#1A1E25; --ink3:#232833;\n  --line:#262C35; --lineStrong:#59647A;\n  --chalk:#ECEFF4; --dim:#97A1AE; --faint:#626C79;\n  --ice:#56D9EC; --onIce:#071013;\n  --flare:#F0508C; --pos:#22C55E; --neg:#EF4444; --warn:#F59E0B;\n  --f-display:'Barlow Condensed','Oswald','Arial Narrow',sans-serif;\n  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;\n  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:#07090c;color:var(--chalk);font-family:var(--f-ui);\n  display:flex;flex-direction:column;align-items:center;padding:24px 12px 64px;gap:20px;min-height:100vh}\n.note{max-width:980px;width:100%;background:var(--ink1);border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-size:13px;line-height:1.55;color:var(--dim)}\n.note h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:22px;color:var(--chalk);margin-bottom:4px}\n.note b{color:var(--chalk)}\n.note ul{margin:6px 0 0 18px}.note li{margin:3px 0}\n.lab{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start}\n.side{display:flex;flex-direction:column;gap:12px;align-items:center}\n.side>.tag{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px;padding:4px 12px;border-radius:2px;border:1px solid var(--line)}\n.tag.cur{color:var(--dim)} .tag.pro{color:var(--ice);border-color:var(--ice)}\n.cap{font-size:12px;color:var(--faint);max-width:400px;text-align:center;line-height:1.5}\n\n.phone{width:390px;background:var(--ink0);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.55);position:relative}\n.status{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:var(--dim);font-family:var(--f-mono)}\nsvg.i{fill:none;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter}\n.ann{position:absolute;z-index:7;font-size:11px;font-family:var(--f-mono);background:rgba(12,14,17,.94);border-radius:2px;padding:2px 6px;line-height:1.45}\n.ann.f{color:var(--flare);border:1px solid var(--flare)}\n.ann.c{color:var(--ice);border:1px solid var(--ice)}\n\n/* \u2500\u2500 iOS push banners (OS chrome depiction, not app UI) \u2500\u2500 */\n.pushzone{padding:10px 10px 16px;background:#101418;display:flex;flex-direction:column;gap:8px}\n.pushzone .zlabel{font-family:var(--f-mono);font-size:11px;color:var(--faint);padding:2px 6px}\n.banner{background:#23262b;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 6px 18px rgba(0,0,0,.4)}\n.appic{width:34px;height:34px;border-radius:8px;background:var(--ink0);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto}\n.appic .tick{width:3px;height:12px;background:var(--ice);margin-right:3px}\n.appic span{font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--chalk)}\n.banner .bt{font-size:13px;font-weight:600;line-height:1.35}\n.banner .bb{font-size:13px;color:#c8cdd4;line-height:1.35;margin-top:1px}\n.banner .when{margin-left:auto;font-size:11px;color:#8a9099;flex:0 0 auto}\n\n/* \u2500\u2500 in-app bell sheet \u2500\u2500 */\n.sheetwrap{position:relative;background:rgba(7,9,12,.78);padding-top:36px}\n.sheet{background:var(--ink2);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:16px 16px 28px;box-shadow:0 12px 32px rgba(0,0,0,.55)}\n.grab{width:32px;height:4px;background:var(--lineStrong);margin:0 auto 8px}\n.shHead{display:flex;align-items:center;justify-content:space-between}\n.shTitle{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:22px}\n.ghost{font-size:13px;font-weight:600;color:var(--dim);padding:6px 8px}\n\n/* current rows: title/body/time stack, no icon (TopBar.tsx styles.item) */\n.crow{border-bottom:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}\n.crow .t{font-size:16px;font-weight:600;line-height:22px}\n.crow .b{font-size:13px;color:var(--dim);line-height:18px}\n.crow .w{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-top:4px}\n\n/* proposed rows: NotificationRow spec \u2014 icon in status color, unread flare square + ink2 fill */\n.prow{border-bottom:1px solid var(--line);padding:12px 8px;display:flex;gap:12px;align-items:flex-start;position:relative}\n.prow.unread{background:var(--ink2)}\n.prow .ic{width:20px;height:20px;flex:0 0 auto;margin-top:1px}\n.prow .t{font-size:14px;font-weight:600;line-height:19px}\n.prow .b{font-size:13px;color:var(--dim);line-height:18px;margin-top:1px}\n.prow .w{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-top:3px}\n.udot{position:absolute;right:10px;top:16px;width:6px;height:6px;background:var(--flare)}\n<\/style>\n<\/head>\n<body>\n\n<div class=\"note\">\n  <h1>Notifications \u2014 De-Chalk Pass (#225)<\/h1>\n  <p><b>Operator ask:<\/b> \"Notifications still have the Claude design vibe with emojis that we've removed from the rest of the app.\"<\/p>\n  <p><b>Left = current<\/b>, with verbatim template strings from <code>backend/server.py<\/code> (<code>create_notification<\/code> / <code>_send_typed_push<\/code>): emoji-prefixed titles on both push and inbox. The mobile bell sheet already strips leading \ud83e\udd1d\u2705\u274c\ud83c\udfaf\ud83d\udd14 from <i>bodies<\/i> (<code>TopBar.tsx<\/code>) \u2014 but titles keep them, and title+body say the same sentence twice. <b>Right = proposed<\/b>: emoji dropped server-side, copy tightened, in-app rows adopt the specced <code>NotificationRow<\/code> (monochrome status-colored glyph + flare unread square).<\/p>\n<\/div>\n\n<div class=\"lab\">\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 CURRENT \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"side\">\n    <div class=\"tag cur\">Current<\/div>\n    <div class=\"phone\">\n      <div class=\"ann f\" style=\"top:64px;right:12px\">emoji as icon<\/div>\n      <div class=\"ann f\" style=\"top:356px;right:12px\">title repeated in body<\/div>\n      <div class=\"status\"><span>9:41<\/span><span>&#9679;&#9679;&#9679;<\/span><\/div>\n\n      <!-- push banners -->\n      <div class=\"pushzone\">\n        <div class=\"zlabel\">iOS push \u2014 current templates (verbatim)<\/div>\n        <div class=\"banner\">\n          <div class=\"appic\"><span class=\"tick\"><\/span><span>TF<\/span><\/div>\n          <div style=\"min-width:0\">\n            <div class=\"bt\">&#127919; Match with @BortlesFan<\/div>\n            <div class=\"bb\">Breece Hall for DK Metcalf<\/div>\n          <\/div>\n          <div class=\"when\">now<\/div>\n        <\/div>\n        <div class=\"banner\">\n          <div class=\"appic\"><span class=\"tick\"><\/span><span>TF<\/span><\/div>\n          <div style=\"min-width:0\">\n            <div class=\"bt\">&#127881; You got your first trade match!<\/div>\n            <div class=\"bb\">@murph matched a trade with you. Tap to review.<\/div>\n          <\/div>\n          <div class=\"when\">2h<\/div>\n        <\/div>\n        <div class=\"banner\">\n          <div class=\"appic\"><span class=\"tick\"><\/span><span>TF<\/span><\/div>\n          <div style=\"min-width:0\">\n            <div class=\"bt\">&#128293; Trade matches are waiting<\/div>\n            <div class=\"bb\">You have 2 unreviewed matches.<\/div>\n          <\/div>\n          <div class=\"when\">1d<\/div>\n        <\/div>\n      <\/div>\n\n      <!-- bell inbox sheet -->\n      <div class=\"sheetwrap\">\n        <div class=\"sheet\">\n          <div class=\"grab\"><\/div>\n          <div class=\"shHead\"><span class=\"shTitle\">Notifications<\/span><span class=\"ghost\">Clear all<\/span><\/div>\n          <div class=\"crow\">\n            <div class=\"t\">&#129309; New trade match with BortlesFan in Dynasty Degens!<\/div>\n            <div class=\"b\">New trade match with BortlesFan in Dynasty Degens! Breece Hall for DK Metcalf<\/div>\n            <div class=\"w\">2m ago<\/div>\n          <\/div>\n          <div class=\"crow\">\n            <div class=\"t\">&#9989; murph accepted your trade in Dynasty Degens<\/div>\n            <div class=\"b\">murph accepted your trade in Dynasty Degens: Jahmyr Gibbs for CeeDee Lamb<\/div>\n            <div class=\"w\">1h ago<\/div>\n          <\/div>\n          <div class=\"crow\">\n            <div class=\"t\">&#10060; TeamJanet declined your trade in Dynasty Degens<\/div>\n            <div class=\"b\">TeamJanet declined your trade in Dynasty Degens: Puka Nacua for Trey McBride<\/div>\n            <div class=\"w\">3h ago<\/div>\n          <\/div>\n          <div class=\"crow\" style=\"border-bottom:0\">\n            <div class=\"t\">&#129309; New leaguemate on Fantasy Trade Finder<\/div>\n            <div class=\"b\">@spags joined Dynasty Degens. More trades may unlock.<\/div>\n            <div class=\"w\">1d ago<\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"cap\">Top: push banners (<code>_send_typed_push<\/code> titles keep \ud83c\udfaf\ud83c\udf89\ud83d\udd25\u23f3\ud83d\udc40\ud83d\udcf0\ud83c\udfc8\ud83d\udc4b\ud83d\udd13). Bottom: the bell sheet \u2014 rows are bare text stacks; bodies are emoji-stripped client-side but restate the whole title before the useful part (the players).<\/div>\n  <\/div>\n\n  <!-- \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 PROPOSED \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 -->\n  <div class=\"side\">\n    <div class=\"tag pro\">Proposed<\/div>\n    <div class=\"phone\">\n      <div class=\"ann c\" style=\"top:64px;right:12px\">plain title \u2014 the app icon<br>already brands the banner<\/div>\n      <div class=\"ann c\" style=\"top:368px;left:12px\">SVG glyph in status color<br>(match / check / x / bell)<\/div>\n      <div class=\"ann c\" style=\"top:344px;right:12px\">unread = flare square<br>+ ink-2 row fill<\/div>\n      <div class=\"status\"><span>9:41<\/span><span>&#9679;&#9679;&#9679;<\/span><\/div>\n\n      <!-- push banners -->\n      <div class=\"pushzone\">\n        <div class=\"zlabel\">iOS push \u2014 proposed templates<\/div>\n        <div class=\"banner\">\n          <div class=\"appic\"><span class=\"tick\"><\/span><span>TF<\/span><\/div>\n          <div style=\"min-width:0\">\n            <div class=\"bt\">Match with @BortlesFan<\/div>\n            <div class=\"bb\">Breece Hall for DK Metcalf. Both boards say yes.<\/div>\n          <\/div>\n          <div class=\"when\">now<\/div>\n        <\/div>\n        <div class=\"banner\">\n          <div class=\"appic\"><span class=\"tick\"><\/span><span>TF<\/span><\/div>\n          <div style=\"min-width:0\">\n            <div class=\"bt\">Your first trade match<\/div>\n            <div class=\"bb\">@murph matched a trade with you. Tap to review.<\/div>\n          <\/div>\n          <div class=\"when\">2h<\/div>\n        <\/div>\n        <div class=\"banner\">\n          <div class=\"appic\"><span class=\"tick\"><\/span><span>TF<\/span><\/div>\n          <div style=\"min-width:0\">\n            <div class=\"bt\">2 matches waiting<\/div>\n            <div class=\"bb\">Your leaguemates have been busy. Tap to review.<\/div>\n          <\/div>\n          <div class=\"when\">1d<\/div>\n        <\/div>\n      <\/div>\n\n      <!-- bell inbox sheet, NotificationRow spec -->\n      <div class=\"sheetwrap\">\n        <div class=\"sheet\">\n          <div class=\"grab\"><\/div>\n          <div class=\"shHead\"><span class=\"shTitle\">Notifications<\/span><span class=\"ghost\">Clear all<\/span><\/div>\n\n          <div class=\"prow unread\">\n            <svg class=\"i ic\" viewBox=\"0 0 20 20\" style=\"stroke:var(--ice)\"><path d=\"M7 12a3.6 3.6 0 0 1 0-5.2l1.8-1.8a3.6 3.6 0 0 1 5.2 5.2l-.9.9M13 8a3.6 3.6 0 0 1 0 5.2l-1.8 1.8a3.6 3.6 0 0 1-5.2-5.2l.9-.9\"/><\/svg>\n            <div style=\"min-width:0;flex:1\">\n              <div class=\"t\">Trade match with @BortlesFan<\/div>\n              <div class=\"b\">Breece Hall for DK Metcalf &#183; Dynasty Degens<\/div>\n              <div class=\"w\">2m ago<\/div>\n            <\/div>\n            <span class=\"udot\"><\/span>\n          <\/div>\n\n          <div class=\"prow\">\n            <svg class=\"i ic\" viewBox=\"0 0 20 20\" style=\"stroke:var(--pos)\"><path d=\"M4 10.5l4 4 8-9\"/><\/svg>\n            <div style=\"min-width:0;flex:1\">\n              <div class=\"t\">@murph accepted your trade<\/div>\n              <div class=\"b\">Jahmyr Gibbs for CeeDee Lamb &#183; Tap to ratify on Sleeper<\/div>\n              <div class=\"w\">1h ago<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"prow\">\n            <svg class=\"i ic\" viewBox=\"0 0 20 20\" style=\"stroke:var(--neg)\"><path d=\"M5 5l10 10M15 5L5 15\"/><\/svg>\n            <div style=\"min-width:0;flex:1\">\n              <div class=\"t\">@TeamJanet declined your trade<\/div>\n              <div class=\"b\">Puka Nacua for Trey McBride &#183; Dynasty Degens<\/div>\n              <div class=\"w\">3h ago<\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"prow\" style=\"border-bottom:0\">\n            <svg class=\"i ic\" viewBox=\"0 0 20 20\" style=\"stroke:var(--dim)\"><path d=\"M4 14h12l-1.5-2.5V8a4.5 4.5 0 0 0-9 0v3.5L4 14z\"/><path d=\"M8.5 16.5a1.5 1.5 0 0 0 3 0\"/><\/svg>\n            <div style=\"min-width:0;flex:1\">\n              <div class=\"t\">@spags joined Dynasty Degens<\/div>\n              <div class=\"b\">A new leaguemate can mean new trade matches.<\/div>\n              <div class=\"w\">1d ago<\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n    <div class=\"cap\">Same events, Chalkline construction: 20px stroke glyphs (match=ice, accept=pos, decline=neg, info=chalk-dim), titles lead with the fact, bodies carry only the new information (players &#183; league). Unread rows take the specced flare 6px square + ink-2 fill.<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"note\">\n  <h1 style=\"font-size:16px\">What changed &amp; why<\/h1>\n  <ul>\n    <li><b>Emoji removed at the source<\/b> \u2014 every <code>create_notification<\/code>/<code>_send_typed_push<\/code> title in <code>backend/server.py<\/code> (\ud83e\udd1d \u2705 \u274c \ud83c\udfaf \ud83c\udf89 \u23f3 \ud83d\udcf0 \ud83d\udc40 \ud83c\udfc8 \ud83d\udc4b \ud83d\udd25 \ud83d\udd13) drops its prefix, so the clients' defensive strip regexes become dead code instead of a band-aid. Design-system prohibition #1: no emoji in UI.<\/li>\n    <li><b>In-app rows adopt the specced <code>NotificationRow<\/code><\/b> (components.md): monochrome SVG glyph in the status color replaces the emoji's job; unread = flare 6px square + ink-2 row fill \u2014 signal moves from decoration to structure.<\/li>\n    <li><b>Copy tightened to the app's voice:<\/b> title states the fact (\"@murph accepted your trade\"), body carries only new info (players &#183; league). Kills the current title-repeated-in-body redundancy in match/disposition templates.<\/li>\n    <li><b>Push titles lose the hype register<\/b> (\"\ud83d\udd25 Trade matches are waiting\" \u2192 \"2 matches waiting\") \u2014 the iOS banner already shows the app icon, so the title doesn't need a brand costume; counts move into the title where they scan fastest.<\/li>\n    <li><b>No layout or routing changes<\/b> \u2014 sheet construction, tap-routing (notif.tap_routing_v2), Clear all, and timestamps are untouched; this is a copy + row-construction pass only.<\/li>\n  <\/ul>\n<\/div>\n\n<\/body>\n<\/html>\n"}]</script>
<script>
const PAGES = JSON.parse(document.getElementById('pages').textContent);
const nav = document.getElementById('tabs');
const frame = document.getElementById('frame');
const note = document.getElementById('note');
const notecount = document.getElementById('notecount');
const KEY = 'ftf-polish-lab-2026-08-notes';
let current = 0;
let notes = {};
try { notes = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { notes = {}; }

PAGES.forEach((p, i) => {
  const b = document.createElement('button');
  b.innerHTML = p.label + '<span class="fb">' + p.fb + '</span><span class="dot"></span>';
  b.onclick = () => select(i);
  nav.appendChild(b);
});

function refreshBadges(){
  let n = 0;
  [...nav.children].forEach((b, j) => {
    const has = !!(notes[PAGES[j].label] || '').trim();
    b.classList.toggle('noted', has);
    if (has) n++;
  });
  notecount.textContent = n ? (n + ' of ' + PAGES.length + ' noted') : 'no notes yet';
}

function select(i){
  current = i;
  [...nav.children].forEach((b, j) => b.classList.toggle('active', j === i));
  frame.srcdoc = PAGES[i].html;
  note.value = notes[PAGES[i].label] || '';
  refreshBadges();
}

note.addEventListener('input', () => {
  notes[PAGES[current].label] = note.value;
  try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) {}
  refreshBadges();
});

document.getElementById('copyall').addEventListener('click', async () => {
  const lines = [];
  PAGES.forEach((p) => {
    const t = (notes[p.label] || '').trim();
    if (t) lines.push('## ' + p.label + ' (' + p.fb + ')\n' + t);
  });
  const text = lines.length ? lines.join('\n\n') : '(no notes)';
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  const btn = document.getElementById('copyall');
  const orig = btn.textContent;
  btn.textContent = ok ? 'Copied!' : 'Copy failed';
  setTimeout(() => { btn.textContent = orig; }, 1500);
});

document.addEventListener('keydown', (e) => {
  if (e.target === note) return;
  if (e.key === 'ArrowRight') select((current + 1) % PAGES.length);
  if (e.key === 'ArrowLeft')  select((current - 1 + PAGES.length) % PAGES.length);
});
select(0);
</script>
</body>
</html>
